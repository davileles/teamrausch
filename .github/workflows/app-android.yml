# ═══════════════════════════════════════════════════════════════════════════
# app-android.yml — compila o app Android do Team Rausch (pasta mobile/).
#
# Gera sempre o APK para instalar e testar no celular (artefato
# "app-android-<nº>" nesta execução do Actions: baixar o .zip, abrir o .apk).
#
# Quando os secrets da chave de assinatura existirem, gera também o .aab
# assinado que vai para o Google Play:
#   ANDROID_KEYSTORE_BASE64   arquivo .jks em base64
#   ANDROID_KEYSTORE_PASSWORD senha do arquivo
#   ANDROID_KEY_ALIAS         nome da chave
#   ANDROID_KEY_PASSWORD      senha da chave
# Sem eles, o APK sai assinado com a chave de depuração (só para teste).
#
# ATENÇÃO: este repositório é PÚBLICO — a chave nunca vai para artefato nem
# para o código; só para os secrets do repositório.
#
# Roda sozinho quando muda o app (mobile/) ou as telas (app/public/index.html),
# e pelo botão "Run workflow" na aba Actions.
# ═══════════════════════════════════════════════════════════════════════════
name: App Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'app/public/index.html'
      - 'app/public/totem.html'
      - 'app/public/logo.png'
      - 'app/public/fonts/**'
      - '.github/workflows/app-android.yml'

concurrency:
  group: app-android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      VERSAO_CODIGO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Versão
        run: |
          V=$(node -p "require('./package.json').version")
          echo "VERSAO_APP=$V" >> "$GITHUB_ENV"
          echo "App $V (código $VERSAO_CODIGO)"

      - name: Dependências
        run: npm ci

      - name: Monta o sistema do estúdio dentro do app
        run: node montar.mjs && npx cap sync android

      - name: Chave de assinatura (se houver)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/teamrausch.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/teamrausch.jks" >> "$GITHUB_ENV"
            echo "Assinatura da loja: sim"
          else
            echo "Assinatura da loja: não (sem secret ANDROID_KEYSTORE_BASE64) — só APK de teste"
          fi

      - name: Compila
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Junta os arquivos
        run: |
          mkdir -p ../saida
          N="team-rausch-$VERSAO_APP-$VERSAO_CODIGO"
          for f in $(find android/app/build/outputs -name '*.apk' -o -name '*.aab'); do
            case "$f" in
              *.aab) cp "$f" "../saida/$N.aab" ;;
              *debug*.apk) cp "$f" "../saida/$N-teste.apk" ;;
              *.apk) cp "$f" "../saida/$N.apk" ;;
            esac
          done
          ls -la ../saida

      - uses: actions/upload-artifact@v4
        with:
          name: app-android-${{ github.run_number }}
          path: saida/
          retention-days: 30
