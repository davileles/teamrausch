<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Rausch Studio — Agendamento</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="theme-color" content="#F2F3F5">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Team Rausch · app do aluno ─────────────────────────────────────────
     Base preta como o logo, vermelho só para ação, amarelo só para o que é
     seu (sua aula, suas conquistas). Anton nos horários e títulos, Work Sans
     no texto. Cantos retos. Feito para o celular: abas embaixo, ao alcance
     do polegar, e horários em dois por linha.                             */
  :root{
    color-scheme:dark;
    /* Fundo bem escuro e superficies claramente acima dele: e o degrau de
       luminancia (nao a sombra) que delimita bloco em tema escuro. */
    --preto:#08090B;--preto-2:#0E1013;--superficie:#1C2026;--fundo-2:#141619;--fundo-3:#252A31;
    --linha:#363C44;--linha-2:#474E57;--linha-3:#5C636D;
    --texto:#F5F5F3;--apagado:#A6ABB2;--fraco:#949AA2;--fraco-2:#7B818A;
    --vermelho:#E01F26;--vermelho-esc:#B8161C;--amarelo:#F5C518;--amarelo-2:#C9BE86;
    --amarelo-fundo:#211E12;--liberado:#1B6B4A;
    /* O que antes estava cravado no meio do CSS e por isso não trocava de tema:
       bordas tingidas, véus, sombras, e o inverter dos ícones de data. */
    --borda-amarela:#5A5230;--borda-vermelha:#4A2124;
    --veu:rgba(0,0,0,.72);--sombra-modal:0 18px 50px rgba(0,0,0,.6);
    --sombra-fixa:0 -12px 28px rgba(8,9,11,.85);--sombra-aviso:0 8px 30px rgba(0,0,0,.5);
    --aba-ativa:#fff;--inv-icone:1;
    --raio:2px;
  }
  /* ── Tema claro ──────────────────────────────────────────────────────────
     Mesma marca, outra luz: o preto vira papel, as superfícies ficam ACIMA do
     fundo em branco puro (no escuro o degrau é para cima, aqui também) e o
     vermelho e o amarelo escurecem só o suficiente para se lerem sobre claro
     — amarelo #F5C518 sobre branco é ilegível. Nada além das variáveis muda. */
  :root[data-tema=claro]{
    color-scheme:light;
    --preto:#F2F3F5;--preto-2:#FFFFFF;--superficie:#FFFFFF;--fundo-2:#E9EBEF;--fundo-3:#DDE0E6;
    --linha:#D6DAE0;--linha-2:#C3C9D1;--linha-3:#A7AEB8;
    --texto:#15181C;--apagado:#414750;--fraco:#5C636C;--fraco-2:#7A8189;
    --vermelho:#C8161C;--vermelho-esc:#9E1116;--amarelo:#9A6E00;--amarelo-2:#7E6412;
    --amarelo-fundo:#FCF6E3;--liberado:#15694A;
    --borda-amarela:#DCC98B;--borda-vermelha:#EDBFC1;
    --veu:rgba(21,24,28,.42);--sombra-modal:0 18px 50px rgba(21,24,28,.20);
    --sombra-fixa:0 -12px 28px rgba(21,24,28,.14);--sombra-aviso:0 8px 30px rgba(21,24,28,.22);
    --aba-ativa:var(--texto);--inv-icone:0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* A barra de rolagem some quando a aba é curta e volta quando é longa.
     Reservando o espaço sempre, nada se mexe ao trocar de aba. */
  html{scrollbar-gutter:stable;overflow-y:scroll;
    -webkit-text-size-adjust:100%;text-size-adjust:100%}
  a,button,summary,.chip,input,select,textarea{
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  body{background:var(--preto);color:var(--texto);
    font:400 15px/1.55 'Work Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .env{max-width:680px;margin:0 auto;min-height:70vh;
    padding:0 max(18px, env(safe-area-inset-left)) calc(104px + env(safe-area-inset-bottom))
            max(18px, env(safe-area-inset-right))}
  [hidden]{display:none!important}
  /* Abas de administração (Lista do dia, Matrículas, Configurações): os 680px
     são para o aluno no celular. Quem administra costuma estar no computador,
     e ali a mesma largura deixava dois terços da tela vazios. `larga` entra no
     #tela-app ao abrir uma aba de admin e sai ao voltar para as do aluno; no
     celular nada muda, porque a tela é mais estreita que qualquer limite. */
  #tela-app.larga .env,#tela-app.larga .cab{max-width:1180px}

  /* Cabeçalho: logo, nome do estúdio e quem está logado */
  header{background:var(--preto);border-bottom:3px solid var(--vermelho);position:sticky;top:0;z-index:100;
    padding-top:env(safe-area-inset-top)}
  .cab{max-width:680px;margin:0 auto;padding:12px 18px;display:flex;
    justify-content:space-between;align-items:center;gap:12px;min-height:34px}
  .cab h1{font:400 15px Anton,sans-serif;letter-spacing:.08em;color:var(--amarelo);text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .cab small{font:600 13px 'Work Sans',sans-serif;color:var(--apagado);white-space:nowrap;flex-shrink:0}
  .cab .logo-topo{height:30px;width:auto;flex-shrink:0;display:block;align-self:center}
  .cab .eu{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .cab .eu button{background:transparent;border:1px solid var(--linha-3);color:var(--apagado);
    border-radius:var(--raio);padding:10px 13px;cursor:pointer;font:400 12px Anton,sans-serif;
    letter-spacing:.1em;text-transform:uppercase;transition:all .15s;
    min-height:40px;display:inline-flex;align-items:center}
  .cab .eu button:hover{border-color:var(--vermelho);background:var(--vermelho);color:#fff}

  /* Abas: barra fixa embaixo, no alcance do polegar */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--preto-2);
    border-top:1px solid var(--linha);display:flex;overflow-x:auto;scrollbar-width:none;
    padding-bottom:env(safe-area-inset-bottom)}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:1 0 auto;min-width:92px;background:transparent;border:none;border-top:3px solid transparent;
    cursor:pointer;padding:13px 10px 15px;font:400 12px Anton,sans-serif;letter-spacing:.1em;
    text-transform:uppercase;color:var(--fraco);white-space:nowrap;transition:color .15s}
  nav button[aria-selected=false]:hover{color:var(--texto)}
  nav button[aria-selected=true]{border-top-color:var(--vermelho);color:var(--aba-ativa)}

  h2{font:400 26px Anton,sans-serif;letter-spacing:.03em;text-transform:uppercase;margin:26px 0 6px}
  h3{font:400 16px Anton,sans-serif;letter-spacing:.08em;text-transform:uppercase;
    color:var(--texto);margin:28px 0 12px;padding-left:12px;border-left:4px solid var(--amarelo)}
  p.ajuda{font:400 13px/1.55 'Work Sans',sans-serif;color:var(--fraco);margin-bottom:12px}

  label{display:block;font:600 11px 'Work Sans',sans-serif;letter-spacing:.14em;
    text-transform:uppercase;color:var(--fraco);margin-bottom:8px}
  input,select,textarea{width:100%;max-width:100%;min-width:0;padding:14px 15px;min-height:50px;
    border:1px solid var(--linha-3);border-radius:var(--raio);background:var(--superficie);
    font:500 16px 'Work Sans',sans-serif;color:var(--texto);outline:none;transition:border-color .2s}
  textarea{min-height:auto;line-height:1.55}
  input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;line-height:normal}
  input[type=date]::-webkit-date-and-time-value,
  input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
  input[type=date]::-webkit-calendar-picker-indicator,
  input[type=time]::-webkit-calendar-picker-indicator{margin-left:auto;opacity:.6;
    filter:invert(var(--inv-icone))}
  input[type=checkbox]{width:auto;min-height:auto;accent-color:var(--vermelho)}
  /* Item de grid tem min-width:auto por padrão e empurra o vizinho para fora. */
  .dupla > *, .gerador .grid > *, .ficha .campos > *, .add-h > *, .linha-c > *{min-width:0}
  input:focus,select:focus,textarea:focus{border-color:var(--amarelo)}
  input::placeholder,textarea::placeholder{color:var(--fraco)}
  input[disabled]{background:var(--fundo-2);border-color:var(--linha);color:var(--fraco-2)}
  select{cursor:pointer}
  .campo{margin-bottom:16px}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  button.acao{width:100%;padding:16px;min-height:54px;border:none;border-radius:var(--raio);
    background:var(--vermelho);color:#fff;font:400 17px Anton,sans-serif;letter-spacing:.08em;
    text-transform:uppercase;cursor:pointer;transition:background .15s}
  button.acao:hover{background:var(--vermelho-esc)}
  button.acao[disabled]{opacity:.45;cursor:not-allowed}
  button.leve{background:transparent;border:1px solid var(--linha-3);color:var(--apagado);
    padding:11px 14px;min-height:44px;border-radius:var(--raio);cursor:pointer;
    font:400 14px Anton,sans-serif;letter-spacing:.08em;text-transform:uppercase;
    transition:border-color .15s,color .15s,background .15s}
  button.leve:hover{border-color:var(--vermelho);color:#fff;background:var(--vermelho)}
  button:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}

  /* Fita de dias: escolhe o dia sem rolar a página */
  .dias-fita{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px 0 20px}
  .dias-fita::-webkit-scrollbar{display:none}
  .pilula{flex:0 0 auto;width:62px;padding:9px 0;background:var(--superficie);
    border:1px solid var(--linha-3);border-radius:var(--raio);cursor:pointer;text-align:center}
  .pilula small{display:block;font:600 10px 'Work Sans',sans-serif;letter-spacing:.12em;
    text-transform:uppercase;color:var(--fraco);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding:0 4px}
  .pilula b{display:block;font:400 24px/1.1 Anton,sans-serif;color:var(--texto)}
  .pilula.sel{background:var(--vermelho);border-color:var(--vermelho)}
  .pilula.sel small{color:rgba(255,255,255,.78)}
  .pilula.sel b{color:#fff}

  /* Horários: dois por linha, lotação em marcas */
  .dia{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
  .dia .titulo,.dia .vazio{grid-column:1 / -1}
  .dia .titulo{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
  .dia .titulo b{font:400 22px Anton,sans-serif;letter-spacing:.03em;text-transform:uppercase}
  .dia .titulo span{font:500 13px 'Work Sans',sans-serif;color:var(--fraco)}

  .slot{background:var(--superficie);border:1px solid var(--linha-2);border-radius:var(--raio);
    padding:14px;display:flex;flex-direction:column;align-items:stretch;gap:0;
    transition:border-color .15s}
  .slot:hover{border-color:var(--linha-3)}
  .slot .hora{font:400 30px/1 Anton,sans-serif;color:var(--texto)}
  .slot .vagas{margin:12px 0 0}
  .marcas{display:flex;gap:3px;margin-bottom:7px;flex-wrap:wrap}
  .marcas i{width:10px;height:10px;border:1px solid var(--linha-2);background:transparent}
  .marcas i.ocupada{background:var(--texto);border-color:var(--texto)}
  .slot .conta{font:500 12px 'Work Sans',sans-serif;color:var(--apagado)}
  .slot .conta.travado{margin-top:8px;text-align:center;line-height:1.45}
  /* Horário que existe fora da configuração da agenda: é seu, mas ninguém
     mais entra nele. */
  .slot .fora-agenda{font:500 11px 'Work Sans',sans-serif;color:var(--fraco-2);
    margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
  .slot .leve,.slot .selo{margin-top:12px;width:100%;text-align:center}
  /* Dois botões no mesmo slot: "Não vou" e "Trocar" dividem a linha. */
  .slot .acoes-slot{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
  .slot .acoes-slot .leve{margin-top:0;padding:11px 6px;font-size:11px}
  /* Modo troca: a agenda inteira vira uma escolha de destino. */
  .faixa-troca{background:var(--amarelo-fundo);border:1px solid var(--borda-amarela);
    border-left:4px solid var(--amarelo);padding:13px 16px;margin:18px 0}
  .faixa-troca b{display:block;font:400 15px Anton,sans-serif;letter-spacing:.06em;
    text-transform:uppercase;color:var(--amarelo);margin-bottom:4px}
  .faixa-troca span{display:block;font:500 13px/1.5 'Work Sans',sans-serif;color:var(--amarelo-2)}
  .faixa-troca button{margin-top:10px}
  .slot.destino{border-color:var(--amarelo)}
  /* O seu horário é o único em amarelo */
  .slot.meu{border-color:var(--amarelo);background:var(--amarelo-fundo)}
  .slot.meu .hora{color:var(--amarelo)}
  .slot.meu .conta{color:var(--amarelo)}
  .slot.meu .marcas i.ocupada{background:var(--amarelo);border-color:var(--amarelo)}
  .slot.meu .leve{border-color:var(--borda-amarela);color:var(--amarelo-2)}
  .slot.meu .leve:hover{border-color:var(--vermelho);color:#fff}
  .slot.indisponivel{background:var(--fundo-2);border-color:var(--linha)}
  .slot.indisponivel .hora{color:var(--fraco-2)}
  .slot .selo{font:400 14px/22px Anton,sans-serif;letter-spacing:.08em;text-transform:uppercase;
    color:var(--fraco-2);border:1px solid var(--linha);padding:11px;min-height:44px}
  .slot .selo.meu{color:var(--amarelo);border-color:var(--borda-amarela)}
  .slot .selo.cheio{color:var(--vermelho);border-color:var(--borda-vermelha)}

  /* Faixa da matrícula: frequência contratada e horário padrão, no topo. */
  .minha-matricula{background:var(--superficie);border:1px solid var(--linha-2);
    border-left:4px solid var(--amarelo);padding:13px 16px;margin:18px 0}
  .minha-matricula b{font:400 16px Anton,sans-serif;letter-spacing:.05em;
    text-transform:uppercase;color:var(--amarelo);display:block;margin-bottom:4px}
  .minha-matricula span{font:500 13px/1.5 'Work Sans',sans-serif;color:var(--fraco);display:block}

  /* Lotação da semana: quantos alunos fixos por horário, contra a capacidade
     que está valendo na aba Configurações. */
  .lot-tabela{width:100%;border-collapse:collapse;margin-top:12px;
    font:500 12.5px 'Work Sans',sans-serif}
  .lot-tabela th{font:400 13px Anton,sans-serif;letter-spacing:.06em;text-transform:uppercase;
    color:var(--fraco);padding:6px 2px;text-align:center}
  .lot-tabela th.h{text-align:right;padding-right:10px;color:var(--texto)}
  .lot-tabela td{border:1px solid var(--linha);padding:7px 2px;text-align:center;
    color:var(--fraco);cursor:pointer}
  /* Célula sem ninguém continua desenhada: some-la abria buracos na grade e
     dava a impressão de tabela quebrada, justamente nos horários vazios. */
  .lot-tabela td.vazia{color:var(--fraco-2)}
  .lot-tabela td.sel{border-color:var(--amarelo);color:var(--amarelo);font-weight:700}
  .lot-detalhe{background:var(--superficie);border:1px solid var(--linha-2);
    border-left:4px solid var(--amarelo);padding:14px 16px;margin-top:12px}
  .lot-detalhe b{font:400 15px Anton,sans-serif;letter-spacing:.06em;text-transform:uppercase;
    color:var(--amarelo);display:block;margin-bottom:2px}
  .lot-tabela td.cheio{color:var(--vermelho);border-color:var(--borda-vermelha);font-weight:700}
  .lot-tabela td.fora{background:var(--fundo-2);color:var(--amarelo-2)}
  .lot-legenda{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;
    font:500 12px 'Work Sans',sans-serif;color:var(--fraco)}
  .lot-legenda i{font-style:normal}
  .lot-legenda i.cheio{color:var(--vermelho)}
  .lot-legenda i.fora{color:var(--amarelo-2)}

  .recado{background:var(--superficie);border:1px solid var(--linha-2);color:var(--texto);padding:14px 16px;
    font:500 14px/1.55 'Work Sans',sans-serif;margin:20px 0;border-left:4px solid var(--amarelo)}
  .vazio{padding:34px 0;color:var(--fraco);font:400 13.5px 'Work Sans',sans-serif;text-align:center}

  /* Como funciona: no topo, discreto, legível para quem entra pela 1ª vez */
  .guia{background:var(--superficie);border:1px solid var(--linha-2);
    border-left:4px solid var(--amarelo);padding:0 16px;margin:18px 0}
  .guia summary{cursor:pointer;font:400 15px Anton,sans-serif;letter-spacing:.08em;
    text-transform:uppercase;color:var(--texto);list-style:none;
    padding:14px 0;min-height:48px;display:flex;align-items:center;justify-content:space-between}
  .guia summary::-webkit-details-marker{display:none}
  .guia summary::after{content:'▾';color:var(--fraco);font-size:13px}
  .guia[open] summary::after{content:'▴';color:var(--amarelo)}
  .guia[open] summary{border-bottom:1px solid var(--linha)}
  .guia ul{margin:14px 0 16px;padding-left:18px;list-style:none}
  .guia li{font:400 13.5px/1.5 'Work Sans',sans-serif;color:var(--apagado);margin-bottom:8px;
    position:relative}
  .guia li::before{content:'·';position:absolute;left:-14px;color:var(--amarelo);font-weight:700}
  .guia .extra{font:400 13.5px/1.55 'Work Sans',sans-serif;color:var(--apagado);
    margin:0 0 16px;padding-top:14px;border-top:1px solid var(--linha);white-space:pre-wrap}

  /* Alerta em popup: aparece uma vez por texto novo, ao entrar */
  .fundo-modal{position:fixed;inset:0;background:var(--veu);z-index:400;
    display:flex;align-items:center;justify-content:center;padding:22px}
  .modal{background:var(--superficie);border:1px solid var(--linha-3);max-width:420px;width:100%;
    overflow:hidden;box-shadow:var(--sombra-modal)}
  .modal .topo{background:var(--vermelho);color:#fff;padding:13px 20px;
    font:400 15px Anton,sans-serif;letter-spacing:.12em;text-transform:uppercase}
  .modal .corpo{padding:20px;font:400 15px/1.6 'Work Sans',sans-serif;white-space:pre-wrap;color:var(--texto)}
  .modal .pe{padding:0 20px 20px}

  .fila{background:var(--superficie);border:1px solid var(--linha-2);padding:15px 16px;
    margin-bottom:1px;display:flex;align-items:center;gap:14px}
  .fila .quem{flex:1;min-width:0}
  .fila .quem b{font:600 15px 'Work Sans',sans-serif;display:block;color:var(--texto)}
  .fila .quem small{font:400 12.5px 'Work Sans',sans-serif;color:var(--fraco)}

  /* ---- números do aluno ---- */
  .numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
    background:var(--linha);margin-bottom:10px}
  .numero{background:var(--superficie);border:1px solid var(--linha-2);padding:16px 14px}
  .numero b{display:block;font:400 32px/1 Anton,sans-serif;color:var(--texto)}
  .numero span{display:block;font:600 10px 'Work Sans',sans-serif;letter-spacing:.14em;
    text-transform:uppercase;color:var(--fraco);margin-top:8px}
  .numero em{display:block;font-style:normal;font:400 11.5px 'Work Sans',sans-serif;
    color:var(--fraco-2);margin-top:5px}
  .numeros .numero:first-child b{font-size:44px}

  /* ---- conquistas ---- */
  .medalhas{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--linha);margin-bottom:10px}
  .medalha{background:var(--fundo-2);border:1px solid var(--linha);padding:12px 14px;display:flex;align-items:center;gap:10px;min-width:0}
  .medalha .cara{font-size:18px;line-height:1}
  .medalha .txt{min-width:0}
  .medalha b{display:block;font:400 13px Anton,sans-serif;letter-spacing:.06em;
    text-transform:uppercase;color:var(--texto)}
  .medalha span{display:block;font:500 11.5px 'Work Sans',sans-serif;color:var(--fraco)}

  .proxima{background:var(--superficie);border:1px solid var(--linha-2);border-left:4px solid var(--amarelo);padding:14px 16px;margin-bottom:10px}
  .proxima .linha{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
  .proxima .linha b{font:400 15px Anton,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--amarelo)}
  .proxima .linha span{font:600 12px 'Work Sans',sans-serif;color:var(--apagado);white-space:nowrap}
  .barra{height:6px;background:var(--linha-2);overflow:hidden}
  .barra i{display:block;height:100%;background:var(--amarelo)}

  /* ---- linhas editáveis de conquista (configurações) ---- */
  .linha-c{display:grid;grid-template-columns:1fr 1fr;gap:8px;
    padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--linha)}
  .linha-c .c-titulo{grid-column:1 / -1}
  .linha-c button{grid-column:1 / -1}
  .linha-c:last-of-type{border-bottom:none}

  /* ---- ficha editável (meus dados e aba Alunos) ---- */
  .ficha{background:var(--superficie);border:1px solid var(--linha-2);padding:16px;margin-bottom:10px}
  .ficha .cabeca{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:2px;flex-wrap:wrap}
  .ficha .cabeca b{font:400 16px Anton,sans-serif;letter-spacing:.06em;text-transform:uppercase}
  .ficha .cabeca .tags{font:600 11px 'Work Sans',sans-serif;letter-spacing:.1em;
    text-transform:uppercase;color:var(--amarelo)}
  .ficha .campos{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
  /* Caixinha com rótulo ao lado — usada na marca de aula experimental. */
  .marcar{display:flex;align-items:center;gap:9px;margin-top:12px;cursor:pointer;
    font:500 13px 'Work Sans',sans-serif;color:var(--apagado);text-transform:none;letter-spacing:0}
  .marcar input{width:auto;min-height:auto;margin:0}
  .ficha .rodape{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .ficha .rodape button{flex:1}
  .ficha.mudou{border-color:var(--amarelo)}

  /* ---- subabas de configurações ---- */
  .msg-alvo{display:flex;align-items:center;gap:10px;padding:9px 6px;
    border-bottom:1px solid var(--linha);font:400 13.5px 'Work Sans',sans-serif;cursor:pointer}
  .msg-alvo:last-child{border-bottom:none}
  .msg-alvo span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .msg-alvo span b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msg-alvo span small{font-size:11.5px;color:var(--fraco);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .msg-alvo em{font-style:normal;font-size:11.5px;color:var(--fraco);white-space:nowrap}
  .msg-alvo.sem-tel{opacity:.5;cursor:not-allowed}
  .subabas{display:flex;gap:0;margin:18px 0 22px;border-bottom:1px solid var(--linha)}
  .subabas button{flex:1;background:transparent;border:none;border-bottom:3px solid transparent;
    padding:14px 10px;cursor:pointer;font:400 13px Anton,sans-serif;letter-spacing:.08em;
    text-transform:uppercase;color:var(--fraco);transition:color .15s,border-color .15s}
  .subabas button:hover[aria-selected=false]{color:var(--texto)}
  .subabas button[aria-selected=true]{color:var(--texto);border-bottom-color:var(--amarelo)}
  /* Cada painel de configuração é dividido em duas colunas (.col-a e .col-b).
     No celular elas empilham na ordem de sempre; na tela larga ficam lado a
     lado e o formulário, que era um corredor de 2.000px, cabe numa tela. */
  .painel-config .col-a > h3:first-of-type{margin-top:6px}
  .painel-config .colunas > div{min-width:0}
  /* Salvar sempre à mão: gruda logo acima das abas enquanto o formulário rola. */
  #btn-salvar{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom));z-index:40;
    box-shadow:var(--sombra-fixa)}

  .nota{background:var(--fundo-2);border:1px solid var(--linha);border-left:4px solid var(--amarelo);
    padding:12px 15px;font:400 13px/1.55 'Work Sans',sans-serif;color:var(--apagado);margin-bottom:16px}
  .nota b{color:var(--texto);font-weight:600}

  /* ---- matrículas: cadastro interno e grade fixa ---- */
  .filtros-mat{margin-bottom:14px}
  .filtros-mat input{margin-bottom:10px}
  .chips-mat{display:flex;gap:6px;flex-wrap:wrap}
  .chips-mat .chip{padding:9px 11px;min-height:38px;font-size:11px}
  .lista-slots{display:flex;flex-direction:column;gap:8px}
  .slot-grade{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:8px;align-items:center}
  /* min-width:0 nos filhos: sem isso o campo de hora estoura a coluna e o
     horário aparece cortado no celular. */
  .slot-grade input,.slot-grade select{background:var(--preto);min-width:0}
  .slot-grade .sg-remover{padding:9px 10px;font-size:11px;white-space:nowrap}
  .grupo-filtro{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .grupo-filtro > span{font:600 10px 'Work Sans',sans-serif;letter-spacing:.12em;
    text-transform:uppercase;color:var(--fraco);min-width:58px}
  .encaixe{display:grid;grid-template-columns:minmax(0,1fr) 104px auto;gap:8px;align-items:center;
    margin-bottom:14px}
  .encaixe select,.encaixe input{background:var(--preto);min-width:0;margin:0}
  /* Alunos em grade: cartões lado a lado em vez de uma pilha de 120 fichas.
     O cartão inteiro abre a ficha; a ficha aberta (edição ou aluno novo) ocupa
     a linha toda e o resto da grade segue embaixo. */
  .busca-novo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:10px}
  .busca-novo input{margin:0}
  .busca-novo button{white-space:nowrap}
  .filtros-mat .chips-mat{gap:6px 20px}
  #mat-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;
    margin-bottom:8px;align-items:stretch}
  #mat-lista > .ficha{margin-bottom:0;min-width:0}
  #mat-lista > .mat-form,#mat-lista > .vazio{grid-column:1 / -1}
  .mat-item{padding:12px 14px 11px;cursor:pointer;border-left:3px solid var(--linha-3);
    display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s}
  .mat-item:hover,.mat-item:focus-visible{border-color:var(--amarelo);outline:none}
  .mat-item.revisar{border-left-color:var(--amarelo)}
  .mat-item.suspenso{border-left-color:var(--vermelho)}
  .mat-item.inativo{opacity:.55}
  .mat-item.alvo{border-color:var(--amarelo);background:var(--amarelo-fundo)}
  .mat-item .cabeca{margin:0;align-items:baseline;flex-wrap:nowrap}
  .mat-item .cabeca b{font-size:15px;min-width:0;overflow-wrap:anywhere}
  .mat-item .abrir{font:400 11px Anton,sans-serif;letter-spacing:.1em;text-transform:uppercase;
    color:var(--fraco-2);white-space:nowrap;flex-shrink:0}
  .mat-item:hover .abrir,.mat-item:focus-visible .abrir{color:var(--amarelo)}
  .mat-item .tags{font:600 10.5px 'Work Sans',sans-serif;letter-spacing:.08em;
    text-transform:uppercase;color:var(--amarelo)}
  .mat-item p.ajuda{margin:0;font-size:12.5px}
  .mat-item p.sem-tel{color:var(--amarelo-2)}
  /* Índice A–Z: pula direto para a letra. Fica grudado abaixo do cabeçalho
     enquanto a lista rola; no celular vira uma fita horizontal. */
  .indice-az{position:sticky;top:var(--topo-fixo,58px);z-index:50;display:flex;flex-wrap:wrap;
    gap:4px;padding:8px 0 10px;margin-bottom:6px;background:var(--preto)}
  .indice-az button{background:var(--superficie);border:1px solid var(--linha-2);color:var(--apagado);
    min-width:34px;height:34px;padding:0 9px;cursor:pointer;font:400 13px Anton,sans-serif;
    letter-spacing:.06em;text-transform:uppercase;transition:border-color .15s,color .15s;flex:0 0 auto}
  .indice-az button:hover{border-color:var(--amarelo);color:var(--texto)}
  .indice-az button.topo{color:var(--fraco-2)}
  @media (max-width:619px){
    .indice-az{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    .indice-az::-webkit-scrollbar{display:none}
  }
  /* Lista do dia, Grade do dia e Frequência: um bloco por horário/aluno, lado
     a lado quando a tela permite. No celular continua uma coluna só. */
  .horas-dia{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 24px;
    align-items:start}
  .hora-bloco{min-width:0}
  #mat-grade .horarios{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;
    align-items:start}
  #mat-grade .horarios .ficha{margin-bottom:0;min-width:0}
  /* NADA DE overflow AQUI — ELE MATA O CABEÇALHO GRUDADO
     `overflow-x:auto` fazia o navegador computar `overflow-y:visible` como
     `auto` (regra do CSS: um eixo rolável obriga o outro a rolar também). Com
     isso esta div virava o "scrollport" mais próximo, e o `position:sticky` do
     <th> passava a se ancorar nela em vez de na página. Como a div nunca rola
     na vertical, o cabeçalho simplesmente subia junto com a lista e sumia.
     A tabela cabe até 320px graças aos ajustes no @media abaixo, então o
     scroll lateral deixou de ser necessário. */
  #fq-lista{overflow:visible}
  #mat-soltos .soltos{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:8px;align-items:start}
  #mat-soltos .soltos .solto{margin-bottom:0;min-width:0}
  /* Órfãos e fichas sem conta: tabelas, e no celular rolam na horizontal. */
  #fq-orfaos,#fq-sem-conta{overflow-x:auto}
  #fq-orfaos .freq-tabela select{min-width:150px}
  .sem-tel{color:var(--amarelo-2);margin:0}
  .nome-antigo{margin:10px 0 0;padding-left:10px;border-left:3px solid var(--linha-2)}
  /* ---- acesso ao app, dentro da ficha do aluno ---- */
  /* Vínculo com o Wellhub dentro da ficha: mesma caixa do bloco de acesso, para
     as duas ligações externas do aluno terem o mesmo peso visual. */
  .mf-wh{margin-top:14px;padding:12px;background:var(--fundo-2);border:1px solid var(--linha)}
  .mf-wh h4{font:400 12px Anton,sans-serif;letter-spacing:.1em;text-transform:uppercase;
    color:var(--fraco);margin:0 0 6px}
  .mf-wh .estado{font:500 13px/1.5 'Work Sans',sans-serif;color:var(--texto);margin:0 0 10px}
  .mf-wh .estado b{font-weight:700;color:var(--amarelo)}
  .mf-wh .linha{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
  .mf-wh select{min-width:0}
  .mf-wh .rodape{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .mf-wh .rodape button{flex:1;min-width:140px}
  .acesso{margin-top:14px;padding:12px;background:var(--fundo-2);border:1px solid var(--linha)}
  .acesso h4{font:400 12px Anton,sans-serif;letter-spacing:.1em;text-transform:uppercase;
    color:var(--fraco);margin:0 0 6px}
  .acesso .estado{font:500 13px/1.5 'Work Sans',sans-serif;color:var(--texto)}
  .acesso .estado b{font-weight:700}
  .acesso .estado .suspenso{color:var(--amarelo-2)}
  .acesso .estado .admin{color:var(--amarelo)}
  .acesso .rodape{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .acesso .rodape button{flex:1;min-width:120px}
  .solto{background:var(--superficie);border:1px solid var(--linha-2);
    border-left:3px solid var(--fraco-2);padding:12px;margin-bottom:8px}
  .solto.suspenso{border-left-color:var(--amarelo)}
  .solto .rodape{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .solto .rodape button{flex:1;min-width:110px}
  .nome-antigo b{color:var(--texto);font-weight:600}
  /* ---- frequência: uma linha por aluno, para varrer a lista de cima a baixo ---- */
  .freq-tabela{width:100%;border-collapse:collapse;
    font:500 13px/1.35 'Work Sans',sans-serif}
  .freq-tabela th{font:400 11px Anton,sans-serif;letter-spacing:.08em;text-transform:uppercase;
    color:var(--fraco);text-align:left;padding:7px 8px;white-space:nowrap;
    border-bottom:1px solid var(--linha-2);
    /* `--fundo` (sem sufixo) NÃO EXISTE: as variáveis são --fundo-2 e --fundo-3.
       Com a variável indefinida o `background` era descartado e o cabeçalho
       ficava transparente — de pé, mas com as linhas passando por trás e o
       texto embolando durante a rolagem. O fundo da página é `--preto`, que
       existe nos dois temas (no claro ele vale #F2F3F5). */
    background:var(--preto);
    /* Gruda ABAIXO do cabeçalho do app, não no topo do viewport: os dois são
       sticky, e com top:0 o cabeçalho da tabela ficava escondido atrás dele —
       na prática a linha de títulos sumia assim que a rolagem começava.
       `--topo-fixo` é medido em tempo de execução, então acompanha o cabeçalho
       em qualquer tela. z-index abaixo do 100 do cabeçalho e acima das linhas. */
    position:sticky;top:var(--topo-fixo,58px);z-index:30;
    /* `border-collapse` não desenha borda em elemento sticky: sem isto, a linha
       de baixo do cabeçalho desaparece durante a rolagem. */
    box-shadow:inset 0 -1px 0 var(--linha-2)}
  .freq-tabela td{padding:9px 8px;border-bottom:1px solid var(--linha);vertical-align:middle}
  .freq-tabela tbody tr:hover td{background:var(--fundo-2)}
  .freq-tabela .nome{font:400 14px Anton,sans-serif;letter-spacing:.04em;
    text-transform:uppercase;min-width:150px}
  /* Números alinhados à direita e com largura fixa por dígito: a coluna vira uma
     régua, e a linha que destoa salta sem precisar ler. */
  .freq-tabela .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .freq-tabela .falta{font:400 15px Anton,sans-serif;letter-spacing:.05em}
  .freq-tabela tr.critico .falta{color:var(--vermelho)}
  .freq-tabela tr.atrasado .falta{color:var(--amarelo)}
  .freq-tabela tr.em-dia .falta,.freq-tabela tr.quitado .falta,
  .freq-tabela .quitado{color:var(--liberado)}
  /* A faixa colorida fica na primeira célula: em tabela com border-collapse a
     borda do <tr> não aparece de forma confiável entre navegadores. */
  .freq-tabela tbody td:first-child{border-left:4px solid var(--linha-2)}
  .freq-tabela tr.critico td:first-child{border-left-color:var(--vermelho)}
  .freq-tabela tr.atrasado td:first-child{border-left-color:var(--amarelo)}
  .freq-tabela tr.em-dia td:first-child,
  .freq-tabela tr.quitado td:first-child{border-left-color:var(--liberado)}
  .freq-tabela .acoes{display:flex;gap:6px;justify-content:flex-end}
  .freq-tabela .acoes button{padding:5px 9px;font-size:12px;white-space:nowrap}
  .freq-tabela .fraco{color:var(--fraco)}
  /* Duplo clique na linha abre os check-ins do mês daquele aluno: a linha
     inteira vira alvo, então ela precisa dizer que é clicável. */
  .freq-tabela tbody tr.freq-item{cursor:pointer}
  /* Caixa larga: a lista de check-ins é uma tabela, e 420px de largura com
     `white-space:pre-wrap` (o padrão do popup de aviso) espremeria as colunas.
     Rola por dentro para não empurrar o rodapé para fora da tela em mês cheio. */
  .modal.largo{max-width:560px}
  .modal .corpo.rolagem{white-space:normal;padding:14px 16px;
    max-height:min(62vh,520px);overflow:auto}
  .modal .corpo.rolagem .freq-tabela th{position:static;top:auto}
  @media(max-width:760px){
    /* Some o que dá para deduzir: no celular o que importa é quem deve e quanto. */
    .freq-tabela .opc{display:none}
    .freq-tabela th,.freq-tabela td{padding:8px 6px}
  }
  /* Telas estreitas: sem estes cortes a tabela mede 375px fixos e transborda
     num aparelho de 360px — e devolver o scroll lateral para resolver isso
     quebraria o cabeçalho grudado de novo. Medido: cabe com folga até 320px. */
  @media(max-width:420px){
    .freq-tabela .nome{min-width:0}
    .freq-tabela th,.freq-tabela td{padding:8px 4px}
    .freq-tabela .acoes{gap:4px}
    .freq-tabela .acoes button{padding:5px 6px;font-size:11px}
  }
  .freq-cartoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
    gap:8px;margin:12px 0 16px}
  .freq-cartao{background:var(--fundo-2);border:1px solid var(--linha);padding:10px;text-align:center}
  .freq-cartao b{display:block;font:400 22px Anton,sans-serif;letter-spacing:.04em}
  .freq-cartao span{font:600 10px 'Work Sans',sans-serif;letter-spacing:.1em;
    text-transform:uppercase;color:var(--fraco)}
  /* Dinheiro é sempre mais largo que um número de treinos: "R$ 18.955,09" não
     cabe nos 90px da grade de contagem sem quebrar no meio do milhar. Mesma
     gramática visual, coluna mais folgada e fonte um ponto menor. */
  /* Título de grupo dos cartões do mês. Sem ele, doze números em sequência
     parecem a mesma unidade — e "597" ao lado de "R$ 16.415" não é. */
  .grupo-mes{font:600 11px 'Work Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;
    color:var(--fraco);margin:16px 0 0}
  .grupo-mes small{display:block;text-transform:none;letter-spacing:0;font-weight:400;
    font-size:11px;color:var(--fraco-2);margin-top:3px}
  .freq-cartoes.dinheiro{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .freq-cartoes.dinheiro .freq-cartao b{font-size:19px}
  .freq-cartao.critico b{color:var(--vermelho)}
  .freq-cartao.atrasado b{color:var(--amarelo)}
  .freq-cartao.em-dia b{color:var(--liberado)}
  /* Linha de pendência (pessoa sem aluno, ficha sem conta): faixa amarela na
     primeira célula, mesma gramática da tabela de frequência. */
  .freq-tabela tr.orfao td:first-child,
  .freq-tabela tr.sem-conta td:first-child{border-left-color:var(--amarelo)}
  .freq-tabela tr.orfao select{padding:5px 8px;font-size:12px}
  .freq-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .freq-acoes button{flex:1;min-width:130px}
  /* Gráfico do mês: SVG desenhado à mão, sem biblioteca. Trinta e uma colunas
     não cabem em 380px de largura sem virar risco, então o quadro rola na
     horizontal em vez de encolher a ponto de não se ler o número do dia. */
  .grafico-mes{overflow-x:auto;margin:4px 0 10px;padding-bottom:4px}
  .grafico-mes svg{display:block;width:100%;min-width:520px;height:auto}
  .g-eixo{font:600 9px 'Work Sans',sans-serif;fill:var(--fraco-2)}
  .g-dia{font:600 9px 'Work Sans',sans-serif;fill:var(--fraco)}
  .g-dia.hoje{fill:var(--amarelo)}
  .g-linha{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .g-linha.ref{stroke-width:1.5}
  .g-hoje{stroke:var(--amarelo);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
  .legenda-mes{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 14px;
    font:500 11px 'Work Sans',sans-serif;color:var(--fraco)}
  .legenda-mes i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
  .nav-mes{display:flex;align-items:center;gap:10px;margin:0 0 4px}
  .nav-mes b{flex:1;text-align:center;font:400 16px Anton,sans-serif;
    letter-spacing:.05em;text-transform:uppercase}
  .nav-mes button{min-width:46px}
  .alerta-rev{border-left:3px solid var(--amarelo);padding-left:10px;margin:12px 0 0}
  .barra-dia{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;margin-bottom:12px}
  .barra-dia input{background:var(--preto);margin:0}
  .lista-nomes{display:flex;flex-direction:column;gap:2px;margin-top:10px}
  .nome-linha{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 0;border-top:1px solid var(--linha);font:400 14px 'Work Sans',sans-serif}
  .nome-linha:first-child{border-top:none}
  .nome-linha button{padding:6px 10px;min-height:34px;font-size:11px}
  .marca-extra{font:600 10px 'Work Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;
    color:var(--amarelo-2);font-style:normal;margin-left:6px}

  /* ---- grade de horários (configurações) ---- */
  .gerador{background:var(--superficie);border:1px solid var(--linha-2);border-left:4px solid var(--amarelo);padding:16px;margin-bottom:22px}
  .gerador h4{font:400 16px Anton,sans-serif;letter-spacing:.08em;text-transform:uppercase;
    color:var(--texto);margin-bottom:14px}
  .gerador .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .gerador input{background:var(--preto)}
  .dias-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:transparent;border:1px solid var(--linha-3);padding:11px 13px;min-height:44px;
    display:flex;align-items:center;cursor:pointer;font:400 12px Anton,sans-serif;
    letter-spacing:.1em;text-transform:uppercase;color:var(--apagado);user-select:none;transition:all .15s}
  .chip:hover{border-color:var(--amarelo);color:var(--texto)}
  .chip.sel{border-color:var(--amarelo);color:var(--preto);background:var(--amarelo)}
  .gerador .botoes{display:flex;gap:8px;flex-wrap:wrap}
  .gerador .botoes button{flex:1}

  /* Grade da semana: sete dias recolhidos. Uma linha por horário empilhava 90
     linhas numa semana cheia e obrigava a rolar a tela inteira para ver o
     sábado. Fechado, cada dia mostra a contagem e a prévia dos horários; só o
     dia que você abre ocupa espaço. */
  .dia-bloco{background:var(--superficie);border:1px solid var(--linha-2);margin-bottom:8px}
  .dia-bloco > summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;
    gap:9px;padding:13px 14px}
  .dia-bloco > summary::-webkit-details-marker{display:none}

  /* Alternador de tema: o ícone mostra para onde se vai, não onde se está. */
  .tema{background:transparent;border:1px solid var(--linha-3);color:var(--apagado);

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
/* Tema claro/escuro — claro é o padrão; a escolha do usuário, quando há,
   vale mais e fica guardada só neste aparelho.
   Roda antes do corpo desenhar para não haver piscada de tema errado. */
(function(){
  var CHAVE='tr_tema', CLARO='#F2F3F5', ESCURO='#0E0F11';
  function pintar(t){
    var claro = t==='claro';
    document.documentElement.setAttribute('data-tema', claro?'claro':'escuro');
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', claro?CLARO:ESCURO);
  }
  var salvo=null; try{ salvo=localStorage.getItem(CHAVE); }catch(e){}
  pintar(salvo||'claro');
  window.alternarTema=function(){
    var novo=document.documentElement.getAttribute('data-tema')==='claro'?'escuro':'claro';
    pintar(novo); try{ localStorage.setItem(CHAVE,novo); }catch(e){}
  };
  document.addEventListener('click',function(ev){
    var alvo=ev.target&&ev.target.closest?ev.target.closest('.tema'):null;
    if(alvo){ ev.preventDefault(); window.alternarTema(); }
  });
})();
</script>

<script>
/* --------------------------- infraestrutura ---------------------------- */
const cofre = {
  _m:null,
  get(){ try{ return localStorage.getItem('agenda-token') }catch{ return this._m } },
  set(v){ this._m=v; try{ v ? localStorage.setItem('agenda-token',v) : localStorage.removeItem('agenda-token') }catch{} }
};

let eu = null, configAtual = null, abaAtiva = 'agendar';
let semCodigo = false;   // canal aberto: entra só com o telefone
let porSenha  = false;   // administrador com senha definida

async function api(caminho, opcoes={}){
  const cab = {'Content-Type':'application/json'};
  const t = cofre.get(); if (t) cab.Authorization = 'Bearer '+t;
  const r = await fetch('/agenda-api'+caminho, {...opcoes, headers:cab});
  const corpo = await r.json().catch(()=>({}));
  if (r.status === 401 && eu){ sair(true); throw new Error('Sua sessão venceu. Entre de novo.'); }
  if (!r.ok) throw new Error(corpo.erro || 'Não consegui completar a ação.');
  return corpo;
}

function avisar(texto, tipo){
  document.querySelector('.aviso')?.remove();
  const d = document.createElement('div');
  d.className = 'aviso'+(tipo?' '+tipo:''); d.setAttribute('role','status'); d.textContent = texto;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 4200);
}

function esc(t){ return String(t??'').replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

/* ------------------------------ login ---------------------------------- */
const inTelefone = document.getElementById('in-telefone');

inTelefone.addEventListener('input', e=>{
  const n = e.target.value.replace(/\D/g,'').slice(0,11);
  e.target.value = n.length > 7 ? `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`
    : n.length > 2 ? `(${n.slice(0,2)}) ${n.slice(2)}` : n;
});

document.getElementById('btn-codigo').addEventListener('click', async ()=>{
  const b = document.getElementById('btn-codigo');
  b.disabled = true; b.textContent = 'Aguarde…';
  try{
    const r = await api('/auth/codigo', {method:'POST', body:JSON.stringify({telefone:inTelefone.value})});

    // Canal aberto e cadastro completo: não há código, senha, nome nem
    // aniversário a informar. A segunda tela só teria um botão, então entra.
    if (r.semCodigo && !r.precisaDeNome && !r.precisaDeAniversario){
      semCodigo = true; porSenha = false;
      if (await entrar(b)) return;
      return;   // deu erro: a mensagem já apareceu e o telefone segue na tela
    }

    document.getElementById('passo-telefone').hidden = true;
    document.getElementById('passo-codigo').hidden = false;
    document.getElementById('campo-nome').hidden = !r.precisaDeNome;
    document.getElementById('campo-aniversario').hidden = !r.precisaDeAniversario;

    // Três caminhos possíveis: senha (administrador), nenhum (canal aberto)
    // ou código. Só um dos campos fica visível.
    semCodigo = Boolean(r.semCodigo);
    porSenha  = Boolean(r.precisaDeSenha);

    document.getElementById('campo-codigo').hidden = semCodigo || porSenha;
    document.getElementById('campo-senha').hidden  = !porSenha;
    if (semCodigo || porSenha) document.getElementById('in-codigo').value = '';

    document.getElementById('sub-login').textContent =
      porSenha    ? 'Acesso de administrador. Informe a senha.'
      : semCodigo ? (r.precisaDeNome ? 'Só completar o cadastro e entrar.' : 'É só entrar.')
      : r.canal === 'log' ? 'Modo de teste: o código está no log do servidor.'
                          : `Código enviado para ${r.telefone}.`;

    (porSenha    ? document.getElementById('in-senha')
     : semCodigo ? (r.precisaDeNome ? document.getElementById('in-nome')
                                    : document.getElementById('btn-entrar'))
     : document.getElementById('in-codigo')).focus();
  }catch(e){ avisar(e.message, 'erro'); }
  finally{
    b.disabled = false;
    b.textContent = 'Entrar';
  }
});

// Máscara dd/mm: barra sozinha depois do dia, sem deixar digitar letra.
const inAniversario = document.getElementById('in-aniversario');
inAniversario.addEventListener('input', e=>{
  const n = e.target.value.replace(/\D/g,'').slice(0,4);
  e.target.value = n.length > 2 ? `${n.slice(0,2)}/${n.slice(2)}` : n;
});
inAniversario.addEventListener('keydown', e=>{
  if (e.key === 'Enter') document.getElementById('btn-entrar').click();
});

document.getElementById('in-nome').addEventListener('keydown', e=>{
  if (e.key !== 'Enter') return;
  // No primeiro acesso os dois campos aparecem juntos: Enter no nome desce para
  // o aniversário em vez de tentar confirmar com ele em branco.
  if (!document.getElementById('campo-aniversario').hidden) inAniversario.focus();
  else document.getElementById('btn-entrar').click();
});

/**
 * Faz a entrada de fato. Fica em função própria porque no canal aberto, para
 * quem já tem cadastro, ela é chamada direto do primeiro passo — sem passar
 * pela segunda tela, que não teria nada a preencher.
 */
async function entrar(botao){
  // Guarda o rótulo original: esta função é chamada pelos dois botões
  // ("Entrar" no primeiro passo, "Confirmar" no segundo).
  const rotulo = botao.textContent;
  botao.disabled = true; botao.textContent = 'Entrando…';
  try{
    const r = await api('/auth/entrar', {method:'POST', body:JSON.stringify({
      telefone: inTelefone.value,
      codigo: document.getElementById('in-codigo').value,
      senha: document.getElementById('in-senha').value,
      nome: document.getElementById('in-nome').value,
      aniversario: document.getElementById('in-aniversario').value,
    })});
    cofre.set(r.token);
    await comecar();
    return true;
  }catch(e){ avisar(e.message, 'erro'); return false; }
  finally{ botao.disabled = false; botao.textContent = rotulo; }
}

document.getElementById('btn-entrar').addEventListener('click', function(){
  entrar(this);
});

document.getElementById('btn-voltar').addEventListener('click', ()=>{
  document.getElementById('passo-codigo').hidden = true;
  document.getElementById('passo-telefone').hidden = false;
  document.getElementById('in-codigo').value = '';
  document.getElementById('campo-codigo').hidden = false;
  document.getElementById('campo-senha').hidden = true;
  document.getElementById('in-senha').value = '';
  semCodigo = false; porSenha = false;
  document.getElementById('btn-codigo').textContent = 'Entrar';
});

document.getElementById('in-codigo').addEventListener('keydown', e=>{
  if (e.key === 'Enter') document.getElementById('btn-entrar').click();
});
document.getElementById('in-senha').addEventListener('keydown', e=>{
  if (e.key === 'Enter') document.getElementById('btn-entrar').click();
});
inTelefone.addEventListener('keydown', e=>{
  if (e.key === 'Enter') document.getElementById('btn-codigo').click();
});

document.getElementById('btn-sair-topo').addEventListener('click', ()=>{
  if (confirm('Sair desta conta?')) sair(false);
});

async function sair(silencioso){
  try{ if (!silencioso) await api('/auth/sair', {method:'POST'}); }catch{}
  cofre.set(null); eu = null;
  limparTela();
  document.getElementById('tela-app').hidden = true;
  document.getElementById('tela-login').hidden = false;
  document.getElementById('passo-codigo').hidden = true;
  document.getElementById('passo-telefone').hidden = false;
}

/**
 * Zera tudo que veio do servidor. Sem isto, quem entra depois vê os horários
 * e os agendamentos de quem estava antes até a primeira busca terminar — e no
 * mesmo navegador, trocando de admin para aluno, isso vaza dado de outra conta.
 */
function limparTela(){
  configAtual = null;
  subConfig = 'negocio';
  diaAberto = '';   // conta nova, agenda nova: a fita recomeça no primeiro dia
  dataDoDia = null;
  matEstado = matEstadoInicial();
  document.getElementById('tela-app').classList.remove('larga');
  TODAS_ABAS.forEach(a=>{ document.getElementById('aba-'+a).innerHTML = ''; });
  document.getElementById('quem-sou').textContent = '';
}

/* ------------------------------ abas ----------------------------------- */
const TODAS_ABAS  = ['agendar','meus','perfil','dia','matriculas','mensagens','config'];
const ABAS_ADMIN  = ['dia','matriculas','mensagens','config'];

/* ------------------------ a aba fica na URL ------------------------------ *
 * Recarregar a página devolvia a pessoa para "Agendar", perdendo o lugar em
 * que ela estava — e quem está conferindo Frequência ou Indicadores recarrega
 * o tempo todo para ver dado novo.
 *
 * O endereço vira o lugar onde a aba mora: `#matriculas/freq`. Sobrevive ao
 * refresh sem storage nenhum, e de quebra dá um link que abre direto na aba.
 *
 * `replaceState` em vez de `location.hash`: trocar de aba não é navegar, e
 * empilhar cada troca no histórico faria o botão voltar do celular percorrer
 * as abas uma a uma antes de sair do app.
 * ------------------------------------------------------------------------- */
const SUBS = { matriculas: ['alunos','grade','lotacao','freq','mes'],
               config: ['negocio','tecnica'] };

function lerRota(){
  const cru = decodeURIComponent(String(location.hash || '').replace(/^#/, ''));
  const [aba, sub] = cru.split('/');
  return { aba: aba || '', sub: sub || '' };
}

function subDaAba(aba){
  if (aba === 'matriculas') return matEstado.sub;
  if (aba === 'config') return subConfig;
  return '';
}

function gravarRota(){
  const sub = subDaAba(abaAtiva);
  const alvo = '#' + abaAtiva + (sub ? '/' + sub : '');
  if (location.hash === alvo) return;
  // Ambientes sem history (file://, webview antiga) não podem derrubar a tela
  // por causa de um detalhe de endereço.
  try{ history.replaceState(null, '', alvo); }catch{}
}

/** Uma aba só vale se existir e, sendo de admin, se a pessoa for admin. */
function abaPermitida(aba){
  if (!TODAS_ABAS.includes(aba)) return false;
  return !ABAS_ADMIN.includes(aba) || Boolean(eu && eu.admin);
}

/**
 * Único caminho para trocar de aba. Antes, o `hidden` das seções só era
 * ajustado no clique; ao entrar de novo, a seção visível continuava sendo a da
 * sessão anterior e o conteúdo novo era desenhado numa seção escondida.
 */
function abrirAba(aba){
  // A troca é um estado da tela de agendar; sair dela desiste da troca em vez
  // de deixar a pessoa voltar depois sem lembrar do que estava no meio.
  if (aba !== 'agendar') trocando = null;

  abaAtiva = abaPermitida(aba) ? aba : 'agendar';
  // Aba de admin alarga o painel (ver `.larga` no CSS); aba de aluno devolve
  // a largura de celular.
  document.getElementById('tela-app').classList.toggle('larga', ABAS_ADMIN.includes(abaAtiva));
  document.querySelectorAll('#abas button').forEach(x=>
    x.setAttribute('aria-selected', String(x.dataset.aba === abaAtiva)));
  TODAS_ABAS.forEach(a=>{
    document.getElementById('aba-'+a).hidden = a !== abaAtiva;
  });
  gravarRota();
  return desenharAba();
}

document.getElementById('abas').addEventListener('click', e=>{
  const b = e.target.closest('button[data-aba]'); if (!b) return;
  if (!abaPermitida(b.dataset.aba)) return;
  abrirAba(b.dataset.aba);
});

function desenharAba(){
  // Rede de segurança: se a sessão perder o admin (removido da lista, por
  // exemplo), volta para uma aba que a pessoa pode ver em vez de tentar
  // carregar dados que o servidor vai recusar.
  if (!abaPermitida(abaAtiva)) return abrirAba('agendar');
  // Devolve a promessa: quem chama precisa esperar o desenho terminar para
  // repor a rolagem no lugar em que a pessoa estava.
  if (abaAtiva === 'agendar') return carregarAgenda();
  if (abaAtiva === 'meus') return carregarMeus();
  if (abaAtiva === 'perfil') return carregarPerfil();
  if (abaAtiva === 'dia') return carregarDia();
  if (abaAtiva === 'matriculas') return carregarMatriculas();
  if (abaAtiva === 'mensagens') return carregarMensagens();
  if (abaAtiva === 'config') return carregarConfig();
}

/**
 * Redesenho depois de uma ação (reservar, cancelar, salvar): a tela é remontada
 * do zero, então sem isto a pessoa perde o lugar — volta ao topo da lista e,
 * na agenda, ao primeiro dia da fita. O dia é guardado em `diaAberto`; aqui
 * cuidamos da rolagem vertical da página.
 */
async function redesenhar(){
  const y = window.scrollY;
  try{ await desenharAba(); }finally{
    requestAnimationFrame(()=>window.scrollTo(0, y));
  }
}

/* ---------------------------- agendar ---------------------------------- */
/**
 * Uma marca por lugar ocupado. De onde veio a ocupação — matrícula ou reserva
 * feita no app — não muda nada para quem está escolhendo horário: o lugar tem
 * dono do mesmo jeito.
 */
function marcas(ocupadas, capacidade){
  return '<div class="marcas">'+Array.from({length:capacidade},(_,i)=>
    `<i class="${i<ocupadas?'ocupada':''}"></i>`).join('')+'</div>';
}

const SELO = {meu:'Seu horário', lotado:'Lotado', fechado:'Fechado', bloqueado:'Fechado'};

/**
 * O que dá para fazer com a aula que já é sua. Largar e trocar são coisas
 * diferentes: quem não vai poder ir naquele dia desmarca; quem vai treinar em
 * outro horário troca, e a troca vai num pedido só para não correr o risco de
 * ficar sem os dois.
 */
function acoesDoMeuSlot(data, h){
  const largar = h.podeCancelar
    ? `<button class="leve cancelar" data-id="${h.meuAgendamentoId}">Não vou</button>`
    : h.podeDesmarcar
      ? `<button class="leve desmarcar" data-data="${data}" data-hora="${h.hora}">Não vou</button>`
      : '';
  const trocar = h.podeTrocar
    ? `<button class="leve troca-iniciar" data-data="${data}" data-hora="${h.hora}">Trocar</button>`
    : '';
  if (largar && trocar) return `<div class="acoes-slot">${largar}${trocar}</div>`;
  if (largar || trocar) return largar || trocar;
  // Sem ação possível, o selo explica a regra em vez de virar um beco sem saída.
  return `<span class="selo meu">${SELO.meu}</span>` +
    (h.motivoTravado ? `<div class="conta travado">${esc(h.motivoTravado)}</div>` : '');
}

/* ------------------------- guia e alerta -------------------------------- */
// Lembrar o que a pessoa já viu é conveniência, não dado importante: se o
// navegador bloquear o armazenamento, o guia abre e o alerta reaparece — chato,
// mas nada quebra.

function lembrete(chave){
  try{ return localStorage.getItem(chave); }catch{ return null; }
}
function anotar(chave, valor){
  try{ localStorage.setItem(chave, valor); }catch{}
}

// As marcas são por pessoa, não por navegador: no celular do estúdio ou num
// aparelho compartilhado, o aviso precisa aparecer para cada um que entra.
const marcaDe = (nome)=> `${nome}:${(eu && eu.telefone) || 'anon'}`;

const jaViuOGuia      = ()=> lembrete(marcaDe('guia-visto')) === '1';
const marcarGuiaVisto = ()=> anotar(marcaDe('guia-visto'),'1');

/** Mesmo id que o servidor calcula: sha256 do texto, 16 primeiros hex. */
async function idDoAlerta(texto){
  const bytes = new TextEncoder().encode(texto.trim());
  const hash = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,16);
}

async function marcarAlertaComoVisto(texto){
  try{ anotar(marcaDe('alerta-visto'), await idDoAlerta(texto)); }catch{}
}

/** Popup do alerta. Reaparece sempre que o texto do aviso muda. */
function mostrarAlerta(alerta){
  if (lembrete(marcaDe('alerta-visto')) === alerta.id) return;
  if (document.querySelector('.fundo-modal')) return;

  const fundo = document.createElement('div');
  fundo.className = 'fundo-modal';
  fundo.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <div class="topo" id="modal-titulo">Aviso do estúdio</div>
      <div class="corpo">${esc(alerta.texto)}</div>
      <div class="pe"><button class="acao" id="modal-ok">Entendi</button></div>
    </div>`;

  const fechar = ()=>{ anotar(marcaDe('alerta-visto'), alerta.id); fundo.remove(); };
  fundo.querySelector('#modal-ok').addEventListener('click', fechar);
  fundo.addEventListener('click', e=>{ if (e.target === fundo) fechar(); });
  document.addEventListener('keydown', function esc(e){
    if (e.key === 'Escape'){ fechar(); document.removeEventListener('keydown', esc); }
  });

  document.body.appendChild(fundo);
  fundo.querySelector('#modal-ok').focus();
}

// Dia aberto na fita. Sobrevive ao redesenho: depois de reservar ou cancelar,
// a pessoa continua no dia em que estava, e não no primeiro da lista.
let diaAberto = '';

// Troca em andamento: { data, hora } da aula que a pessoa está largando.
// Enquanto estiver preenchido, a agenda inteira vira uma escolha de destino.
let trocando = null;

async function carregarAgenda(){
  const alvo = document.getElementById('aba-agendar');
  try{
    const r = await api('/agenda');

    // Como funciona: regras vindas da configuração + o texto livre do estúdio.
    const guia = (r.regras && r.regras.length) || r.recado
      ? `<details class="guia" ${jaViuOGuia() ? '' : 'open'} id="guia">
           <summary>Como funciona</summary>
           ${r.regras && r.regras.length
             ? `<ul>${r.regras.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>` : ''}
           ${r.recado ? `<div class="extra">${esc(r.recado)}</div>` : ''}
         </details>`
      : '';

    // O alerta também fica na página, para quem fechou o popup e quer reler.
    const recado = r.alerta ? `<div class="recado">${esc(r.alerta.texto)}</div>` : '';

    // Faixa da matrícula: quantas vezes por semana e qual o horário padrão.
    // Só aparece para quem tem telefone ligado a uma matrícula.
    const m = r.matricula;
    const faixa = m ? (()=>{ 
      const freq = m.frequencia
        ? `${m.frequencia}x por semana`
        : 'sem frequência definida';
      const restam = m.respeitarFrequencia && m.diasRestantesNaSemana !== null
        ? (m.diasRestantesNaSemana > 0
            ? ` · ainda dá para marcar ${m.diasRestantesNaSemana} ${m.diasRestantesNaSemana===1?'dia':'dias'} nesta semana`
            : ' · sua semana já está completa')
        : '';
      return `<div class="minha-matricula">
        <b>Sua matrícula · ${esc(freq)}</b>
        <span>${esc(m.gradeEmTexto || 'sem horário fixo')}</span>
        <span>${m.diasNaSemana} ${m.diasNaSemana===1?'dia':'dias'} nesta semana${esc(restam)}</span>
      </div>`; })()
      : '';
    const dias = r.dias.map(d=>{
      if (d.bloqueada || !d.horarios.length){
        return `<div class="dia" data-d="${d.data}"><div class="titulo"><b>${d.rotulo}</b><span>${d.porExtenso}</span></div>
          <div class="vazio">${d.bloqueada ? 'O estúdio não abre neste dia.' : 'Sem horários neste dia.'}</div></div>`;
      }
      return `<div class="dia" data-d="${d.data}"><div class="titulo"><b>${d.rotulo}</b><span>${d.porExtenso}</span></div>${
        d.horarios.map(h=>{
          const livre = h.situacao === 'aberto';
          const ehOrigem = trocando && trocando.data === d.data && trocando.hora === h.hora;

          // Em modo troca a agenda tem uma pergunta só: para onde? Todo horário
          // livre vira destino, e a aula que está saindo oferece desistir.
          const direita = trocando
            ? (ehOrigem
                ? `<button class="leve troca-cancelar">Desistir</button>`
                : livre
                  ? `<button class="leve troca-para" data-data="${d.data}" data-hora="${h.hora}">Trocar para cá</button>`
                  : `<span class="selo ${h.situacao==='meu'?'meu':h.situacao==='lotado'?'cheio':''}">${SELO[h.situacao]||''}</span>`)
            // Aula da matrícula não tem agendamento para cancelar: desmarcar
            // manda data e hora, e o servidor grava a exceção do dia.
            : livre
              ? `<button class="leve reservar" data-data="${d.data}" data-hora="${h.hora}">Reservar</button>`
              : h.situacao === 'meu'
                ? acoesDoMeuSlot(d.data, h)
                : `<span class="selo ${h.situacao==='lotado'?'cheio':''}">${SELO[h.situacao]||''}</span>`;
          return `<div class="slot ${h.situacao==='meu'?'meu':''} ${trocando&&livre&&!ehOrigem?'destino':''} ${livre||h.situacao==='meu'?'':'indisponivel'}">
            <div class="hora">${h.hora}</div>
            <div class="vagas">${marcas(h.ocupadas,h.capacidade)}
              <div class="conta">${h.vagas>0?`${h.vagas} de ${h.capacidade} livres`:`${h.capacidade} lugares ocupados`}</div>
              ${h.foraDaAgenda?'<div class="fora-agenda">fora da agenda</div>':''}
            </div>${direita}</div>`;
        }).join('')}</div>`;
    }).join('');
    const fita = r.dias.length > 1
      ? `<div class="dias-fita" id="fita">${r.dias.map((d,k)=>
          `<button class="pilula${k?'':' sel'}" data-d="${d.data}"><small>${esc(d.rotulo)}</small><b>${String(d.data||'').slice(8,10)}</b></button>`).join('')}</div>`
      : '';
    // Em modo troca a faixa da matrícula e o guia saem da frente: a tela toda
    // está a serviço de uma escolha só.
    const faixaTroca = trocando
      ? `<div class="faixa-troca">
           <b>Trocando de horário</b>
           <span>Saindo de ${esc(trocando.porExtenso || trocando.data)} às ${esc(trocando.hora)}.
             Escolha o novo horário — sua aula atual só sai quando o novo for confirmado.</span>
           <button class="leve troca-cancelar">Desistir da troca</button>
         </div>`
      : '';
    alvo.innerHTML = fita + recado + (trocando ? faixaTroca : faixa + guia) + dias;

    // Um dia por vez: a fita troca o dia sem rolar a página.
    const mostrarDia = (data)=>{
      diaAberto = data;
      alvo.querySelectorAll('.dia').forEach(el=>{ el.hidden = el.dataset.d !== data; });
      alvo.querySelectorAll('.pilula').forEach(b=>b.classList.toggle('sel', b.dataset.d === data));
      // A fita rola sozinha para mostrar o dia escolhido (só ela, na
      // horizontal — a página não se mexe).
      const fitaEl = document.getElementById('fita');
      const sel = fitaEl && fitaEl.querySelector('.pilula.sel');
      if (fitaEl && sel) fitaEl.scrollLeft = sel.offsetLeft - (fitaEl.clientWidth - sel.offsetWidth) / 2;
    };
    if (r.dias.length > 1){
      // Se o dia guardado ainda existe na agenda (não passou), volta para ele.
      const manter = r.dias.some(d=>d.data === diaAberto) ? diaAberto : r.dias[0].data;
      mostrarDia(manter);
      document.getElementById('fita').addEventListener('click', e=>{
        const b = e.target.closest('.pilula'); if (b) mostrarDia(b.dataset.d);
      });
    } else if (r.dias.length === 1){
      diaAberto = r.dias[0].data;
    }

    const det = document.getElementById('guia');
    if (det) det.addEventListener('toggle', ()=>{ if (!det.open) marcarGuiaVisto(); });

    if (r.alerta) mostrarAlerta(r.alerta);
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

document.body.addEventListener('click', async e=>{
  const res = e.target.closest('button.reservar');
  const can = e.target.closest('button.cancelar');
  const des = e.target.closest('button.desmarcar');
  const ini = e.target.closest('button.troca-iniciar');
  const par = e.target.closest('button.troca-para');
  const sai = e.target.closest('button.troca-cancelar');

  const daqui = e.target.closest('button.troca-daqui');
  if (ini || daqui){
    // Nada é gravado aqui: a troca só existe no servidor quando o destino for
    // escolhido. Até lá a aula original continua valendo.
    const b = ini || daqui;
    trocando = { data: b.dataset.data, hora: b.dataset.hora,
                 porExtenso: b.dataset.extenso ||
                   b.closest('.dia')?.querySelector('.titulo span')?.textContent || '' };
    diaAberto = b.dataset.data;
    // Vindo de "Meus horários", a escolha do destino acontece na aba Agendar.
    if (daqui) await abrirAba('agendar'); else redesenhar();
    return;
  }
  if (sai){ trocando = null; redesenhar(); return; }
  if (par){
    par.disabled = true; par.textContent = '…';
    const de = trocando;
    try{
      await api('/agenda/trocar', {method:'POST', body:JSON.stringify({
        de: { data: de.data, hora: de.hora },
        para: { data: par.dataset.data, hora: par.dataset.hora },
      })});
      trocando = null;
      diaAberto = par.dataset.hora ? par.dataset.data : diaAberto;
      avisar(`Horário trocado para ${par.dataset.hora}.`, 'ok');
    }catch(err){ avisar(err.message, 'erro'); }
    redesenhar();
    return;
  }
  if (des){
    if (!confirm('Avisar que você não vem nesta aula?')) return;
    des.disabled = true;
    try{
      await api('/agenda/cancelar', {method:'POST',
        body:JSON.stringify({data:des.dataset.data, hora:des.dataset.hora})});
      avisar('Aula desmarcada. Seu lugar voltou para a agenda.', 'ok');
    }catch(err){ avisar(err.message, 'erro'); }
    redesenhar();
  }
  if (res){
    res.disabled = true; res.textContent = '…';
    try{
      await api('/agenda/reservar', {method:'POST', body:JSON.stringify({data:res.dataset.data, hora:res.dataset.hora})});
      avisar('Horário reservado.', 'ok');
    }catch(err){ avisar(err.message, 'erro'); }
    redesenhar();
  }
  if (can){
    if (!confirm('Cancelar este horário?')) return;
    can.disabled = true;
    try{
      await api('/agenda/cancelar', {method:'POST', body:JSON.stringify({id:can.dataset.id})});
      avisar('Horário cancelado.', 'ok');
    }catch(err){ avisar(err.message, 'erro'); }
    redesenhar();
  }
});

/* -------------------------- meus horários ------------------------------- */
async function carregarMeus(){
  const alvo = document.getElementById('aba-meus');
  try{
    const r = await api('/agenda');
    // Aula fixa e reserva convivem na mesma lista. O rótulo diz de onde veio,
    // e o botão muda junto: reserva cancela por id, aula fixa desmarca por dia.
    const rotulo = {fixo:'aula da sua matrícula', extra:'aula extra', reserva:'reservado'};
    alvo.innerHTML = '<h2>Meus horários</h2>' + (r.meus.length
      ? r.meus.map(a=>{
          const largar = !a.podeLargar ? ''
            : a.id
              ? `<button class="leve cancelar" data-id="${a.id}">Não vou</button>`
              : `<button class="leve desmarcar" data-data="${a.data}" data-hora="${a.hora}">Não vou</button>`;
          // Trocar mora na aba Agendar, que é onde estão os horários de destino.
          const trocar = a.podeTrocar
            ? `<button class="leve troca-daqui" data-data="${a.data}" data-hora="${a.hora}"
                 data-extenso="${esc(a.porExtenso)}">Trocar</button>`
            : '';
          return `<div class="fila"><div class="quem"><b>${a.hora} · ${a.porExtenso}</b>
            <small>${rotulo[a.origem]||'reservado'}${
              a.motivoTravado ? ` · ${esc(a.motivoTravado)}` : ''}</small></div>
            ${largar}${trocar}</div>`;
        }).join('')
      : '<div class="vazio">Você não tem horários reservados.</div>');
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

/* ----------------------------- meus dados ------------------------------- */

function cartao(valor, rotulo, detalhe){
  return `<div class="numero">
    <b>${valor}</b><span>${rotulo}</span>
    ${detalhe ? `<em>${detalhe}</em>` : ''}
  </div>`;
}

async function carregarPerfil(){
  const alvo = document.getElementById('aba-perfil');
  try{
    const p = await api('/perfil');
    const n = p.numeros;
    const desde = p.desde ? new Date(p.desde).toLocaleDateString('pt-BR',
      {month:'long', year:'numeric'}) : null;

    const medalhas = (n.conquistas||[]).length
      ? `<div class="medalhas">${n.conquistas.slice().reverse().map(m=>`
          <div class="medalha">
            <span class="cara">${esc(m.emoji||'🏅')}</span>
            <span class="txt"><b>${esc(m.titulo)}</b><span>${m.aulas} ${m.aulas===1?'aula':'aulas'}</span></span>
          </div>`).join('')}</div>`
      : '';

    const proxima = n.proximaConquista
      ? (()=>{ const p = n.proximaConquista;
          const feito = Math.max(0, Math.min(100, Math.round(n.total / p.aulas * 100)));
          return `<div class="proxima">
            <div class="linha">
              <b>${esc(p.emoji||'🏅')} ${esc(p.titulo)}</b>
              <span>faltam ${p.faltam}</span>
            </div>
            <div class="barra"><i style="width:${feito}%"></i></div>
          </div>`; })()
      : '';

    const numeros = n.total === 0
      ? `<div class="vazio">Seus números aparecem aqui depois da primeira aula.</div>`
      : `<div class="numeros">
          ${cartao(n.total, n.total === 1 ? 'horário feito' : 'horários feitos',
                   n.dias !== n.total ? `em ${n.dias} ${n.dias===1?'dia':'dias'}` : '')}
          ${cartao(n.noMes, 'neste mês')}
          ${n.semanasSeguidas > 1
            ? cartao(n.semanasSeguidas, 'semanas seguidas', 'sem faltar nenhuma')
            : ''}
          ${n.horarioFavorito
            ? cartao(n.horarioFavorito, 'horário preferido',
                     `${n.vezesNoFavorito}x neste horário`)
            : ''}
        </div>
        ${n.primeiraVezPorExtenso
          ? `<p class="ajuda" style="text-align:center">Sua primeira aula foi em ${esc(n.primeiraVezPorExtenso)}.</p>`
          : ''}`;

    alvo.innerHTML = `
      <h2>Meus dados</h2>

      ${medalhas || proxima ? `<h3>Conquistas</h3>${medalhas}${proxima}` : ''}

      <h3>Meus números</h3>
      ${numeros}
      <p class="ajuda" style="font-size:11.5px">Contamos os horários que você reservou e
        que já passaram. Reserva cancelada não entra na conta.</p>

      <h3>Meu cadastro</h3>
      <div class="ficha">
        <div class="dupla">
          <div class="campo"><label for="p-nome">Como quero ser chamado</label>
            <input id="p-nome" maxlength="60" value="${esc(p.nome||'')}"></div>
          <div class="campo"><label for="p-aniv">Meu aniversário</label>
            <input id="p-aniv" inputmode="numeric" maxlength="5" placeholder="dd/mm"
              value="${esc(p.aniversario||'')}"></div>
        </div>
        <div class="campo" style="margin:0">
          <label>Telefone</label>
          <input value="${esc(p.telefone||'')}" disabled>
          <p class="ajuda" style="margin:6px 0 0">É por ele que você entra. Para trocar, fale com o estúdio.</p>
        </div>
        <div class="rodape"><button class="leve" id="p-salvar">Salvar meus dados</button></div>
      </div>
      ${desde ? `<p class="ajuda" style="text-align:center">Você está no estúdio desde ${esc(desde)}.</p>` : ''}`;

    const pAniv = document.getElementById('p-aniv');
    pAniv.addEventListener('input', ()=>{
      const v = pAniv.value.replace(/\D/g,'').slice(0,4);
      pAniv.value = v.length > 2 ? `${v.slice(0,2)}/${v.slice(2)}` : v;
    });
    document.getElementById('p-salvar').addEventListener('click', async ()=>{
      const b = document.getElementById('p-salvar');
      b.disabled = true; b.textContent = 'Salvando…';
      try{
        const r = await api('/perfil', {method:'PUT', body: JSON.stringify({
          nome: document.getElementById('p-nome').value,
          aniversario: pAniv.value,
        })});
        eu.nome = r.nome; eu.aniversario = r.aniversario;
        document.getElementById('quem-sou').textContent = eu.nome || eu.telefone;
        avisar('Dados atualizados.', 'ok');
      }catch(e){ avisar(e.message, 'erro'); }
      finally{ b.disabled = false; b.textContent = 'Salvar meus dados'; }
    });
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

/* ---------------------------- matrículas -------------------------------- */
/* A única tela de aluno do painel. Guarda quem treina (com ou sem telefone), a
   grade fixa, a frequência e — desde que a aba "Alunos" foi desfeita — também o
   acesso ao app: telefone, suspensão e remoção do cadastro de login. Eram duas
   telas para a mesma pessoa, e o telefone editado numa não chegava à outra. */

const DIAS_SEM = [[1,'Seg'],[2,'Ter'],[3,'Qua'],[4,'Qui'],[5,'Sex'],[6,'Sáb'],[0,'Dom']];
const NOME_DIA = {0:'dom',1:'seg',2:'ter',3:'qua',4:'qui',5:'sex',6:'sáb'};

function matEstadoInicial(){
  return { sub:'alunos', busca:'', situacao:'ativos', vinculo:'', revisar:false,
    experimental:false, acesso:'', data:null, aberta:null, freqDias:7, freqSo:'devendo',
    focarFicha:false, mesRef:null };
}
let matEstado = matEstadoInicial();
/* Fora da função de propósito: `carregarMatriculas` roda de novo a cada
   redesenho, e um timer declarado lá dentro nasceria zerado — o `clearTimeout`
   nunca alcançaria o agendamento da tecla anterior, e cada letra digitada
   dispararia a sua própria busca. */
let matBuscaTimer = null;

/** Primeira letra do nome, sem acento, para o índice A–Z; o que não for letra vira '#'. */
function inicialDe(nome){
  const c = String(nome||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .charAt(0).toUpperCase();
  return /[A-Z]/.test(c) ? c : '#';
}

/** Fita de letras acima da grade de alunos. Só com lista longa; senão é ruído. */
function indiceAZ(lista){
  if (lista.length < 12) return '';
  const letras = [...new Set(lista.map(m=>inicialDe(m.nome)))]
    .sort((a,b)=> a==='#' ? 1 : b==='#' ? -1 : a.localeCompare(b));
  return `<div class="indice-az" aria-label="Ir para a letra">
    <button type="button" class="topo" data-topo title="Voltar ao topo">Topo</button>
    ${letras.map(l=>`<button type="button" data-letra="${l}">${l}</button>`).join('')}
  </div>`;
}

/** Altura do cabeçalho fixo: o índice A–Z e a rolagem param logo abaixo dele. */
function medirTopo(){
  const h = document.querySelector('header')?.offsetHeight || 58;
  document.documentElement.style.setProperty('--topo-fixo', h + 'px');
  return h;
}
window.addEventListener('resize', medirTopo);
// Medido também no carregamento. Antes só a lista de alunos media, então quem
// entrasse direto na Frequência ficava com o valor de reserva (58px) e o
// cabeçalho da tabela grudava no lugar errado.
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', medirTopo);
else medirTopo();

/**
 * Abre a ficha de um aluno vindo de outra subaba (Lotação, Frequência, acessos
 * soltos). Limpa os filtros da lista antes: uma busca antiga esconderia
 * justamente quem se quer ver, e a ficha não apareceria em lugar nenhum.
 */
function abrirFichaDe(id){
  Object.assign(matEstado, { sub:'alunos', aberta:id, busca:'', situacao:'ativos', vinculo:'',
    acesso:'', revisar:false, experimental:false, focarFicha:true });
  return redesenhar();
}

/** Rola até o elemento, descontando cabeçalho e índice, e o destaca por um instante. */
function rolarAte(el){
  const desconto = medirTopo() + (document.querySelector('.indice-az')?.offsetHeight || 0) + 8;
  const y = el.getBoundingClientRect().top + window.scrollY - desconto;
  window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  el.classList.add('alvo');
  setTimeout(()=>el.classList.remove('alvo'), 1600);
}

/** Grade em uma linha: agrupa os dias que compartilham o mesmo horário. */
function gradeEmTexto(grade){
  if (!grade || !grade.length) return 'sem horário definido';
  const porHora = new Map();
  grade.forEach(s=>{ if(!porHora.has(s.hora)) porHora.set(s.hora,[]); porHora.get(s.hora).push(s.dia); });
  return [...porHora.entries()].sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([hora,dias])=>`${hora} · ${dias.sort().map(d=>NOME_DIA[d]).join(', ')}`).join('  |  ');
}

function linhaSlot(dia=1, hora=''){
  return `<div class="slot-grade">
    <select class="sg-dia">${DIAS_SEM.map(([v,r])=>
      `<option value="${v}"${v===dia?' selected':''}>${r}</option>`).join('')}</select>
    <input type="time" step="3600" class="sg-hora" value="${esc(hora)}">
    <button class="leve sg-remover" aria-label="Remover horário">Remover</button>
  </div>`;
}

    <!-- Vínculo com o portal. O ID tem treze dígitos e ninguém decora, então a

    <div class="mf-wh" ${mens?'hidden':''}>

      <!-- Uma pessoa faz o check-in e o pacote cobre duas. Sem declarar isso, a
