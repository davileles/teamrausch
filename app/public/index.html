/**
 * Acesso ao app — o que era a aba Alunos.
 *
 * Só aparece quando o aluno tem telefone: o cadastro de login é chaveado pelo
 * número, e sem ele não há o que suspender. Trocar o telefone acontece no campo
 * de cima, ao salvar a ficha; aqui ficam as ações que não são edição de dado.
 */
function blocoAcesso(m){
  if (!m.telefone){
    return `<div class="acesso"><h4>Acesso ao app</h4>
      <p class="ajuda" style="margin:0">Cadastre um telefone para o aluno poder entrar
        no app e reservar horário.</p></div>`;
  }
  const a = m.acesso;
  if (!a){
    return `<div class="acesso"><h4>Acesso ao app</h4>
      <p class="ajuda" style="margin:0">Ainda não entrou. O cadastro de acesso nasce
        sozinho no primeiro login com este número.</p></div>`;
  }
  return `<div class="acesso">
    <h4>Acesso ao app</h4>
    <p class="estado">${esc(a.telefoneFormatado)} ·
      ${a.bloqueado ? '<b class="suspenso">suspenso</b>' : '<b>ativo</b>'}
      ${a.admin ? ' · <b class="admin">administrador</b>' : ''}</p>
    <div class="rodape">
      <button class="leve ac-alternar" data-bloq="${a.bloqueado?1:0}">
        ${a.bloqueado ? 'Reativar acesso' : 'Suspender acesso'}</button>
      <button class="leve ac-remover">Remover acesso</button>
    </div>
  </div>`;
}

/** Lê o formulário e devolve o corpo do PUT/POST. */
function lerFicha(el){
  const grade = [...el.querySelectorAll('.slot-grade')]
    .map(l=>({ dia: Number(l.querySelector('.sg-dia').value), hora: l.querySelector('.sg-hora').value }))
    .filter(s=>s.hora);
  const corpo = {
    nome: el.querySelector('.mf-nome').value,
    telefone: el.querySelector('.mf-tel').value,
    aniversario: el.querySelector('.mf-nasc').value,
    // `gympassId` não vai no PUT: o vínculo passou a ser feito pelo botão, que
    // também move os check-ins. Mandar o campo aqui reescreveria o ID sem mexer
    // no histórico, que é exatamente o descompasso que existia antes.

    titularWellhub: el.querySelector('.mf-titular')?.value ?? undefined,
    vinculo: el.querySelector('.mf-vinculo').value,
    experimental: el.querySelector('.mf-exp').checked,
    observacao: el.querySelector('.mf-obs').value,
    grade,
    revisado: true,
  };
  if (corpo.vinculo === 'mensalista'){
    corpo.ciclo = el.querySelector('.mf-ciclo').value;
    corpo.diaVencimento = el.querySelector('.mf-venc').value;
  }
  return corpo;
}

/**
 * Vínculo com o portal, dentro da ficha.
 *
 * A lista de pessoas vem do histórico de check-ins, e não de um cadastro do
 * Wellhub: quem nunca apareceu no estúdio não tem o que vincular. Quem já está
 * em outra ficha aparece com o dono atual entre parênteses — é o que permite
 * consertar dois alunos que caíram na mesma ficha sem adivinhar números.
 *
 * `id` vazio é ficha nova, ainda sem matrícula gravada: aí não há onde pendurar
 * check-in, e o bloco só volta a valer depois de salvar.
 */
async function ligarVinculoWellhub(el, id){
  const bloco = el.querySelector('.mf-wh');
  if (!bloco) return;
  const quem = bloco.querySelector('.mf-wh-quem');
  const ok = bloco.querySelector('.mf-wh-ok');
  const tirar = bloco.querySelector('.mf-wh-tirar');
  const atual = el.querySelector('.mf-wellhub').value.trim();

  if (!id){
    quem.innerHTML = '<option value="">Salve a ficha para poder vincular</option>';
    quem.disabled = true; ok.disabled = true;
    return;
  }

  try{
    const r = await api('/matriculas/checkins/pessoas');
    quem.innerHTML = '<option value="">Escolha a pessoa no Wellhub…</option>' +
      r.pessoas.map(p=>{
        const dono = p.matriculaId && p.matriculaId !== id
          ? ` — hoje em ${p.nomeMatricula || 'outra ficha'}` : '';
        return `<option value="${esc(p.gympassId)}"${p.gympassId===atual?' selected':''}
          >${esc(p.nome || 'Sem nome')} · ${p.quantos} check-in(s)${esc(dono)}</option>`;
      }).join('');
  }catch(err){
    quem.innerHTML = `<option value="">Não consegui carregar: ${esc(err.message)}</option>`;
    return;
  }

  const contaSel = bloco.querySelector('.mf-conta-de');
  if (contaSel){
    // Só quem tem Wellhub próprio pode ser titular; a divisão da cota precisa de
    // uma assinatura real por trás.
    try{
      const base = await api('/matriculas?situacao=ativos');
      const titulares = base.matriculas
        .filter(x=>x.id !== id && x.gympassId && !x.contaDe)
        .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
      const atualConta = el.closest('.mat-form')?.dataset.contaDe || '';
      contaSel.innerHTML = '<option value="">Não compartilha conta</option>' +
        titulares.map(x=>`<option value="${esc(x.id)}"${x.id===atualConta?' selected':''}
          >Treina na conta de ${esc(x.nome)}</option>`).join('');
    }catch(err){
      contaSel.innerHTML = `<option value="">Não consegui carregar: ${esc(err.message)}</option>`;
    }
    bloco.querySelector('.mf-conta-ok').addEventListener('click', async ()=>{
      try{
        const r = await api('/matriculas/'+id+'/conta-compartilhada',
          {method:'POST', body: JSON.stringify({titularId: contaSel.value})});
        avisar(r.titular
          ? `Passa a treinar na conta de "${r.titular}". A cota do mês é dividida pela grade.`
          : 'Compartilhamento desfeito.', 'ok');
        matEstado.aberta = null; await redesenhar();
      }catch(err){ avisar(err.message,'erro'); }
    });
  }

  ok.addEventListener('click', async ()=>{
    const gympassId = quem.value;
    if (!gympassId) return avisar('Escolha a pessoa no Wellhub.','erro');
    if (gympassId === atual) return avisar('Esta pessoa já está vinculada a esta ficha.','');
    const escolhida = quem.options[quem.selectedIndex].textContent;
    if (escolhida.includes(' — hoje em ') &&
      !confirm(`${escolhida.trim()}\n\nTirar dessa ficha e trazer todos os check-ins para cá?`)) return;
    ok.disabled = true; ok.textContent = 'Vinculando…';
    try{
      const r = await api('/matriculas/'+id+'/wellhub',
        {method:'POST', body: JSON.stringify({gympassId})});
      avisar(`${r.movidos} check-in(s) trazidos para esta ficha`
        + (r.tomadoDe ? `, tirados de "${r.tomadoDe}".` : '.'), 'ok');
      matEstado.aberta = null; await redesenhar();
    }catch(err){
      avisar(err.message,'erro');
      ok.disabled = false; ok.textContent = 'Vincular';
    }
  });

  if (tirar) tirar.addEventListener('click', async ()=>{
    if (!confirm('Desvincular do Wellhub?\n\nOs check-ins voltam a ficar sem aluno '
      + 'e aparecem na aba Frequência para vincular de novo.')) return;
    tirar.disabled = true;
    try{
      const r = await api('/matriculas/'+id+'/wellhub', {method:'DELETE'});
      avisar(`Vínculo desfeito · ${r.soltos} check-in(s) soltos.`, 'ok');
      matEstado.aberta = null; await redesenhar();
    }catch(err){ avisar(err.message,'erro'); tirar.disabled = false; }
  });
}

function ligarFicha(el, id){
  const nasc = el.querySelector('.mf-nasc');
  nasc.addEventListener('input', ()=>{
    const n = nasc.value.replace(/\D/g,'').slice(0,4);
    nasc.value = n.length > 2 ? `${n.slice(0,2)}/${n.slice(2)}` : n;
  });
  el.querySelector('.mf-add').addEventListener('click', ()=>{
    el.querySelector('.lista-slots').insertAdjacentHTML('beforeend', linhaSlot());
  });
  el.querySelector('.lista-slots').addEventListener('click', e=>{
    if (e.target.closest('.sg-remover')) e.target.closest('.slot-grade').remove();
  });
  el.querySelector('.mf-vinculo').addEventListener('change', e=>{
    el.querySelector('.mf-cobranca').hidden = e.target.value !== 'mensalista';
    el.querySelector('.mf-bloco-wellhub').hidden = e.target.value === 'mensalista';
    const wh = el.querySelector('.mf-wh');
    if (wh) wh.hidden = e.target.value === 'mensalista';
  });
  ligarVinculoWellhub(el, id);
  el.querySelector('.mf-cancelar').addEventListener('click', ()=>{
    matEstado.aberta = null; redesenhar();
  });
  el.querySelector('.mf-salvar').addEventListener('click', async ()=>{
    const b = el.querySelector('.mf-salvar');
    // Trocar o telefone move a ficha de login inteira e derruba a sessão aberta:
    // é a única edição desta tela que o aluno sente do outro lado.
    const telAntes = b.closest('.mat-form').dataset.telefone || '';
    const telAgora = el.querySelector('.mf-tel').value.trim();
    if (telAntes && telAgora !== telAntes && !confirm(
      `Trocar o telefone de ${telAntes} para ${telAgora}?\n\n`
      + 'Os agendamentos vão junto, mas o aluno é desconectado e passa a entrar '
      + 'com o número novo.')) return;

    b.disabled = true; b.textContent = 'Salvando…';
    try{
      await api('/matriculas' + (id ? '/'+id : ''), {
        method: id ? 'PUT' : 'POST', body: JSON.stringify(lerFicha(el)) });
      avisar(id ? 'Matrícula atualizada.' : 'Aluno cadastrado.', 'ok');
      matEstado.aberta = null; redesenhar();
    }catch(e){
      avisar(e.message,'erro'); b.disabled = false; b.textContent = id ? 'Salvar' : 'Cadastrar';
    }
  });
  const alternar = el.querySelector('.ac-alternar');
  if (alternar) alternar.addEventListener('click', async ()=>{
    const bloquear = alternar.dataset.bloq !== '1';
    if (bloquear && !confirm('Suspender o acesso? O aluno não consegue mais entrar no app,\n'
      + 'mas continua na grade e no histórico.')) return;
    try{
      await api('/matriculas/'+id+'/acesso', {method:'POST',
        body: JSON.stringify({bloqueado: bloquear})});
      avisar(bloquear ? 'Acesso suspenso.' : 'Acesso reativado.', 'ok');
      redesenhar();
    }catch(e){ avisar(e.message,'erro'); }
  });

  const remover = el.querySelector('.ac-remover');
  if (remover) remover.addEventListener('click', async ()=>{
    if (!confirm('Apagar o cadastro de acesso deste aluno?\n\n'
      + 'A matrícula fica: ele continua na grade, só perde o login no app.')) return;
    try{
      await api('/matriculas/'+id+'/acesso', {method:'DELETE'});
      avisar('Acesso removido.', 'ok');
      redesenhar();
    }catch(e){ avisar(e.message,'erro'); }
  });

  const inat = el.querySelector('.mf-inativar');
  if (inat) inat.addEventListener('click', async ()=>{
    const ativo = inat.textContent.trim() === 'Inativar';
    if (ativo && !confirm('Inativar este aluno? Ele sai da grade a partir de hoje, mas o histórico fica.')) return;
    try{
      if (ativo) await api('/matriculas/'+id, {method:'DELETE'});
      else await api('/matriculas/'+id, {method:'PUT', body: JSON.stringify({ativo:true})});
      matEstado.aberta = null; redesenhar();
    }catch(e){ avisar(e.message,'erro'); }
  });
}

async function carregarMatriculas(){
  const alvo = document.getElementById('aba-matriculas');
  const q = new URLSearchParams({ situacao: matEstado.situacao });
  if (matEstado.busca.trim()) q.set('busca', matEstado.busca.trim());
  if (matEstado.vinculo) q.set('vinculo', matEstado.vinculo);
  if (matEstado.revisar) q.set('revisar','1');
  if (matEstado.experimental) q.set('experimental','1');
  if (matEstado.acesso) q.set('acesso', matEstado.acesso);

  try{
    const { resumo, matriculas } = await api('/matriculas?'+q);

    // O redesenho troca a aba inteira, campo de busca junto. Enquanto a resposta
    // vinha, a pessoa continuou digitando: sem guardar o texto vivo do campo, o
    // HTML novo entra com o valor de quando a busca começou e as últimas letras
    // somem da tela — o "bug de digitar" desta aba.
    const vivo = document.getElementById('mat-busca');
    const digitando = vivo && document.activeElement === vivo
      ? { texto: vivo.value, cursor: vivo.selectionStart } : null;

    alvo.innerHTML = `<h2>Matrículas</h2>
      <div class="subabas" id="sub-mat">
        <button data-sub="alunos" aria-selected="${matEstado.sub==='alunos'}">Alunos</button>
        <button data-sub="grade" aria-selected="${matEstado.sub==='grade'}">Grade do dia</button>
        <button data-sub="lotacao" aria-selected="${matEstado.sub==='lotacao'}">Lotação da semana</button>
        <button data-sub="freq" aria-selected="${matEstado.sub==='freq'}">Frequência</button>
        <button data-sub="mes" aria-selected="${matEstado.sub==='mes'}">Indicadores</button>
      </div>
      <div data-painel="alunos" ${matEstado.sub==='alunos'?'':'hidden'}>
        <p class="ajuda">${resumo.ativas} ativos · ${resumo.mensalistas} mensalistas ·
          ${resumo.wellhub} Wellhub · ${resumo.semTelefone} sem telefone ·
          ${resumo.comAcesso} com acesso ao app${
          resumo.suspensos ? ` · <b>${resumo.suspensos} suspenso(s)</b>` : ''}${
          resumo.aRevisar ? ` · <b>${resumo.aRevisar} a revisar</b>` : ''}${
          resumo.experimentais ? ` · <b>${resumo.experimentais} em experimental</b>` : ''}</p>
        <div class="filtros-mat">
          <div class="busca-novo">
            <input id="mat-busca" value="${esc(matEstado.busca)}" placeholder="Buscar por nome ou telefone"
              title="Enter abre a ficha quando sobra um aluno só">
            <button class="leve" id="mat-novo">+ Novo aluno</button>
          </div>
          <div class="chips-mat">
            <div class="grupo-filtro"><span>Situação</span>
              ${[['ativos','Ativos'],['inativos','Inativos'],['todos','Todos']].map(([v,r])=>
                `<button class="chip${matEstado.situacao===v?' sel':''}" data-sit="${v}">${r}</button>`).join('')}
            </div>
            <div class="grupo-filtro"><span>Vínculo</span>
              ${[['','Ambos'],['mensalista','Mensalista'],['wellhub','Wellhub']].map(([v,r])=>
                `<button class="chip${matEstado.vinculo===v?' sel':''}" data-vin="${v}">${r}</button>`).join('')}
            </div>
            <div class="grupo-filtro"><span>Acesso ao app</span>
              ${[['','Todos'],['com','Tem'],['sem','Não tem'],['suspensos','Suspensos']].map(([v,r])=>
                `<button class="chip${matEstado.acesso===v?' sel':''}" data-ac="${v}">${r}</button>`).join('')}
            </div>
            <div class="grupo-filtro"><span></span>
              <button class="chip${matEstado.experimental?' sel':''}" data-exp="1">Experimentais</button>
              <button class="chip${matEstado.revisar?' sel':''}" data-rev="1">A revisar</button>
            </div>
          </div>
        </div>
        <p class="ajuda" style="margin:0 0 8px">${matriculas.length} ${matriculas.length===1?'aluno':'alunos'} nesta lista</p>
        ${indiceAZ(matriculas)}
        <div id="mat-lista">${
          matEstado.aberta === 'novo' ? fichaMatricula({}) : ''}${
          matriculas.length ? matriculas.map(m=>
            matEstado.aberta === m.id ? fichaMatricula(m) : `

              title="Abrir ficha de ${esc(m.nome)}">
              <div class="cabeca"><b>${esc(m.nome)}</b><span class="abrir" aria-hidden="true">Editar</span></div>

                m.acesso && m.acesso.bloqueado?' · suspenso':''}${
                m.acesso && m.acesso.admin?' · admin':''}${
                m.experimental?' · experimental':''}${
                m.precisaRevisar?' · revisar':''}</span>
              <p class="ajuda">${esc(gradeEmTexto(m.grade))}</p>

        <div id="mat-grade"><div class="vazio">Carregando…</div></div>

        <div id="mat-mes"><div class="vazio">Carregando…</div></div>
      </div>`;

    alvo.querySelector('#sub-mat').addEventListener('click', e=>{
      const b = e.target.closest('button[data-sub]'); if (!b) return;
      matEstado.sub = b.dataset.sub; matEstado.aberta = null; gravarRota(); redesenhar();
    });

    const busca = alvo.querySelector('#mat-busca');
    busca.addEventListener('input', ()=>{
      clearTimeout(matBuscaTimer);
      matBuscaTimer = setTimeout(()=>{
        // Este campo pode já ter sido trocado por um redesenho disparado de
        // outro lugar. Seguir com ele gravaria em `matEstado` o texto congelado
        // de um elemento que não está mais na tela.
        if (busca !== document.getElementById('mat-busca')) return;
        // Sem `.trim()`: o valor gravado é o que a pessoa vê no campo. Aparar
        // aqui devolveria um texto menor do que o digitado e o cursor pularia
        // para trás no meio da palavra.
        matEstado.busca = busca.value;
        matEstado.aberta = null;
        redesenhar();
      }, 320);
    });

    // Enter aplica a busca na hora e, se sobrar um aluno só, já abre a ficha —
    // o caminho mais curto de "digitei o nome" até "estou editando".
    busca.addEventListener('keydown', async e=>{
      if (e.key !== 'Enter') return;
      e.preventDefault(); clearTimeout(matBuscaTimer);
      matEstado.busca = busca.value; matEstado.aberta = null;
      await redesenhar();
      const cartoes = document.querySelectorAll('#mat-lista .mat-item');
      if (cartoes.length === 1){ matEstado.aberta = cartoes[0].dataset.id; redesenhar(); return; }
      const novo = document.getElementById('mat-busca');
      if (novo){ novo.focus(); novo.setSelectionRange(novo.value.length, novo.value.length); }
    });

    alvo.querySelector('.chips-mat').addEventListener('click', e=>{
      const b = e.target.closest('.chip'); if (!b) return;
      if (b.dataset.sit) matEstado.situacao = b.dataset.sit;
      else if (b.dataset.vin !== undefined) matEstado.vinculo = b.dataset.vin;
      else if (b.dataset.ac !== undefined) matEstado.acesso = b.dataset.ac;
      else if (b.dataset.exp) matEstado.experimental = !matEstado.experimental;
      else if (b.dataset.rev) matEstado.revisar = !matEstado.revisar;
      matEstado.aberta = null; redesenhar();
    });

    alvo.querySelector('#mat-novo').addEventListener('click', ()=>{
      matEstado.aberta = 'novo'; redesenhar();
    });

    // Devolve ao campo novo o texto e o cursor de quem estava digitando. Se o
    // que ficou no campo já não é o que esta lista respondeu, dispara outra
    // busca pelo mesmo caminho do debounce, em vez de deixar tela e filtro
    // desencontrados.
    if (digitando){
      busca.value = digitando.texto;
      busca.focus();
      const pos = Math.min(digitando.cursor ?? digitando.texto.length, digitando.texto.length);
      busca.setSelectionRange(pos, pos);
      if (digitando.texto !== matEstado.busca) busca.dispatchEvent(new Event('input'));
    }

    // O cartão inteiro abre a ficha — no toque, no clique e pelo teclado.
    alvo.querySelectorAll('.mat-item').forEach(item=>{
      const abrir = ()=>{ matEstado.aberta = item.dataset.id; redesenhar(); };
      item.addEventListener('click', abrir);
      item.addEventListener('keydown', e=>{
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abrir(); }
      });
    });

    const indice = alvo.querySelector('.indice-az');
    if (indice){
      medirTopo();
      indice.addEventListener('click', e=>{
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.topo !== undefined){ window.scrollTo({ top:0, behavior:'smooth' }); return; }
        const cartao = alvo.querySelector(`.mat-item[data-inicial="${b.dataset.letra}"]`);
        if (cartao) rolarAte(cartao);
      });
    }

    alvo.querySelectorAll('.mat-form').forEach(f=> ligarFicha(f, f.dataset.id || null));

    // Ficha aberta a partir de outra subaba (Lotação, Frequência, acessos
    // soltos): a pessoa estava em outro lugar da página, então a ficha precisa
    // vir até ela. O redesenho devolve a rolagem antiga num frame; esperamos
    // ele passar antes de rolar para a ficha.
    if (matEstado.focarFicha){
      matEstado.focarFicha = false;
      setTimeout(()=>{ const f = alvo.querySelector('.mat-form'); if (f) rolarAte(f); }, 80);
    }

    if (matEstado.sub === 'alunos' && resumo.acessosSoltos) await carregarAcessosSoltos();
    if (matEstado.sub === 'grade') await carregarGradeDoDia();
    if (matEstado.sub === 'lotacao') await carregarLotacao();
    if (matEstado.sub === 'freq') await carregarFrequencia();
    if (matEstado.sub === 'mes') await carregarMes();
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

    alvo.innerHTML = `<h3 style="font:400 14px Anton,sans-serif;letter-spacing:.06em;
      text-transform:uppercase;color:var(--amarelo);margin:24px 0 8px">
      ${acessos.length} acesso(s) sem matrícula</h3>
      <p class="ajuda">Entraram no app mas não estão na base do estúdio.</p>
      <div class="soltos">${acessos.map(a=>`<div class="solto${a.bloqueado?' suspenso':''}" data-tel="${esc(a.telefone)}">
        <b>${esc(a.nome || 'Sem nome')}</b>
        <p class="ajuda" style="margin:4px 0 0">${esc(a.telefoneFormatado)}${
          a.bloqueado ? ' · suspenso' : ''}${a.admin ? ' · administrador' : ''}${
          a.aniversarioFormatado ? ' · 🎂 '+esc(a.aniversarioFormatado) : ''}</p>
        <div class="rodape">
          <button class="leve so-matricular">Criar matrícula</button>
          <button class="leve so-alternar" data-bloq="${a.bloqueado?1:0}">
            ${a.bloqueado?'Reativar':'Suspender'}</button>
          <button class="leve so-remover">Remover</button>
        </div>
      </div>`).join('')}</div>`;

    alvo.querySelectorAll('.solto').forEach(el=>{
      const tel = el.dataset.tel;
      el.querySelector('.so-matricular').addEventListener('click', async ()=>{
        try{
          const m = await api('/matriculas/acessos/'+tel+'/matricular',
            {method:'POST', body: JSON.stringify({})});
          avisar('Matrícula criada. Defina os horários na ficha.','ok');
          abrirFichaDe(m.id);
        }catch(e){ avisar(e.message,'erro'); }
      });
      el.querySelector('.so-alternar').addEventListener('click', async ()=>{
        const bloquear = el.querySelector('.so-alternar').dataset.bloq !== '1';
        try{
          await api('/matriculas/acessos/'+tel+'/suspender',
            {method:'POST', body: JSON.stringify({bloqueado: bloquear})});
          await carregarAcessosSoltos();
        }catch(e){ avisar(e.message,'erro'); }
      });
      el.querySelector('.so-remover').addEventListener('click', async ()=>{
        if (!confirm('Apagar este cadastro de acesso? Os agendamentos dele vão junto.')) return;
        try{
          await api('/matriculas/acessos/'+tel, {method:'DELETE'});
          avisar('Acesso removido.','ok');
          await carregarAcessosSoltos();
        }catch(e){ avisar(e.message,'erro'); }
      });
    });
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

/**
 * Baixa uma planilha CSV montada no navegador.
 *
 * Não passa por endpoint de download porque a API só responde com o token no
 * cabeçalho Authorization, e um link comum não carrega cabeçalho — o arquivo
 * voltaria como 401. Montar aqui também evita um formato novo no servidor.
 *
 * Separador ";" e BOM UTF-8: é o que faz o Excel em português abrir o arquivo
 * já com as colunas separadas e os acentos certos, sem passar pelo assistente
 * de importação.
 */
function baixarCsv(nome, cabecalho, linhas){
  const campo = (v)=>{
    const t = v === null || v === undefined ? '' : String(v);
    return /[";\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
  };
  const texto = [cabecalho, ...linhas].map(l=>l.map(campo).join(';')).join('\r\n');
  const url = URL.createObjectURL(
    new Blob(['\uFEFF'+texto], {type:'text/csv;charset=utf-8;'}));
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  // Sem revogar, o blob fica preso na memória da aba até recarregar a página.
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/**
 * Planilha .xlsx com uma ou mais abas, montada aqui mesmo no navegador.
 *
 * CSV não tem aba: para o resumo do mês vir junto com um recorte simplificado
 * no mesmo arquivo, o jeito é entregar um xlsx de verdade. Não há biblioteca
 * envolvida — um xlsx é um ZIP com uns poucos XMLs dentro, e o ZIP vai sem
 * compressão (método "store"), o que dispensa qualquer rotina de deflate.
 *
 * abas: [{ nome, cabecalho:[...], linhas:[[...], ...] }]
 * Valor numérico vira número na célula; o resto vira texto (importante para
 * Wellhub ID e telefone, que o Excel senão comeria zeros à esquerda).
 */
function baixarXlsx(nome, abas){
  const esc = (v)=> String(v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    // Caracteres de controle não são válidos em XML e derrubariam o arquivo.
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');

  const letra = (i)=>{ let s='', n=i+1; while(n>0){ const r=(n-1)%26;
    s = String.fromCharCode(65+r)+s; n = (n-r-1)/26; } return s; };

  const folha = (aba)=>{
    const todas = [aba.cabecalho, ...aba.linhas];
    const largura = aba.cabecalho.map((_,c)=>{
      let m = 8;
      todas.forEach(l=>{ const v = l[c]; if (v!==null && v!==undefined)
        m = Math.max(m, String(v).length + 2); });
      return Math.min(m, 42);
    });
    const corpo = todas.map((l,i)=>{
      const cel = l.map((v,c)=>{
        if (v === null || v === undefined || v === '') return '';
        const ref = letra(c) + (i+1);
        return (typeof v === 'number' && Number.isFinite(v))
          ? `<c r="${ref}"><v>${v}</v></c>`
          : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
      }).join('');
      return `<row r="${i+1}">${cel}</row>`;
    }).join('');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
      + '<sheetViews><sheetView workbookViewId="0">'
      + '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>'
      + '</sheetView></sheetViews>'
      + '<cols>' + largura.map((w,c)=>
          `<col min="${c+1}" max="${c+1}" width="${w}" customWidth="1"/>`).join('') + '</cols>'
      + `<sheetData>${corpo}</sheetData></worksheet>`;
  };

  const NS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const arquivos = [
    { nome:'[Content_Types].xml', texto:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + abas.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" `
          + 'ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')
      + '</Types>' },
    { nome:'_rels/.rels', texto:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + `<Relationship Id="rId1" Type="${NS}/officeDocument" Target="xl/workbook.xml"/>`
      + '</Relationships>' },
    { nome:'xl/workbook.xml', texto:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
      + `xmlns:r="${NS}"><sheets>`
      + abas.map((a,i)=>`<sheet name="${esc(String(a.nome).slice(0,31))}" `
          + `sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')
      + '</sheets></workbook>' },
    { nome:'xl/_rels/workbook.xml.rels', texto:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + abas.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${NS}/worksheet" `
          + `Target="worksheets/sheet${i+1}.xml"/>`).join('')
      + '</Relationships>' },
    ...abas.map((a,i)=>({ nome:`xl/worksheets/sheet${i+1}.xml`, texto: folha(a) })),
  ];

  const TABELA = (()=>{ const t = new Uint32Array(256);
    for (let n=0;n<256;n++){ let x=n; for (let k=0;k<8;k++)
      x = (x & 1) ? (0xEDB88320 ^ (x>>>1)) : (x>>>1); t[n] = x>>>0; } return t; })();
  const crc32 = (b)=>{ let x = 0xFFFFFFFF;
    for (let i=0;i<b.length;i++) x = TABELA[(x ^ b[i]) & 0xFF] ^ (x>>>8);
    return (x ^ 0xFFFFFFFF) >>> 0; };

  const enc = new TextEncoder();
  const saida = [];
  const p16 = (n)=> saida.push(n & 255, (n>>>8) & 255);
  const p32 = (n)=> saida.push(n & 255, (n>>>8) & 255, (n>>>16) & 255, (n>>>24) & 255);
  const pbytes = (b)=>{ for (let i=0;i<b.length;i++) saida.push(b[i]); };

  const dir = [];
  arquivos.forEach(f=>{
    const nb = enc.encode(f.nome), db = enc.encode(f.texto);
    const crc = crc32(db), inicio = saida.length;
    p32(0x04034b50); p16(20); p16(0x0800); p16(0); p16(0); p16(0);
    p32(crc); p32(db.length); p32(db.length); p16(nb.length); p16(0);
    pbytes(nb); pbytes(db);
    dir.push({nb, crc, tam: db.length, inicio});
  });
  const dirInicio = saida.length;
  dir.forEach(d=>{
    p32(0x02014b50); p16(20); p16(20); p16(0x0800); p16(0); p16(0); p16(0);
    p32(d.crc); p32(d.tam); p32(d.tam); p16(d.nb.length);
    p16(0); p16(0); p16(0); p16(0); p32(0); p32(d.inicio);
    pbytes(d.nb);
  });
  const dirTam = saida.length - dirInicio;
  p32(0x06054b50); p16(0); p16(0); p16(dir.length); p16(dir.length);
  p32(dirTam); p32(dirInicio); p16(0);

  const url = URL.createObjectURL(new Blob([new Uint8Array(saida)],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function dataCurta(iso){
  if (!iso) return null;
  const [a,m,d] = iso.split('-');
  return `${d}/${m}`;
}

/** R$ 1.234,56 — sem centavo perdido e sem depender do locale do aparelho. */
function dinheiro(valor){
  return (Number(valor) || 0).toLocaleString('pt-BR',
    {style:'currency', currency:'BRL', minimumFractionDigits:2});
}

function cartaoFreq(valor, rotulo, classe){
  return `<div class="freq-cartao ${classe||''}"><b>${valor}</b><span>${rotulo}</span></div>`;
}

/**
 * Uma linha da tabela de frequência.
 *
 * Cartão por aluno virava uma parede de 66 blocos que só se lia um a um. Em
 * linha, cada coluna é uma régua vertical: dá para descer a coluna "faltam" e
 * achar quem precisa de cobrança sem ler nome nenhum.
 *
 * As classes `freq-item`, `fq-exp`, `fq-cobrar` e `fq-abrir` continuam as
 * mesmas: os handlers da tela pendem delas e não precisam saber que agora é
 * `<tr>` em vez de `<div>`.
 */
function linhaFrequencia(a){
  const s = SITUACAO[a.situacao] || { rotulo:a.situacao, marca:'·' };
  const meta = a.mes && a.mes.meta ? a.mes.meta : 0;
  const feitos = a.mes ? a.mes.realizado : a.realizado;
  const faltam = a.mes ? a.mes.faltam : Math.max(a.esperado - a.realizado, 0);

  const ultimo = a.ultimoCheckin
    ? `${dataCurta(a.ultimoCheckin)}<span class="fraco">${
        a.diasSemTreinar === 0 ? ' hoje' : a.diasSemTreinar === 1 ? ' ontem'
        : ` · ${a.diasSemTreinar}d`}</span>`
    : '<span class="fraco">nunca</span>';

  // Grade de 5x com teto de 3: mostrar só o combinado faria a meta de 12
  // parecer erro de conta.
  // Conta dividida: a grade continua sendo a dele, mas o que vale é a cota.
  const semana = a.mes && a.mes.conta
    ? `${a.porSemana}<span class="fraco">→${a.mes.meta}/mês</span>`
    : (a.mes && a.mes.acimaDoTeto
      ? `${a.porSemana}<span class="fraco">→${a.mes.porSemanaCobravel}</span>`
      : `${a.porSemana}`);

  const devendo = a.situacao === 'critico' || a.situacao === 'atrasado';
  const conta = a.mes && a.mes.conta ? a.mes.conta : null;
  return `<tr class="freq-item ${esc(a.situacao)}" data-id="${esc(a.matriculaId)}"
    title="Duplo clique para ver os check-ins do mês">
    <td class="nome">${esc(a.nome)}${conta
      ? ` <span class="fraco" title="${esc(conta.ehTitular
          ? `Conta dividida com ${conta.participantes.filter(n=>n!==a.nome).join(', ')} · cota ${conta.cota}`
          : `Treina na conta de ${conta.titular} · cota ${conta.cota}`)}">🔗</span>`
      : (a.gympassId ? '' : ' <span class="fraco" title="Sem Wellhub ID vinculado">⚠</span>')}</td>
    <td class="num opc">${semana}×</td>
    <td class="num">${meta ? `${feitos}/${meta}` : `<span class="fraco">${feitos}/—</span>`}</td>
    <td class="num opc" title="${a.mes && a.mes.proximoMarco
      ? `A régua sobe para ${a.mes.proximoMarco.exigido} em ${dataCurta(a.mes.proximoMarco.data)}`
      : 'Último dia do mês'}">${meta
        ? `${feitos}/${a.mes.devido}${a.mes.atrasoNoRitmo
            ? ` <span class="falta">−${a.mes.atrasoNoRitmo}</span>` : ''}`
        : '—'}</td>
    <td class="num falta" title="${a.mes && a.mes.risco === 'impossivel'
      ? `Não fecha mais: ${faltam} check-in(s) para ${a.mes.diasRestantes} dia(s)`
      : a.mes && a.mes.risco === 'no-limite'
        ? `Só fecha vindo todos os ${a.mes.diasRestantes} dia(s) que restam` : ''}"
      >${meta ? (faltam ? `${faltam}${a.mes.risco === 'impossivel' ? ' ⛔'
        : a.mes.risco === 'no-limite' ? ' ⏳' : ''}`
        : '<span class="quitado">ok</span>') : '—'}</td>
    <td class="num opc">${ultimo}</td>
    <td class="opc"><span class="fraco">${s.marca} ${esc(s.rotulo)}</span></td>
    <td class="opc" style="text-align:center">
      <input type="checkbox" class="fq-exp" ${a.experimental?'checked':''}
        title="Em aula experimental"></td>
    <td><div class="acoes">
      ${devendo && a.telefone ? '<button class="leve fq-cobrar">Cobrar</button>' : ''}
      <button class="leve fq-abrir">Ficha</button>
    </div></td>
  </tr>`;
}

/**
 * Junta os órfãos por pessoa. Um aluno que treinou o mês inteiro sem vínculo
 * gera treze check-ins soltos, e treze cartões iguais na tela para uma decisão
 * só. `vincular` no servidor já arrasta os outros registros do mesmo Wellhub
 * ID, então a tela pede um cartão por pessoa — não por check-in.
 *
 * A chave é o Wellhub ID. Sem ID (caso raro, portal sem identificar) cada
 * registro fica sozinho, porque aí não há o que garanta que é a mesma pessoa.
 */
function agruparOrfaos(lista){
  const grupos = new Map();
  for (const c of lista){
    const chave = c.gympassId ? 'id:'+c.gympassId : 'avulso:'+c.id;
    if (!grupos.has(chave)) grupos.set(chave, []);
    grupos.get(chave).push(c);
  }
  return [...grupos.values()]
    .map((cs)=>{
      const ordenados = cs.slice().sort((a,b)=> String(b.data).localeCompare(String(a.data)));
      return { ...ordenados[0], quantos: cs.length,
        primeira: ordenados[ordenados.length-1].data, ultima: ordenados[0].data };
    })
    // Quem tem mais check-ins parados primeiro: é o vínculo que mais muda a conta.
    .sort((a,b)=> b.quantos - a.quantos ||
      String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));
}

/**
 * Uma linha da tabela de pessoas do portal sem aluno na base.
 *
 * Era um cartão por pessoa, com nome editável e duas caixinhas. Lido um a um
 * funciona; conferir dezesseis de uma vez, não — o que se quer olhar é a coluna
 * de quantidade e decidir a ordem de ataque. As opções finas (nome diferente do
 * portal, conta de terceiro) continuam existindo, agora perguntadas na hora de
 * usar em vez de ocupar espaço em toda linha.
 *
 * O botão manda o check-in mais recente; o servidor liga os demais do mesmo
 * Wellhub ID junto, então uma pessoa sai da tabela por vez.
 */
/**
 * Uma pessoa do portal que treinou sem ficha na base.
 *
 * A CAIXINHA "EXP" NASCE MARCADA
 *   Quem cai nesta lista quase sempre é aula experimental: apareceu, treinou,
 *   ainda não combinou horário nenhum. Criada como aluno normal, a ficha nasce
 *   com grade vazia e entra na conta do pacote como quem está devendo o mês
 *   inteiro sem ter combinado nada. Marcada, ela nasce fora da cobrança e sai
 *   de lá sozinha quando você define a grade na aba Alunos.
 *
 *   Vale só para "Criar". "Vincular a…" joga os check-ins numa ficha que já
 *   existe, e essa ficha já tem a própria marcação — mexer nela a partir daqui
 *   desfaria uma decisão tomada na tela do aluno.
 */
function linhaOrfa(c, alunos){
  const periodo = c.quantos > 1
    ? `${dataCurta(c.primeira)} a ${dataCurta(c.ultima)}`
    : `${dataCurta(c.data)} às ${esc(c.hora||'--:--')}`;
  return `<tr class="orfao" data-id="${esc(c.id)}" data-nome="${esc(c.nome||'')}">
    <td class="nome">${esc(c.nome || 'Sem nome no portal')}</td>
    <td class="num">${c.quantos}</td>
    <td class="opc"><span class="fraco">${periodo}</span></td>
    <td class="opc"><span class="fraco">${esc(c.gympassId || '—')}</span></td>
    <td><select class="orf-quem">
      <option value="">Vincular a…</option>
      ${alunos.map(m=>`<option value="${esc(m.id)}">${esc(m.nome)}</option>`).join('')}
    </select></td>
    <td class="opc" style="text-align:center">
      <input type="checkbox" class="orf-exp" checked
        title="Criar como aula experimental — vale só para o botão Criar."></td>
    <td><div class="acoes">
      <button class="leve orf-ok">Vincular</button>
      <button class="leve orf-criar">Criar</button>
    </div></td>
  </tr>`;
}

/**
 * Fichas que dizem ser Wellhub mas não têm conta ligada.
 *
 * É o outro lado do mesmo buraco: a tabela de órfãos mostra quem treinou sem
 * ficha, esta mostra quem tem ficha e não aparece no portal. Um aluno destes
 * conta como devendo o mês inteiro sem ter feito nada de errado — pode ser
 * vínculo faltando, ou pode ser que ele realmente não venha, e a diferença só
 * se resolve olhando as duas listas lado a lado.
 */
function linhaSemConta(m){
  const dias = ['dom','seg','ter','qua','qui','sex','sáb'];
  const grade = [...new Set((m.grade||[]).map(s=>s.dia))].sort().map(d=>dias[d]).join(', ');
  return `<tr class="sem-conta" data-id="${esc(m.id)}">
    <td class="nome">${esc(m.nome)}${m.experimental
      ? ' <span class="fraco">✳︎</span>' : ''}</td>
    <td class="num">${m.diasSemana||0}×</td>
    <td class="opc"><span class="fraco">${grade || '—'}</span></td>
    <td class="num">${m.checkinsNaFicha||0}</td>
    <td><div class="acoes"><button class="leve sc-abrir">Abrir ficha</button></div></td>
  </tr>`;
}

async function carregarFrequencia(){
  const alvo = document.getElementById('mat-freq');
  if (!alvo) return;
  try{
    const [f, orfaos, base] = await Promise.all([
      api('/matriculas/frequencia?dias='+matEstado.freqDias),
      // Limite alto de propósito: a tela agrupa por pessoa, e cortar em 40
      // registros esconderia gente inteira atrás dos check-ins de outra.
      api('/matriculas/checkins?semVinculo=1&limite=500'),
      api('/matriculas?situacao=ativos'),
    ]);

    const pessoasOrfas = agruparOrfaos(orfaos.checkins);
    // O outro lado do buraco: ficha Wellhub sem conta ligada. Sai da mesma
    // chamada que popula o seletor de alunos, sem pedir nada a mais ao servidor.
    // `contaDe` também é vínculo: a ficha treina na assinatura de outro aluno e
    // por isso nunca vai ter Wellhub ID próprio. Sem esta exceção ela ficaria
    // para sempre na lista de pendências, pedindo algo que já foi resolvido.
    const semConta = base.matriculas
      .filter(m=>m.ativo && m.vinculo === 'wellhub' && !m.gympassId && !m.contaDe)
      .sort((a,b)=> a.nome.localeCompare(b.nome,'pt-BR'));
    const devendo = f.alunos.filter(a=>a.situacao==='critico'||a.situacao==='atrasado');
    const mostrar = matEstado.freqSo === 'devendo' ? devendo
      : matEstado.freqSo === 'experimentais' ? f.alunos.filter(a=>a.experimental)
      : f.alunos;
    const j = f.janela;

    // A janela pode voltar menor do que a pedida: ela para no dia 1º, porque o
    // pacote do aluno renova na virada e falta do mês passado não é cobrada de
    // novo. Sem dizer isso, o número curto pareceria erro.
    const periodo = `${dataCurta(j.de)} a ${dataCurta(j.ate)}`;
    const cabecalho = j.truncadaNoMes
      ? `Do dia 1º até hoje (${periodo}) — ${j.dias} ${j.dias===1?'dia':'dias'} de mês.
         A janela de ${j.diasPedidos} dias não atravessa a virada: o ciclo anterior já fechou.`
      : `Últimos ${j.dias} dias (${periodo}), sem passar do dia 1º.`;

    alvo.innerHTML = `
      <p class="ajuda">${cabecalho}
        <b>Mês</b> é o pacote: check-ins feitos sobre a meta, que é o combinado semanal
        vezes quatro, limitado a 12 — o Wellhub não repassa mais do que isso. Quem treina
        além do combinado continua sendo confirmado no portal, mas o excedente não entra
        nessa soma: quem prometeu 8 e fez 12 fecha o pacote em 8, e os outros 4 aparecem em
        <b>além do combinado</b> — o Wellhub ainda paga por eles, só que não eram previstos.
        Do 13º em diante vai para <b>sem repasse</b>: aconteceu e não rende nada. Experimental
        fica fora dessa soma: sem grade combinada não há meta, e o treino dele é excedente
        até a ficha virar aluno de fato.
        <b>No prazo</b> compara com o que já venceu: a meta do mês repartida pelos dias do
        mês, subindo um pouco a cada dia. Quem faz 3× por semana deve 12 no fechamento, e no
        dia 20 de um mês de 31 já deveria ter 7. É daí que sai a situação —
        dá para ter treinado ontem e ainda estar atrasado no mês. ⏳ marca quem só fecha
        vindo todos os dias que restam; ⛔, quem já não fecha de jeito nenhum.
        <b>Duplo clique na linha do aluno</b> abre a lista dos check-ins dele no mês, um a um.</p>

      <div class="freq-cartoes">
        ${cartaoFreq(f.resumo.criticos, 'críticos', 'critico')}
        ${cartaoFreq(f.resumo.atrasados, 'atrasados', 'atrasado')}
        ${(()=>{
          // O SALDO DO DIA, NO LUGAR DE "EM DIA"
          //   "22 em dia" conta pessoas e não diz se o mês fecha: 22 assíduos
          //   podem estar cobrindo 40 que sumiram, ou não. Este cartão compara
          //   a cota que já venceu com o que foi feito — é a mesma régua da aba
          //   Mês, então as duas telas dizem o mesmo do mesmo dia.
          const saldo = f.resumo.realizadoMes - f.resumo.devidoAteHoje;
          return cartaoFreq(saldo >= 0 ? `+${saldo}` : `−${-saldo}`,
            `${f.resumo.realizadoMes} de ${f.resumo.devidoAteHoje} até hoje`,
            saldo >= 0 ? 'em-dia' : 'atrasado');
        })()}
        ${cartaoFreq(f.resumo.faltamMes, 'faltam no mês', f.resumo.faltamMes ? 'atrasado' : 'em-dia')}
        ${cartaoFreq(`${f.resumo.realizadoMes}/${f.resumo.metaMes}`,
          `pacote no mês · ${f.resumo.comPacote} alunos`)}
      </div>
      ${(()=>{
        // O RESTO VIRA FRASE, NÃO CARTÃO
        //   Eram doze cartões e a faixa quebrava em duas linhas — e um cartão
        //   na segunda linha não é mais destaque, é ruído com moldura. Ficam em
        //   cima os cinco que mudam a decisão do dia: quem cobrar, quanto falta.
        //   O que se lê uma vez por semana cabe numa linha de texto.
        const notas = [];
        notas.push(`<b>${f.resumo.emDia}</b> aluno(s) em dia`);
        if (f.resumo.quitados) notas.push(`<b>${f.resumo.quitados}</b> já fecharam o pacote`);
        if (f.resumo.naoFecham) notas.push(`⛔ <b>${f.resumo.naoFecham}</b> não fecham mais`);
        if (f.resumo.excedenteMes) notas.push(`<b>${f.resumo.excedenteMes}</b> check-in(s)
          além do combinado, de ${f.resumo.alunosComExcedente} aluno(s)`);
        if (f.resumo.ignoradosMes) notas.push(`<b>${f.resumo.ignoradosMes}</b> sem repasse,
          de ${f.resumo.alunosNoTeto} aluno(s)`);
        if (f.resumo.checkinsExperimentais) notas.push(`<b>${f.resumo.checkinsExperimentais}</b>
          check-in(s) de ${f.resumo.experimentais || '?'} experimenta(l/is)`);
        notas.push(`<b>${f.checkins.ultimos7}</b> check-in(s) nos últimos 7 dias`);
        return `<p class="ajuda" style="margin-top:-6px">${notas.join(' · ')}.</p>`;
      })()}

      <div class="freq-acoes">
        <button class="leve" id="fq-sincronizar">Buscar check-ins agora</button>
        <button class="leve" id="fq-aviso">Ver aviso do dia</button>
        <button class="leve" id="fq-nomes">Adotar nomes do Wellhub</button>
        <button class="leve" id="fq-exportar">Exportar check-ins</button>
        <button class="leve" id="fq-exportar-resumo">Exportar resumo</button>
      </div>

      <div class="chips-mat" style="margin-bottom:14px">
        <div class="grupo-filtro"><span>Janela (até o dia 1º)</span>
          ${[7,14,30].map(d=>`<button class="chip${matEstado.freqDias===d?' sel':''}"
            data-dias="${d}">${d} dias</button>`).join('')}
        </div>
        <div class="grupo-filtro"><span>Mostrar</span>
          ${[['devendo','Só devendo'],['experimentais','Experimentais'],['todos','Todos']].map(([v,r])=>
            `<button class="chip${matEstado.freqSo===v?' sel':''}" data-so="${v}">${r}</button>`).join('')}
        </div>
      </div>

      ${pessoasOrfas.length ? `<h3 style="font:400 14px Anton,sans-serif;letter-spacing:.06em;
        text-transform:uppercase;color:var(--amarelo);margin:0 0 8px">
        ${pessoasOrfas.length} pessoa(s) do Wellhub sem aluno${orfaos.checkins.length > pessoasOrfas.length
          ? ` · ${orfaos.checkins.length} check-ins` : ''}</h3>
        <p class="ajuda">Treinaram, mas não contam para ninguém. Vincular uma vez resolve todos
          os check-ins da pessoa e grava o Wellhub ID na ficha.</p>
        <div id="fq-orfaos"><table class="freq-tabela">
          <thead><tr>
            <th>Pessoa no portal</th>
            <th class="num">Check-ins</th>
            <th class="opc">Período</th>
            <th class="opc">Wellhub ID</th>
            <th>Aluno na base</th>
            <th class="opc" style="text-align:center"
              title="Criar como aula experimental">Exp</th>
            <th></th>
          </tr></thead>
          <tbody>${pessoasOrfas.map(c=>linhaOrfa(c, base.matriculas)).join('')}</tbody>
        </table></div>
        <button class="leve" id="fq-revincular" style="margin:10px 0 20px">Tentar vincular sozinho</button>`
      : ''}

      ${semConta.length ? `<h3 style="font:400 14px Anton,sans-serif;letter-spacing:.06em;
        text-transform:uppercase;color:var(--amarelo);margin:0 0 8px">
        ${semConta.length} aluno(s) Wellhub sem conta vinculada</h3>
        <p class="ajuda">A ficha existe e diz ser Wellhub, mas nenhuma conta do portal está

        <div id="fq-sem-conta"><table class="freq-tabela">
          <thead><tr>
            <th>Aluno</th>
            <th class="num">/sem</th>
            <th class="opc">Grade</th>
            <th class="num">Check-ins</th>
            <th></th>
          </tr></thead>
          <tbody>${semConta.map(linhaSemConta).join('')}</tbody>
        </table></div>
        <p class="ajuda" style="margin:10px 0 20px">Para ligar, abra a ficha e use o bloco
          <b>Cadastro no Wellhub</b>.</p>`
      : ''}

      <!-- Título só quando há linha embaixo dele: cabeçalho sobre tabela vazia
           faz parecer que algo não carregou. -->
      ${mostrar.length ? `<h3 style="font:400 14px Anton,sans-serif;letter-spacing:.06em;
        text-transform:uppercase;margin:0 0 10px">${matEstado.freqSo==='devendo' ? 'Precisam repor'
        : matEstado.freqSo==='experimentais' ? 'Em aula experimental'
        : 'Todos os alunos Wellhub'}</h3>` : ''}
      <div id="fq-lista">${mostrar.length
        ? `<table class="freq-tabela">
            <thead><tr>
              <th>Aluno</th>
              <th class="num opc">/sem</th>
              <th class="num">Mês</th>
              <th class="num opc" title="Check-ins feitos sobre o exigido até hoje">No prazo</th>
              <th class="num">Faltam</th>

              <th class="opc" style="text-align:center">Exp</th>
              <th></th>
            </tr></thead>
            <tbody>${mostrar.map(linhaFrequencia).join('')}</tbody>
          </table>`
        : `<div class="vazio">${matEstado.freqSo==='experimentais'
            ? 'Ninguém marcado como experimental.'

    alvo.querySelector('.chips-mat').addEventListener('click', e=>{
      const b = e.target.closest('.chip'); if (!b) return;
      if (b.dataset.dias) matEstado.freqDias = Number(b.dataset.dias);

    alvo.querySelector('#fq-sincronizar').addEventListener('click', async e=>{
      const b = e.target; b.disabled = true; b.textContent = 'Buscando…';

        const r = await api('/matriculas/checkins/sincronizar', {method:'POST'});
        avisar(r.erro ? r.erro
          : `${r.registrados?.novos || 0} check-in(s) novo(s) de ${r.validados || 0} validado(s).`,
          r.erro ? 'erro' : 'ok');

    alvo.querySelector('#fq-aviso').addEventListener('click', async ()=>{

        const r = await api('/matriculas/frequencia/aviso', {method:'POST', body:'{}'});

    alvo.querySelector('#fq-nomes').addEventListener('click', async ()=>{

        const recusa = r.recusados.length ? ` ${r.recusados.length} recusado(s) por nome repetido.` : '';
        avisar(r.trocas.length

          : `Nenhuma mudança — as ${r.avaliados} fichas já usam o nome do portal.${recusa}`, 'ok');

      }catch(err){ avisar(err.message,'erro'); }

    /* Conferência contra o relatório do portal: uma linha por check-in, com o
       aluno em que ele caiu. Órfão entra também, com a coluna do aluno vazia —

    alvo.querySelector('#fq-exportar').addEventListener('click', async ()=>{
      const b = alvo.querySelector('#fq-exportar');
      b.disabled = true; b.textContent = 'Montando…';
      try{
        const mes = j.ate.slice(0,7);
        const r = await api(`/matriculas/checkins?de=${mes}-01&ate=${j.ate}&limite=5000`);
        const linhas = r.checkins
          .slice()
          .sort((x,y)=> String(x.data).localeCompare(String(y.data))
            || String(x.hora).localeCompare(String(y.hora)))
          .map(c=>[c.data, c.hora||'', c.gympassId||'', c.nome||'',
            c.nomeMatricula||'', c.matriculaId ? 'vinculado' : 'SEM ALUNO',
            c.vinculadoPor||'', c.produto||'', c.origem||'']);
        baixarCsv(`checkins-wellhub-${mes}.csv`,
          ['Data','Hora','Wellhub ID','Nome no portal','Aluno na base','Situação',
           'Casou por','Produto','Origem'], linhas);
        avisar(`${linhas.length} check-in(s) exportado(s).`,'ok');
      }catch(err){ avisar(err.message,'erro'); }
      b.disabled = false; b.textContent = 'Exportar check-ins';
    });

    /* Fechamento do mês, uma linha por aluno: é a planilha que se confere
       contra o repasse do Wellhub. */
    alvo.querySelector('#fq-exportar-resumo').addEventListener('click', ()=>{
      const linhas = f.alunos.map(a=>[
        a.nome, a.vinculo||'', a.porSemana,
        a.mes ? a.mes.porSemanaCobravel : '', a.mes ? a.mes.meta : '',
        a.mes ? a.mes.realizado : a.realizado,
        a.mes ? a.mes.devido : '', a.mes ? a.mes.atrasoNoRitmo : '',
        a.mes ? a.mes.faltam : '', a.mes ? a.mes.diasRestantes : '',
        a.mes && a.mes.conta
          ? (a.mes.conta.ehTitular ? `titular · divide com ${a.mes.conta.participantes
              .filter(n=>n!==a.nome).join(', ')}` : `na conta de ${a.mes.conta.titular}`) : '',
        a.mes && a.mes.risco === 'impossivel' ? 'não fecha mais'
          : a.mes && a.mes.risco === 'no-limite' ? 'no limite' : '',
        (SITUACAO[a.situacao]||{rotulo:a.situacao}).rotulo,
        a.ultimoCheckin||'', a.diasSemTreinar ?? '', a.gympassId||'', a.telefone||'',
      ]);
      const cabecalho =
        ['Aluno','Vínculo','Grade x/sem','Cobráveis x/sem','Meta do mês','Feitos',
         'Exigido até hoje','Atraso no ritmo','Faltam','Dias restantes','Conta compartilhada',
         'Risco','Situação','Último check-in','Dias sem treinar','Wellhub ID','Telefone'];
      // Aba enxuta para bater o olho: colunas A, C, E, F, I e M da aba cheia —
      // Aluno, Grade x/sem, Meta do mês, Feitos, Faltam e Situação.
      const SIMPLES = [0, 2, 4, 5, 8, 12];
      const recorte = (l)=> SIMPLES.map(i=>l[i]);
      /* Quebra do mês em quatro faixas por dia do mês: 1–7, 8–14, 15–21 e do 22
         até o último dia, seja 28, 29, 30 ou 31. Não é semana de calendário —
         é o corte fixo que o fechamento usa. As datas vêm de `mes.datas`, as
         mesmas que somam a coluna "Feitos", então as quatro colunas fecham
         com ela. */
      const semanaDoDia = (data)=>{
        const dia = Number(String(data).slice(8,10));
        return dia <= 7 ? 0 : dia <= 14 ? 1 : dia <= 21 ? 2 : 3;
      };
      const porSemana = (a)=>{
        const conta = [0,0,0,0];
        ((a.mes && a.mes.datas) || []).forEach(d=>{
          const i = semanaDoDia(d);
          if (i >= 0 && i <= 3) conta[i] += 1;
        });
        return conta;
      };
      // As quatro faixas entram logo depois de "Meta do mês": lê-se a meta,
      // depois como o mês se distribuiu, e só então o total e o que falta.
      const APOS_META = 3;
      const encaixar = (base, semanas)=>
        [...base.slice(0, APOS_META), ...semanas, ...base.slice(APOS_META)];
      const cabSimples = encaixar(recorte(cabecalho),
        ['Semana 1 (1–7)','Semana 2 (8–14)','Semana 3 (15–21)','Semana 4 (22–fim)']);
      const linhasSimples = linhas.map((l,i)=> encaixar(recorte(l), porSemana(f.alunos[i])));
      baixarXlsx(`frequencia-${j.ate.slice(0,7)}.xlsx`, [
        {nome:'Resumo', cabecalho, linhas},
        {nome:'Resumo simplificado', cabecalho: cabSimples, linhas: linhasSimples},
      ]);
      avisar(`${linhas.length} aluno(s) exportado(s) em 2 abas.`,'ok');
    });

    const revincular = alvo.querySelector('#fq-revincular');
    if (revincular) revincular.addEventListener('click', async ()=>{
      try{
        const r = await api('/matriculas/checkins/revincular', {method:'POST'});
        avisar(r.ligados ? `${r.ligados} vinculado(s). ${r.restantes} ainda sem aluno.`
          : 'Nenhum casou automaticamente — vincule na mão.', r.ligados ? 'ok' : '');
        await carregarFrequencia();
      }catch(err){ avisar(err.message,'erro'); }
    });

    alvo.querySelectorAll('.orfao').forEach(el=>{
      const nomePortal = el.dataset.nome || '';

      el.querySelector('.orf-ok').addEventListener('click', async ()=>{
        const sel = el.querySelector('.orf-quem');
        const quem = sel.value;
        if (!quem) return avisar('Escolha o aluno.','erro');
        // Conta em nome de terceiro deixou de ser caixinha na linha e virou
        // pergunta: é caso raro, e uma coluna a mais em toda linha para ele
        // custaria mais do que resolve.
        const alvoNome = sel.options[sel.selectedIndex].textContent.trim();
        const comoTitular = nomePortal && alvoNome &&
          nomePortal.toLowerCase() !== alvoNome.toLowerCase() &&
          confirm(`O portal chama esta pessoa de "${nomePortal}", e o aluno é "${alvoNome}".\n\n`
            + 'OK = a conta é de outra pessoa: guardo esse nome como titular e mantenho '
            + `"${alvoNome}" na ficha.\nCancelar = é a mesma pessoa, adoto o nome do portal.`);
        try{
          const r = await api('/matriculas/checkins/'+el.dataset.id+'/vincular',
            {method:'POST', body: JSON.stringify({matriculaId: quem, comoTitular})});
          const total = 1 + (r.arrastados || 0);
          const quantos = total > 1 ? `${total} check-ins vinculados` : 'Check-in vinculado';
          avisar(r.titular
            ? `${quantos} a "${r.nome}". Conta do Wellhub registrada em nome de "${r.titular}".`
            : (r.renomeado
              ? `${quantos}. Ficha renomeada para "${r.nome}".`
              : `${quantos} a "${r.nome}".`), 'ok');
          await carregarFrequencia();
        }catch(err){ avisar(err.message,'erro'); }
      });

      const criar = el.querySelector('.orf-criar');
      criar.addEventListener('click', async ()=>{
        // O nome vem do portal e quase sempre serve como está; o prompt existe
        // para os casos de cadastro com nome de titular ou digitação estranha.
        const nome = (prompt('Nome do aluno novo:', nomePortal) || '').trim();
        if (!nome) return;
        // Antes isto era um segundo `confirm` empilhado no prompt do nome: dois
        // diálogos nativos seguidos para uma escolha que agora cabe numa caixinha
        // na própria linha, visível antes de clicar em Criar.
        const caixa = el.querySelector('.orf-exp');
        const experimental = !caixa || caixa.checked;
        criar.disabled = true; criar.textContent = 'Criando…';
        try{
          const r = await api('/matriculas/checkins/'+el.dataset.id+'/criar-aluno',
            {method:'POST', body: JSON.stringify({nome, experimental})});
          const total = 1 + (r.arrastados || 0);
          avisar(`Ficha de "${r.nome}" criada${experimental ? ' como experimental' : ''} `
            + `com ${total} check-in(s) vinculado(s). `
            + (experimental
              ? 'Fica fora da cobrança até você definir a grade na aba Alunos.'
              : 'Defina a grade na aba Alunos.'), 'ok');
          await carregarFrequencia();
        }catch(err){
          avisar(err.message,'erro');
          criar.disabled = false; criar.textContent = 'Criar';
        }
      });
    });

    alvo.querySelectorAll('.sem-conta').forEach(el=>{
      el.querySelector('.sc-abrir').addEventListener('click', ()=> abrirFichaDe(el.dataset.id));
    });

    alvo.querySelectorAll('.freq-item').forEach(el=>{
      const cobrar = el.querySelector('.fq-cobrar');
      if (cobrar) cobrar.addEventListener('click', async ()=>{
        if (!confirm('Enviar a mensagem de cobrança no WhatsApp deste aluno?')) return;
        cobrar.disabled = true; cobrar.textContent = 'Enviando…';
        try{
          await api('/matriculas/frequencia/cobrar',
            {method:'POST', body: JSON.stringify({matriculaId: el.dataset.id})});
          avisar('Mensagem enviada.','ok');
          cobrar.textContent = 'Cobrado ✓';
        }catch(err){
          avisar(err.message,'erro');
          cobrar.disabled = false; cobrar.textContent = 'Cobrar';
        }
      });
      const exp = el.querySelector('.fq-exp');
      if (exp) exp.addEventListener('change', async ()=>{
        exp.disabled = true;
        try{
          await api('/matriculas/'+el.dataset.id,
            {method:'PUT', body: JSON.stringify({experimental: exp.checked})});
          avisar(exp.checked ? 'Marcado como experimental.'
            : 'Experimental desmarcado — agora conta como aluno normal.', 'ok');
          await carregarFrequencia();
        }catch(err){
          avisar(err.message,'erro');
          exp.checked = !exp.checked; exp.disabled = false;
        }
      });

      const abrir = el.querySelector('.fq-abrir');
      if (abrir) abrir.addEventListener('click', ()=> abrirFichaDe(el.dataset.id));

      /* Duplo clique na linha: a lista de check-ins do mês daquele aluno.
         A tabela responde "faltam 3"; o duplo clique responde "quais dias
         foram", que é o que se confere contra a memória do aluno na hora da
         cobrança. Cliques em botão, caixinha ou select ficam de fora — dois
         cliques rápidos em "Cobrar" não podem abrir caixa nenhuma. */
      el.addEventListener('dblclick', e=>{
        if (e.target.closest('button,input,select,a,label')) return;
        // Duplo clique seleciona a palavra embaixo do cursor; com a caixa
        // aberta por cima, a seleção fica presa e aparece realçada atrás.
        const sel = window.getSelection(); if (sel) sel.removeAllRanges();
        const dele = f.alunos.find(x=> String(x.matriculaId) === el.dataset.id);
        if (dele) abrirCheckinsDoMes(dele, j);
      });
    });
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
