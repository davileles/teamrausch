    <div class="campos mf-cobranca" ${mens?'':'hidden'}>
      <select class="mf-ciclo">${['mensal','trimestral','semestral','anual'].map(x=>
        `<option value="${x}"${(m.ciclo||'mensal')===x?' selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select>
      <input class="mf-venc" type="number" min="1" max="31" value="${m.diaVencimento??''}"
        placeholder="Dia do vencimento">
    </div>
    <p class="ajuda" style="margin:14px 0 6px">Horários fixos da semana</p>
    <div class="lista-slots">${(m.grade||[]).map(s=>linhaSlot(s.dia,s.hora)).join('')}</div>
    <button class="leve mf-add" style="margin-top:8px">+ Adicionar horário</button>
    <div class="campos" style="margin-top:12px">
      <input class="mf-obs" value="${esc(m.observacao||'')}" maxlength="140" placeholder="Observação (opcional)">
    </div>
    ${(m.revisar||[]).length ? `<p class="ajuda alerta-rev">⚠︎ ${m.revisar.map(esc).join(' · ')}<br>
      <span style="opacity:.75">Da planilha: ${esc(m.freqOriginal||'—')}</span></p>` : ''}
    ${novo ? '' : blocoAcesso(m)}
    <div class="rodape">
      <button class="leve mf-salvar">${novo ? 'Cadastrar' : 'Salvar'}</button>
      <button class="leve mf-cancelar">Cancelar</button>
      ${novo ? '' : `<button class="leve mf-inativar">${m.ativo?'Inativar':'Reativar'}</button>`}
    </div>
  </div>`;
}

/**
 * Acesso ao app — o que era a aba Alunos.
 *
 * Só aparece quando o aluno tem telefone: o cadastro de login é chaveado pelo
 * número, e sem ele não há o que suspender. Trocar o telefone acontece no campo
 * de cima, ao salvar a ficha; aqui ficam as ações que não são edição de dado.
 */
function blocoAcesso(m){
  if (!m.telefone){
    return `<div class="acesso"><h4>Acesso ao app</h4>
      <p class="ajuda" style="margin:0">Cadastre um telefone para o aluno poder entrar
        no app e reservar horário.</p></div>`;
  }
  const a = m.acesso;
  if (!a){
    return `<div class="acesso"><h4>Acesso ao app</h4>
      <p class="ajuda" style="margin:0">Ainda não entrou. O cadastro de acesso nasce
        sozinho no primeiro login com este número.</p></div>`;
  }
  return `<div class="acesso">
    <h4>Acesso ao app</h4>
    <p class="estado">${esc(a.telefoneFormatado)} ·
      ${a.bloqueado ? '<b class="suspenso">suspenso</b>' : '<b>ativo</b>'}
      ${a.admin ? ' · <b class="admin">administrador</b>' : ''}</p>
    <div class="rodape">
      <button class="leve ac-alternar" data-bloq="${a.bloqueado?1:0}">
        ${a.bloqueado ? 'Reativar acesso' : 'Suspender acesso'}</button>
      <button class="leve ac-remover">Remover acesso</button>
    </div>
  </div>`;
}

/** Lê o formulário e devolve o corpo do PUT/POST. */
function lerFicha(el){
  const grade = [...el.querySelectorAll('.slot-grade')]
    .map(l=>({ dia: Number(l.querySelector('.sg-dia').value), hora: l.querySelector('.sg-hora').value }))
    .filter(s=>s.hora);
  const corpo = {
    nome: el.querySelector('.mf-nome').value,
    telefone: el.querySelector('.mf-tel').value,
    aniversario: el.querySelector('.mf-nasc').value,
    gympassId: el.querySelector('.mf-wellhub').value,
    titularWellhub: el.querySelector('.mf-titular')?.value ?? undefined,
    vinculo: el.querySelector('.mf-vinculo').value,
    experimental: el.querySelector('.mf-exp').checked,
    observacao: el.querySelector('.mf-obs').value,
    grade,
    revisado: true,
  };
  if (corpo.vinculo === 'mensalista'){
    corpo.ciclo = el.querySelector('.mf-ciclo').value;
    corpo.diaVencimento = el.querySelector('.mf-venc').value;
  }
  return corpo;
}

function ligarFicha(el, id){
  const nasc = el.querySelector('.mf-nasc');
  nasc.addEventListener('input', ()=>{
    const n = nasc.value.replace(/\D/g,'').slice(0,4);
    nasc.value = n.length > 2 ? `${n.slice(0,2)}/${n.slice(2)}` : n;
  });
  el.querySelector('.mf-add').addEventListener('click', ()=>{
    el.querySelector('.lista-slots').insertAdjacentHTML('beforeend', linhaSlot());
  });
  el.querySelector('.lista-slots').addEventListener('click', e=>{
    if (e.target.closest('.sg-remover')) e.target.closest('.slot-grade').remove();
  });
  el.querySelector('.mf-vinculo').addEventListener('change', e=>{
    el.querySelector('.mf-cobranca').hidden = e.target.value !== 'mensalista';
    el.querySelector('.mf-bloco-wellhub').hidden = e.target.value === 'mensalista';
  });
  el.querySelector('.mf-cancelar').addEventListener('click', ()=>{
    matEstado.aberta = null; redesenhar();
  });
  el.querySelector('.mf-salvar').addEventListener('click', async ()=>{
    const b = el.querySelector('.mf-salvar');
    // Trocar o telefone move a ficha de login inteira e derruba a sessão aberta:
    // é a única edição desta tela que o aluno sente do outro lado.
    const telAntes = b.closest('.mat-form').dataset.telefone || '';
    const telAgora = el.querySelector('.mf-tel').value.trim();
    if (telAntes && telAgora !== telAntes && !confirm(
      `Trocar o telefone de ${telAntes} para ${telAgora}?\n\n`
      + 'Os agendamentos vão junto, mas o aluno é desconectado e passa a entrar '
      + 'com o número novo.')) return;

    b.disabled = true; b.textContent = 'Salvando…';
    try{
      await api('/matriculas' + (id ? '/'+id : ''), {
        method: id ? 'PUT' : 'POST', body: JSON.stringify(lerFicha(el)) });
      avisar(id ? 'Matrícula atualizada.' : 'Aluno cadastrado.', 'ok');
      matEstado.aberta = null; redesenhar();
    }catch(e){
      avisar(e.message,'erro'); b.disabled = false; b.textContent = id ? 'Salvar' : 'Cadastrar';
    }
  });
  const alternar = el.querySelector('.ac-alternar');
  if (alternar) alternar.addEventListener('click', async ()=>{
    const bloquear = alternar.dataset.bloq !== '1';
    if (bloquear && !confirm('Suspender o acesso? O aluno não consegue mais entrar no app,\n'
      + 'mas continua na grade e no histórico.')) return;
    try{
      await api('/matriculas/'+id+'/acesso', {method:'POST',
        body: JSON.stringify({bloqueado: bloquear})});
      avisar(bloquear ? 'Acesso suspenso.' : 'Acesso reativado.', 'ok');
      redesenhar();
    }catch(e){ avisar(e.message,'erro'); }
  });

  const remover = el.querySelector('.ac-remover');
  if (remover) remover.addEventListener('click', async ()=>{
    if (!confirm('Apagar o cadastro de acesso deste aluno?\n\n'
      + 'A matrícula fica: ele continua na grade, só perde o login no app.')) return;
    try{
      await api('/matriculas/'+id+'/acesso', {method:'DELETE'});
      avisar('Acesso removido.', 'ok');
      redesenhar();
    }catch(e){ avisar(e.message,'erro'); }
  });

  const inat = el.querySelector('.mf-inativar');
  if (inat) inat.addEventListener('click', async ()=>{
    const ativo = inat.textContent.trim() === 'Inativar';
    if (ativo && !confirm('Inativar este aluno? Ele sai da grade a partir de hoje, mas o histórico fica.')) return;
    try{
      if (ativo) await api('/matriculas/'+id, {method:'DELETE'});
      else await api('/matriculas/'+id, {method:'PUT', body: JSON.stringify({ativo:true})});
      matEstado.aberta = null; redesenhar();
    }catch(e){ avisar(e.message,'erro'); }
  });
}

async function carregarMatriculas(){
  const alvo = document.getElementById('aba-matriculas');
  const q = new URLSearchParams({ situacao: matEstado.situacao });
  if (matEstado.busca.trim()) q.set('busca', matEstado.busca.trim());
  if (matEstado.vinculo) q.set('vinculo', matEstado.vinculo);
  if (matEstado.revisar) q.set('revisar','1');
  if (matEstado.experimental) q.set('experimental','1');
  if (matEstado.acesso) q.set('acesso', matEstado.acesso);

  try{
    const { resumo, matriculas } = await api('/matriculas?'+q);

    // O redesenho troca a aba inteira, campo de busca junto. Enquanto a resposta
    // vinha, a pessoa continuou digitando: sem guardar o texto vivo do campo, o
    // HTML novo entra com o valor de quando a busca começou e as últimas letras
    // somem da tela — o "bug de digitar" desta aba.
    const vivo = document.getElementById('mat-busca');
    const digitando = vivo && document.activeElement === vivo
      ? { texto: vivo.value, cursor: vivo.selectionStart } : null;

    alvo.innerHTML = `<h2>Matrículas</h2>
      <div class="subabas" id="sub-mat">
        <button data-sub="alunos" aria-selected="${matEstado.sub==='alunos'}">Alunos</button>
        <button data-sub="grade" aria-selected="${matEstado.sub==='grade'}">Grade do dia</button>
        <button data-sub="lotacao" aria-selected="${matEstado.sub==='lotacao'}">Lotação da semana</button>
        <button data-sub="freq" aria-selected="${matEstado.sub==='freq'}">Frequência</button>
      </div>
      <div data-painel="alunos" ${matEstado.sub==='alunos'?'':'hidden'}>
        <p class="ajuda">${resumo.ativas} ativos · ${resumo.mensalistas} mensalistas ·
          ${resumo.wellhub} Wellhub · ${resumo.semTelefone} sem telefone ·
          ${resumo.comAcesso} com acesso ao app${
          resumo.suspensos ? ` · <b>${resumo.suspensos} suspenso(s)</b>` : ''}${
          resumo.aRevisar ? ` · <b>${resumo.aRevisar} a revisar</b>` : ''}${
          resumo.experimentais ? ` · <b>${resumo.experimentais} em experimental</b>` : ''}</p>
        <div class="filtros-mat">
          <div class="busca-novo">
            <input id="mat-busca" value="${esc(matEstado.busca)}" placeholder="Buscar por nome ou telefone"
              title="Enter abre a ficha quando sobra um aluno só">
            <button class="leve" id="mat-novo">+ Novo aluno</button>
          </div>
          <div class="chips-mat">
            <div class="grupo-filtro"><span>Situação</span>
              ${[['ativos','Ativos'],['inativos','Inativos'],['todos','Todos']].map(([v,r])=>
                `<button class="chip${matEstado.situacao===v?' sel':''}" data-sit="${v}">${r}</button>`).join('')}
            </div>
            <div class="grupo-filtro"><span>Vínculo</span>
              ${[['','Ambos'],['mensalista','Mensalista'],['wellhub','Wellhub']].map(([v,r])=>
                `<button class="chip${matEstado.vinculo===v?' sel':''}" data-vin="${v}">${r}</button>`).join('')}
            </div>
            <div class="grupo-filtro"><span>Acesso ao app</span>
              ${[['','Todos'],['com','Tem'],['sem','Não tem'],['suspensos','Suspensos']].map(([v,r])=>
                `<button class="chip${matEstado.acesso===v?' sel':''}" data-ac="${v}">${r}</button>`).join('')}
            </div>
            <div class="grupo-filtro"><span></span>
              <button class="chip${matEstado.experimental?' sel':''}" data-exp="1">Experimentais</button>
              <button class="chip${matEstado.revisar?' sel':''}" data-rev="1">A revisar</button>
            </div>
          </div>
        </div>
        <p class="ajuda" style="margin:0 0 8px">${matriculas.length} ${matriculas.length===1?'aluno':'alunos'} nesta lista</p>
        ${indiceAZ(matriculas)}
        <div id="mat-lista">${
          matEstado.aberta === 'novo' ? fichaMatricula({}) : ''}${
          matriculas.length ? matriculas.map(m=>
            matEstado.aberta === m.id ? fichaMatricula(m) : `
            <div class="ficha mat-item${m.ativo?'':' inativo'}${
                m.acesso && m.acesso.bloqueado?' suspenso':''}${m.precisaRevisar?' revisar':''}"
              data-id="${esc(m.id)}" data-inicial="${inicialDe(m.nome)}" role="button" tabindex="0"
              title="Abrir ficha de ${esc(m.nome)}">
              <div class="cabeca"><b>${esc(m.nome)}</b><span class="abrir" aria-hidden="true">Editar</span></div>
              <span class="tags">${m.vinculo==='wellhub'?'wellhub':'mensal'} ·
                ${m.diasSemana}×/sem${m.ativo?'':' · inativo'}${
                m.acesso && m.acesso.bloqueado?' · suspenso':''}${
                m.acesso && m.acesso.admin?' · admin':''}${
                m.experimental?' · experimental':''}${
                m.precisaRevisar?' · revisar':''}</span>
              <p class="ajuda">${esc(gradeEmTexto(m.grade))}</p>
              ${m.aniversarioFormatado ? `<p class="ajuda">🎂 ${esc(m.aniversarioFormatado)}</p>` : ''}
              ${m.telefone ? '' : '<p class="ajuda sem-tel">sem telefone cadastrado</p>'}
            </div>`).join('')
          : '<div class="vazio">Nenhum aluno com esses filtros.</div>'}</div>
        <div id="mat-soltos"></div>
      </div>
      <div data-painel="grade" ${matEstado.sub==='grade'?'':'hidden'}>
        <div id="mat-grade"><div class="vazio">Carregando…</div></div>
      </div>
      <div data-painel="lotacao" ${matEstado.sub==='lotacao'?'':'hidden'}>
        <div id="mat-lotacao"><div class="vazio">Carregando…</div></div>
      </div>
      <div data-painel="freq" ${matEstado.sub==='freq'?'':'hidden'}>
        <div id="mat-freq"><div class="vazio">Carregando…</div></div>
      </div>`;

    alvo.querySelector('#sub-mat').addEventListener('click', e=>{
      const b = e.target.closest('button[data-sub]'); if (!b) return;
      matEstado.sub = b.dataset.sub; matEstado.aberta = null; redesenhar();
    });

    const busca = alvo.querySelector('#mat-busca');
    busca.addEventListener('input', ()=>{
      clearTimeout(matBuscaTimer);
      matBuscaTimer = setTimeout(()=>{
        // Este campo pode já ter sido trocado por um redesenho disparado de
        // outro lugar. Seguir com ele gravaria em `matEstado` o texto congelado
        // de um elemento que não está mais na tela.
        if (busca !== document.getElementById('mat-busca')) return;
        // Sem `.trim()`: o valor gravado é o que a pessoa vê no campo. Aparar
        // aqui devolveria um texto menor do que o digitado e o cursor pularia
        // para trás no meio da palavra.
        matEstado.busca = busca.value;
        matEstado.aberta = null;
        redesenhar();
      }, 320);
    });

    // Enter aplica a busca na hora e, se sobrar um aluno só, já abre a ficha —
    // o caminho mais curto de "digitei o nome" até "estou editando".
    busca.addEventListener('keydown', async e=>{
      if (e.key !== 'Enter') return;
      e.preventDefault(); clearTimeout(matBuscaTimer);
      matEstado.busca = busca.value; matEstado.aberta = null;
      await redesenhar();
      const cartoes = document.querySelectorAll('#mat-lista .mat-item');
      if (cartoes.length === 1){ matEstado.aberta = cartoes[0].dataset.id; redesenhar(); return; }
      const novo = document.getElementById('mat-busca');
      if (novo){ novo.focus(); novo.setSelectionRange(novo.value.length, novo.value.length); }
    });

    alvo.querySelector('.chips-mat').addEventListener('click', e=>{
      const b = e.target.closest('.chip'); if (!b) return;
      if (b.dataset.sit) matEstado.situacao = b.dataset.sit;
      else if (b.dataset.vin !== undefined) matEstado.vinculo = b.dataset.vin;
      else if (b.dataset.ac !== undefined) matEstado.acesso = b.dataset.ac;
      else if (b.dataset.exp) matEstado.experimental = !matEstado.experimental;
      else if (b.dataset.rev) matEstado.revisar = !matEstado.revisar;
      matEstado.aberta = null; redesenhar();
    });

    alvo.querySelector('#mat-novo').addEventListener('click', ()=>{
      matEstado.aberta = 'novo'; redesenhar();
    });

    // Devolve ao campo novo o texto e o cursor de quem estava digitando. Se o
    // que ficou no campo já não é o que esta lista respondeu, dispara outra
    // busca pelo mesmo caminho do debounce, em vez de deixar tela e filtro
    // desencontrados.
    if (digitando){
      busca.value = digitando.texto;
      busca.focus();
      const pos = Math.min(digitando.cursor ?? digitando.texto.length, digitando.texto.length);
      busca.setSelectionRange(pos, pos);
      if (digitando.texto !== matEstado.busca) busca.dispatchEvent(new Event('input'));
    }

    // O cartão inteiro abre a ficha — no toque, no clique e pelo teclado.
    alvo.querySelectorAll('.mat-item').forEach(item=>{
      const abrir = ()=>{ matEstado.aberta = item.dataset.id; redesenhar(); };
      item.addEventListener('click', abrir);
      item.addEventListener('keydown', e=>{
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abrir(); }
      });
    });

    const indice = alvo.querySelector('.indice-az');
    if (indice){
      medirTopo();
      indice.addEventListener('click', e=>{
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.topo !== undefined){ window.scrollTo({ top:0, behavior:'smooth' }); return; }
        const cartao = alvo.querySelector(`.mat-item[data-inicial="${b.dataset.letra}"]`);
        if (cartao) rolarAte(cartao);
      });
    }

    alvo.querySelectorAll('.mat-form').forEach(f=> ligarFicha(f, f.dataset.id || null));

    // Ficha aberta a partir de outra subaba (Lotação, Frequência, acessos
    // soltos): a pessoa estava em outro lugar da página, então a ficha precisa
    // vir até ela. O redesenho devolve a rolagem antiga num frame; esperamos
    // ele passar antes de rolar para a ficha.
    if (matEstado.focarFicha){
      matEstado.focarFicha = false;
      setTimeout(()=>{ const f = alvo.querySelector('.mat-form'); if (f) rolarAte(f); }, 80);
    }

    if (matEstado.sub === 'alunos' && resumo.acessosSoltos) await carregarAcessosSoltos();
    if (matEstado.sub === 'grade') await carregarGradeDoDia();
    if (matEstado.sub === 'lotacao') await carregarLotacao();
    if (matEstado.sub === 'freq') await carregarFrequencia();
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

/**
 * Quem entrou no app e não está na base do estúdio.
 *
 * Antes eram só mais uma linha na aba Alunos. Sem esta seção eles ficariam
 * invisíveis: ninguém conseguiria suspender ou apagar um cadastro de acesso de
 * alguém que nunca foi matriculado — um número errado que pediu código, por
 * exemplo, ou quem saiu do estúdio e teve a matrícula removida.
 */
async function carregarAcessosSoltos(){
  const alvo = document.getElementById('mat-soltos');
  if (!alvo) return;
  try{
    const { acessos } = await api('/matriculas/acessos/soltos');
    if (!acessos.length){ alvo.innerHTML = ''; return; }

    alvo.innerHTML = `<h3 style="font:400 14px Anton,sans-serif;letter-spacing:.06em;
      text-transform:uppercase;color:var(--amarelo);margin:24px 0 8px">
      ${acessos.length} acesso(s) sem matrícula</h3>
      <p class="ajuda">Entraram no app mas não estão na base do estúdio.</p>
      <div class="soltos">${acessos.map(a=>`<div class="solto${a.bloqueado?' suspenso':''}" data-tel="${esc(a.telefone)}">
        <b>${esc(a.nome || 'Sem nome')}</b>
        <p class="ajuda" style="margin:4px 0 0">${esc(a.telefoneFormatado)}${
          a.bloqueado ? ' · suspenso' : ''}${a.admin ? ' · administrador' : ''}${
          a.aniversarioFormatado ? ' · 🎂 '+esc(a.aniversarioFormatado) : ''}</p>
        <div class="rodape">
          <button class="leve so-matricular">Criar matrícula</button>
          <button class="leve so-alternar" data-bloq="${a.bloqueado?1:0}">
            ${a.bloqueado?'Reativar':'Suspender'}</button>
          <button class="leve so-remover">Remover</button>
        </div>
      </div>`).join('')}</div>`;

    alvo.querySelectorAll('.solto').forEach(el=>{
      const tel = el.dataset.tel;
      el.querySelector('.so-matricular').addEventListener('click', async ()=>{
        try{
          const m = await api('/matriculas/acessos/'+tel+'/matricular',
            {method:'POST', body: JSON.stringify({})});
          avisar('Matrícula criada. Defina os horários na ficha.','ok');
          abrirFichaDe(m.id);
        }catch(e){ avisar(e.message,'erro'); }
      });
      el.querySelector('.so-alternar').addEventListener('click', async ()=>{
        const bloquear = el.querySelector('.so-alternar').dataset.bloq !== '1';
        try{
          await api('/matriculas/acessos/'+tel+'/suspender',
            {method:'POST', body: JSON.stringify({bloqueado: bloquear})});
          await carregarAcessosSoltos();
        }catch(e){ avisar(e.message,'erro'); }
      });
      el.querySelector('.so-remover').addEventListener('click', async ()=>{
        if (!confirm('Apagar este cadastro de acesso? Os agendamentos dele vão junto.')) return;
        try{
          await api('/matriculas/acessos/'+tel, {method:'DELETE'});
          avisar('Acesso removido.','ok');
          await carregarAcessosSoltos();
        }catch(e){ avisar(e.message,'erro'); }
      });
    });
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

/* ------------------------------ frequência ------------------------------- *
 * O combinado contra o que aconteceu. Só aparece aluno Wellhub: mensalista não
 * faz check-in no portal, então o realizado dele seria sempre zero e a lista de
 * devedores viraria a base inteira.
 * ------------------------------------------------------------------------- */

const SITUACAO = {
  'critico':  { rotulo:'crítico',   marca:'🔴' },
  'atrasado': { rotulo:'atrasado',  marca:'🟡' },
  'em-dia':   { rotulo:'em dia',    marca:'🟢' },
  'sem-aula': { rotulo:'sem aula prevista', marca:'·' },
  'sem-grade':{ rotulo:'sem horário fixo',  marca:'·' },
  experimental:{ rotulo:'aula experimental', marca:'✳︎' },
};

function dataCurta(iso){
  if (!iso) return null;
  const [a,m,d] = iso.split('-');
  return `${d}/${m}`;
}

function cartaoFreq(valor, rotulo, classe){
  return `<div class="freq-cartao ${classe||''}"><b>${valor}</b><span>${rotulo}</span></div>`;
}

/**
 * Uma linha da tabela de frequência.
 *
 * Cartão por aluno virava uma parede de 66 blocos que só se lia um a um. Em
 * linha, cada coluna é uma régua vertical: dá para descer a coluna "faltam" e
 * achar quem precisa de cobrança sem ler nome nenhum.
 *
 * As classes `freq-item`, `fq-exp`, `fq-cobrar` e `fq-abrir` continuam as
 * mesmas: os handlers da tela pendem delas e não precisam saber que agora é
 * `<tr>` em vez de `<div>`.
 */
function linhaFrequencia(a){
  const s = SITUACAO[a.situacao] || { rotulo:a.situacao, marca:'·' };
  const meta = a.mes && a.mes.meta ? a.mes.meta : 0;
  const feitos = a.mes ? a.mes.realizado : a.realizado;
  const faltam = a.mes ? a.mes.faltam : Math.max(a.esperado - a.realizado, 0);

  const ultimo = a.ultimoCheckin
    ? `${dataCurta(a.ultimoCheckin)}<span class="fraco">${
        a.diasSemTreinar === 0 ? ' hoje' : a.diasSemTreinar === 1 ? ' ontem'
        : ` · ${a.diasSemTreinar}d`}</span>`
    : '<span class="fraco">nunca</span>';

  // Grade de 5x com teto de 3: mostrar só o combinado faria a meta de 12
  // parecer erro de conta.
  const semana = a.mes && a.mes.acimaDoTeto
    ? `${a.porSemana}<span class="fraco">→${a.mes.porSemanaCobravel}</span>`
    : `${a.porSemana}`;

  const devendo = a.situacao === 'critico' || a.situacao === 'atrasado';
  return `<tr class="freq-item ${esc(a.situacao)}" data-id="${esc(a.matriculaId)}">
    <td class="nome">${esc(a.nome)}${a.gympassId ? ''
      : ' <span class="fraco" title="Sem Wellhub ID vinculado">⚠</span>'}</td>
    <td class="num opc">${semana}×</td>
    <td class="num">${meta ? `${feitos}/${meta}` : `<span class="fraco">${feitos}/—</span>`}</td>
    <td class="num falta">${meta ? (faltam || '<span class="quitado">ok</span>') : '—'}</td>
    <td class="num opc">${ultimo}</td>
    <td class="opc"><span class="fraco">${s.marca} ${esc(s.rotulo)}</span></td>
    <td class="opc" style="text-align:center">
      <input type="checkbox" class="fq-exp" ${a.experimental?'checked':''}
        title="Em aula experimental"></td>
    <td><div class="acoes">
      ${devendo && a.telefone ? '<button class="leve fq-cobrar">Cobrar</button>' : ''}
      <button class="leve fq-abrir">Ficha</button>
    </div></td>
  </tr>`;
}

/**
 * Junta os órfãos por pessoa. Um aluno que treinou o mês inteiro sem vínculo
 * gera treze check-ins soltos, e treze cartões iguais na tela para uma decisão
 * só. `vincular` no servidor já arrasta os outros registros do mesmo Wellhub
 * ID, então a tela pede um cartão por pessoa — não por check-in.
 *
 * A chave é o Wellhub ID. Sem ID (caso raro, portal sem identificar) cada
 * registro fica sozinho, porque aí não há o que garanta que é a mesma pessoa.
 */
function agruparOrfaos(lista){
  const grupos = new Map();
  for (const c of lista){
    const chave = c.gympassId ? 'id:'+c.gympassId : 'avulso:'+c.id;
    if (!grupos.has(chave)) grupos.set(chave, []);
    grupos.get(chave).push(c);
  }
  return [...grupos.values()]
    .map((cs)=>{
      const ordenados = cs.slice().sort((a,b)=> String(b.data).localeCompare(String(a.data)));
      return { ...ordenados[0], quantos: cs.length,
        primeira: ordenados[ordenados.length-1].data, ultima: ordenados[0].data };
    })
    // Quem tem mais check-ins parados primeiro: é o vínculo que mais muda a conta.
    .sort((a,b)=> b.quantos - a.quantos ||
      String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));
}

/**
 * Uma pessoa que não casou com nenhum aluno. Enquanto ficar aqui nenhum dos
 * check-ins dela conta — daí aparecer antes da lista, e não escondido no rodapé.
 *
 * O botão vincula o check-in mais recente; o servidor liga os demais do mesmo
 * Wellhub ID junto e grava o ID na ficha, então uma pessoa sai da tela por vez.
 */
function itemOrfao(c, alunos){
  const periodo = c.quantos > 1
    ? `${c.quantos} check-ins · ${dataCurta(c.primeira)} a ${dataCurta(c.ultima)}`
    : `${dataCurta(c.data)} às ${esc(c.hora||'--:--')}`;
  return `<div class="orfao" data-id="${esc(c.id)}">
    <b>${esc(c.nome || 'Sem nome no portal')}</b>
    <p class="ajuda" style="margin:4px 0 0">${periodo}
      · Wellhub ID ${esc(c.gympassId || '—')}${c.produto ? ' · '+esc(c.produto) : ''}</p>
    <div class="linha">
      <select class="orf-quem">
        <option value="">Vincular a…</option>
        ${alunos.map(m=>`<option value="${esc(m.id)}">${esc(m.nome)}</option>`).join('')}
      </select>
      <button class="leve orf-ok">Vincular</button>
    </div>
    <label class="marcar"><input type="checkbox" class="orf-titular">
      A conta é de outra pessoa — manter o nome do aluno e guardar
      <b>${esc(c.nome || 'este nome')}</b> como titular</label>
    <div class="linha separa">
      <input class="orf-nome" value="${esc(c.nome || '')}" placeholder="Nome do aluno novo">
      <button class="leve orf-criar">Criar cadastro</button>
    </div>
    <label class="marcar"><input type="checkbox" class="orf-exp" checked>
      Entra em aula experimental</label>
    <p class="ajuda" style="margin:6px 0 0">Ninguém na lista? O cadastro novo entra como Wellhub,
      já com este ID gravado. A grade de horários se define depois, na ficha do aluno.</p>
  </div>`;
}

async function carregarFrequencia(){
  const alvo = document.getElementById('mat-freq');
  if (!alvo) return;
  try{
    const [f, orfaos, base] = await Promise.all([
      api('/matriculas/frequencia?dias='+matEstado.freqDias),
      // Limite alto de propósito: a tela agrupa por pessoa, e cortar em 40
      // registros esconderia gente inteira atrás dos check-ins de outra.
      api('/matriculas/checkins?semVinculo=1&limite=500'),
      api('/matriculas?situacao=ativos'),
    ]);

    const pessoasOrfas = agruparOrfaos(orfaos.checkins);
    const devendo = f.alunos.filter(a=>a.situacao==='critico'||a.situacao==='atrasado');
    const mostrar = matEstado.freqSo === 'devendo' ? devendo
      : matEstado.freqSo === 'experimentais' ? f.alunos.filter(a=>a.experimental)
      : f.alunos;
    const j = f.janela;

    // A janela pode voltar menor do que a pedida: ela para no dia 1º, porque o
    // pacote do aluno renova na virada e falta do mês passado não é cobrada de
    // novo. Sem dizer isso, o número curto pareceria erro.
    const periodo = `${dataCurta(j.de)} a ${dataCurta(j.ate)}`;
    const cabecalho = j.truncadaNoMes
      ? `Do dia 1º até hoje (${periodo}) — ${j.dias} ${j.dias===1?'dia':'dias'} de mês.
         A janela de ${j.diasPedidos} dias não atravessa a virada: o ciclo anterior já fechou.`
      : `Últimos ${j.dias} dias (${periodo}), sem passar do dia 1º.`;

    alvo.innerHTML = `
      <p class="ajuda">${cabecalho}
        O número grande de cada aluno é o pacote do mês: check-ins feitos sobre a meta,
        que é o combinado semanal vezes quatro, limitado a 12 — o Wellhub não repassa
        mais do que isso. As situações (crítico, atrasado, em dia) olham a janela curta,
        para cobrar no meio do caminho em vez de no fechamento.</p>

      <div class="freq-cartoes">
        ${cartaoFreq(f.resumo.criticos, 'críticos', 'critico')}
        ${cartaoFreq(f.resumo.atrasados, 'atrasados', 'atrasado')}
        ${cartaoFreq(f.resumo.emDia, 'em dia', 'em-dia')}
        ${cartaoFreq(f.resumo.faltamMes, 'faltam no mês', f.resumo.faltamMes ? 'atrasado' : 'em-dia')}
        ${cartaoFreq(`${f.resumo.realizadoMes}/${f.resumo.metaMes}`, 'pacote do mês')}
        ${cartaoFreq(f.checkins.ultimos7, 'check-ins 7d')}
        ${f.resumo.experimentais ? cartaoFreq(f.resumo.experimentais, 'experimentais') : ''}
      </div>

      <div class="freq-acoes">
        <button class="leve" id="fq-sincronizar">Buscar check-ins agora</button>
        <button class="leve" id="fq-aviso">Ver aviso do dia</button>
        <button class="leve" id="fq-nomes">Adotar nomes do Wellhub</button>
      </div>

      <div class="chips-mat" style="margin-bottom:14px">
        <div class="grupo-filtro"><span>Janela (até o dia 1º)</span>
          ${[7,14,30].map(d=>`<button class="chip${matEstado.freqDias===d?' sel':''}"
            data-dias="${d}">${d} dias</button>`).join('')}
        </div>
        <div class="grupo-filtro"><span>Mostrar</span>
          ${[['devendo','Só devendo'],['experimentais','Experimentais'],['todos','Todos']].map(([v,r])=>
            `<button class="chip${matEstado.freqSo===v?' sel':''}" data-so="${v}">${r}</button>`).join('')}
        </div>
      </div>

      ${pessoasOrfas.length ? `<h3 style="font:400 14px Anton,sans-serif;letter-spacing:.06em;
        text-transform:uppercase;color:var(--amarelo);margin:0 0 8px">
        ${pessoasOrfas.length} pessoa(s) sem aluno${orfaos.checkins.length > pessoasOrfas.length
          ? ` · ${orfaos.checkins.length} check-ins` : ''}</h3>
        <p class="ajuda">Enquanto não forem vinculados, estes treinos não contam para ninguém.
          Vincular uma vez resolve todos os check-ins da pessoa e grava o Wellhub ID na ficha.</p>
        <div id="fq-orfaos">${pessoasOrfas.map(c=>itemOrfao(c, base.matriculas)).join('')}</div>
        <button class="leve" id="fq-revincular" style="margin:0 0 20px">Tentar vincular sozinho</button>`
      : ''}

      <h3 style="font:400 14px Anton,sans-serif;letter-spacing:.06em;text-transform:uppercase;
        margin:0 0 10px">${matEstado.freqSo==='devendo' ? 'Precisam repor'
        : matEstado.freqSo==='experimentais' ? 'Em aula experimental'
        : 'Todos os alunos Wellhub'}</h3>
      <div id="fq-lista">${mostrar.length
        ? `<table class="freq-tabela">
            <thead><tr>
              <th>Aluno</th>
              <th class="num opc">/sem</th>
              <th class="num">Mês</th>
              <th class="num">Faltam</th>
              <th class="num opc">Último</th>
              <th class="opc">Situação</th>
              <th class="opc" style="text-align:center">Exp</th>
              <th></th>
            </tr></thead>
            <tbody>${mostrar.map(linhaFrequencia).join('')}</tbody>
          </table>`
        : `<div class="vazio">${matEstado.freqSo==='experimentais'
            ? 'Ninguém marcado como experimental.'
            : 'Ninguém devendo treino nesta janela.'}</div>`}</div>`;

    alvo.querySelector('.chips-mat').addEventListener('click', e=>{
      const b = e.target.closest('.chip'); if (!b) return;
      if (b.dataset.dias) matEstado.freqDias = Number(b.dataset.dias);
      else if (b.dataset.so) matEstado.freqSo = b.dataset.so;
      carregarFrequencia();
    });

    alvo.querySelector('#fq-sincronizar').addEventListener('click', async e=>{
      const b = e.target; b.disabled = true; b.textContent = 'Buscando…';
      try{
        const r = await api('/matriculas/checkins/sincronizar', {method:'POST'});
        avisar(r.erro ? r.erro
          : `${r.registrados?.novos || 0} check-in(s) novo(s) de ${r.validados || 0} validado(s).`,
          r.erro ? 'erro' : 'ok');
        await carregarFrequencia();
      }catch(err){ avisar(err.message,'erro'); b.disabled = false; b.textContent = 'Buscar check-ins agora'; }
    });

    alvo.querySelector('#fq-aviso').addEventListener('click', async ()=>{
      try{
        const r = await api('/matriculas/frequencia/aviso', {method:'POST', body:'{}'});
        alert(r.texto);
      }catch(err){ avisar(err.message,'erro'); }
    });

    alvo.querySelector('#fq-nomes').addEventListener('click', async ()=>{
      try{
        const r = await api('/matriculas/checkins/aplicar-nomes', {method:'POST'});
        const recusa = r.recusados.length ? ` ${r.recusados.length} recusado(s) por nome repetido.` : '';
        avisar(r.trocas.length
          ? `${r.trocas.length} ficha(s) renomeada(s) de ${r.avaliados} avaliada(s).${recusa}`
          : `Nenhuma mudança — as ${r.avaliados} fichas já usam o nome do portal.${recusa}`, 'ok');
        await carregarFrequencia();
      }catch(err){ avisar(err.message,'erro'); }
    });

    const revincular = alvo.querySelector('#fq-revincular');
    if (revincular) revincular.addEventListener('click', async ()=>{
      try{
        const r = await api('/matriculas/checkins/revincular', {method:'POST'});
        avisar(r.ligados ? `${r.ligados} vinculado(s). ${r.restantes} ainda sem aluno.`
          : 'Nenhum casou automaticamente — vincule na mão.', r.ligados ? 'ok' : '');
        await carregarFrequencia();
      }catch(err){ avisar(err.message,'erro'); }
    });

    alvo.querySelectorAll('.orfao').forEach(el=>{
      el.querySelector('.orf-ok').addEventListener('click', async ()=>{
        const quem = el.querySelector('.orf-quem').value;
        if (!quem) return avisar('Escolha o aluno.','erro');
        try{
          const comoTitular = el.querySelector('.orf-titular').checked;
          const r = await api('/matriculas/checkins/'+el.dataset.id+'/vincular',
            {method:'POST', body: JSON.stringify({matriculaId: quem, comoTitular})});
          const extra = r.arrastados ? ` (+${r.arrastados} do mesmo ID)` : '';
          avisar(r.titular
            ? `Vinculado${extra} a "${r.nome}". Conta do Wellhub registrada em nome de "${r.titular}".`
            : (r.renomeado
              ? `Vinculado${extra}. Ficha renomeada para "${r.nome}".`
              : `Check-in vinculado${extra}.`), 'ok');
          await carregarFrequencia();
        }catch(err){ avisar(err.message,'erro'); }
      });

      const criar = el.querySelector('.orf-criar');
      criar.addEventListener('click', async ()=>{
        const nome = el.querySelector('.orf-nome').value.trim();
        if (!nome) return avisar('Informe o nome do aluno novo.','erro');
        criar.disabled = true; criar.textContent = 'Criando…';
        try{
          const experimental = el.querySelector('.orf-exp').checked;
          const r = await api('/matriculas/checkins/'+el.dataset.id+'/criar-aluno',
            {method:'POST', body: JSON.stringify({nome, experimental})});
          const extra = r.arrastados ? ` (+${r.arrastados} do mesmo ID)` : '';
          avisar(`Ficha de "${r.nome}" criada e check-in vinculado${extra}. `
            + 'Defina a grade na aba Alunos.', 'ok');
          await carregarFrequencia();
        }catch(err){
          avisar(err.message,'erro');
          criar.disabled = false; criar.textContent = 'Criar cadastro';
        }
      });
    });

    alvo.querySelectorAll('.freq-item').forEach(el=>{
      const cobrar = el.querySelector('.fq-cobrar');
      if (cobrar) cobrar.addEventListener('click', async ()=>{
        if (!confirm('Enviar a mensagem de cobrança no WhatsApp deste aluno?')) return;
        cobrar.disabled = true; cobrar.textContent = 'Enviando…';
        try{
          await api('/matriculas/frequencia/cobrar',
            {method:'POST', body: JSON.stringify({matriculaId: el.dataset.id})});
          avisar('Mensagem enviada.','ok');
          cobrar.textContent = 'Cobrado ✓';
        }catch(err){
          avisar(err.message,'erro');
          cobrar.disabled = false; cobrar.textContent = 'Cobrar';
        }
      });
      const exp = el.querySelector('.fq-exp');
      if (exp) exp.addEventListener('change', async ()=>{
        exp.disabled = true;
        try{
          await api('/matriculas/'+el.dataset.id,
            {method:'PUT', body: JSON.stringify({experimental: exp.checked})});
          avisar(exp.checked ? 'Marcado como experimental.'
            : 'Experimental desmarcado — agora conta como aluno normal.', 'ok');
          await carregarFrequencia();
        }catch(err){
          avisar(err.message,'erro');
          exp.checked = !exp.checked; exp.disabled = false;
        }
      });

      const abrir = el.querySelector('.fq-abrir');
      if (abrir) abrir.addEventListener('click', ()=> abrirFichaDe(el.dataset.id));
    });
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

/**
 * Lotação da semana: alunos fixos de cada horário contra a capacidade que está
 * valendo na aba Configurações. Serve para responder duas perguntas sem
 * adivinhação — a agenda oferece todos os horários que a grade usa? e alguma
 * turma está com mais gente do que cabe?
 */
async function carregarLotacao(){
  const alvo = document.getElementById('mat-lotacao');
  if (!alvo) return;
  try{
    const r = await api('/matriculas/grade/ocupacao');
    if (!r.slots.length){
      alvo.innerHTML = '<div class="vazio">Nenhum horário fixo cadastrado.</div>';
      return;
    }
    const dias  = [1,2,3,4,5,6,0].filter(d=>r.slots.some(s=>s.dia===d));
    const horas = [...new Set(r.slots.map(s=>s.hora))].sort();
    const achar = (d,h)=> r.slots.find(s=>s.dia===d && s.hora===h);

    alvo.innerHTML = `
      <p class="ajuda">Quantos alunos têm horário fixo em cada turma, comparado com a
        capacidade configurada. ${r.foraDaAgenda
          ? `<b>${r.foraDaAgenda} ${r.foraDaAgenda===1?'horário':'horários'} da grade não ${
              r.foraDaAgenda===1?'existe':'existem'} na aba Agendar</b> — os alunos têm aula,
             mas ninguém consegue reservar ali.`
          : 'Todos os horários da grade existem na aba Agendar.'}</p>
      <div class="lot-wrap">
      <table class="lot-tabela">
        <thead><tr><th class="h"></th>${dias.map(d=>`<th>${NOME_DIA[d]}</th>`).join('')}</tr></thead>
        <tbody>${horas.map(h=>`<tr>
          <th class="h">${h}</th>
          ${dias.map(d=>{ const s = achar(d,h);
            if (!s) return `<td class="vazia" data-dia="${d}" data-hora="${h}">·</td>`;
            const cheio = s.capacidade && s.total > s.capacidade;
            return `<td class="${s.naAgenda?'':'fora'} ${cheio?'cheio':''}"
              data-dia="${d}" data-hora="${h}"
              title="${s.naAgenda ? `capacidade ${s.capacidade}` : 'fora da agenda'}">${
              s.total}${s.capacidade?'/'+s.capacidade:''}</td>`;
          }).join('')}
        </tr>`).join('')}</tbody>
      </table>
      <div id="lot-detalhe" class="lot-detalhe" hidden></div>
      <div class="lot-legenda">
        <span>toque numa célula para ver quem está na turma</span>
        <span><i class="fora">amarelo</i> — horário não existe na aba Agendar</span>
        <span><i class="cheio">vermelho</i> — mais alunos fixos do que a capacidade</span>
      </div>
      </div>`;

    // A célula abre a lista com os nomes daquela turma. Os alunos já vêm no
    // mesmo `/grade/ocupacao`, então abrir e fechar não custa nova requisição.
    const detalhe = alvo.querySelector('#lot-detalhe');
    alvo.querySelector('.lot-tabela').addEventListener('click', e=>{
      const td = e.target.closest('td'); if (!td) return;
      const jaAberta = td.classList.contains('sel');
      alvo.querySelectorAll('.lot-tabela td.sel').forEach(x=>x.classList.remove('sel'));
      if (jaAberta){ detalhe.hidden = true; return; }   // segundo toque fecha
      td.classList.add('sel');

      const d = Number(td.dataset.dia), hora = td.dataset.hora;
      const s = achar(d, hora);
      const alunos = (s && s.alunos) || [];
      const linha = alunos.length
        ? `${alunos.length} ${alunos.length===1?'aluno':'alunos'} com horário fixo`
          + (s.naAgenda ? ` · capacidade ${s.capacidade}` : ' · horário fora da aba Agendar')
        : 'Ninguém com horário fixo nesta turma.';

      detalhe.hidden = false;
      detalhe.innerHTML = `
        <b>${NOME_DIA[d]} · ${esc(hora)}</b>
        <p class="ajuda" style="margin:0">${linha}</p>
        ${alunos.length ? `<div class="lista-nomes">${alunos.map(a=>`
          <div class="nome-linha" data-mat="${esc(a.id)}">
            <span>${esc(a.nome)}${a.vinculo==='wellhub'?' <i class="marca-extra">wellhub</i>':''}</span>
            <button class="leve lot-ficha">Abrir ficha</button>
          </div>`).join('')}</div>` : ''}`;

      detalhe.querySelectorAll('.lot-ficha').forEach(b=>{
        b.addEventListener('click', ()=> abrirFichaDe(b.closest('.nome-linha').dataset.mat));
      });
    });
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

async function carregarGradeDoDia(){
  const alvo = document.getElementById('mat-grade');
  if (!alvo) return;
  try{
    const [dia, base] = await Promise.all([
      api('/matriculas/grade/dia' + (matEstado.data ? '?data='+matEstado.data : '')),
      api('/matriculas?situacao=ativos'),
    ]);
    matEstado.data = dia.data;

    alvo.innerHTML = `
      <div class="barra-dia">
        <button class="leve" data-passo="-1">◀</button>
        <input type="date" id="mat-data" value="${dia.data}">
        <button class="leve" data-passo="1">▶</button>
        <button class="leve" data-passo="0">Hoje</button>
      </div>
      <p class="ajuda">${dia.porExtenso} · ${dia.total} ${dia.total===1?'aula':'aulas'} previstas.
        A grade é projetada dos horários fixos — o que você mexer aqui vale só para este dia.</p>
      <div class="encaixe">
        <select id="mat-encaixe-quem">
          <option value="">Encaixar aluno…</option>
          ${base.matriculas.map(m=>`<option value="${esc(m.id)}">${esc(m.nome)}</option>`).join('')}
        </select>
        <input type="time" step="3600" id="mat-encaixe-hora">
        <button class="leve" id="mat-encaixe-ok">Encaixar</button>
      </div>
      ${dia.horarios.length ? '<div class="horarios">' + dia.horarios.map(h=>`
        <div class="ficha">
          <div class="cabeca"><b>${h.hora}</b><span class="tags">${h.total} ${h.total===1?'aluno':'alunos'}</span></div>
          <div class="lista-nomes">${h.alunos.map(a=>`
            <div class="nome-linha" data-mat="${esc(a.matriculaId)}" data-hora="${h.hora}"
                 data-exc="${esc(a.excecaoId||'')}">
              <span>${esc(a.nome)}${a.origem==='extra'?' <i class="marca-extra">extra</i>':''}</span>
              <button class="leve n-desmarcar">${a.origem==='extra'?'Remover':'Desmarcar'}</button>
            </div>`).join('')}</div>
        </div>`).join('') + '</div>'
      : '<div class="vazio">Nenhuma aula neste dia.</div>'}`;

    alvo.querySelector('.barra-dia').addEventListener('click', e=>{
      const b = e.target.closest('button[data-passo]'); if (!b) return;
      const passo = Number(b.dataset.passo);
      if (passo === 0){ matEstado.data = null; }
      else {
        const d = new Date(matEstado.data + 'T12:00:00Z');
        d.setUTCDate(d.getUTCDate() + passo);
        matEstado.data = d.toISOString().slice(0,10);
      }
      carregarGradeDoDia();
    });
    alvo.querySelector('#mat-data').addEventListener('change', e=>{
      matEstado.data = e.target.value || null;
      carregarGradeDoDia();
    });

    alvo.querySelector('#mat-encaixe-ok').addEventListener('click', async ()=>{
      const quem = alvo.querySelector('#mat-encaixe-quem').value;
      const hora = alvo.querySelector('#mat-encaixe-hora').value;
      if (!quem || !hora) return avisar('Escolha o aluno e o horário.', 'erro');
      try{
        await api('/matriculas/excecoes', {method:'POST', body: JSON.stringify({
          matriculaId: quem, data: matEstado.data, tipo:'extra', hora })});
        avisar('Aula extra encaixada.', 'ok');
        await carregarGradeDoDia();
      }catch(e){ avisar(e.message,'erro'); }
    });

    alvo.querySelectorAll('.n-desmarcar').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const linha = b.closest('.nome-linha');
        b.disabled = true;
        try{
          if (linha.dataset.exc){
            await api('/matriculas/excecoes/'+linha.dataset.exc, {method:'DELETE'});
          } else {
            await api('/matriculas/excecoes', {method:'POST', body: JSON.stringify({
              matriculaId: linha.dataset.mat, data: matEstado.data,
              tipo:'cancelou', hora: linha.dataset.hora })});
          }
          await carregarGradeDoDia();
        }catch(e){ avisar(e.message,'erro'); b.disabled = false; }
      });
    });
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

    <input value="${esc(emoji)}" class="c-emoji" maxlength="4" placeholder="🏅" style="text-align:center">

/* --------- grade de horários: gerador, cópia entre dias e contagem -------- */

/**
 * A grade vive aqui, não no DOM. Quando os horários eram inputs na tela, a
 * ordem era a ordem de digitação: adicionar 11:00 numa grade pronta deixava o
 * horário no fim da lista, e só salvar e recarregar arrumava. Com o modelo em
 * memória, `pintarDia` ordena a cada desenho e a tela nunca fica fora de ordem.
 */
let gradeH = {};

/** Qual horário de cada dia está aberto para edição — null quando nenhum. */
const editandoH = {};

function listaDo(dia){ return document.querySelector(`.lista-h[data-dia="${dia}"]`); }
function horariosDo(dia){ return (gradeH[dia] || []).map(s=>({ ...s })); }

const emMin = h => { const [a,b] = h.split(':').map(Number); return a*60+(b||0); };
const emHora = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const ordenarH = lista => lista.slice().sort((a,b)=>emMin(a.hora)-emMin(b.hora));

function chipHorario(dia, s){
  const editando = editandoH[dia] === s.hora;
  return `<span class="chip-h${editando?' edit':''}" data-dia="${dia}" data-hora="${s.hora}"
    title="${s.capacidade ? `capacidade ${s.capacidade}` : 'capacidade padrão'} — toque para editar">
    <b>${s.hora}</b>${s.capacidade?`<small>${s.capacidade}</small>`:''}
    <i class="chip-x" role="button" aria-label="Remover ${s.hora}">×</i></span>`;
}

/** Guarda a grade de um dia já ordenada e redesenha. */
function definirDia(dia, horarios){
  gradeH[dia] = ordenarH((horarios || []).filter(s=>s.hora).map(s=>({
    hora: s.hora,
    capacidade: Number(s.capacidade) || undefined,
  })));
  pintarDia(dia);
}

function pintarDia(dia){
  const lista = gradeH[dia] = ordenarH(gradeH[dia] || []);
  const el = listaDo(dia);
  if (el){
    el.innerHTML = lista.length
      ? lista.map(s=>chipHorario(dia, s)).join('')
      : '<span class="sem-horario">Nenhum horário — o estúdio não abre neste dia.</span>';
  }
  const cont = document.querySelector(`[data-cont="${dia}"]`);
  if (cont) cont.textContent = lista.length
    ? `${lista.length} ${lista.length===1?'horário':'horários'}` : 'fechado';
  const previa = document.querySelector(`[data-previa="${dia}"]`);
  if (previa) previa.textContent = lista.map(s=>s.hora).join(' · ');
}

function contarTodos(){ DIAS.forEach(([k])=>pintarDia(k)); }

/** Insere ou substitui um horário do dia, a partir dos campos de baixo. */
function guardarHorario(dia){
  const campoHora = document.querySelector(`.h-nova[data-dia="${dia}"]`);
  const campoCap  = document.querySelector(`.h-cap[data-dia="${dia}"]`);
  const hora = campoHora.value;
  if (!hora) return avisar('Escolha o horário.', 'erro');

  const capacidade = Number(campoCap.value) || undefined;
  const antiga = editandoH[dia];
  // Tirar o horário antigo e o repetido na mesma passada: repetir um horário
  // que já existe é correção de capacidade, não um segundo horário igual.
  gradeH[dia] = (gradeH[dia] || []).filter(s=>s.hora !== hora && s.hora !== antiga);
  gradeH[dia].push({ hora, capacidade });

  editandoH[dia] = null;
  campoHora.value = ''; campoCap.value = '';
  document.querySelector(`.h-add[data-dia="${dia}"]`).textContent = 'Adicionar';
  pintarDia(dia);
}

/** Traz um horário para os campos de baixo, para ajustar hora ou capacidade. */
function editarHorario(dia, hora){
  const s = (gradeH[dia] || []).find(x=>x.hora === hora);
  if (!s) return;
  const cancelar = editandoH[dia] === hora;
  editandoH[dia] = cancelar ? null : hora;
  document.querySelector(`.h-nova[data-dia="${dia}"]`).value = cancelar ? '' : s.hora;
  document.querySelector(`.h-cap[data-dia="${dia}"]`).value = cancelar ? '' : (s.capacidade || '');
  document.querySelector(`.h-add[data-dia="${dia}"]`).textContent = cancelar ? 'Adicionar' : 'Salvar';
  pintarDia(dia);
}

function ligarGrade(alvo, horarios){
  // O modelo é remontado a cada desenho da aba, a partir do que veio do
  // servidor. Alterações não salvas se perdem ao sair da aba — como já era.
  gradeH = {};
  DIAS.forEach(([k])=>{
    gradeH[k] = ordenarH((horarios && horarios[k] || []).map(s=>({
      hora: s.hora, capacidade: Number(s.capacidade) || undefined,
    })));
    editandoH[k] = null;
  });

  // A aba é redesenhada a cada visita; o container não. Sem esta trava os
  // listeners delegados se acumulariam e cada clique dispararia várias vezes.
  if (!alvo.dataset.gradeLigada){
    alvo.dataset.gradeLigada = '1';
    alvo.addEventListener('click', e=>{
      const add = e.target.closest('.h-add');
      if (add){ guardarHorario(add.dataset.dia); return; }

      // O × fica dentro do chip, então vem antes na checagem.
      const x = e.target.closest('.chip-x');
      if (x){
        const dia = x.closest('.chip-h').dataset.dia;
        const hora = x.closest('.chip-h').dataset.hora;
        gradeH[dia] = (gradeH[dia] || []).filter(s=>s.hora !== hora);
        if (editandoH[dia] === hora) editarHorario(dia, hora);
        pintarDia(dia);
        return;
      }
      const chipH = e.target.closest('.chip-h');
      if (chipH){ editarHorario(chipH.dataset.dia, chipH.dataset.hora); return; }

      const lim = e.target.closest('.h-limpar');
      if (lim){ definirDia(lim.dataset.dia, []); return; }
      const chip = e.target.closest('#g-dias .chip');
      if (chip) chip.classList.toggle('sel');
    });

    // Enter no campo de horário adiciona, sem obrigar a mirar no botão.
    alvo.addEventListener('keydown', e=>{
      const campo = e.target.closest('.h-nova, .add-h .h-cap');
      if (campo && e.key === 'Enter'){ e.preventDefault(); guardarHorario(campo.dataset.dia); }
    });
  }

  // copiar a grade de outro dia
  alvo.querySelectorAll('.h-copiar-de').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const origem = sel.value; if (!origem) return;
      const destino = sel.dataset.dia;
      definirDia(destino, horariosDo(origem));
      sel.value = '';
      const nome = (DIAS.find(([k])=>k===origem)||[])[1] || origem;
      avisar(`Grade copiada de ${nome}.`, 'ok');
    });
  });

  // atalhos de seleção de dias
  document.getElementById('g-uteis').addEventListener('click', ()=>{
    document.querySelectorAll('#g-dias .chip').forEach(ch=>
      ch.classList.toggle('sel', ['seg','ter','qua','qui','sex'].includes(ch.dataset.dia)));
  });
  document.getElementById('g-nenhum').addEventListener('click', ()=>{
    document.querySelectorAll('#g-dias .chip').forEach(ch=>ch.classList.remove('sel'));
  });

  // gerar a grade
  document.getElementById('g-aplicar').addEventListener('click', ()=>{
    const inicio = document.getElementById('g-inicio').value;
    const fim    = document.getElementById('g-fim').value;
    const passo  = Number(document.getElementById('g-int').value);
    const cap    = document.getElementById('g-cap').value;
    const dias   = [...document.querySelectorAll('#g-dias .chip.sel')].map(ch=>ch.dataset.dia);

    if (!inicio || !fim) return avisar('Preencha o primeiro e o último horário.', 'erro');
    if (!(passo >= 5))   return avisar('O intervalo precisa ser de pelo menos 5 minutos.', 'erro');
    if (emMin(fim) < emMin(inicio)) return avisar('O último horário vem antes do primeiro.', 'erro');
    if (!dias.length)    return avisar('Marque pelo menos um dia.', 'erro');

    const horarios = [];
    for (let m = emMin(inicio); m <= emMin(fim); m += passo) horarios.push({ hora: emHora(m), capacidade: cap });
    if (horarios.length > 60) return avisar('Isso geraria mais de 60 horários por dia. Revise o intervalo.', 'erro');

    dias.forEach(d=>definirDia(d, horarios));
    avisar(`${horarios.length} horários em ${dias.length} ${dias.length===1?'dia':'dias'}. Não esqueça de salvar.`, 'ok');
  });

  contarTodos();
}

function ligarSubabas(alvo){

    selCanal.addEventListener('change', pintarAviso);
    pintarAviso();

    document.getElementById('c-add-conquista').addEventListener('click', ()=>{
      document.getElementById('lista-conquistas')
        .insertAdjacentHTML('beforeend', linhaConquista());
    });
    alvo.addEventListener('click', e=>{
      const r = e.target.closest('.c-remover');
      if (r) r.closest('.linha-c').remove();
    });

    ligarSubabas(alvo);
    ligarGrade(alvo, c.agenda.horarios);
    mostrarBackup();
    document.getElementById('btn-salvar').addEventListener('click', salvarConfig);
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

async function salvarConfig(){
  const v = id => document.getElementById(id).value.trim();
  const n = id => Number(document.getElementById(id).value);
  // Sai do modelo, já ordenado. Um horário deixado nos campos de baixo sem
  // clicar em Adicionar não entra — o que está na tela como chip é o que vale.
  const horarios = {};
  DIAS.forEach(([k])=>{ horarios[k] = ordenarH(gradeH[k] || []); });

  const conquistas = [...document.querySelectorAll('#lista-conquistas .linha-c')]
    .map(l=>({
      aulas: Number(l.querySelector('.c-aulas').value),
      emoji: l.querySelector('.c-emoji').value,
      titulo: l.querySelector('.c-titulo').value,
    }))
    .filter(m=>m.aulas > 0 && m.titulo.trim());

  const corpo = {
    conquistas,
    estudio: {
      nome: v('c-nome'), fuso: v('c-fuso'), recado: v('c-recado'),
      alerta: v('c-alerta'), alertaAte: v('c-alerta-ate'),
    },
    agenda: {
      diasAntecedencia: n('c-antec'), capacidadePadrao: n('c-cap'),
      minutosAntesDeFechar: n('c-fechar'), limitePorDia: n('c-limite'),
      permitirCancelar: v('c-permcanc') === '1', minutosParaCancelar: n('c-mincanc'),
      datasBloqueadas: v('c-bloq').split(',').map(s=>s.trim()).filter(Boolean),
      horarios,
    },
    acesso: {
      diasDeSessao: n('c-sessao'), canalDoCodigo: v('c-canal'),
      minutosDeValidadeDoCodigo: n('c-valcod'), maxPedidosPorHora: n('c-maxped'),
      cadastroAberto: v('c-aberto') === '1',
    },
    envio: {
      url: v('c-url'), nomeDoCabecalhoDoToken: v('c-cabec'),
      corpo: v('c-corpo'), texto: v('c-texto'),
    },
    avisos: {
      checkinConfirmado: v('c-aviso-ligado') === '1',
      emails: v('c-aviso-emails').split(',').map(s=>s.trim()).filter(Boolean),
      telefones: v('c-aviso-tels').split(',').map(s=>s.trim()).filter(Boolean),
    },
    administradores: v('c-admins').split(',').map(s=>s.trim()).filter(Boolean),
  };
  if (v('c-token')) corpo.envio.token = v('c-token');

  // Senha em branco = mantém a atual. Só vai ao servidor quando muda.
  const removerSenha = document.getElementById('c-remover-senha');
  if (removerSenha && removerSenha.checked) corpo.novaSenhaAdmin = '';
  else if (v('c-senha')) corpo.novaSenhaAdmin = v('c-senha');

  const b = document.getElementById('btn-salvar');
  b.disabled = true; b.textContent = 'Salvando…';
  try{
    await api('/admin/config', {method:'PUT', body:JSON.stringify(corpo)});
    avisar('Configurações salvas.', 'ok');
    // Quem escreveu o aviso acabou de lê-lo. Marcar como visto aqui evita que
    // o popup pule na cara logo após salvar — e, principalmente, evita que o
    // administrador o dispense sem querer antes dos alunos verem.
    if (corpo.estudio.alerta) marcarAlertaComoVisto(corpo.estudio.alerta);
    // Salvar não pode jogar o administrador para o topo da página: guarda a
    // rolagem e devolve depois que a tela termina de ser remontada.
    const y = window.scrollY;
    await comecar(true);
    requestAnimationFrame(()=>window.scrollTo(0, y));
  }catch(e){ avisar(e.message, 'erro'); }
  finally{ b.disabled = false; b.textContent = 'Salvar configurações'; }
}

/* ------------------------------ início ---------------------------------- */
async function comecar(manterAba){
  try{
    const r = await api('/auth/eu');
    // Descarta o que estiver na tela antes de mostrar a conta nova.
    if (!manterAba) limparTela();
    eu = r.aluno;
    document.getElementById('tela-login').hidden = true;
    document.getElementById('tela-app').hidden = false;
    document.getElementById('nome-estudio').textContent = r.config.estudio.nome;
    document.getElementById('quem-sou').textContent = eu.nome || eu.telefone;
    document.querySelectorAll('.so-admin').forEach(b=>{ b.hidden = !eu.admin; });
    await abrirAba(manterAba ? abaAtiva : 'agendar');
  }catch{
    document.getElementById('tela-login').hidden = false;
    document.getElementById('tela-app').hidden = true;
  }
}

if (cofre.get()) comecar(); else document.getElementById('in-telefone').focus();
</script>
