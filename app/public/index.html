/* --------------------- check-ins do aluno, um a um ----------------------- *
 * A tabela de frequência é um placar: diz quanto falta, não quais dias foram.
 * Na hora de cobrar, a pergunta seguinte é sempre a mesma — "mas eu vim dia
 * tal" — e ela só se responde com a lista aberta. Daí o duplo clique na linha.
 * ------------------------------------------------------------------------- */

const DIA_CURTO = ['dom','seg','ter','qua','qui','sex','sáb'];

/**
 * Caixa larga, no mesmo desenho do popup de aviso do estúdio.
 *
 * Reaproveita `.fundo-modal` e `.modal` para não inventar um segundo diálogo na
 * página; muda só a largura e troca o `pre-wrap` do corpo por HTML normal, já
 * que aqui dentro vai uma tabela. Devolve o elemento para quem chamou poder
 * trocar o conteúdo depois que a busca voltar.
 */
function abrirPainel(titulo, html){
  const antigo = document.querySelector('.fundo-modal');
  if (antigo) antigo.remove();

  const fundo = document.createElement('div');
  fundo.className = 'fundo-modal';
  fundo.innerHTML = `
    <div class="modal largo" role="dialog" aria-modal="true" aria-labelledby="painel-titulo">
      <div class="topo" id="painel-titulo">${esc(titulo)}</div>
      <div class="corpo rolagem">${html}</div>
      <div class="pe"><button class="acao" id="painel-ok">Fechar</button></div>
    </div>`;

  const fechar = ()=>{ fundo.remove(); document.removeEventListener('keydown', porTecla); };
  function porTecla(e){ if (e.key === 'Escape') fechar(); }
  fundo.querySelector('#painel-ok').addEventListener('click', fechar);
  fundo.addEventListener('click', e=>{ if (e.target === fundo) fechar(); });
  document.addEventListener('keydown', porTecla);

  document.body.appendChild(fundo);
  fundo.querySelector('#painel-ok').focus();
  return fundo;
}

/**
 * Em que zona do repasse cai cada check-in do mês.
 *
 * Mesma régua do fechamento: em ordem de data, os primeiros até a meta fecham o
 * pacote, do seguinte até o 12º o Wellhub ainda paga como excedente, e do 13º
 * em diante não rende nada. Sem meta (experimental, ficha sem grade) tudo é
 * excedente — é exatamente o que o servidor faz com esses check-ins.
 */
function zonaDoCheckin(posicao, meta){
  if (posicao > 12) return 'ignorado';
  return meta && posicao <= meta ? 'pacote' : 'excedente';
}

const ZONA = {
  pacote:    { marca:'🟢', rotulo:'pacote' },
  excedente: { marca:'🟡', rotulo:'além do combinado' },
  ignorado:  { marca:'⛔', rotulo:'sem repasse' },
};

/** dd/mm com o dia da semana, direto do ISO — sem passar pelo fuso do aparelho. */
function diaComSemana(iso){
  const [ano,mes,dia] = String(iso).split('-').map(Number);
  const s = DIA_CURTO[new Date(Date.UTC(ano, mes-1, dia)).getUTCDay()];
  return `${String(dia).padStart(2,'0')}/${String(mes).padStart(2,'0')} `
    + `<span class="fraco">${s}</span>`;
}

/** O miolo da caixa: uma linha por check-in, do primeiro do mês ao último. */
function corpoCheckinsDoMes(a, lista, mes){
  const meta = a.mes && a.mes.meta ? a.mes.meta : 0;
  const conta = a.mes && a.mes.conta ? a.mes.conta : null;

  const nota = conta
    ? `<p class="ajuda">${esc(conta.ehTitular
        ? `Conta dividida com ${conta.participantes.filter(n=>n!==a.nome).join(', ')}: `
          + `a lista abaixo é o que caiu nesta ficha, e a cota dela é ${conta.cota}.`
        : `Esta ficha treina na conta de ${conta.titular}, com cota ${conta.cota}. `
          + 'Check-ins lançados na conta do titular não aparecem aqui.')}</p>`
    : '';

  if (!lista.length) return nota + `<p class="ajuda">Nenhum check-in registrado em `
    + `${rotuloMes(mes)}${a.gympassId ? '' : ' — esta ficha ainda não tem Wellhub ID vinculado'}.</p>`;

  const ordenados = lista.slice().sort((x,y)=>
    String(x.data).localeCompare(String(y.data))
    || String(x.hora||'').localeCompare(String(y.hora||'')));

  const soma = { pacote:0, excedente:0, ignorado:0 };
  const linhas = ordenados.map((c,i)=>{
    const zona = zonaDoCheckin(i+1, meta);
    soma[zona] += 1;
    const z = ZONA[zona];
    return `<tr class="${zona === 'pacote' ? 'em-dia' : zona === 'excedente' ? 'atrasado' : 'critico'}">
      <td class="num fraco">${i+1}</td>
      <td>${diaComSemana(c.data)}${c.primeiraVez
        ? ' <span class="fraco" title="Primeira vez no estúdio">✳︎</span>' : ''}</td>
      <td class="num">${esc(c.hora || '—')}</td>
      <td class="opc fraco">${esc(c.produto || '—')}</td>
      <td class="fraco">${z.marca} ${z.rotulo}</td>
    </tr>`;
  }).join('');

  const resumo = [
    `<b>${ordenados.length}</b> check-in(s) no mês`,
    meta ? `<b>${soma.pacote}</b> de ${meta} no pacote` : 'sem meta definida',
    soma.excedente ? `<b>${soma.excedente}</b> além do combinado` : '',
    soma.ignorado ? `<b>${soma.ignorado}</b> sem repasse` : '',
    meta && a.mes.faltam ? `faltam <b>${a.mes.faltam}</b>` : '',
  ].filter(Boolean).join(' · ');

  return nota + `
    <table class="freq-tabela" style="margin-bottom:10px">
      <thead><tr>
        <th class="num">#</th><th>Dia</th><th class="num">Hora</th>
        <th class="opc">Produto</th><th>Conta</th>
      </tr></thead>
      <tbody>${linhas}</tbody>
    </table>
    <p class="ajuda" style="margin:0">${resumo}.</p>`;
}

/**
 * Busca e mostra os check-ins do mês vigente de um aluno.
 *
 * O recorte é o mesmo da janela já carregada na tela (dia 1º até `janela.ate`),
 * para a contagem daqui bater com a coluna "Mês" da linha de onde veio o duplo
 * clique. O endpoint já filtra por matrícula, então não há nada de novo no
 * servidor — é a rota que a exportação de check-ins usa, com um parâmetro a
 * mais.
 */
async function abrirCheckinsDoMes(a, janela){
  const mes = String(janela.ate).slice(0,7);
  const painel = abrirPainel(`${a.nome} · ${rotuloMes(mes)}`,
    '<p class="ajuda">Carregando…</p>');
  const corpo = painel.querySelector('.corpo');
  try{
    const r = await api('/matriculas/checkins'
      + `?matriculaId=${encodeURIComponent(a.matriculaId)}`
      + `&de=${mes}-01&ate=${janela.ate}&limite=200`);
    // A caixa pode ter sido fechada enquanto a busca voltava.
    if (!document.body.contains(painel)) return;
    corpo.innerHTML = corpoCheckinsDoMes(a, r.checkins || [], mes);
  }catch(e){
    if (document.body.contains(painel)) corpo.innerHTML = `<p class="ajuda">${esc(e.message)}</p>`;
  }
}

/* ------------------------------ mês a dia -------------------------------- */

const MES_NOME = ['janeiro','fevereiro','março','abril','maio','junho','julho',
  'agosto','setembro','outubro','novembro','dezembro'];
const DIA_LONGO = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

function rotuloMes(mes){
  const [a,m] = String(mes).split('-').map(Number);
  return `${MES_NOME[m-1]} de ${a}`;
}

/* Aritmética de mês pelo UTC: somar 30 dias a 31/01 cairia em março. */
function mesVizinho(mes, passo){
  const [a,m] = String(mes).split('-').map(Number);
  return new Date(Date.UTC(a, m-1+passo, 1)).toISOString().slice(0,7);
}

/**
 * O mês como curva acumulada, em SVG escrito à mão.
 *
 * POR QUE ACUMULADO E NÃO BARRA POR DIA
 *   Barra por dia responde "quanta gente veio na terça". A pergunta que se faz
 *   olhando o mês é outra — "a esta altura, quanto eu já deveria ter" — e essa
 *   só se responde somando os dias anteriores de cabeça, um por um, o que
 *   ninguém faz. Acumulado, a resposta é a altura da linha no dia: onde a
 *   amarela está abaixo da tracejada, o mês está atrasado, e a distância
 *   vertical é exatamente quantos treinos faltam.
 *
 * DUAS RÉGUAS, E ELAS MEDEM COISAS DIFERENTES
 *   A tracejada é a meta do pacote: o combinado do mês repartido pelos dias do
 *   mês, uma reta do zero ao total. É o que vira dinheiro. A cinza contínua é a
 *   agenda: cada aula combinada projetada no calendário, com os altos e baixos
 *   da semana. É quanta gente o estúdio esperava na porta.
 *
 *   A reta era uma escada de degraus semanais, e o degrau escondia o meio do
 *   caminho: no dia 27 ela ainda marcava o que vencera no dia 21, seis dias de
 *   treino atrás do calendário.
 *
 *   Elas não batem de propósito. Quem treina segunda, quarta e sexta tem 13
 *   aulas num mês de cinco segundas e só 12 entram no repasse; quem treina de
 *   segunda a sexta tem 21 aulas e os mesmos 12 de teto. A agenda acima da meta
 *   é exatamente o treino que o aluno faz e o Wellhub não paga.
 *
 * AS LINHAS DO REALIZADO PARAM EM HOJE
 *   Estendê-las até o dia 31 as deixaria horizontais no resto do mês, como se
 *   o estúdio tivesse fechado. O que ainda não aconteceu não vira linha.
 *
 * SEM BIBLIOTECA DE GRÁFICO
 *   Duas polylines e um eixo. Trazer Chart.js custaria 60 kB e uma dependência
 *   de CDN numa página que hoje não tem nenhuma — e o app precisa abrir na
 *   recepção com internet ruim.
 */
function graficoMes(p){
  const ESQ=38, DIR=12, TOPO=14, BASE=26;
  const larg = 700, alt = 268;
  const areaL = larg - ESQ - DIR, areaA = alt - TOPO - BASE;
  const n = p.dias.length;
  const fim = p.dias[n-1];

  const maior = Math.max(4, fim.metaAcum, fim.previstoAcum,
    fim.feitoAcum, fim.experimentalAcum, fim.foraAcum);
  const passo = maior<=40 ? 10 : maior<=120 ? 25 : maior<=400 ? 100 : 200;
  const teto = Math.ceil(maior/passo)*passo;

  const x = i => ESQ + (n===1 ? areaL/2 : (i/(n-1))*areaL);
  const y = v => TOPO + areaA - (v/teto)*areaA;

  // Índice do último dia que já aconteceu; -1 quando o mês inteiro é futuro.
  let ultimo = -1;
  p.dias.forEach((d,i)=>{ if (!d.futuro) ultimo = i; });

  const linha = (campo, ate) => p.dias.slice(0, (ate ?? n-1)+1)
    .map((d,i)=>`${x(i).toFixed(1)},${y(d[campo]).toFixed(1)}`).join(' ');

  // A meta é uma reta: o combinado do mês repartido pelos dias do mês. Era uma
  // escada enquanto a cobrança vencia nos dias 7, 14 e 21 — e no dia 27 aquela
  // escada ainda mostrava o degrau do dia 21, seis dias de treino atrás do
  // calendário. `metaAcum` é a régua do estúdio inteiro, a mesma dos cartões:
  // por um tempo o gráfico desenhou uma conta e o cartão mostrou outra, e a
  // linha aparecia abaixo de um número que dizia o contrário.
  const escada = () => p.dias
    .map((d,i)=>`${x(i).toFixed(1)},${y(d.metaAcum).toFixed(1)}`).join(' ');

  let svg = '';
  for (let v=0; v<=teto; v+=passo){
    svg += `<line x1="${ESQ}" y1="${y(v)}" x2="${larg-DIR}" y2="${y(v)}"`
      + ` stroke="var(--linha)" stroke-width="1"${v ? ' stroke-dasharray="2 4"' : ''}/>`
      + `<text x="${ESQ-6}" y="${y(v)+3.5}" text-anchor="end" class="g-eixo">${v}</text>`;
  }

  // Rótulos rareados: 31 números colados viram uma tarja cinza. O dia de hoje
  // entra sempre e empurra o múltiplo de cinco vizinho para fora — dois números
  // a 40px um do outro se sobrepõem na largura do celular.
  const diaHoje = ultimo >= 0 ? p.dias[ultimo].dia : -99;
  p.dias.forEach((d,i)=>{
    const marco = d.dia===1 || d.dia%5===0;
    if (!marco && !d.ehHoje) return;
    if (marco && !d.ehHoje && Math.abs(d.dia - diaHoje) < 3) return;
    svg += `<text x="${x(i).toFixed(1)}" y="${alt-BASE+15}" text-anchor="middle"`
      + ` class="g-dia${d.ehHoje?' hoje':''}">${d.dia}</text>`;
  });

  if (ultimo >= 0 && ultimo < n-1){
    svg += `<line class="g-hoje" x1="${x(ultimo).toFixed(1)}" y1="${TOPO}"`
      + ` x2="${x(ultimo).toFixed(1)}" y2="${TOPO+areaA}"/>`;
  }

  // A régua do pacote é a que se lê primeiro, então vai mais clara; a agenda é
  // contexto e fica apagada. Com os dois cinzas parecidos, a tracejada sumia.
  svg += `<polyline class="g-linha ref" points="${escada()}"`
    + ` stroke="var(--apagado)" stroke-dasharray="5 4"/>`;
  svg += `<polyline class="g-linha ref" points="${linha('previstoAcum')}"`
    + ` stroke="var(--linha-3)"/>`;
  if (ultimo >= 0){
    if (fim.experimentalAcum) svg += `<polyline class="g-linha"`
      + ` points="${linha('experimentalAcum', ultimo)}" stroke="var(--liberado)"/>`;
    if (fim.semVinculoAcum) svg += `<polyline class="g-linha ref"`
      + ` points="${linha('semVinculoAcum', ultimo)}" stroke="var(--vermelho)"/>`;
    // Além do combinado fica num amarelo apagado, logo abaixo da linha cheia:
    // é treino de aluno como o outro, só que ninguém previu. O que passa dos
    // doze não vira linha — não rende, e uma quarta curva só polui o gráfico.
    if (fim.foraAcum) svg += `<polyline class="g-linha ref"`
      + ` points="${linha('foraAcum', ultimo)}" stroke="var(--amarelo-2)"/>`;
    svg += `<polyline class="g-linha" points="${linha('feitoAcum', ultimo)}"`
      + ` stroke="var(--amarelo)"/>`;
  }

  // Faixa transparente por dia: é o que faz o <title> responder em qualquer
  // ponto da coluna, e não só em cima do traço de dois pixels.
  const fatia = areaL / n;
  p.dias.forEach((d,i)=>{
    const dica = `${d.dia} de ${MES_NOME[Number(p.mes.slice(5))-1]} · ${DIA_LONGO[d.diaDaSemana]}`
      + `\nMeta do pacote até aqui: ${d.metaAcum} check-in(s)`
      + `\nAulas na agenda: ${d.previstoAcum}`
      + (d.futuro ? '\nAinda não aconteceu.'
        : `\nCheck-ins do pacote: ${d.feitoAcum}`
          + (d.foraAcum ? `\nAlém do combinado: ${d.foraAcum}` : '')
          + (d.ignoradoAcum ? `\nSem repasse: ${d.ignoradoAcum}` : '')
          + `\nExperimentais: ${d.experimentalAcum}`
          + (d.semVinculoAcum ? `\nSem aluno: ${d.semVinculoAcum}` : '')
          + (d.receitaAcum ? `\nRepasse até aqui: ${dinheiro(d.receitaAcum)}` : '')
          + `\n(neste dia: ${d.previsto} na agenda, ${d.feito} do pacote`
          + (d.fora ? `, ${d.fora} além do combinado` : '')
          + (d.ignorado ? `, ${d.ignorado} acima do teto` : '')
          + (d.receita ? `, ${dinheiro(d.receita)}` : '') + `)`);
    svg += `<g><title>${esc(dica)}</title><rect x="${(ESQ+i*fatia).toFixed(1)}" y="${TOPO}"`
      + ` width="${fatia.toFixed(1)}" height="${areaA}" fill="transparent"/></g>`;
  });

  return `<div class="grafico-mes"><svg viewBox="0 0 ${larg} ${alt}" role="img"
    xmlns="http://www.w3.org/2000/svg"
    aria-label="Check-ins acumulados por dia em ${esc(rotuloMes(p.mes))}"
    >${svg}</svg></div>`;
}

/**
 * O mês por data: quanto o estúdio já deveria ter somado e quanto somou.
 *
 * A aba Frequência já responde por aluno, e é lá que se cobra. Aqui a pergunta
 * é onde, no calendário, a curva descolou.
 */
async function carregarMes(){
  const alvo = document.getElementById('mat-mes');
  if (!alvo) return;
  try{
    const p = await api('/matriculas/frequencia/mes'
      + (matEstado.mesRef ? '?mes='+matEstado.mesRef : ''));
    // Grava o mês que o servidor resolveu: sem isto, o primeiro clique em "‹"
    // partiria de `null` e voltaria para o mês corrente de novo.
    matEstado.mesRef = p.mes;

    const t = p.totais;
    const f = p.financeiro;
    const noCorrente = p.mes === p.hoje.slice(0,7);
    const atraso = t.metaAteHoje - t.feito;
    const faltam = Math.max(p.metaMes - t.feito, 0);

    alvo.innerHTML = `
      <div class="nav-mes">
        <button class="leve" id="mes-ant" title="Mês anterior" aria-label="Mês anterior">‹</button>
        <b>${esc(rotuloMes(p.mes))}</b>
        <button class="leve" id="mes-prox" title="Mês seguinte" aria-label="Mês seguinte"
          ${noCorrente ? 'disabled' : ''}>›</button>
      </div>

      <p class="ajuda">Todos os números desta faixa contam <b>check-ins</b> — um por aluno
        por dia, do jeito que o Wellhub paga. Não são pessoas: o estúdio tem
        <b>${p.alunosComPacote}</b> alunos com pacote. Dinheiro só depois do gráfico.</p>

      <h4 class="grupo-mes">${noCorrente ? `Até hoje, dia ${Number(p.hoje.slice(8))}` : 'No mês'}
        <small>O ritmo: se o mês parasse agora, estaria adiantado ou atrasado?</small></h4>
      <p class="ajuda">A meta do dia é a do estúdio inteiro — o pacote de cada aluno
        repartido pelos ${Number(p.ate.slice(8))} dias, somado com as frações e arredondado
        uma vez só. Por aluno a régua arredonda para baixo (ninguém deve meio treino), então
        a soma das metas individuais dá um pouco menos que este número.</p>
      <div class="freq-cartoes">
        ${cartaoFreq(t.metaAteHoje, 'o pacote já pedia')}
        ${cartaoFreq(t.feito, 'feitos, do pacote', atraso > 0 ? 'atrasado' : 'em-dia')}
        ${cartaoFreq(atraso > 0 ? `−${atraso}` : `+${-atraso}`,
          atraso > 0 ? 'atrás do ritmo' : 'à frente do ritmo',
          atraso > 0 ? 'atrasado' : 'em-dia')}
      </div>

      <h4 class="grupo-mes">Fechamento, dia ${Number(p.ate.slice(8))}
        <small>O combinado do mês inteiro, e o que ainda falta para bater.</small></h4>
      <div class="freq-cartoes">
        ${cartaoFreq(p.metaMes, 'o pacote pede no mês')}
        ${cartaoFreq(faltam, 'ainda faltam', faltam ? '' : 'em-dia')}
      </div>

      <h4 class="grupo-mes">A agenda do estúdio
        <small>Quanta gente você espera na porta — ocupação, não repasse.</small></h4>
      <div class="freq-cartoes">
        ${cartaoFreq(t.previstoTodos, 'aulas na agenda')}
        ${cartaoFreq(t.previsto, 'delas, do Wellhub')}
        ${t.previstoOutros ? cartaoFreq(t.previstoOutros, 'de mensalistas') : ''}
        ${cartaoFreq(p.alunosNaAgenda, 'pessoas com horário fixo')}
      </div>
      <p class="ajuda">Cada aula combinada projetada no calendário, sem as desmarcadas e com
        as extras, contando uma vez por pessoa por dia. É o único bloco desta tela que inclui
        <b>mensalista</b>: ele não passa pelo portal e não gera repasse, mas ocupa lugar na
        sala — e para pensar em turma cheia ou escala de professor, contar só os
        ${p.alunosNaAgendaWellhub} do Wellhub subestima a casa.
        ${p.agendaParcial && p.agendaParcial.pessoas ? `<br><b>Atenção:</b>
          ${p.agendaParcial.pessoas} ficha(s) só entram na conta a partir de
          ${dataCurta(p.agendaParcial.desde)}, que é quando foram cadastradas — sem check-in
          no portal e sem data de início na ficha, não há como provar que já treinavam antes.
          A agenda real do mês é maior do que a que aparece aqui.` : ''}</p>

      ${(t.fora || t.ignorado || t.experimental || t.semVinculo) ? `
      <h4 class="grupo-mes">Fora do pacote
        <small>Aconteceu, mas nenhum destes entra nas contas acima.</small></h4>
      <div class="freq-cartoes">
        ${t.fora ? cartaoFreq(t.fora, 'extras, o Wellhub paga') : ''}
        ${t.experimental ? cartaoFreq(t.experimental, 'de experimentais') : ''}
        ${t.semVinculo ? cartaoFreq(t.semVinculo, 'sem ficha', 'critico') : ''}
        ${t.ignorado ? cartaoFreq(t.ignorado,
          `acima do teto · ${t.alunosNoTeto} aluno(s)`, 'atrasado') : ''}
      </div>` : ''}

      <h3 style="margin:18px 0 0">O mês em dinheiro</h3>
      <p class="ajuda">Dos check-ins acima, <b>${f.checkins.pagos}</b> o Wellhub paga —
        somando pacote, extras, experimentais e órfãos${f.checkins.naoPagos
          ? `, e ${f.checkins.naoPagos} não, por terem passado do teto de 12 por pessoa` : ''}.
        Cada um vale ${dinheiro(f.precos.funcional)} no funcional e
        ${dinheiro(f.precos.crosstraining)} no crosstraining (Configurações → Negócio).
        ${f.mesCorrente
          ? `Daí os <b>${dinheiro(f.realizado.total)}</b> já validados; o pacote ainda promete
             <b>${dinheiro(f.aReceber)}</b> até o dia ${Number(p.ate.slice(8))}.`
          : 'Mês fechado: o que está aqui é o que foi validado, sem projeção.'}</p>

      <div class="freq-cartoes dinheiro">
        ${cartaoFreq(dinheiro(f.realizado.total), 'já validado')}
        ${f.mesCorrente ? cartaoFreq(dinheiro(f.aReceber), 'ainda a receber') : ''}
        ${f.mesCorrente ? cartaoFreq(dinheiro(f.previsto), 'previsão do mês', 'em-dia') : ''}
        ${cartaoFreq(dinheiro(f.realizado.pacote), 'do pacote')}
        ${f.realizado.excedente
          ? cartaoFreq(dinheiro(f.realizado.excedente), 'além do combinado') : ''}
        ${f.realizado.experimental
          ? cartaoFreq(dinheiro(f.realizado.experimental), 'de experimentais') : ''}
        ${f.realizado.semVinculo
          ? cartaoFreq(dinheiro(f.realizado.semVinculo), 'de sem aluno') : ''}
        ${f.perdido ? cartaoFreq(dinheiro(f.perdido), 'perdido no teto', 'atrasado') : ''}
        ${f.trocaDeProduto.checkins
          ? cartaoFreq(dinheiro(f.trocaDeProduto.deixadoNaMesa),
              'funcional em vez de cross', 'atrasado') : ''}
      </div>

      <table class="freq-tabela" style="margin-bottom:14px">
        <thead><tr><th>Produto</th><th>Check-ins</th><th>Valor</th><th>Repasse</th></tr></thead>
        <tbody>
          <tr><td>Funcional</td><td>${f.porProduto.funcional.checkins}</td>
            <td>${dinheiro(f.precos.funcional)}</td>
            <td><b>${dinheiro(f.porProduto.funcional.valor)}</b></td></tr>
          <tr><td>Crosstraining</td><td>${f.porProduto.crosstraining.checkins}</td>
            <td>${dinheiro(f.precos.crosstraining)}</td>
            <td><b>${dinheiro(f.porProduto.crosstraining.valor)}</b></td></tr>
          ${f.porProduto.semProduto.checkins ? `<tr class="orfao">
            <td>Produto não reconhecido</td><td>${f.porProduto.semProduto.checkins}</td>
            <td>${dinheiro(Math.min(f.precos.funcional, f.precos.crosstraining))}</td>
            <td><b>${dinheiro(f.porProduto.semProduto.valor)}</b></td></tr>` : ''}
        </tbody>
      </table>

      ${f.mesCorrente && f.projetados ? `<p class="ajuda">A previsão soma o que
        <b>${f.alunosNaProjecao}</b> aluno(s) ainda devem para fechar o pacote —
        <b>${f.projetados}</b> check-in(s) — pelo produto que cada um costuma marcar.
        Só o pacote entra: treino além do combinado e experimental são o aluno decidindo
        aparecer, e prometer isso no caixa é contar com o que ninguém combinou. O limite
        é o calendário — sobram ${f.diasRestantes} dia(s) e ninguém gera dois repasses na
        mesma data, então quem deve mais do que isso projeta só o que cabe.</p>` : ''}

      ${f.perdido ? `<p class="ajuda">${dinheiro(f.perdido)} passaram dos 12 check-ins por
        pessoa: o treino aconteceu, o estúdio entregou e o repasse não vem.</p>` : ''}

      ${f.trocaDeProduto.checkins ? `
        <h3 style="margin:18px 0 0">Quem entra pelo produto barato</h3>
        <p class="ajuda">Funcional e crosstraining custam o mesmo para o aluno — é o mesmo
          plano do lado dele. Para o estúdio, cada check-in de funcional rende
          ${dinheiro(f.trocaDeProduto.diferenca)} a menos. Neste mês são
          <b>${f.trocaDeProduto.checkins}</b> check-in(s) de
          <b>${f.trocaDeProduto.pessoas}</b> pessoa(s), ou
          <b>${dinheiro(f.trocaDeProduto.deixadoNaMesa)}</b> deixados na mesa sem que
          ninguém economizasse nada.
          ${f.mesCorrente && f.trocaDeProduto.aRecuperar
            ? `Instruindo hoje, <b>${dinheiro(f.trocaDeProduto.aRecuperar)}</b> ainda dá para
               recuperar nos treinos que faltam até o dia 31 — o que já passou não volta.`
            : ''}
          É a única perda desta tela que se resolve com uma conversa, e não com o aluno
          treinando mais.</p>
        <table class="freq-tabela">
          <thead><tr><th>Aluno</th><th>Check-ins no funcional</th><th>Deixado na mesa</th></tr></thead>
          <tbody>${f.trocaDeProduto.alunos.map(a=>`
            <tr class="${a.semFicha ? 'orfao' : ''}">
              <td class="nome">${esc(a.nome)}${a.semFicha
                ? ' <span class="ajuda">(sem ficha)</span>' : ''}</td>
              <td>${a.checkins}</td>
              <td><b>${dinheiro(a.deixadoNaMesa)}</b></td>
            </tr>`).join('')}</tbody>
        </table>
        <button class="leve" id="troca-csv" style="margin:6px 0 4px">Exportar esta lista</button>`
        : ''}

      ${f.porProduto.semProduto.checkins ? `<p class="ajuda alerta-rev">
        ${f.porProduto.semProduto.checkins} check-in(s) vieram com um produto que não é
        Funcional nem Crosstraining. Entraram pelo valor mais baixo para não inflar a
        previsão — se o portal criou um produto novo, ele precisa de preço próprio.</p>` : ''}

      ${graficoMes(p)}

      <div class="legenda-mes">
        <span><i style="background:var(--apagado)"></i>meta do pacote</span>
        <span><i style="background:var(--linha-3)"></i>aulas na agenda</span>
        <span><i style="background:var(--amarelo)"></i>check-ins do pacote</span>
        ${t.fora
          ? '<span><i style="background:var(--amarelo-2)"></i>além do combinado</span>' : ''}
        ${t.experimental
          ? '<span><i style="background:var(--liberado)"></i>experimentais</span>' : ''}
        ${t.semVinculo
          ? '<span><i style="background:var(--vermelho)"></i>sem aluno</span>' : ''}
      </div>

      <p class="ajuda">Tudo somado desde o dia 1º: a altura da linha num dia é o total do mês
        até ali, e não o movimento daquele dia. A distância vertical entre a amarela e a
        tracejada é, em treinos, o quanto o mês está adiantado ou atrasado.</p>

      <p class="ajuda">A tracejada é o <b>pacote</b> (${p.metaMes} no mês): o combinado semanal
        de cada aluno vezes quatro, limitado a 12, porque o Wellhub não repassa mais do que
        isso — são ${p.alunosComPacote} alunos. Sobe todo dia um pouco, porque é o total do
        mês repartido pelos ${Number(p.ate.slice(8))} dias: no dia
        ${noCorrente ? Number(p.hoje.slice(8)) : 15}, quem combinou 12 já deveria ter
        ${Math.floor(12 * (noCorrente ? Number(p.hoje.slice(8)) : 15) / Number(p.ate.slice(8)))}.
        É a mesma régua que decide quem aparece atrasado na aba Frequência, então o gráfico e
        aquela lista nunca discordam.<br>
        A cinza contínua é a <b>agenda</b> (${t.previsto} no mês): cada aula combinada
        projetada no calendário, sem as desmarcadas e com as extras, contando uma vez por
        aluno por dia. Responde quanta gente o estúdio esperava na porta. Onde ela passa da
        tracejada, a diferença é o treino que o aluno faz e o Wellhub não paga.</p>

      <p class="ajuda">A projeção vale o mês inteiro mesmo para quem foi cadastrado no meio
        dele: o piso é a estreia do aluno — a primeira das duas datas entre o cadastro da
        ficha e o primeiro check-in do mês —, e não o dia em que a grade foi digitada. Quem
        treinou no dia 3 já era aluno no dia 3.</p>

      ${(t.fora || t.ignorado) ? `<p class="ajuda">O treino além do combinado tem duas
        camadas. ${t.fora ? `<b>${t.fora}</b> check-in(s) passaram da meta do aluno mas
        continuam dentro dos 12 que a assinatura paga — é a linha apagada, receita que
        entra sem ter sido prevista. Somando ao pacote, são <b>${t.contabilizavel}</b>
        check-in(s) de alunos com pacote que o Wellhub paga.` : ''} ${t.ignorado ? `<b>${t.ignorado}</b> passaram dos
        12 por aluno (${t.alunosNoTeto} pessoa(s)): foram confirmados no portal, mas não
        rendem nada e não entram em nenhuma linha.` : ''} Contar tudo junto faria o mês
        parecer melhor do que o extrato vai mostrar.</p>` : ''}

      ${t.experimental ? `<p class="ajuda">Experimental fica na própria linha e fora da conta
        do pacote: sem grade combinada não há meta para comparar, e o treino dele é excedente
        até a ficha virar aluno de fato.</p>` : ''}

      ${t.semVinculo ? `<p class="ajuda alerta-rev">${t.semVinculo} check-in(s) do mês não
        caíram em nenhuma ficha. Eles aconteceram, mas não contam para o pacote de ninguém —
        a aba <b>Frequência</b> lista essas pessoas e cria ou vincula a ficha. Enquanto
        estiverem soltos, a linha amarela está mais baixa do que a realidade.</p>` : ''}

      <button class="leve" id="mes-csv" style="margin-top:6px">Exportar dia a dia</button>`;

    alvo.querySelector('#mes-ant').addEventListener('click', ()=>{
      matEstado.mesRef = mesVizinho(p.mes, -1); carregarMes();
    });
    const prox = alvo.querySelector('#mes-prox');
    prox.addEventListener('click', ()=>{
      if (prox.disabled) return;
      matEstado.mesRef = mesVizinho(p.mes, 1); carregarMes();
    });

    const trocaCsv = alvo.querySelector('#troca-csv');
    if (trocaCsv) trocaCsv.addEventListener('click', ()=>{
      baixarCsv(`funcional-${p.mes}.csv`,
        ['Aluno','Tem ficha','Check-ins no funcional','Deixado na mesa'],
        f.trocaDeProduto.alunos.map(a=>[a.nome, a.semFicha ? 'não' : 'sim', a.checkins,
          a.deixadoNaMesa.toFixed(2).replace('.', ',')]));
      avisar(`${f.trocaDeProduto.alunos.length} pessoa(s) exportada(s).`,'ok');
    });

    alvo.querySelector('#mes-csv').addEventListener('click', ()=>{
      baixarCsv(`mes-${p.mes}.csv`,
        ['Data','Dia da semana','Previsto no dia (Wellhub)','Agenda do estúdio no dia','Check-ins do pacote no dia','Além do combinado no dia',
         'Acima do teto no dia','Experimentais no dia','Sem ficha no dia','Meta do pacote (acum.)',
         'Previsto Wellhub (acum.)','Agenda do estúdio (acum.)','Check-ins do pacote (acum.)',
         'Além do combinado (acum.)','Acima do teto (acum.)',
         'Experimentais (acum.)','Sem ficha (acum.)','Repasse no dia','Repasse (acum.)'],
        p.dias.map(d=>[d.data, DIA_LONGO[d.diaDaSemana],
          d.previsto, d.previstoTodos, d.feito, d.fora, d.ignorado, d.experimental, d.semVinculo,
          d.metaAcum, d.previstoAcum, d.previstoTodosAcum, d.feitoAcum, d.foraAcum, d.ignoradoAcum,
          d.experimentalAcum, d.semVinculoAcum,
          // Vírgula decimal: o CSV abre no Excel em pt-BR, e 215.74 vira duzentos
          // e quinze mil setecentos e quarenta na planilha.
          d.receita.toFixed(2).replace('.', ','),
          d.receitaAcum.toFixed(2).replace('.', ',')]));
      avisar(`${p.dias.length} dia(s) exportado(s).`,'ok');
    });
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }

/**
 * Lotação da semana: alunos fixos de cada horário contra a capacidade que está
 * valendo na aba Configurações. Serve para responder duas perguntas sem
 * adivinhação — a agenda oferece todos os horários que a grade usa? e alguma
 * turma está com mais gente do que cabe?
 */
async function carregarLotacao(){
  const alvo = document.getElementById('mat-lotacao');
  if (!alvo) return;
  try{
    const r = await api('/matriculas/grade/ocupacao');
    if (!r.slots.length){
      alvo.innerHTML = '<div class="vazio">Nenhum horário fixo cadastrado.</div>';
      return;
    }
    const dias  = [1,2,3,4,5,6,0].filter(d=>r.slots.some(s=>s.dia===d));
    const horas = [...new Set(r.slots.map(s=>s.hora))].sort();
    const achar = (d,h)=> r.slots.find(s=>s.dia===d && s.hora===h);

    alvo.innerHTML = `
      <p class="ajuda">Quantos alunos têm horário fixo em cada turma, comparado com a
        capacidade configurada. ${r.foraDaAgenda
          ? `<b>${r.foraDaAgenda} ${r.foraDaAgenda===1?'horário':'horários'} da grade não ${
              r.foraDaAgenda===1?'existe':'existem'} na aba Agendar</b> — os alunos têm aula,
             mas ninguém consegue reservar ali.`
          : 'Todos os horários da grade existem na aba Agendar.'}</p>
      <div class="lot-wrap">
      <table class="lot-tabela">
        <thead><tr><th class="h"></th>${dias.map(d=>`<th>${NOME_DIA[d]}</th>`).join('')}</tr></thead>
        <tbody>${horas.map(h=>`<tr>
          <th class="h">${h}</th>
          ${dias.map(d=>{ const s = achar(d,h);
            if (!s) return `<td class="vazia" data-dia="${d}" data-hora="${h}">·</td>`;
            const cheio = s.capacidade && s.total > s.capacidade;
            return `<td class="${s.naAgenda?'':'fora'} ${cheio?'cheio':''}"
              data-dia="${d}" data-hora="${h}"
              title="${s.naAgenda ? `capacidade ${s.capacidade}` : 'fora da agenda'}">${
              s.total}${s.capacidade?'/'+s.capacidade:''}</td>`;
          }).join('')}
        </tr>`).join('')}</tbody>
      </table>
      <div id="lot-detalhe" class="lot-detalhe" hidden></div>
      <div class="lot-legenda">
        <span>toque numa célula para ver quem está na turma</span>
        <span><i class="fora">amarelo</i> — horário não existe na aba Agendar</span>
        <span><i class="cheio">vermelho</i> — mais alunos fixos do que a capacidade</span>
      </div>
      </div>`;

    // A célula abre a lista com os nomes daquela turma. Os alunos já vêm no
    // mesmo `/grade/ocupacao`, então abrir e fechar não custa nova requisição.
    const detalhe = alvo.querySelector('#lot-detalhe');
    alvo.querySelector('.lot-tabela').addEventListener('click', e=>{
      const td = e.target.closest('td'); if (!td) return;
      const jaAberta = td.classList.contains('sel');
      alvo.querySelectorAll('.lot-tabela td.sel').forEach(x=>x.classList.remove('sel'));
      if (jaAberta){ detalhe.hidden = true; return; }   // segundo toque fecha
      td.classList.add('sel');

      const d = Number(td.dataset.dia), hora = td.dataset.hora;
      const s = achar(d, hora);
      const alunos = (s && s.alunos) || [];
      const linha = alunos.length
        ? `${alunos.length} ${alunos.length===1?'aluno':'alunos'} com horário fixo`
          + (s.naAgenda ? ` · capacidade ${s.capacidade}` : ' · horário fora da aba Agendar')
        : 'Ninguém com horário fixo nesta turma.';

      detalhe.hidden = false;
      detalhe.innerHTML = `
        <b>${NOME_DIA[d]} · ${esc(hora)}</b>
        <p class="ajuda" style="margin:0">${linha}</p>
        ${alunos.length ? `<div class="lista-nomes">${alunos.map(a=>`
          <div class="nome-linha" data-mat="${esc(a.id)}">
            <span>${esc(a.nome)}${a.vinculo==='wellhub'?' <i class="marca-extra">wellhub</i>':''}</span>
            <button class="leve lot-ficha">Abrir ficha</button>
          </div>`).join('')}</div>` : ''}`;

      detalhe.querySelectorAll('.lot-ficha').forEach(b=>{
        b.addEventListener('click', ()=> abrirFichaDe(b.closest('.nome-linha').dataset.mat));
      });
    });
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

              ['sex','Sexta'],['sab','Sábado'],['dom','Domingo']];

/* --------- grade de horários: gerador, cópia entre dias e contagem -------- */

/**
 * A grade vive aqui, não no DOM. Quando os horários eram inputs na tela, a
 * ordem era a ordem de digitação: adicionar 11:00 numa grade pronta deixava o
 * horário no fim da lista, e só salvar e recarregar arrumava. Com o modelo em
 * memória, `pintarDia` ordena a cada desenho e a tela nunca fica fora de ordem.
 */
let gradeH = {};

/** Qual horário de cada dia está aberto para edição — null quando nenhum. */
const editandoH = {};

function listaDo(dia){ return document.querySelector(`.lista-h[data-dia="${dia}"]`); }
function horariosDo(dia){ return (gradeH[dia] || []).map(s=>({ ...s })); }

const emMin = h => { const [a,b] = h.split(':').map(Number); return a*60+(b||0); };
const emHora = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const ordenarH = lista => lista.slice().sort((a,b)=>emMin(a.hora)-emMin(b.hora));

function chipHorario(dia, s){
  const editando = editandoH[dia] === s.hora;
  return `<span class="chip-h${editando?' edit':''}" data-dia="${dia}" data-hora="${s.hora}"
    title="${s.capacidade ? `capacidade ${s.capacidade}` : 'capacidade padrão'} — toque para editar">
    <b>${s.hora}</b>${s.capacidade?`<small>${s.capacidade}</small>`:''}
    <i class="chip-x" role="button" aria-label="Remover ${s.hora}">×</i></span>`;
}

/** Guarda a grade de um dia já ordenada e redesenha. */
function definirDia(dia, horarios){
  gradeH[dia] = ordenarH((horarios || []).filter(s=>s.hora).map(s=>({
    hora: s.hora,
    capacidade: Number(s.capacidade) || undefined,
  })));
  pintarDia(dia);
}

function pintarDia(dia){
  const lista = gradeH[dia] = ordenarH(gradeH[dia] || []);
  const el = listaDo(dia);
  if (el){
    el.innerHTML = lista.length
      ? lista.map(s=>chipHorario(dia, s)).join('')
      : '<span class="sem-horario">Nenhum horário — o estúdio não abre neste dia.</span>';
  }
  const cont = document.querySelector(`[data-cont="${dia}"]`);
  if (cont) cont.textContent = lista.length
    ? `${lista.length} ${lista.length===1?'horário':'horários'}` : 'fechado';
  const previa = document.querySelector(`[data-previa="${dia}"]`);
  if (previa) previa.textContent = lista.map(s=>s.hora).join(' · ');
}

function contarTodos(){ DIAS.forEach(([k])=>pintarDia(k)); }

/** Insere ou substitui um horário do dia, a partir dos campos de baixo. */
function guardarHorario(dia){
  const campoHora = document.querySelector(`.h-nova[data-dia="${dia}"]`);
  const campoCap  = document.querySelector(`.h-cap[data-dia="${dia}"]`);
  const hora = campoHora.value;
  if (!hora) return avisar('Escolha o horário.', 'erro');

  const capacidade = Number(campoCap.value) || undefined;
  const antiga = editandoH[dia];
  // Tirar o horário antigo e o repetido na mesma passada: repetir um horário
  // que já existe é correção de capacidade, não um segundo horário igual.
  gradeH[dia] = (gradeH[dia] || []).filter(s=>s.hora !== hora && s.hora !== antiga);
  gradeH[dia].push({ hora, capacidade });

  editandoH[dia] = null;
  campoHora.value = ''; campoCap.value = '';
  document.querySelector(`.h-add[data-dia="${dia}"]`).textContent = 'Adicionar';
  pintarDia(dia);
}

/** Traz um horário para os campos de baixo, para ajustar hora ou capacidade. */
function editarHorario(dia, hora){
  const s = (gradeH[dia] || []).find(x=>x.hora === hora);
  if (!s) return;
  const cancelar = editandoH[dia] === hora;
  editandoH[dia] = cancelar ? null : hora;
  document.querySelector(`.h-nova[data-dia="${dia}"]`).value = cancelar ? '' : s.hora;
  document.querySelector(`.h-cap[data-dia="${dia}"]`).value = cancelar ? '' : (s.capacidade || '');
  document.querySelector(`.h-add[data-dia="${dia}"]`).textContent = cancelar ? 'Adicionar' : 'Salvar';
  pintarDia(dia);
}

function ligarGrade(alvo, horarios){
  // O modelo é remontado a cada desenho da aba, a partir do que veio do
  // servidor. Alterações não salvas se perdem ao sair da aba — como já era.
  gradeH = {};
  DIAS.forEach(([k])=>{
    gradeH[k] = ordenarH((horarios && horarios[k] || []).map(s=>({
      hora: s.hora, capacidade: Number(s.capacidade) || undefined,
    })));
    editandoH[k] = null;
  });

  // A aba é redesenhada a cada visita; o container não. Sem esta trava os
  // listeners delegados se acumulariam e cada clique dispararia várias vezes.
  if (!alvo.dataset.gradeLigada){
    alvo.dataset.gradeLigada = '1';
    alvo.addEventListener('click', e=>{
      const add = e.target.closest('.h-add');
      if (add){ guardarHorario(add.dataset.dia); return; }

      // O × fica dentro do chip, então vem antes na checagem.
      const x = e.target.closest('.chip-x');
      if (x){
        const dia = x.closest('.chip-h').dataset.dia;
        const hora = x.closest('.chip-h').dataset.hora;
        gradeH[dia] = (gradeH[dia] || []).filter(s=>s.hora !== hora);
        if (editandoH[dia] === hora) editarHorario(dia, hora);
        pintarDia(dia);
        return;
      }
      const chipH = e.target.closest('.chip-h');
      if (chipH){ editarHorario(chipH.dataset.dia, chipH.dataset.hora); return; }

      const lim = e.target.closest('.h-limpar');
      if (lim){ definirDia(lim.dataset.dia, []); return; }
      const chip = e.target.closest('#g-dias .chip');
      if (chip) chip.classList.toggle('sel');
    });

    // Enter no campo de horário adiciona, sem obrigar a mirar no botão.
    alvo.addEventListener('keydown', e=>{
      const campo = e.target.closest('.h-nova, .add-h .h-cap');
      if (campo && e.key === 'Enter'){ e.preventDefault(); guardarHorario(campo.dataset.dia); }
    });
  }

  // copiar a grade de outro dia
  alvo.querySelectorAll('.h-copiar-de').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const origem = sel.value; if (!origem) return;
      const destino = sel.dataset.dia;
      definirDia(destino, horariosDo(origem));
      sel.value = '';
      const nome = (DIAS.find(([k])=>k===origem)||[])[1] || origem;
      avisar(`Grade copiada de ${nome}.`, 'ok');
    });
  });

  // atalhos de seleção de dias
  document.getElementById('g-uteis').addEventListener('click', ()=>{
    document.querySelectorAll('#g-dias .chip').forEach(ch=>
      ch.classList.toggle('sel', ['seg','ter','qua','qui','sex'].includes(ch.dataset.dia)));
  });
  document.getElementById('g-nenhum').addEventListener('click', ()=>{
    document.querySelectorAll('#g-dias .chip').forEach(ch=>ch.classList.remove('sel'));
  });

  // gerar a grade
  document.getElementById('g-aplicar').addEventListener('click', ()=>{
    const inicio = document.getElementById('g-inicio').value;
    const fim    = document.getElementById('g-fim').value;
    const passo  = Number(document.getElementById('g-int').value);
    const cap    = document.getElementById('g-cap').value;
    const dias   = [...document.querySelectorAll('#g-dias .chip.sel')].map(ch=>ch.dataset.dia);

    if (!inicio || !fim) return avisar('Preencha o primeiro e o último horário.', 'erro');
    if (!(passo >= 5))   return avisar('O intervalo precisa ser de pelo menos 5 minutos.', 'erro');
    if (emMin(fim) < emMin(inicio)) return avisar('O último horário vem antes do primeiro.', 'erro');
    if (!dias.length)    return avisar('Marque pelo menos um dia.', 'erro');

    const horarios = [];
    for (let m = emMin(inicio); m <= emMin(fim); m += passo) horarios.push({ hora: emHora(m), capacidade: cap });
    if (horarios.length > 60) return avisar('Isso geraria mais de 60 horários por dia. Revise o intervalo.', 'erro');

    dias.forEach(d=>definirDia(d, horarios));
    avisar(`${horarios.length} horários em ${dias.length} ${dias.length===1?'dia':'dias'}. Não esqueça de salvar.`, 'ok');
  });

  contarTodos();
}

/* ============================== MENSAGENS ================================= */
/**
 * Modelos, disparo individual, disparo em massa e histórico.
 *
 * O DISPARO EM MASSA RODA AQUI, NO NAVEGADOR
 *   Uma chamada por aluno, com intervalo aleatório entre elas — o mesmo
 *   desenho do concierge. Você vê o log ao vivo e pode parar no meio. Em
 *   troca, a aba precisa ficar aberta: `msgMassa.rodando` bloqueia o redesenho
 *   e a troca de sub-aba enquanto o lote anda, porque remontar o HTML no meio
 *   apagaria a lista que está sendo percorrida.
 *
 *   Cada envio é gravado no servidor na hora. Se a aba fechar mesmo assim, o
 *   lote é retomável: reabrir com o mesmo número de lote traz de volta quem já
 *   recebeu, e essas pessoas entram desmarcadas.
 *
 *   O programado e o recorrente não passam por aqui — quem dispara é o
 *   agendador do servidor.
 */
const MSG_PAUSA_MIN = 7000;
const MSG_PAUSA_MAX = 18000;

const MSG_PUBLICOS = [['ausentes','Sumidos'],['devedores','Devendo treino'],
  ['mensalista','Mensalistas'],['todos','Todos os ativos'],['wellhub','Wellhub']];
const MSG_MODOS = [['manual','Manual — você dispara pela tela'],
  ['programado','Programado — uma data e hora'],
  ['recorrente','Recorrente — repete sempre']];
const MSG_GATILHOS = [['aniversario','No aniversário do aluno'],
  ['dia_do_mes','Todo mês, num dia fixo'],
  ['dia_da_semana','Toda semana, num dia fixo']];
const MSG_DIAS = [['0','Domingo'],['1','Segunda'],['2','Terça'],['3','Quarta'],
  ['4','Quinta'],['5','Sexta'],['6','Sábado']];

const msgEstado = { sub:'modelos', editando:null, publico:'todos', modeloId:'',
  alunoId:'', modelos:[], marcadores:[], alunos:[], resumo:null, lote:null };
const msgMassa = { rodando:false, abortar:false, timer:null, fila:[], i:0, ok:0, erro:0 };

function msgRotulo(lista, valor){
  const achou = lista.find(([v])=>String(v)===String(valor));
  return achou ? achou[1] : valor;
}

      <div class="subabas" id="sub-msg" role="tablist">
        <button data-sub="modelos" aria-selected="${msgEstado.sub==='modelos'}">Modelos</button>
        <button data-sub="individual" aria-selected="${msgEstado.sub==='individual'}">Um aluno</button>
        <button data-sub="massa" aria-selected="${msgEstado.sub==='massa'}">Em massa</button>
        <button data-sub="historico" aria-selected="${msgEstado.sub==='historico'}">Histórico</button>
      </div>
      <div data-painel="modelos" ${msgEstado.sub==='modelos'?'':'hidden'}
        id="msg-modelos">${msgPainelModelos()}</div>
      <div data-painel="individual" ${msgEstado.sub==='individual'?'':'hidden'}
        id="msg-individual"><div class="vazio">Carregando…</div></div>
      <div data-painel="massa" ${msgEstado.sub==='massa'?'':'hidden'}
        id="msg-massa"><div class="vazio">Carregando…</div></div>
      <div data-painel="historico" ${msgEstado.sub==='historico'?'':'hidden'}
        id="msg-hist"><div class="vazio">Carregando…</div></div>`;

    alvo.querySelector('#sub-msg').addEventListener('click', e=>{
      const b = e.target.closest('button[data-sub]'); if (!b) return;
      if (msgMassa.rodando) return avisar('Termine ou pare o disparo antes de sair.', 'erro');
      msgEstado.sub = b.dataset.sub; msgEstado.editando = null; gravarRota(); redesenhar();
    });

    alvo.addEventListener('click', msgCliques);

    if (msgEstado.sub === 'individual') await msgPainelIndividual();
    if (msgEstado.sub === 'massa') await msgPainelMassa();
    if (msgEstado.sub === 'historico') await msgPainelHistorico();
  }catch(e){
    alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`;
  }
}

/** Um só ouvinte para a aba inteira: o HTML é remontado o tempo todo. */
function msgCliques(e){
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.marcador) return msgInserirMarcador(b.dataset.marcador);
  if (b.id === 'mm-salvar') return msgSalvarModelo();
  if (b.id === 'mm-cancelar'){ msgEstado.editando = null; return redesenhar(); }
  if (b.dataset.editar){ msgEstado.editando = b.dataset.editar;
    document.getElementById('msg-modelos').innerHTML = msgPainelModelos();
    document.getElementById('msg-modelos').scrollIntoView({behavior:'smooth'}); return; }
  if (b.dataset.excluir) return msgExcluirModelo(b.dataset.excluir);
  if (b.id === 'mi-enviar') return msgEnviarIndividual();
  if (b.id === 'mx-disparar') return msgDispararMassa();
  if (b.id === 'mx-parar') return msgPararMassa();
  if (b.id === 'mx-todos') return msgMarcarTodos(true);
  if (b.id === 'mx-nenhum') return msgMarcarTodos(false);
}

/* ------------------------------- modelos --------------------------------- */

function msgResumoModelo(m){
  const quem = msgRotulo(MSG_PUBLICOS, m.publico);
  if (m.modo === 'manual') return `manual · ${quem}`;
  if (m.modo === 'programado'){
    const [d,h] = String(m.quando||'').split('T');
    return `programado · ${d ? d.split('-').reverse().join('/') : '?'} ${h||''} · ${quem}`
      + (m.ativo ? '' : ' · já saiu');
  }
  const quando = m.gatilho === 'aniversario' ? 'no aniversário'
    : m.gatilho === 'dia_do_mes' ? `todo dia ${m.diaDoMes} do mês`
    : `toda ${msgRotulo(MSG_DIAS, m.diaDaSemana).toLowerCase()}`;
  return `recorrente · ${quando} às ${m.hora} · ${quem}` + (m.ativo ? '' : ' · desligado');
}

function msgPainelModelos(){
  const m = msgEstado.editando
    ? (msgEstado.modelos.find(x=>x.id===msgEstado.editando) || {}) : {};
  const modo = m.modo || 'manual';
  const gatilho = m.gatilho || 'aniversario';

  return `
    <div class="ficha">
      <h3>${msgEstado.editando ? 'Editando: '+esc(m.nome) : 'Novo modelo'}</h3>
      <div class="dupla">
        <div class="campo"><label for="mm-nome">Nome</label>
          <input id="mm-nome" value="${esc(m.nome||'')}" placeholder="Ex: Cobrança de treino"></div>
        <div class="campo"><label for="mm-publico">Quem recebe</label>
          <select id="mm-publico">${MSG_PUBLICOS.map(([v,r])=>
            `<option value="${v}"${(m.publico||'todos')===v?' selected':''}>${r}</option>`).join('')}</select></div>
      </div>

      <div class="campo"><label for="mm-modo">Quando sai</label>
        <select id="mm-modo" onchange="msgAtualizarForm()">${MSG_MODOS.map(([v,r])=>
          `<option value="${v}"${modo===v?' selected':''}>${r}</option>`).join('')}</select>
        <p class="ajuda">Manual é você que dispara, pela sub-aba Em massa. Programado e
          recorrente saem sozinhos, pelo servidor — não precisa deixar o app aberto.</p></div>

      <div id="mm-programado" ${modo==='programado'?'':'hidden'}>
        <div class="campo"><label for="mm-quando">Data e hora do envio</label>
          <input id="mm-quando" type="datetime-local" value="${esc(m.quando||'')}">
          <p class="ajuda">Sai uma vez só e desliga sozinho. Se o serviço estiver fora do ar
            na hora marcada, ainda envia até 12 h depois; passou disso, não envia mais.</p></div>
      </div>

      <div id="mm-recorrente" ${modo==='recorrente'?'':'hidden'}>
        <div class="dupla">
          <div class="campo"><label for="mm-gatilho">Repetição</label>
            <select id="mm-gatilho" onchange="msgAtualizarForm()">${MSG_GATILHOS.map(([v,r])=>
              `<option value="${v}"${gatilho===v?' selected':''}>${r}</option>`).join('')}</select></div>
          <div class="campo"><label for="mm-hora">Hora</label>
            <input id="mm-hora" type="time" value="${esc(m.hora||'09:00')}"></div>
        </div>
        <div class="campo" id="mm-campo-dia-mes" ${gatilho==='dia_do_mes'?'':'hidden'}>
          <label for="mm-dia-mes">Dia do mês</label>
          <input id="mm-dia-mes" type="number" min="1" max="28" value="${m.diaDoMes||1}">
          <p class="ajuda">De 1 a 28: fevereiro não tem dia 30, e um envio mensal que pula
            um mês por ano é pior do que um que sai sempre.</p></div>
        <div class="campo" id="mm-campo-dia-semana" ${gatilho==='dia_da_semana'?'':'hidden'}>
          <label for="mm-dia-semana">Dia da semana</label>
          <select id="mm-dia-semana">${MSG_DIAS.map(([v,r])=>
            `<option value="${v}"${String(m.diaDaSemana||1)===v?' selected':''}>${r}</option>`).join('')}</select></div>
      </div>

      <div class="campo"><label for="mm-texto">Texto</label>
        <textarea id="mm-texto" rows="7"
          placeholder="Oi {{nome}}! Aqui é do TeamRausch…">${esc(m.texto||'')}</textarea>
        <p class="ajuda">Clique para inserir no ponto do cursor. Passe o mouse
          para ver o que cada um vira na mensagem do aluno:</p>
        <div class="chips-mat">${msgEstado.marcadores.map(x=>
          `<button class="chip" type="button" data-marcador="${x.chave}"
            title="${esc(x.descricao)}${x.exemplo?' · vira \''+esc(x.exemplo)+'\'':''}">{{${x.chave}}}</button>`).join('')}</div></div>

      <div class="campo"><label for="mm-ativo">Situação</label>
        <select id="mm-ativo"><option value="1"${m.ativo===false?'':' selected'}>Ligado</option>
          <option value="0"${m.ativo===false?' selected':''}>Desligado</option></select></div>

      <button class="acao" id="mm-salvar">${msgEstado.editando?'Salvar alterações':'Criar modelo'}</button>
      ${msgEstado.editando?'<button class="leve" id="mm-cancelar" style="width:100%;margin-top:10px">Cancelar edição</button>':''}

    ${msgEstado.modelos.length ? msgEstado.modelos.map(x=>`

        ${x.ultimoDisparoEm?`<p class="ajuda">Último disparo: ${new Date(x.ultimoDisparoEm).toLocaleString('pt-BR')}</p>`:''}
        <div class="dupla">
          <button class="leve" data-editar="${esc(x.id)}">Editar</button>
          <button class="leve" data-excluir="${esc(x.id)}">Excluir</button>
        </div>
      </div>`).join('') : '<div class="vazio">Nenhum modelo cadastrado ainda.</div>'}`;
}

function msgAtualizarForm(){
  const modo = document.getElementById('mm-modo').value;
  const gatilho = (document.getElementById('mm-gatilho')||{}).value || 'aniversario';
  document.getElementById('mm-programado').hidden = modo !== 'programado';
  document.getElementById('mm-recorrente').hidden = modo !== 'recorrente';
  const dm = document.getElementById('mm-campo-dia-mes');
  const ds = document.getElementById('mm-campo-dia-semana');
  if (dm) dm.hidden = gatilho !== 'dia_do_mes';
  if (ds) ds.hidden = gatilho !== 'dia_da_semana';
}

function msgInserirMarcador(chave){
  const ta = document.getElementById('mm-texto') || document.getElementById('mx-texto');
  if (!ta) return;
  const marca = '{{'+chave+'}}';
  const i = ta.selectionStart ?? ta.value.length;
  const j = ta.selectionEnd ?? ta.value.length;
  ta.value = ta.value.slice(0,i) + marca + ta.value.slice(j);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = i + marca.length;
}

async function msgSalvarModelo(){
  const v = id => (document.getElementById(id)||{}).value;
  const modo = v('mm-modo');
  const corpo = {
    nome: v('mm-nome'), texto: v('mm-texto'), modo,
    publico: v('mm-publico'), ativo: v('mm-ativo') === '1',
  };
  if (modo === 'programado') corpo.quando = v('mm-quando');
  if (modo === 'recorrente'){
    corpo.gatilho = v('mm-gatilho');
    corpo.hora = v('mm-hora');
    if (corpo.gatilho === 'dia_do_mes') corpo.diaDoMes = Number(v('mm-dia-mes'));
    if (corpo.gatilho === 'dia_da_semana') corpo.diaDaSemana = Number(v('mm-dia-semana'));
  }

  const btn = document.getElementById('mm-salvar');
  btn.disabled = true;
  try{
    if (msgEstado.editando){
      await api('/mensagens/modelos/'+msgEstado.editando, {method:'PUT', body:JSON.stringify(corpo)});
    } else {
      await api('/mensagens/modelos', {method:'POST', body:JSON.stringify(corpo)});
    }
    msgEstado.editando = null;
    avisar('Modelo salvo.');
    await redesenhar();
  }catch(e){
    avisar(e.message, 'erro');
    btn.disabled = false;
  }
}

async function msgExcluirModelo(id){
  const m = msgEstado.modelos.find(x=>x.id===id);
  if (!confirm(`Excluir o modelo "${m?m.nome:id}"?`)) return;
  try{
    await api('/mensagens/modelos/'+id, {method:'DELETE'});
    if (msgEstado.editando === id) msgEstado.editando = null;
    avisar('Modelo excluído.');
    await redesenhar();
  }catch(e){ avisar(e.message, 'erro'); }
}

/* ----------------------------- destinatários ----------------------------- */

/** Prévia por aluno vem do servidor: é o mesmo código que o envio usa. */
async function msgBuscarDestinatarios({ publico, texto, modeloId, lote }){
  const r = await api('/mensagens/destinatarios', {
    method:'POST',
    body: JSON.stringify({ publico, texto, modeloId, lote }),
  });
  msgEstado.alunos = r.alunos || [];
  msgEstado.resumo = r;
  return r;
}

  const alvo = document.getElementById('msg-individual');
  try{
    const r = await msgBuscarDestinatarios({ publico:'todos', modeloId: msgEstado.modeloId || null });
    const comTel = r.alunos.filter(a=>a.temTelefone);
    alvo.innerHTML = `
      <p class="ajuda">${comTel.length} aluno(s) ativos com telefone válido.
        ${r.semTelefone ? `<b>${r.semTelefone} sem telefone</b> não aparecem nesta lista.` : ''}</p>
      <div class="ficha">
        <div class="dupla">
          <div class="campo"><label for="mi-aluno">Aluno</label>
            <select id="mi-aluno" onchange="msgTrocarIndividual()">
              <option value="">Escolha o aluno…</option>
              ${comTel.map(a=>`<option value="${esc(a.matriculaId)}"${
                msgEstado.alunoId===a.matriculaId?' selected':''}>${esc(a.nome)}</option>`).join('')}
            </select></div>
          <div class="campo"><label for="mi-modelo">Modelo</label>
            <select id="mi-modelo" onchange="msgTrocarModeloIndividual()">
              <option value="">Escrever na hora…</option>
              ${msgEstado.modelos.map(m=>`<option value="${esc(m.id)}"${

            </select></div>
        </div>
        <div class="campo"><label for="mi-texto">Mensagem</label>
          <textarea id="mi-texto" rows="8" placeholder="Escolha um modelo ou escreva aqui…"></textarea>
          <p class="ajuda" id="mi-destino">Escolha o aluno para ver o número.</p></div>
        <button class="acao" id="mi-enviar">Enviar no WhatsApp</button>
      </div>`;
    msgTrocarIndividual();
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

function msgTrocarIndividual(){
  const sel = document.getElementById('mi-aluno');
  msgEstado.alunoId = sel ? sel.value : '';
  const a = msgEstado.alunos.find(x=>x.matriculaId===msgEstado.alunoId);
  const info = document.getElementById('mi-destino');
  const ta = document.getElementById('mi-texto');
  if (info) info.textContent = a
    ? `Vai para ${a.nome} — ${a.telefoneFormatado}` + (a.motivo ? ` · ${a.motivo}` : '')
    : 'Escolha o aluno para ver o número.';
  // Prévia só existe quando há modelo escolhido; texto escrito na hora fica
  // como está para não apagar o que a pessoa digitou.
  if (ta && a && a.previa !== null && msgEstado.modeloId) ta.value = a.previa;
}

async function msgTrocarModeloIndividual(){
  msgEstado.modeloId = document.getElementById('mi-modelo').value;
  await msgPainelIndividual();
}

async function msgEnviarIndividual(){
  const a = msgEstado.alunos.find(x=>x.matriculaId===msgEstado.alunoId);
  const texto = (document.getElementById('mi-texto').value||'').trim();
  if (!a) return avisar('Escolha o aluno.', 'erro');
  if (!texto) return avisar('A mensagem está vazia.', 'erro');
  if (!confirm(`Enviar para ${a.nome} (${a.telefoneFormatado})?`)) return;

  const btn = document.getElementById('mi-enviar');
  btn.disabled = true; btn.textContent = 'Enviando…';
  try{
    const modelo = msgEstado.modelos.find(m=>m.id===msgEstado.modeloId);
    await api('/mensagens/enviar', {method:'POST', body: JSON.stringify({
      matriculaId: a.matriculaId, texto, origem:'manual',
      modeloId: modelo?modelo.id:null, modeloNome: modelo?modelo.nome:null,
    })});
    avisar('Mensagem enviada.');
    document.getElementById('mi-texto').value = '';
  }catch(e){ avisar(e.message, 'erro'); }
  finally{ btn.disabled = false; btn.textContent = 'Enviar no WhatsApp'; }
}

          <div class="chips-mat">${msgEstado.marcadores.map(x=>

      </div>

      <div class="ficha">

              <em id="mx-st-${esc(a.matriculaId)}">${
                !a.temTelefone ? 'sem telefone' : a.jaEnviado ? 'já recebeu' : ''}</em>

async function msgTrocarModeloMassa(){
  msgEstado.modeloId = document.getElementById('mx-modelo').value;
  const ta = document.getElementById('mx-texto');
  const m = msgEstado.modelos.find(x=>x.id===msgEstado.modeloId);
  if (ta) ta.value = m ? m.texto : '';
  await msgPainelMassa();
}

async function msgTrocarPublicoMassa(){
  msgEstado.publico = document.getElementById('mx-publico').value;
  await msgPainelMassa();
}

function msgMarcarTodos(marcar){
  document.querySelectorAll('#mx-lista .mx-chk:not(:disabled)')
    .forEach(c => { c.checked = !!marcar; });
  msgContar();
}

function msgContar(){
  const n = document.querySelectorAll('#mx-lista .mx-chk:checked').length;
  const el = document.getElementById('mx-contagem');
  if (el) el.textContent = `${n} marcado(s) para envio`;
}

function msgLog(texto, cor){
  const el = document.getElementById('mx-log'); if (!el) return;
  const d = document.createElement('div');
  if (cor) d.style.color = cor;
  d.textContent = texto;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function msgPausa(){
  return MSG_PAUSA_MIN + Math.floor(Math.random() * (MSG_PAUSA_MAX - MSG_PAUSA_MIN + 1));
}

function msgDispararMassa(){
  if (msgMassa.rodando) return;
  const texto = (document.getElementById('mx-texto').value||'').trim();
  if (!texto) return avisar('A mensagem está vazia.', 'erro');

  const marcados = Array.from(document.querySelectorAll('#mx-lista .mx-chk:checked'))
    .map(c => msgEstado.alunos.find(a => a.matriculaId === c.value))
    .filter(a => a && a.temTelefone);
  if (!marcados.length) return avisar('Ninguém marcado.', 'erro');

  const minutos = Math.ceil(marcados.length * ((MSG_PAUSA_MIN + MSG_PAUSA_MAX)/2) / 60000);
  if (!confirm(`Enviar para ${marcados.length} aluno(s)?\n\n`
    + `O envio é um de cada vez, com intervalo de ${MSG_PAUSA_MIN/1000} a ${MSG_PAUSA_MAX/1000} `
    + `segundos — cerca de ${minutos} min no total.\n\n`
    + 'Mantenha esta aba aberta até o fim.')) return;

  msgMassa.rodando = true; msgMassa.abortar = false;
  msgMassa.fila = marcados; msgMassa.i = 0; msgMassa.ok = 0; msgMassa.erro = 0;
  // O lote é o que permite retomar depois: o servidor registra cada envio com
  // ele, e reabrir a tela com o mesmo lote traz de volta quem já recebeu.
  msgEstado.lote = 'LOTE-' + Date.now().toString(36);

  document.getElementById('mx-disparar').disabled = true;
  document.getElementById('mx-parar').style.display = '';
  document.getElementById('mx-log').innerHTML = '';
  msgLog('Lote ' + msgEstado.lote, 'var(--fraco)');

  msgEnviarProximo(texto);
}

async function msgEnviarProximo(texto){
  const prog = document.getElementById('mx-progresso');
  if (msgMassa.abortar || msgMassa.i >= msgMassa.fila.length) return msgFinalizarMassa();

  const a = msgMassa.fila[msgMassa.i];
  const st = document.getElementById('mx-st-'+a.matriculaId);
  if (prog) prog.textContent = `Enviando ${msgMassa.i+1} de ${msgMassa.fila.length} — ${a.nome}`;
  if (st) st.textContent = 'enviando…';

  const modelo = msgEstado.modelos.find(m=>m.id===msgEstado.modeloId);
  try{
    await api('/mensagens/enviar', {method:'POST', body: JSON.stringify({
      matriculaId: a.matriculaId,
      texto: a.previa || texto,
      origem: 'massa', lote: msgEstado.lote,
      modeloId: modelo?modelo.id:null, modeloNome: modelo?modelo.nome:null,
    })});
    msgMassa.ok++;
    if (st) st.textContent = 'enviada';
    msgLog('✓ ' + a.nome);
  }catch(e){
    msgMassa.erro++;
    if (st) st.textContent = 'falhou';
    msgLog('✕ ' + a.nome + ' — ' + e.message, 'var(--vermelho)');
  }

  msgMassa.i++;
  if (msgMassa.abortar || msgMassa.i >= msgMassa.fila.length) return msgFinalizarMassa();

  const espera = msgPausa();
  if (prog) prog.textContent = `Aguardando ${Math.round(espera/1000)}s — `
    + `próximo: ${msgMassa.fila[msgMassa.i].nome} (${msgMassa.i+1} de ${msgMassa.fila.length})`;
  msgMassa.timer = setTimeout(()=>msgEnviarProximo(texto), espera);
}

function msgFinalizarMassa(){
  clearTimeout(msgMassa.timer);
  msgMassa.rodando = false;
  const btn = document.getElementById('mx-disparar');
  if (btn) btn.disabled = false;
  const parar = document.getElementById('mx-parar');
  if (parar) parar.style.display = 'none';
  const falta = msgMassa.fila.length - msgMassa.i;
  const txt = (msgMassa.abortar ? 'Interrompido — ' : 'Concluído — ')
    + `${msgMassa.ok} enviada(s), ${msgMassa.erro} com erro`
    + (falta > 0 ? `, ${falta} não enviada(s)` : '');
  const prog = document.getElementById('mx-progresso');
  if (prog) prog.textContent = txt;
  msgLog('──────────', 'var(--fraco)');
  msgLog(txt);
  if (falta > 0) msgLog('Para retomar, dispare de novo: quem já recebeu volta desmarcado.', 'var(--fraco)');
  avisar(msgMassa.abortar ? 'Disparo interrompido.' : 'Disparo concluído.');
}

function msgPararMassa(){
  if (!msgMassa.rodando) return;
  msgMassa.abortar = true;
  clearTimeout(msgMassa.timer);
  const prog = document.getElementById('mx-progresso');
  if (prog) prog.textContent = 'Parando depois da mensagem atual…';
}

/**
 * Mostra em que pé está a conexão do número e, quando houver QR, desenha ele
 * aqui mesmo — sem abrir o serviço de WhatsApp, que não tem endereço público.
 *
 * O QR do WhatsApp vira pó em poucos segundos, então a consulta se repete
 * sozinha enquanto a tela estiver aberta e o número, desconectado. Ao sair da
 * aba de configurações o painel é remontado e o timer antigo morre junto.
 */
let timerWpp = null;
function ligarConexaoWhatsApp(){
  const estado = document.getElementById('c-wpp-estado');
  const caixaQr = document.getElementById('c-wpp-qr');
  const img = document.getElementById('c-wpp-img');
  const botao = document.getElementById('c-wpp-botao');
  if (!estado) return;

  if (timerWpp) { clearInterval(timerWpp); timerWpp = null; }

  const consultar = async ()=>{
    // A tela foi remontada por baixo: para de bater no servidor.
    if (!document.body.contains(estado)){
      if (timerWpp) { clearInterval(timerWpp); timerWpp = null; }
      return;
    }
    try{
      const r = await api('/admin/whatsapp/qr');
      if (r.situacao === 'conectado'){
        estado.innerHTML = 'Conectado ao número <b>' + esc(r.numero || '—') + '</b>.';
        caixaQr.hidden = true;
        if (timerWpp) { clearInterval(timerWpp); timerWpp = null; }
        return;
      }
      if (r.imagem){
        estado.textContent = 'Número desconectado. Leia o código abaixo — ele troca a cada poucos segundos.';
        img.src = r.imagem;
        caixaQr.hidden = false;
        return;
      }
      estado.textContent = r.situacao === 'iniciando'
        ? 'O serviço está subindo. O código aparece em instantes.'
        : 'Sem código no momento. Aguarde alguns segundos.';
      caixaQr.hidden = true;
    }catch(e){
      estado.textContent = 'Não consegui consultar: ' + e.message;
      caixaQr.hidden = true;
      if (timerWpp) { clearInterval(timerWpp); timerWpp = null; }
    }
  };

  botao.addEventListener('click', ()=>{
    if (timerWpp) { clearInterval(timerWpp); }
    estado.textContent = 'Consultando…';
    consultar();
    timerWpp = setInterval(consultar, 8000);
  });

  consultar();
  timerWpp = setInterval(consultar, 8000);
}

/**
 * Preenche o seletor com os grupos de que o número do estúdio participa.
 *
 * O serviço de WhatsApp mora na rede interna do Railway e não abre no
 * navegador — sem isto, descobrir o ID de um grupo vira caça ao tesouro.
 */
function ligarBuscaDeGrupos(){
  const botao = document.getElementById('c-buscar-grupos');
  const lista = document.getElementById('c-lista-grupos');
  const nota  = document.getElementById('c-grupos-aviso');
  const campo = document.getElementById('c-aviso-grupos');
  if (!botao) return;

  botao.addEventListener('click', async ()=>{
    botao.disabled = true; botao.textContent = 'Buscando…'; nota.textContent = '';
    try{
      const r = await api('/admin/whatsapp/grupos');
      const grupos = r.grupos || [];
      if (!grupos.length){
        nota.textContent = 'O número do estúdio não participa de nenhum grupo.';
        lista.hidden = true;
      } else {
        lista.innerHTML = '<option value="">Escolha um grupo para adicionar…</option>' +
          grupos.map(g=>`<option value="${esc(g.id)}">${esc(g.nome)} (${g.participantes})</option>`).join('');
        lista.hidden = false;
        nota.textContent = `${grupos.length} grupo(s) encontrado(s).`;
      }
    }catch(e){ nota.textContent = 'Não consegui buscar: ' + e.message; }
    finally{ botao.disabled = false; botao.textContent = 'Buscar grupos'; }
  });

  lista.addEventListener('change', ()=>{
    const id = lista.value;
    if (!id) return;
    const atuais = campo.value.split(',').map(s=>s.trim()).filter(Boolean);
    if (!atuais.includes(id)) atuais.push(id);
    campo.value = atuais.join(', ');
    lista.value = '';
    nota.textContent = 'Grupo adicionado. Salve as configurações para valer.';
  });
}

async function salvarConfig(){
  const v = id => document.getElementById(id).value.trim();
  const n = id => Number(document.getElementById(id).value);
  // Sai do modelo, já ordenado. Um horário deixado nos campos de baixo sem
  // clicar em Adicionar não entra — o que está na tela como chip é o que vale.
  const horarios = {};
  DIAS.forEach(([k])=>{ horarios[k] = ordenarH(gradeH[k] || []); });

  const conquistas = [...document.querySelectorAll('#lista-conquistas .linha-c')]
    .map(l=>({
      aulas: Number(l.querySelector('.c-aulas').value),
      emoji: l.querySelector('.c-emoji').value,
      titulo: l.querySelector('.c-titulo').value,
    }))
    .filter(m=>m.aulas > 0 && m.titulo.trim());

  const corpo = {
    conquistas,
    estudio: {
      nome: v('c-nome'), fuso: v('c-fuso'), recado: v('c-recado'),
      alerta: v('c-alerta'), alertaAte: v('c-alerta-ate'),
    },
    agenda: {
      diasAntecedencia: n('c-antec'), capacidadePadrao: n('c-cap'),
      minutosAntesDeFechar: n('c-fechar'), limitePorDia: n('c-limite'),
      permitirCancelar: v('c-permcanc') === '1', minutosParaCancelar: n('c-mincanc'),
      datasBloqueadas: v('c-bloq').split(',').map(s=>s.trim()).filter(Boolean),
      horarios,
    },
    acesso: {
      diasDeSessao: n('c-sessao'), canalDoCodigo: v('c-canal'),
      minutosDeValidadeDoCodigo: n('c-valcod'), maxPedidosPorHora: n('c-maxped'),
      cadastroAberto: v('c-aberto') === '1',
    },
    envio: {
      url: v('c-url'), nomeDoCabecalhoDoToken: v('c-cabec'),
      corpo: v('c-corpo'), texto: v('c-texto'),
    },
    financeiro: {
      valorFuncional: n('c-val-func'),
      valorCrosstraining: n('c-val-cross'),
    },
    avisos: {
      checkinConfirmado: v('c-aviso-ligado') === '1',
      emails: v('c-aviso-emails').split(',').map(s=>s.trim()).filter(Boolean),
      telefones: v('c-aviso-tels').split(',').map(s=>s.trim()).filter(Boolean),
      grupos: v('c-aviso-grupos').split(',').map(s=>s.trim()).filter(Boolean),
    },
    administradores: v('c-admins').split(',').map(s=>s.trim()).filter(Boolean),
  };
  if (v('c-token')) corpo.envio.token = v('c-token');

  // Senha em branco = mantém a atual. Só vai ao servidor quando muda.
  const removerSenha = document.getElementById('c-remover-senha');
  if (removerSenha && removerSenha.checked) corpo.novaSenhaAdmin = '';
  else if (v('c-senha')) corpo.novaSenhaAdmin = v('c-senha');

  const b = document.getElementById('btn-salvar');
  b.disabled = true; b.textContent = 'Salvando…';
  try{
    await api('/admin/config', {method:'PUT', body:JSON.stringify(corpo)});
    avisar('Configurações salvas.', 'ok');
    // Quem escreveu o aviso acabou de lê-lo. Marcar como visto aqui evita que
    // o popup pule na cara logo após salvar — e, principalmente, evita que o
    // administrador o dispense sem querer antes dos alunos verem.
    if (corpo.estudio.alerta) marcarAlertaComoVisto(corpo.estudio.alerta);
    // Salvar não pode jogar o administrador para o topo da página: guarda a
    // rolagem e devolve depois que a tela termina de ser remontada.
    const y = window.scrollY;
    await comecar(true);
    requestAnimationFrame(()=>window.scrollTo(0, y));
  }catch(e){ avisar(e.message, 'erro'); }
  finally{ b.disabled = false; b.textContent = 'Salvar configurações'; }
}

async function comecar(manterAba, usarRota){
  try{
    const r = await api('/auth/eu');
    // Descarta o que estiver na tela antes de mostrar a conta nova.
    if (!manterAba) limparTela();
    eu = r.aluno;
    document.getElementById('tela-login').hidden = true;
    document.getElementById('tela-app').hidden = false;
    document.getElementById('nome-estudio').textContent = r.config.estudio.nome;
    document.getElementById('quem-sou').textContent = eu.nome || eu.telefone;
    document.querySelectorAll('.so-admin').forEach(b=>{ b.hidden = !eu.admin; });

    // Só o boot lê a URL. Depois de um login a rota que estiver ali é da conta
    // anterior, e mandar a pessoa nova para a aba de quem saiu seria errado —
    // `abrirAba` reescreve o endereço logo em seguida.
    let destino = manterAba ? abaAtiva : 'agendar';
    if (usarRota) {
      const rota = lerRota();
      // `abaPermitida` já barra aba de admin para quem não é, e `abrirAba`
      // devolve para 'agendar' de qualquer jeito. A checagem aqui evita
      // aplicar a sub-aba de uma aba que a pessoa não vai abrir.
      if (rota.aba && abaPermitida(rota.aba)) {
        destino = rota.aba;
        // Sub-aba inventada na URL fica de fora: um valor solto esconderia
        // todos os painéis e a aba abriria em branco.
        if (rota.sub && (SUBS[destino] || []).includes(rota.sub)) {
          if (destino === 'matriculas') matEstado.sub = rota.sub;
          if (destino === 'config') subConfig = rota.sub;
        }
      }
    }
    await abrirAba(destino);
  }catch{
    document.getElementById('tela-login').hidden = false;
    document.getElementById('tela-app').hidden = true;
  }
}
