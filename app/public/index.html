<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Rausch Studio — Agendamento</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="theme-color" content="#16171a">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── Paleta Team Rausch ──────────────────────────────────────────────────
     Vermelho, preto e amarelo do logo, sobre base clara para leitura no sol
     e em telas de celular baratas. Estrutura (raios, pesos, espaçamentos)
     segue as convenções do painel CDV.                                     */
  :root{
    --preto:#16171a;--preto-2:#25272c;
    --vermelho:#e01f26;--vermelho-esc:#b8161c;--vermelho-dim:rgba(224,31,38,.10);
    --amarelo:#f5c518;--amarelo-esc:#8a6d00;--amarelo-dim:rgba(245,197,24,.16);

    --bg:#f3f3f5;--surface:#ffffff;--card:#fafafa;--card-deep:#eeeef1;
    --border:#e3e3e8;--border-ctrl:#c9cad1;
    --text:#16171a;--muted:#5f6169;--muted2:#9a9ca4;

    --accent:var(--vermelho);--accent2:var(--vermelho-esc);
    --meu:var(--amarelo-esc);--cheio:var(--vermelho);
    --raio:10px;--raio-card:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* A barra de rolagem some quando a aba é curta e volta quando é longa. Cada
     ida e volta reserva ou devolve ~15px e empurra tudo que é centralizado.
     Reservando o espaço sempre, nada se mexe ao trocar de aba. */
  html{scrollbar-gutter:stable;overflow-y:scroll}
  body{background:var(--bg);color:var(--text);
    font:400 15px/1.55 'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .env{max-width:680px;margin:0 auto;padding:0 18px 90px;min-height:70vh}
  [hidden]{display:none!important}

  /* Cabeçalho preto com faixa vermelha — a leitura do logo */
  header{background:var(--preto);border-bottom:3px solid var(--vermelho);position:sticky;top:0;z-index:100;
    box-shadow:0 2px 10px rgba(22,23,26,.18)}
  .cab{max-width:680px;margin:0 auto;padding:12px 18px 0;display:flex;
    justify-content:space-between;align-items:center;gap:12px;min-height:34px}
  .cab h1{font-size:17px;font-weight:800;letter-spacing:.01em;color:var(--amarelo);text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cab small{font-size:12px;font-weight:500;color:rgba(255,255,255,.62);
    white-space:nowrap;flex-shrink:0}
  /* Altura fixa: a imagem carrega depois do HTML e, sem reservar o espaço,
     o cabeçalho pularia ao aparecer. */
  .cab .logo-topo{height:30px;width:auto;flex-shrink:0;display:block;align-self:center}
  .cab .eu{display:flex;align-items:baseline;gap:10px;flex-shrink:0}
  .cab .eu button{background:transparent;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.78);
    border-radius:7px;padding:4px 10px;cursor:pointer;font:700 10.5px 'Montserrat',sans-serif;
    letter-spacing:.06em;text-transform:uppercase;transition:all .15s}
  .cab .eu button:hover{border-color:var(--vermelho);background:var(--vermelho);color:#fff}
  nav{max-width:680px;margin:0 auto;padding:10px 18px;display:flex;gap:4px;overflow-x:auto;
    scrollbar-width:none;min-height:56px;align-items:center}
  nav::-webkit-scrollbar{display:none}
  nav button{background:transparent;border:1px solid transparent;border-radius:var(--raio);cursor:pointer;
    padding:9px 15px;font:700 12.5px 'Montserrat',sans-serif;color:rgba(255,255,255,.66);
    white-space:nowrap;flex-shrink:0;transition:color .15s,background .15s}
  nav button[aria-selected=false]:hover{color:#fff;background:rgba(255,255,255,.09)}
  nav button[aria-selected=true]{background:var(--vermelho);color:#fff}

  h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:24px 0 4px}
  h3{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:var(--text);margin:26px 0 10px;padding-left:10px;border-left:3px solid var(--amarelo)}
  p.ajuda{font-size:12.5px;color:var(--muted);margin-bottom:12px}

  label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--border-ctrl);
    border-radius:var(--raio);background:var(--card);
    font:400 14px 'Montserrat',sans-serif;color:var(--text);outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--vermelho)}
  input::placeholder,textarea::placeholder{color:var(--muted2)}
  select{cursor:pointer}
  .campo{margin-bottom:14px}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  button.acao{width:100%;padding:13px;border:none;border-radius:var(--raio);background:var(--vermelho);
    color:#fff;font:800 14.5px 'Montserrat',sans-serif;letter-spacing:.02em;text-transform:uppercase;
    cursor:pointer;transition:background .15s}
  button.acao:hover{background:var(--vermelho-esc)}
  button.acao[disabled]{opacity:.45;cursor:not-allowed}
  button.leve{background:transparent;border:1px solid var(--border-ctrl);color:var(--muted);
    padding:8px 13px;border-radius:8px;cursor:pointer;
    font:700 11.5px 'Montserrat',sans-serif;transition:border-color .15s,color .15s,background .15s}
  button.leve:hover{border-color:var(--vermelho);color:var(--vermelho);background:var(--vermelho-dim)}
  button:focus-visible{outline:2px solid var(--vermelho);outline-offset:2px}

  /* Horário: as vagas viram marcas — dá pra ver a lotação sem ler número */
  .slot{background:var(--surface);border:1px solid var(--border);border-radius:var(--raio-card);
    padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;
    transition:border-color .15s}
  .slot:hover{border-color:var(--border-ctrl)}
  .slot .hora{font-size:19px;font-weight:800;letter-spacing:-.02em;min-width:62px;color:var(--text)}
  .slot .vagas{flex:1;min-width:0}
  .marcas{display:flex;gap:3px;margin-bottom:5px;flex-wrap:wrap}
  .marcas i{width:11px;height:11px;border:1px solid var(--border-ctrl);border-radius:2px;background:var(--card)}
  .marcas i.ocupada{background:var(--preto);border-color:var(--preto)}
  .slot .conta{font-size:11.5px;font-weight:500;color:var(--muted)}
  /* O seu horário é o único em amarelo — acha de relance na lista */
  .slot.meu{border-color:var(--amarelo);border-left:4px solid var(--amarelo);background:#fffdf4}
  .slot.meu .marcas i.ocupada{background:var(--amarelo);border-color:#d9ad10}
  .slot.indisponivel{opacity:.55}
  .slot .selo{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap}
  .slot .selo.meu{color:var(--amarelo-esc)}
  .slot .selo.cheio{color:var(--vermelho)}

  .dia{margin-bottom:26px}
  .dia .titulo{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
  .dia .titulo b{font-size:17px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
  .dia .titulo span{font-size:12px;font-weight:500;color:var(--muted)}

  .recado{background:var(--preto);color:#fff;padding:13px 16px;border-radius:var(--raio-card);
    font-size:13.5px;font-weight:500;margin:20px 0;border-left:4px solid var(--amarelo)}
  .vazio{padding:32px 0;color:var(--muted);font-size:13.5px;text-align:center}

  .fila{background:var(--surface);border:1px solid var(--border);border-radius:var(--raio-card);
    padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
  .fila .quem{flex:1;min-width:0}
  .fila .quem b{font-size:15px;font-weight:700;display:block}
  .fila .quem small{font-size:12px;font-weight:500;color:var(--muted)}

  /* ---- ficha editável (meus dados e aba Alunos) ---- */
  .ficha{background:var(--surface);border:1px solid var(--border);border-radius:var(--raio-card);
    padding:14px 16px;margin-bottom:10px}
  .ficha .cabeca{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-bottom:2px;flex-wrap:wrap}
  .ficha .cabeca b{font-size:15px;font-weight:700}
  .ficha .cabeca .tags{font-size:11.5px;font-weight:600;color:var(--muted2)}
  .ficha .campos{display:grid;grid-template-columns:1fr 148px 96px;gap:8px;margin-top:10px}
  .ficha .campos input{padding:9px 11px;font-size:13.5px}
  .ficha .rodape{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
  .ficha.mudou{border-color:var(--amarelo)}
  @media (max-width:560px){ .ficha .campos{grid-template-columns:1fr} }

  /* ---- subabas de configurações ---- */
  .subabas{display:flex;gap:6px;margin:16px 0 22px;border-bottom:1px solid var(--border);padding-bottom:0}
  .subabas button{background:transparent;border:none;border-bottom:3px solid transparent;
    padding:10px 14px;cursor:pointer;font:800 12px 'Montserrat',sans-serif;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted);transition:color .15s,border-color .15s}
  .subabas button:hover[aria-selected=false]{color:var(--text)}
  .subabas button[aria-selected=true]{color:var(--vermelho);border-bottom-color:var(--vermelho)}
  .painel-config h3:first-of-type{margin-top:4px}

  .nota{background:var(--card-deep);border:1px solid var(--border);border-left:3px solid var(--amarelo);
    border-radius:8px;padding:11px 14px;font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .nota b{color:var(--text);font-weight:700}

  /* ---- grade de horários (configurações) ---- */
  .gerador{background:var(--card-deep);border:1px solid var(--border);border-radius:var(--raio-card);
    padding:16px;margin-bottom:22px;border-top:3px solid var(--amarelo)}
  .gerador h4{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--text);margin-bottom:12px}
  .gerador .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .gerador input{background:var(--surface)}
  .dias-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:var(--surface);border:1px solid var(--border-ctrl);border-radius:8px;
    padding:7px 12px;cursor:pointer;font:700 11.5px 'Montserrat',sans-serif;color:var(--muted);
    user-select:none;transition:all .15s}
  .chip:hover{border-color:var(--vermelho)}
  .chip.sel{border-color:var(--vermelho);color:#fff;background:var(--vermelho)}
  .gerador .botoes{display:flex;gap:8px;flex-wrap:wrap}

  .dia-bloco{background:var(--surface);border:1px solid var(--border);border-radius:var(--raio-card);
    padding:14px 16px;margin-bottom:12px}
  .dia-bloco .topo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .dia-bloco .topo label{margin:0;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--text)}
  .dia-bloco .topo .contagem{font-size:11.5px;font-weight:600;color:var(--muted2);text-transform:none;letter-spacing:0}
  .dia-bloco .acoes{display:flex;gap:6px;flex-wrap:wrap}
  .dia-bloco .acoes button{padding:6px 10px;font-size:11px}
  .dia-bloco .acoes select{width:auto;padding:6px 10px;font-size:11.5px;font-weight:600;border-radius:8px}
  .linha-h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .linha-h input[type=time]{width:108px;padding:8px 10px;font-weight:600}
  .linha-h input[type=number]{width:92px;padding:8px 10px}
  .linha-h button{padding:8px 11px;font-size:11px}

  .aviso{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:300;
    background:var(--preto);color:#fff;padding:13px 20px;border-radius:var(--raio);
    font:600 13.5px 'Montserrat',sans-serif;max-width:calc(100% - 36px);
    box-shadow:0 6px 24px rgba(22,23,26,.28)}
  .aviso.ok{background:var(--preto);border-left:4px solid var(--amarelo)}
  .aviso.erro{background:var(--vermelho)}

  /* login */
  .entrada{max-width:400px;margin:0 auto;padding:56px 18px}
  .entrada .logo-login{display:block;width:180px;max-width:60%;height:auto;margin:0 auto 22px}
  .entrada .sub{text-align:center}
  .entrada .marca{font-size:27px;font-weight:800;letter-spacing:.01em;margin-bottom:6px;
    text-transform:uppercase;line-height:1.1}
  .entrada .marca::after{content:'';display:block;width:52px;height:4px;background:var(--vermelho);
    border-radius:2px;margin-top:9px}
  .entrada .sub{color:var(--muted);font-size:13.5px;margin-bottom:28px}
  .codigo{font-size:26px;font-weight:800;letter-spacing:.22em;text-align:center;padding:15px}
  .voltar{display:block;margin:16px auto 0;background:none;border:none;color:var(--muted);
    font:500 13px 'Montserrat',sans-serif;text-decoration:underline;cursor:pointer}

  @media (max-width:560px){
    .dupla{grid-template-columns:1fr}
    .gerador .grid{grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<section id="tela-login" class="entrada">
  <img src="/logo.png" alt="Team Rausch Studio" class="logo-login">
  <div class="marca" id="marca-login" hidden>Agendamento</div>
  <div class="sub" id="sub-login">Entre com seu telefone para reservar seu horário.</div>

  <div id="passo-telefone">
    <div class="campo">
      <label for="in-telefone">Telefone com DDD</label>
      <input id="in-telefone" type="tel" inputmode="numeric" placeholder="(31) 98888-7777" autocomplete="tel">
    </div>
    <button class="acao" id="btn-codigo">Receber código</button>
  </div>

  <div id="passo-codigo" hidden>
    <div class="campo" id="campo-codigo">
      <label for="in-codigo">Código recebido</label>
      <input id="in-codigo" class="codigo" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
    </div>
    <div class="campo" id="campo-senha" hidden>
      <label for="in-senha">Senha de administrador</label>
      <input id="in-senha" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="campo" id="campo-nome" hidden>
      <label for="in-nome">Como você quer ser chamado</label>
      <input id="in-nome" type="text" placeholder="Seu nome ou apelido" autocomplete="name">
    </div>
    <div class="campo" id="campo-aniversario" hidden>
      <label for="in-aniversario">Seu aniversário</label>
      <input id="in-aniversario" type="text" inputmode="numeric" maxlength="5"
             placeholder="dia/mês — ex: 07/03" autocomplete="off">
      <p class="ajuda" style="margin:6px 0 0">Só o dia e o mês. Não pedimos o ano.</p>
    </div>
    <button class="acao" id="btn-entrar">Entrar</button>
    <button class="voltar" id="btn-voltar">Usar outro telefone</button>
  </div>
</section>

<!-- ======================= APP ======================= -->
<div id="tela-app" hidden>
  <header>
    <div class="cab">
      <img src="/logo.png" alt="" class="logo-topo" aria-hidden="true">
      <h1 id="nome-estudio">Agendamento</h1>
      <div class="eu">
        <small id="quem-sou"></small>
        <button id="btn-sair-topo" type="button">Sair</button>
      </div>
    </div>
    <nav id="abas" role="tablist">
      <button data-aba="agendar" aria-selected="true">Agendar</button>
      <button data-aba="meus" aria-selected="false">Meus horários</button>
      <button data-aba="dia" aria-selected="false" class="so-admin" hidden>Lista do dia</button>
      <button data-aba="alunos" aria-selected="false" class="so-admin" hidden>Alunos</button>
      <button data-aba="config" aria-selected="false" class="so-admin" hidden>Configurações</button>
    </nav>
  </header>

  <div class="env">
    <section id="aba-agendar"></section>
    <section id="aba-meus" hidden></section>
    <section id="aba-dia" hidden></section>
    <section id="aba-alunos" hidden></section>
    <section id="aba-config" hidden></section>
  </div>
</div>

<script>
/* --------------------------- infraestrutura ---------------------------- */
const cofre = {
  _m:null,
  get(){ try{ return localStorage.getItem('agenda-token') }catch{ return this._m } },
  set(v){ this._m=v; try{ v ? localStorage.setItem('agenda-token',v) : localStorage.removeItem('agenda-token') }catch{} }
};

let eu = null, configAtual = null, abaAtiva = 'agendar';
let semCodigo = false;   // canal aberto: entra só com o telefone
let porSenha  = false;   // administrador com senha definida

async function api(caminho, opcoes={}){
  const cab = {'Content-Type':'application/json'};
  const t = cofre.get(); if (t) cab.Authorization = 'Bearer '+t;
  const r = await fetch('/agenda-api'+caminho, {...opcoes, headers:cab});
  const corpo = await r.json().catch(()=>({}));
  if (r.status === 401 && eu){ sair(true); throw new Error('Sua sessão venceu. Entre de novo.'); }
  if (!r.ok) throw new Error(corpo.erro || 'Não consegui completar a ação.');
  return corpo;
}

function avisar(texto, tipo){
  document.querySelector('.aviso')?.remove();
  const d = document.createElement('div');
  d.className = 'aviso'+(tipo?' '+tipo:''); d.setAttribute('role','status'); d.textContent = texto;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 4200);
}

function esc(t){ return String(t??'').replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

/* ------------------------------ login ---------------------------------- */
const inTelefone = document.getElementById('in-telefone');

inTelefone.addEventListener('input', e=>{
  const n = e.target.value.replace(/\D/g,'').slice(0,11);
  e.target.value = n.length > 7 ? `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`
    : n.length > 2 ? `(${n.slice(0,2)}) ${n.slice(2)}` : n;
});

document.getElementById('btn-codigo').addEventListener('click', async ()=>{
  const b = document.getElementById('btn-codigo');
  b.disabled = true; b.textContent = 'Enviando…';
  try{
    const r = await api('/auth/codigo', {method:'POST', body:JSON.stringify({telefone:inTelefone.value})});

    // Canal aberto e cadastro completo: não há código, senha, nome nem
    // aniversário a informar. A segunda tela só teria um botão, então entra.
    if (r.semCodigo && !r.precisaDeNome && !r.precisaDeAniversario){
      semCodigo = true; porSenha = false;
      if (await entrar(b)) return;
      return;   // deu erro: a mensagem já apareceu e o telefone segue na tela
    }

    document.getElementById('passo-telefone').hidden = true;
    document.getElementById('passo-codigo').hidden = false;
    document.getElementById('campo-nome').hidden = !r.precisaDeNome;
    document.getElementById('campo-aniversario').hidden = !r.precisaDeAniversario;

    // Três caminhos possíveis: senha (administrador), nenhum (canal aberto)
    // ou código. Só um dos campos fica visível.
    semCodigo = Boolean(r.semCodigo);
    porSenha  = Boolean(r.precisaDeSenha);

    document.getElementById('campo-codigo').hidden = semCodigo || porSenha;
    document.getElementById('campo-senha').hidden  = !porSenha;
    if (semCodigo || porSenha) document.getElementById('in-codigo').value = '';

    document.getElementById('sub-login').textContent =
      porSenha    ? 'Acesso de administrador. Informe a senha.'
      : semCodigo ? (r.precisaDeNome ? 'Só completar o cadastro e entrar.' : 'É só entrar.')
      : r.canal === 'log' ? 'Modo de teste: o código está no log do servidor.'
                          : `Código enviado para ${r.telefone}.`;

    (porSenha    ? document.getElementById('in-senha')
     : semCodigo ? (r.precisaDeNome ? document.getElementById('in-nome')
                                    : document.getElementById('btn-entrar'))
     : document.getElementById('in-codigo')).focus();
  }catch(e){ avisar(e.message, 'erro'); }
  finally{
    b.disabled = false;
    b.textContent = (semCodigo || porSenha) ? 'Continuar' : 'Receber código';
  }
});

// Máscara dd/mm: barra sozinha depois do dia, sem deixar digitar letra.
const inAniversario = document.getElementById('in-aniversario');
inAniversario.addEventListener('input', e=>{
  const n = e.target.value.replace(/\D/g,'').slice(0,4);
  e.target.value = n.length > 2 ? `${n.slice(0,2)}/${n.slice(2)}` : n;
});
inAniversario.addEventListener('keydown', e=>{
  if (e.key === 'Enter') document.getElementById('btn-entrar').click();
});

/**
 * Faz a entrada de fato. Fica em função própria porque no canal aberto, para
 * quem já tem cadastro, ela é chamada direto do primeiro passo — sem passar
 * pela segunda tela, que não teria nada a preencher.
 */
async function entrar(botao){
  const rotulo = botao.textContent;
  botao.disabled = true; botao.textContent = 'Entrando…';
  try{
    const r = await api('/auth/entrar', {method:'POST', body:JSON.stringify({
      telefone: inTelefone.value,
      codigo: document.getElementById('in-codigo').value,
      senha: document.getElementById('in-senha').value,
      nome: document.getElementById('in-nome').value,

/**
 * Zera tudo que veio do servidor. Sem isto, quem entra depois vê os horários
 * e os agendamentos de quem estava antes até a primeira busca terminar — e no
 * mesmo navegador, trocando de admin para aluno, isso vaza dado de outra conta.
 */
function limparTela(){
  configAtual = null;
  subConfig = 'negocio';
  ['agendar','meus','dia','alunos','config'].forEach(a=>{ document.getElementById('aba-'+a).innerHTML = ''; });
  document.getElementById('quem-sou').textContent = '';

/* ------------------------------ abas ----------------------------------- */
const ABAS_ADMIN = ['dia','alunos','config'];

/** Uma aba só vale se existir e, sendo de admin, se a pessoa for admin. */
function abaPermitida(aba){
  if (!['agendar','meus','dia','alunos','config'].includes(aba)) return false;
  return !ABAS_ADMIN.includes(aba) || Boolean(eu && eu.admin);
}

/**
 * Único caminho para trocar de aba. Antes, o `hidden` das seções só era
 * ajustado no clique; ao entrar de novo, a seção visível continuava sendo a da
 * sessão anterior e o conteúdo novo era desenhado numa seção escondida.
 */
function abrirAba(aba){
  abaAtiva = abaPermitida(aba) ? aba : 'agendar';
  document.querySelectorAll('#abas button').forEach(x=>
    x.setAttribute('aria-selected', String(x.dataset.aba === abaAtiva)));
  ['agendar','meus','dia','alunos','config'].forEach(a=>{
    document.getElementById('aba-'+a).hidden = a !== abaAtiva;
  });
  desenharAba();
}

document.getElementById('abas').addEventListener('click', e=>{
  const b = e.target.closest('button[data-aba]'); if (!b) return;
  if (!abaPermitida(b.dataset.aba)) return;
  abrirAba(b.dataset.aba);
});

function desenharAba(){
  // Rede de segurança: se a sessão perder o admin (removido da lista, por
  // exemplo), volta para uma aba que a pessoa pode ver em vez de tentar
  // carregar dados que o servidor vai recusar.
  if (!abaPermitida(abaAtiva)) return abrirAba('agendar');
  if (abaAtiva === 'agendar') carregarAgenda();
  if (abaAtiva === 'meus') carregarMeus();
  if (abaAtiva === 'dia') carregarDia();
  if (abaAtiva === 'alunos') carregarAlunos();
  if (abaAtiva === 'config') carregarConfig();
}

function marcas(ocupadas, capacidade){
  return '<div class="marcas">'+Array.from({length:capacidade},(_,i)=>
    `<i class="${i<ocupadas?'ocupada':''}"></i>`).join('')+'</div>';
}

const SELO = {meu:'Seu horário', lotado:'Lotado', fechado:'Fechado', bloqueado:'Fechado'};

async function carregarAgenda(){
  const alvo = document.getElementById('aba-agendar');
  try{
    const r = await api('/agenda');
    const recado = r.recado ? `<div class="recado">${esc(r.recado)}</div>` : '';
    const dias = r.dias.map(d=>{
      if (d.bloqueada || !d.horarios.length){
        return `<div class="dia"><div class="titulo"><b>${d.rotulo}</b><span>${d.porExtenso}</span></div>
          <div class="vazio">${d.bloqueada ? 'O estúdio não abre neste dia.' : 'Sem horários neste dia.'}</div></div>`;
      }
      return `<div class="dia"><div class="titulo"><b>${d.rotulo}</b><span>${d.porExtenso}</span></div>${
        d.horarios.map(h=>{
          const livre = h.situacao === 'aberto';
          const direita = livre
            ? `<button class="leve reservar" data-data="${d.data}" data-hora="${h.hora}">Reservar</button>`
            : h.situacao === 'meu' && h.podeCancelar
              ? `<button class="leve cancelar" data-id="${h.meuAgendamentoId}">Cancelar</button>`
              : `<span class="selo ${h.situacao==='meu'?'meu':h.situacao==='lotado'?'cheio':''}">${SELO[h.situacao]||''}</span>`;
          return `<div class="slot ${h.situacao==='meu'?'meu':''} ${livre||h.situacao==='meu'?'':'indisponivel'}">
            <div class="hora">${h.hora}</div>
            <div class="vagas">${marcas(h.ocupadas,h.capacidade)}
              <div class="conta">${h.vagas>0?`${h.vagas} de ${h.capacidade} livres`:`${h.capacidade} lugares ocupados`}</div>
            </div>${direita}</div>`;
        }).join('')}</div>`;
    }).join('');
    alvo.innerHTML = recado + dias;
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

}

const DIAS = [['seg','Segunda'],['ter','Terça'],['qua','Quarta'],['qui','Quinta'],
              ['sex','Sexta'],['sab','Sábado'],['dom','Domingo']];

function linhaHorario(dia, hora='', capacidade=''){
  return `<div class="linha-h" data-dia="${dia}">
    <input type="time" value="${hora}" class="h-hora">
    <input type="number" min="1" max="200" value="${capacidade}" class="h-cap" placeholder="padrão">
    <button class="leve h-remover" aria-label="Remover horário">Remover</button></div>`;
}

/* --------- grade de horários: gerador, cópia entre dias e contagem -------- */

function listaDo(dia){ return document.querySelector(`.lista-h[data-dia="${dia}"]`); }

/** Lê os horários já montados na tela de um dia. */
function horariosDo(dia){
  return [...listaDo(dia).querySelectorAll('.linha-h')].map(l=>({
    hora: l.querySelector('.h-hora').value,
    capacidade: l.querySelector('.h-cap').value,
  })).filter(s=>s.hora);
}

/** Redesenha um dia inteiro e atualiza o contador. */
function pintarDia(dia, horarios){
  listaDo(dia).innerHTML = horarios
    .slice().sort((a,b)=>a.hora.localeCompare(b.hora))
    .map(s=>linhaHorario(dia, s.hora, s.capacidade||'')).join('');
  contarDia(dia);
}

function contarDia(dia){
  const n = listaDo(dia).querySelectorAll('.linha-h').length;
  const alvo = document.querySelector(`[data-cont="${dia}"]`);
  if (alvo) alvo.textContent = n ? `— ${n} ${n===1?'horário':'horários'}` : '— fechado';
}

function contarTodos(){ DIAS.forEach(([k])=>contarDia(k)); }

const emMin = h => { const [a,b] = h.split(':').map(Number); return a*60+(b||0); };
const emHora = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;

function ligarGrade(alvo){
  // A aba é redesenhada a cada visita; o container não. Sem esta trava os
  // listeners delegados se acumulariam e cada clique dispararia várias vezes.
  if (!alvo.dataset.gradeLigada){
    alvo.dataset.gradeLigada = '1';
    alvo.addEventListener('click', e=>{
      const add = e.target.closest('.h-add');
      if (add){
        listaDo(add.dataset.dia).insertAdjacentHTML('beforeend', linhaHorario(add.dataset.dia));
        contarDia(add.dataset.dia);
        return;
      }
      const rem = e.target.closest('.h-remover');
      if (rem){
        const dia = rem.closest('.linha-h').dataset.dia;
        rem.closest('.linha-h').remove();
        contarDia(dia);
        return;
      }
      const lim = e.target.closest('.h-limpar');
      if (lim){ pintarDia(lim.dataset.dia, []); return; }
      const chip = e.target.closest('#g-dias .chip');
      if (chip) chip.classList.toggle('sel');
    });
  }

  // copiar a grade de outro dia
  alvo.querySelectorAll('.h-copiar-de').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const origem = sel.value; if (!origem) return;
      const destino = sel.dataset.dia;
      pintarDia(destino, horariosDo(origem));
      sel.value = '';
      const nome = (DIAS.find(([k])=>k===origem)||[])[1] || origem;
      avisar(`Grade copiada de ${nome}.`, 'ok');
    });
  });

  // atalhos de seleção de dias
  document.getElementById('g-uteis').addEventListener('click', ()=>{
    document.querySelectorAll('#g-dias .chip').forEach(ch=>
      ch.classList.toggle('sel', ['seg','ter','qua','qui','sex'].includes(ch.dataset.dia)));
  });
  document.getElementById('g-nenhum').addEventListener('click', ()=>{
    document.querySelectorAll('#g-dias .chip').forEach(ch=>ch.classList.remove('sel'));
  });

  // gerar a grade
  document.getElementById('g-aplicar').addEventListener('click', ()=>{
    const inicio = document.getElementById('g-inicio').value;
    const fim    = document.getElementById('g-fim').value;
    const passo  = Number(document.getElementById('g-int').value);
    const cap    = document.getElementById('g-cap').value;
    const dias   = [...document.querySelectorAll('#g-dias .chip.sel')].map(ch=>ch.dataset.dia);

    if (!inicio || !fim) return avisar('Preencha o primeiro e o último horário.', 'erro');
    if (!(passo >= 5))   return avisar('O intervalo precisa ser de pelo menos 5 minutos.', 'erro');
    if (emMin(fim) < emMin(inicio)) return avisar('O último horário vem antes do primeiro.', 'erro');
    if (!dias.length)    return avisar('Marque pelo menos um dia.', 'erro');

    const horarios = [];
    for (let m = emMin(inicio); m <= emMin(fim); m += passo) horarios.push({ hora: emHora(m), capacidade: cap });
    if (horarios.length > 60) return avisar('Isso geraria mais de 60 horários por dia. Revise o intervalo.', 'erro');

    dias.forEach(d=>pintarDia(d, horarios));
    avisar(`${horarios.length} horários em ${dias.length} ${dias.length===1?'dia':'dias'}. Não esqueça de salvar.`, 'ok');
  });

  contarTodos();
}

        <div class="campo"><label for="c-fechar">Fecha quantos min antes</label>
          <input id="c-fechar" type="number" min="0" max="1440" value="${c.agenda.minutosAntesDeFechar}"></div>
        <div class="campo"><label for="c-limite">Horários por aluno no dia</label>
          <input id="c-limite" type="number" min="0" max="20" value="${c.agenda.limitePorDia}">
          <p class="ajuda">0 = sem limite.</p></div>
        <div class="campo"><label for="c-permcanc">Aluno pode cancelar</label>
          <select id="c-permcanc"><option value="1"${c.agenda.permitirCancelar?' selected':''}>Sim</option>
          <option value="0"${!c.agenda.permitirCancelar?' selected':''}>Não</option></select></div>
        <div class="campo"><label for="c-mincanc">Cancela até quantos min antes</label>
          <input id="c-mincanc" type="number" min="0" max="10080" value="${c.agenda.minutosParaCancelar}"></div>
      </div>
      <div class="campo"><label for="c-bloq">Datas fechadas</label>
        <input id="c-bloq" value="${(c.agenda.datasBloqueadas||[]).join(', ')}" placeholder="2026-12-25, 2027-01-01">
        <p class="ajuda">Separe por vírgula, no formato AAAA-MM-DD.</p></div>

      <h3>Horários da semana</h3>
      <p class="ajuda">Use o gerador para criar a grade de uma vez. Depois ajuste dia a dia se precisar.
        Deixe a capacidade em branco para usar a padrão.</p>

      <div class="gerador">
        <h4>Gerar grade automaticamente</h4>
        <div class="grid">
          <div><label for="g-inicio">Primeiro horário</label><input id="g-inicio" type="time" value="06:00"></div>
          <div><label for="g-fim">Último horário</label><input id="g-fim" type="time" value="20:00"></div>
          <div><label for="g-int">A cada (min)</label><input id="g-int" type="number" min="5" max="240" step="5" value="60"></div>
          <div><label for="g-cap">Capacidade</label><input id="g-cap" type="number" min="1" max="200" placeholder="padrão"></div>
        </div>
        <label>Aplicar nos dias</label>
        <div class="dias-chips" id="g-dias">${DIAS.map(([k,nome])=>
          `<div class="chip${['seg','ter','qua','qui'].includes(k)?' sel':''}" data-dia="${k}">${nome}</div>`).join('')}
        </div>
        <div class="botoes">
          <button class="leve" id="g-aplicar">Gerar nos dias marcados</button>
          <button class="leve" id="g-uteis">Marcar seg a sex</button>
          <button class="leve" id="g-nenhum">Desmarcar todos</button>
        </div>
      </div>

      <div id="grade">${DIAS.map(([k,nome])=>`
        <div class="dia-bloco" data-bloco="${k}">
          <div class="topo">
            <label>${nome} <span class="contagem" data-cont="${k}"></span></label>
            <div class="acoes">
              <select class="h-copiar-de" data-dia="${k}">
                <option value="">Copiar de…</option>
                ${DIAS.filter(([o])=>o!==k).map(([o,on])=>`<option value="${o}">${on}</option>`).join('')}
              </select>
              <button class="leve h-add" data-dia="${k}">+ Horário</button>
              <button class="leve h-limpar" data-dia="${k}">Limpar</button>
            </div>
          </div>
          <div class="lista-h" data-dia="${k}">${(c.agenda.horarios[k]||[]).map(s=>
            linhaHorario(k, s.hora, s.capacidade||'')).join('')}</div>
        </div>`).join('')}
      </div>

      <h3>Administradores</h3>
      <div class="campo"><label for="c-admins">Telefones com DDD</label>
        <input id="c-admins" value="${(c.administradores||[]).map(t=>t.replace(/^55/,'')).join(', ')}"
          placeholder="31988887777, 11977776666">
        <p class="ajuda">Separe por vírgula. Quem está aqui vê as abas Lista do dia,
          Alunos e Configurações. Você não pode tirar o seu próprio número.</p></div>

      </div><!-- fim negócio -->

      <!-- ================= TÉCNICA ================= -->
      <div class="painel-config" data-painel="tecnica" hidden>

      <div class="nota">Estas opções mexem em como o sistema funciona por dentro.
        No dia a dia do estúdio você não precisa tocar em nada aqui.</div>

      <h3>Servidor</h3>
      <div class="campo"><label for="c-fuso">Fuso horário</label><input id="c-fuso" value="${esc(c.estudio.fuso)}">
        <p class="ajuda">Base de todos os horários. Ex: America/Sao_Paulo.</p></div>

      <h3>Senha do administrador</h3>
      <p class="ajuda">Com senha definida, quem está na lista de administradores entra
        com telefone + senha, sem código. Alunos seguem pelo canal escolhido abaixo.</p>
      <div class="campo">
        <label for="c-senha">${c.acesso.temSenhaAdmin ? 'Trocar a senha' : 'Definir uma senha'}</label>
        <input id="c-senha" type="password" autocomplete="new-password"
          placeholder="${c.acesso.temSenhaAdmin ? 'deixe em branco para manter a atual' : 'mínimo 6 caracteres'}">
        <p class="ajuda" style="margin:6px 0 0">
          ${c.acesso.temSenhaAdmin
            ? 'Já existe uma senha definida. Para voltar ao acesso por código, marque a opção abaixo.'
            : 'Sem senha, o administrador entra por código como qualquer aluno.'}
        </p>
      </div>
      ${c.acesso.temSenhaAdmin ? `
      <div class="campo">
        <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;font-weight:600;color:var(--text)">
          <input type="checkbox" id="c-remover-senha" style="width:auto;margin:0">
          Remover a senha e voltar ao acesso por código
        </label>
      </div>` : ''}

      <h3>Entrada dos alunos</h3>
      <div class="dupla">
        <div class="campo"><label for="c-sessao">Sessão dura quantos dias</label>
          <input id="c-sessao" type="number" min="1" max="365" value="${c.acesso.diasDeSessao}"></div>
        <div class="campo"><label for="c-canal">Canal do código</label>
          <select id="c-canal">
            <option value="aberto"${c.acesso.canalDoCodigo==='aberto'?' selected':''}>Sem código — entra só com o telefone</option>
            <option value="log"${c.acesso.canalDoCodigo==='log'?' selected':''}>Só no log (teste)</option>
            <option value="sms"${c.acesso.canalDoCodigo==='sms'?' selected':''}>SMS</option>
            <option value="whatsapp"${c.acesso.canalDoCodigo==='whatsapp'?' selected':''}>WhatsApp</option>
          </select></div>
        <div class="campo"><label for="c-valcod">Código vale quantos min</label>
          <input id="c-valcod" type="number" min="1" max="60" value="${c.acesso.minutosDeValidadeDoCodigo}"></div>
        <div class="campo"><label for="c-maxped">Pedidos por hora</label>
          <input id="c-maxped" type="number" min="1" max="50" value="${c.acesso.maxPedidosPorHora}"></div>
      </div>
      <div class="nota" id="aviso-aberto" hidden>
        <b>Sem código:</b> quem souber o telefone de um aluno entra como ele.
        Use só nos testes iniciais, enquanto não há WhatsApp configurado, e volte
        para <b>WhatsApp</b> antes de abrir para a turma toda.
        Administradores continuam precisando de código mesmo assim — o seu sai no log do servidor.
      </div>

      <div class="campo"><label for="c-aberto">Quem pode entrar</label>
        <select id="c-aberto">
          <option value="1"${c.acesso.cadastroAberto?' selected':''}>Qualquer telefone</option>
          <option value="0"${!c.acesso.cadastroAberto?' selected':''}>Só telefones já cadastrados</option>
        </select></div>

      <h3>Envio do código</h3>
      <p class="ajuda">Um POST em JSON. Serve para o seu servidor de WhatsApp e para provedores de SMS.</p>
      <div class="campo"><label for="c-url">Endereço</label>
        <input id="c-url" value="${esc(c.envio.url)}" placeholder="https://seu-servidor/enviar"></div>
      <div class="dupla">
        <div class="campo"><label for="c-cabec">Cabeçalho do token</label>
          <input id="c-cabec" value="${esc(c.envio.nomeDoCabecalhoDoToken)}"></div>
        <div class="campo"><label for="c-token">Token</label>
          <input id="c-token" type="password" value="${esc(c.envio.token)}" placeholder="deixe em branco para manter"></div>
      </div>
      <div class="campo"><label for="c-corpo">Corpo do POST</label>
        <textarea id="c-corpo" rows="2">${esc(c.envio.corpo)}</textarea>
        <p class="ajuda">Use {{telefone}} e {{mensagem}}.</p></div>
      <div class="campo"><label for="c-texto">Texto enviado</label>
        <textarea id="c-texto" rows="2">${esc(c.envio.texto)}</textarea>
        <p class="ajuda">Use {{codigo}} e {{minutos}}.</p></div>

      <h3>Backup da ficha dos alunos</h3>
      <div id="c-backup" class="nota">Consultando…</div>

      </div><!-- fim técnica -->

      <button class="acao" id="btn-salvar" style="margin-top:22px">Salvar configurações</button>`;

    const selCanal = document.getElementById('c-canal');
    const avisoAberto = document.getElementById('aviso-aberto');
    const pintarAviso = ()=>{ avisoAberto.hidden = selCanal.value !== 'aberto'; };
    selCanal.addEventListener('change', pintarAviso);
    pintarAviso();

    ligarSubabas(alvo);
    ligarGrade(alvo);
    mostrarBackup();
    document.getElementById('btn-salvar').addEventListener('click', salvarConfig);
  }catch(e){ alvo.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

async function salvarConfig(){
  const v = id => document.getElementById(id).value.trim();
  const n = id => Number(document.getElementById(id).value);
  const horarios = {};
  DIAS.forEach(([k])=>{
    horarios[k] = [...document.querySelectorAll(`.lista-h[data-dia="${k}"] .linha-h`)]
      .map(l=>({
        hora: l.querySelector('.h-hora').value,
        capacidade: Number(l.querySelector('.h-cap').value) || undefined,
      }))
      .filter(s=>s.hora);
  });

  const corpo = {
    estudio: { nome: v('c-nome'), fuso: v('c-fuso'), recado: v('c-recado') },
    agenda: {
      diasAntecedencia: n('c-antec'), capacidadePadrao: n('c-cap'),
      minutosAntesDeFechar: n('c-fechar'), limitePorDia: n('c-limite'),
      permitirCancelar: v('c-permcanc') === '1', minutosParaCancelar: n('c-mincanc'),
      datasBloqueadas: v('c-bloq').split(',').map(s=>s.trim()).filter(Boolean),
      horarios,
    },
    acesso: {
      diasDeSessao: n('c-sessao'), canalDoCodigo: v('c-canal'),
      minutosDeValidadeDoCodigo: n('c-valcod'), maxPedidosPorHora: n('c-maxped'),
      cadastroAberto: v('c-aberto') === '1',
    },
    envio: {
      url: v('c-url'), nomeDoCabecalhoDoToken: v('c-cabec'),
      corpo: v('c-corpo'), texto: v('c-texto'),
    },
    administradores: v('c-admins').split(',').map(s=>s.trim()).filter(Boolean),
  };
  if (v('c-token')) corpo.envio.token = v('c-token');

  // Senha em branco = mantém a atual. Só vai ao servidor quando muda.
  const removerSenha = document.getElementById('c-remover-senha');
  if (removerSenha && removerSenha.checked) corpo.novaSenhaAdmin = '';
  else if (v('c-senha')) corpo.novaSenhaAdmin = v('c-senha');

  const b = document.getElementById('btn-salvar');
  b.disabled = true; b.textContent = 'Salvando…';
  try{
    await api('/admin/config', {method:'PUT', body:JSON.stringify(corpo)});
    avisar('Configurações salvas.', 'ok');
    await comecar(true);
  }catch(e){ avisar(e.message, 'erro'); }
  finally{ b.disabled = false; b.textContent = 'Salvar configurações'; }
}

/* ------------------------------ início ---------------------------------- */
async function comecar(manterAba){
  try{
    const r = await api('/auth/eu');
    // Descarta o que estiver na tela antes de mostrar a conta nova.
    if (!manterAba) limparTela();
    eu = r.aluno;
    document.getElementById('tela-login').hidden = true;
    document.getElementById('tela-app').hidden = false;
    document.getElementById('nome-estudio').textContent = r.config.estudio.nome;
    document.getElementById('quem-sou').textContent = eu.nome || eu.telefone;
    document.querySelectorAll('.so-admin').forEach(b=>{ b.hidden = !eu.admin; });
    abrirAba(manterAba ? abaAtiva : 'agendar');
  }catch{
    document.getElementById('tela-login').hidden = false;
    document.getElementById('tela-app').hidden = true;
  }
}

if (cofre.get()) comecar(); else document.getElementById('in-telefone').focus();
</script>
</body>
</html>
