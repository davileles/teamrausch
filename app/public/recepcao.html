<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recepção · Check-ins Wellhub</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#0E0F11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Team Rausch · recepção ─────────────────────────────────────────────
     Base preta do logo, vermelho só para a ação de liberar, amarelo para o
     que exige atenção (fila, validade escoando). Verde só na confirmação:
     é sinal de porta aberta, lido de longe.                              */
  :root{
    color-scheme:dark;
    --preto:#08090B;--superficie:#1C2026;--fundo-2:#141619;
    --linha:#363C44;--linha-2:#474E57;--linha-3:#5C636D;
    --texto:#F5F5F3;--apagado:#A6ABB2;--fraco:#949AA2;--fraco-2:#7B818A;
    --vermelho:#E01F26;--amarelo:#F5C518;--liberado:#1B6B4A;
    --sombra-aviso:0 8px 30px rgba(0,0,0,.5);
    --raio:2px;
  }
  /* Tema claro: mesma paleta lida sobre papel. Vermelho e amarelo escurecem
     para manterem contraste; nada além das variáveis muda. */
  :root[data-tema=claro]{
    color-scheme:light;
    --preto:#F2F3F5;--superficie:#FFFFFF;--fundo-2:#E9EBEF;
    --linha:#D6DAE0;--linha-2:#C3C9D1;--linha-3:#A7AEB8;
    --texto:#15181C;--apagado:#414750;--fraco:#5C636C;--fraco-2:#7A8189;
    --vermelho:#C8161C;--amarelo:#9A6E00;--liberado:#15694A;
    --sombra-aviso:0 8px 30px rgba(21,24,28,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--preto);color:var(--texto);
    font:400 16px/1.55 'Work Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a,button,input{-webkit-tap-highlight-color:transparent}
  .env{max-width:900px;margin:0 auto;padding:0 24px 80px}

  header.topo{border-bottom:3px solid var(--vermelho);background:var(--preto);
    position:sticky;top:0;z-index:10}
  .topo-int{max-width:900px;margin:0 auto;padding:16px 24px;display:flex;
    align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .marca{display:flex;align-items:center;gap:14px}
  .marca img{height:34px;width:auto;display:block}
  h1{font:400 24px/1 Anton,sans-serif;letter-spacing:.04em;text-transform:uppercase}
  h1 span{display:block;font:600 10.5px 'Work Sans',sans-serif;color:var(--amarelo);
    letter-spacing:.16em;text-transform:uppercase;margin-top:5px}
  .placar{display:flex;gap:1px;background:var(--linha)}
  .placar div{background:var(--superficie);border:1px solid var(--linha-2);padding:10px 20px;text-align:right;min-width:96px}
  .placar b{display:block;font:400 30px/1 Anton,sans-serif;color:var(--texto);font-variant-numeric:tabular-nums}
  .placar div:first-child b{color:var(--amarelo)}
  .placar small{display:block;font:600 10px 'Work Sans',sans-serif;color:var(--fraco);
    letter-spacing:.14em;text-transform:uppercase;margin-top:5px}

  .aviso{background:var(--amarelo);color:var(--preto);font:400 13px Anton,sans-serif;
    letter-spacing:.14em;text-transform:uppercase;padding:9px 24px;text-align:center}

  .busca{display:flex;gap:10px;margin:22px 0 18px}
  input[type=text]{flex:1;min-width:0;padding:15px 16px;min-height:54px;border:1px solid var(--linha-3);
    border-radius:var(--raio);background:var(--superficie);color:var(--texto);
    font:500 17px 'Work Sans',sans-serif;letter-spacing:.06em}
  input[type=text]::placeholder{color:var(--fraco)}
  input[type=text]:focus{outline:none;border-color:var(--amarelo)}
  button{font:400 17px Anton,sans-serif;letter-spacing:.08em;text-transform:uppercase;
    border:none;border-radius:var(--raio);cursor:pointer;padding:15px 30px;min-height:54px;
    background:var(--vermelho);color:#fff;transition:background .15s}
  button:hover{background:#B8161C}
  button:focus-visible{outline:2px solid var(--amarelo);outline-offset:2px}
  button[disabled]{opacity:.45;cursor:not-allowed}

  .filtros{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .filtros button{background:transparent;color:var(--apagado);border:1px solid var(--linha-3);
    padding:10px 16px;min-height:auto;font:400 13px Anton,sans-serif;letter-spacing:.1em}
  .filtros button:hover{border-color:var(--amarelo);background:transparent;color:var(--texto)}
  .filtros button[aria-pressed=true]{background:var(--amarelo);color:var(--preto);border-color:var(--amarelo)}

  /* Cartão: a faixa do topo é a janela de validade escoando em tempo real */
  .cartao{background:var(--superficie);border:1px solid var(--linha-2);margin-bottom:10px}
  .faixa{height:4px;background:var(--linha-2)}
  .faixa i{display:block;height:100%;background:var(--amarelo);
    transition:width 1s linear,background-color .4s}
  .faixa.urgente i{background:var(--vermelho)}
  .corpo{padding:18px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .quem{flex:1;min-width:200px}
  .nome{font:400 24px/1.1 Anton,sans-serif;letter-spacing:.02em;text-transform:uppercase}
  .meta{font:500 13px 'Work Sans',sans-serif;letter-spacing:.06em;color:var(--fraco);margin-top:5px}
  .relogio{font:400 22px/1 Anton,sans-serif;font-variant-numeric:tabular-nums;
    color:var(--texto);white-space:nowrap}
  .relogio.urgente{color:var(--vermelho)}
  .selo{font:400 13px Anton,sans-serif;letter-spacing:.12em;text-transform:uppercase;
    padding:9px 14px;white-space:nowrap}
  .selo.validado{background:var(--liberado);color:#fff}
  .selo.recusado{background:var(--vermelho);color:#fff}
  .selo.expirado{background:var(--linha-2);color:var(--apagado)}
  .motivo{flex-basis:100%;font:400 13.5px 'Work Sans',sans-serif;color:var(--fraco)}
  /* Quem já foi resolvido recua um passo: a fila é o que a recepção lê. */
  .cartao:has(.selo){background:var(--fundo-2);border-color:var(--linha)}
  .cartao:has(.selo) .nome{color:var(--apagado)}
  .cartao:has(.selo.validado) .faixa{background:var(--liberado)}
  .cartao:has(.selo.recusado) .faixa,.cartao:has(.selo.expirado) .faixa{background:var(--vermelho)}

  .vazio{text-align:center;padding:64px 20px;color:var(--fraco)}
  .vazio p{font:400 24px Anton,sans-serif;letter-spacing:.04em;text-transform:uppercase;
    color:var(--texto);margin-bottom:8px}
  .vazio small{font:400 14px 'Work Sans',sans-serif}

  .recado{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;
    background:var(--superficie);border:1px solid var(--linha-3);color:var(--texto);
    padding:14px 24px;font:400 15px Anton,sans-serif;letter-spacing:.08em;text-transform:uppercase;
    max-width:calc(100% - 48px);box-shadow:var(--sombra-aviso)}
  .recado.ok{background:var(--liberado);border-color:var(--liberado);color:#fff}
  .recado.erro{background:var(--vermelho);border-color:var(--vermelho);color:#fff}

  @media (max-width:620px){
    .topo-int{padding:14px 18px;gap:14px}
    .marca img{height:28px} h1{font-size:20px}
    .placar div{padding:8px 14px;min-width:78px} .placar b{font-size:24px}
    .env{padding:0 18px 80px}
    .busca{flex-direction:column} button{width:100%}
    .filtros button{width:auto}
    .corpo{padding:16px;gap:12px} .nome{font-size:21px}
    .quem{min-width:140px}
  }

  /* Alternador de tema: o ícone mostra para onde se vai, não onde se está. */
  .tema{background:transparent;border:1px solid var(--linha-3);color:var(--apagado);
    border-radius:var(--raio,2px);cursor:pointer;padding:0;width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:border-color .15s,color .15s,background .15s}
  .tema:hover{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
  .tema svg{display:block}
  .tema .i-lua{display:none}
  :root[data-tema=claro] .tema .i-sol{display:none}
  :root[data-tema=claro] .tema .i-lua{display:block}
  .canto{display:flex;align-items:center;gap:14px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
/* Tema claro/escuro — escolha do usuário, guardada só neste aparelho.
   Roda antes do corpo desenhar para não haver piscada de tema errado. */
(function(){
  var CHAVE='tr_tema', CLARO='#F2F3F5', ESCURO='#0E0F11';
  function pintar(t){
    var claro = t==='claro';
    document.documentElement.setAttribute('data-tema', claro?'claro':'escuro');
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', claro?CLARO:ESCURO);
  }
  var salvo=null; try{ salvo=localStorage.getItem(CHAVE); }catch(e){}
  pintar(salvo||'escuro');
  window.alternarTema=function(){
    var novo=document.documentElement.getAttribute('data-tema')==='claro'?'escuro':'claro';
    pintar(novo); try{ localStorage.setItem(CHAVE,novo); }catch(e){}
  };
  document.addEventListener('click',function(ev){
    var alvo=ev.target&&ev.target.closest?ev.target.closest('.tema'):null;
    if(alvo){ ev.preventDefault(); window.alternarTema(); }
  });
})();
</script>
</head>
<body>
<div id="aviso" class="aviso" hidden>Modo simulação — nada é enviado ao Wellhub</div>

<header class="topo">
  <div class="topo-int">
    <div class="marca">
      <img src="/logo.png" alt="Team Rausch Studio">
      <h1>Check-ins<span>Recepção · Wellhub</span></h1>
    </div>
    <div class="canto">
      <div class="placar">
        <div><b id="pl-aguardando">—</b><small>Na fila</small></div>
        <div><b id="pl-validados">—</b><small>Hoje</small></div>
      </div>
      <button class="tema" type="button" aria-label="Alternar tema claro ou escuro" title="Alternar tema claro/escuro"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="i-sol"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.1M12 19.3v2.1M4.5 4.5l1.5 1.5M18 18l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.5 19.5l1.5-1.5M18 6l1.5-1.5"/></g><path class="i-lua" d="M20.2 14.6A8.5 8.5 0 0 1 9.4 3.8 8.7 8.7 0 1 0 20.2 14.6Z"/></svg></button>
    </div>
  </div>
</header>

<div class="env">
  <div class="busca">
    <input id="entrada" type="text" inputmode="numeric" placeholder="Wellhub ID do aluno"
           aria-label="Wellhub ID do aluno" autocomplete="off">
    <button id="btn-liberar">Liberar</button>
  </div>

  <div class="filtros" role="group" aria-label="Filtrar check-ins">
    <button data-f="aguardando" aria-pressed="true">Na fila</button>
    <button data-f="validado" aria-pressed="false">Liberados</button>
    <button data-f="todos" aria-pressed="false">Tudo</button>
  </div>

  <div id="lista"></div>
</div>

<script>
const guarda = {
  get(){ try{ return sessionStorage.getItem('painel-token')||'' }catch{ return this._m||'' } },
  set(v){ this._m=v; try{ sessionStorage.setItem('painel-token',v) }catch{} }
};

let filtro = 'aguardando';
let itens = [];

function cabecalhos(){
  const h = {'Content-Type':'application/json'};
  const t = guarda.get(); if (t) h['X-Panel-Token'] = t;
  return h;
}

async function api(caminho, opcoes = {}){
  const r = await fetch('/api'+caminho, {...opcoes, headers: cabecalhos()});
  if (r.status === 401){
    const t = prompt('Token do painel:');
    if (t){ guarda.set(t); return api(caminho, opcoes); }
    throw new Error('Token do painel necessário.');
  }
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).erro || 'Falha na requisição.');
  return r.json();
}

function recado(texto, tipo){
  document.querySelector('.recado')?.remove();
  const d = document.createElement('div');
  d.className = 'recado' + (tipo ? ' '+tipo : '');
  d.setAttribute('role','status');
  d.textContent = texto;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 4500);
}

function restante(ate){
  const s = Math.max(0, Math.round((new Date(ate) - Date.now())/1000));
  return {segundos:s, texto: String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
}

function desenhar(){
  const lista = document.getElementById('lista');
  if (!itens.length){
    lista.innerHTML = '<div class="vazio"><p>Nada na fila</p>'+
      '<small>Os check-ins aparecem aqui assim que o aluno confirma no app.</small></div>';
    return;
  }
  lista.innerHTML = itens.map(c=>{
    const nome = [c.nome, c.sobrenome].filter(Boolean).join(' ') || 'Aluno Wellhub';
    const r = restante(c.validoAte);
    const total = (new Date(c.validoAte) - new Date(c.criadoEm))/1000 || 1;
    const pct = Math.max(0, Math.min(100, r.segundos/total*100));
    const urgente = r.segundos < 300;
    const acao = c.situacao === 'aguardando'
      ? `<button data-id="${c.id}" class="liberar">Liberar acesso</button>`
      : `<span class="selo ${c.situacao}">${{validado:'Liberado',recusado:'Negado',expirado:'Expirou'}[c.situacao]}</span>`;
    return `<article class="cartao">
      <div class="faixa ${urgente?'urgente':''}"><i style="width:${c.situacao==='aguardando'?pct:0}%"></i></div>
      <div class="corpo">
        <div class="quem">
          <div class="nome">${nome}</div>
          <div class="meta">${c.gympassId}${c.produto ? ' · '+c.produto : ''}</div>
        </div>
        ${c.situacao==='aguardando' ? `<span class="relogio ${urgente?'urgente':''}" data-ate="${c.validoAte}">${r.texto}</span>` : ''}
        ${acao}
        ${c.motivo && c.situacao!=='validado' ? `<div class="motivo">${c.motivo}</div>` : ''}
      </div>
    </article>`;
  }).join('');
}

function tiquetaque(){
  document.querySelectorAll('.relogio[data-ate]').forEach(el=>{
    const r = restante(el.dataset.ate);
    el.textContent = r.texto;
    if (r.segundos < 300) el.classList.add('urgente');
    if (r.segundos === 0) carregar();
  });
}

async function carregar(){
  try{
    const [resumo, lista] = await Promise.all([
      api('/resumo'),
      api('/checkins?situacao='+filtro)
    ]);
    document.getElementById('pl-aguardando').textContent = resumo.aguardando;
    document.getElementById('pl-validados').textContent = resumo.validadosHoje;
    document.getElementById('aviso').hidden = !resumo.simulacao;
    itens = lista;
    desenhar();
  }catch(e){ recado(e.message, 'erro'); }
}

async function liberarPorId(id){
  const r = await api('/checkins/'+id+'/validar', {method:'POST'});
  recado(r.ok ? 'Acesso liberado.' : r.motivo, r.ok ? 'ok' : 'erro');
  carregar();
}

document.getElementById('lista').addEventListener('click', e=>{
  const b = e.target.closest('button.liberar');
  if (!b) return;
  b.disabled = true; b.textContent = 'Validando…';
  liberarPorId(b.dataset.id).catch(err=>{ recado(err.message,'erro'); carregar(); });
});

document.querySelectorAll('.filtros button').forEach(b=>{
  b.addEventListener('click', ()=>{
    filtro = b.dataset.f;
    document.querySelectorAll('.filtros button')
      .forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
    carregar();
  });
});

async function liberarDigitado(){
  const campo = document.getElementById('entrada');
  const gympassId = campo.value.trim();
  if (!gympassId) return campo.focus();
  const btn = document.getElementById('btn-liberar');
  btn.disabled = true;
  try{
    const r = await fetch('/api/validar-por-id', {
      method:'POST', headers: cabecalhos(), body: JSON.stringify({gympassId})
    }).then(x=>x.json());
    recado(r.ok ? 'Acesso liberado.' : (r.motivo || r.erro), r.ok ? 'ok' : 'erro');
    if (r.ok) campo.value = '';
    carregar();
  }catch(e){ recado('Não consegui falar com o servidor.', 'erro'); }
  finally{ btn.disabled = false; }
}

document.getElementById('btn-liberar').addEventListener('click', liberarDigitado);
document.getElementById('entrada').addEventListener('keydown', e=>{ if(e.key==='Enter') liberarDigitado(); });

carregar();
setInterval(carregar, 15000);
setInterval(tiquetaque, 1000);
</script>
</body>
</html>
