<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrada · Wellhub</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#F2F3F5">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Team Rausch · totem ────────────────────────────────────────────────
     Base preta como o logo, vermelho só para a ação, amarelo para o que a
     pessoa está digitando. Verde e vermelho na resposta são sinal de porta,
     não marca: quem está entrando lê de longe, sem ler texto.            */
  :root{
    color-scheme:dark;
    --preto:#08090B;--superficie:#1C2026;--linha:#474E57;--linha-2:#5C636D;
    --texto:#F5F5F3;--apagado:#A6ABB2;--fraco:#949AA2;
    --vermelho:#E01F26;--amarelo:#F5C518;--liberado:#1B6B4A;
    --tecla-apagar:#141619;--linha-3:var(--linha-2);
  }
  /* Tema claro: o totem fica com fundo de papel e teclas brancas. Vermelho e
     amarelo escurecem para continuarem legíveis a alguns passos de distância. */
  :root[data-tema=claro]{
    color-scheme:light;
    --preto:#F2F3F5;--superficie:#FFFFFF;--linha:#C3C9D1;--linha-2:#A7AEB8;
    --texto:#15181C;--apagado:#414750;--fraco:#5C636C;
    --vermelho:#C8161C;--amarelo:#9A6E00;--liberado:#15694A;
    --tecla-apagar:#E9EBEF;
  }
  *{box-sizing:border-box;margin:0;padding:0;user-select:none}
  body{background:var(--preto);color:var(--texto);font-family:'Work Sans',system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 24px;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .painel{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center}
  .logo{width:132px;height:auto;display:block;margin-bottom:32px}
  .rotulo{font:600 11px 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;
    color:var(--amarelo);margin-bottom:14px}
  .chamada{font:400 30px/1.1 Anton,sans-serif;letter-spacing:.02em;text-transform:uppercase;
    text-align:center;margin-bottom:28px}
  .visor{width:100%;min-height:104px;background:var(--superficie);border:1px solid var(--linha-2);
    border-bottom:3px solid var(--amarelo);display:flex;align-items:center;justify-content:center;
    font:400 40px Anton,sans-serif;letter-spacing:.34em;color:var(--amarelo);
    margin-bottom:18px;padding:0 12px;word-break:break-all}
  .visor:empty::before{content:'••••••';color:var(--linha)}
  .teclas{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .teclas button{height:82px;background:var(--superficie);border:1px solid var(--linha);
    font:400 34px Anton,sans-serif;color:var(--texto);cursor:pointer}
  .teclas button:active{background:var(--texto);color:var(--preto);border-color:var(--texto)}
  .teclas button[data-acao=apagar]{background:var(--tecla-apagar);font-size:28px;color:var(--apagado)}
  .teclas button.ok{background:var(--vermelho);border-color:var(--vermelho);color:#fff;
    font-size:20px;letter-spacing:.08em;text-transform:uppercase}
  .rodape{font:400 13.5px/1.5 'Work Sans',sans-serif;color:var(--fraco);text-align:center;margin-top:24px}

  .resposta{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;color:#fff;padding:36px;text-align:center}
  .resposta.mostrar{display:flex}
  .resposta.sim{background:var(--liberado)} .resposta.nao{background:var(--vermelho)}
  .resposta h2{font:400 clamp(46px,13vw,72px)/0.95 Anton,sans-serif;letter-spacing:.02em;text-transform:uppercase}
  .resposta h2::after{content:'';display:block;width:48px;height:4px;margin:22px auto 0;background:var(--amarelo)}
  .resposta.nao h2::after{background:var(--preto)}
  .resposta p{font:500 19px/1.45 'Work Sans',sans-serif;margin-top:18px;max-width:420px;opacity:.94}

  @media (max-height:700px){
    .logo{width:104px;margin-bottom:20px}
    .chamada{font-size:24px;margin-bottom:18px}
    .visor{min-height:84px;font-size:32px}
    .teclas button{height:68px;font-size:28px}
  }

  /* Alternador de tema: o ícone mostra para onde se vai, não onde se está. */
  .tema{background:transparent;border:1px solid var(--linha-3);color:var(--apagado);
    border-radius:var(--raio,2px);cursor:pointer;padding:0;width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:border-color .15s,color .15s,background .15s}
  .tema:hover{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
  .tema svg{display:block}
  .tema .i-lua{display:none}
  :root[data-tema=claro] .tema .i-sol{display:none}
  :root[data-tema=claro] .tema .i-lua{display:block}
  .tema{position:fixed;top:18px;right:18px;z-index:5;width:44px;height:44px;
    border-color:var(--linha);opacity:.55}
  .tema:hover{opacity:1}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
/* Tema claro/escuro — claro é o padrão; a escolha do usuário, quando há,
   vale mais e fica guardada só neste aparelho.
   Roda antes do corpo desenhar para não haver piscada de tema errado. */
(function(){
  var CHAVE='tr_tema', CLARO='#F2F3F5', ESCURO='#0E0F11';
  function pintar(t){
    var claro = t==='claro';
    document.documentElement.setAttribute('data-tema', claro?'claro':'escuro');
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', claro?CLARO:ESCURO);
  }
  var salvo=null; try{ salvo=localStorage.getItem(CHAVE); }catch(e){}
  pintar(salvo||'claro');
  window.alternarTema=function(){
    var novo=document.documentElement.getAttribute('data-tema')==='claro'?'escuro':'claro';
    pintar(novo); try{ localStorage.setItem(CHAVE,novo); }catch(e){}
  };
  document.addEventListener('click',function(ev){
    var alvo=ev.target&&ev.target.closest?ev.target.closest('.tema'):null;
    if(alvo){ ev.preventDefault(); window.alternarTema(); }
  });
})();
</script>
</head>
<body>
  <button class="tema" type="button" aria-label="Alternar tema claro ou escuro" title="Alternar tema claro/escuro"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="i-sol"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.1M12 19.3v2.1M4.5 4.5l1.5 1.5M18 18l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.5 19.5l1.5-1.5M18 6l1.5-1.5"/></g><path class="i-lua" d="M20.2 14.6A8.5 8.5 0 0 1 9.4 3.8 8.7 8.7 0 1 0 20.2 14.6Z"/></svg></button>
  <div class="painel">
    <img src="/logo.png" alt="Team Rausch Studio" class="logo">
    <div class="rotulo">Entrada</div>
    <div class="chamada">Digite seu código</div>
    <div class="visor" id="visor" aria-live="polite"></div>
    <div class="teclas" id="teclas">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button data-acao="apagar">←</button><button>0</button>
      <button class="ok" data-acao="entrar">Entrar</button>
    </div>
    <p class="rodape">Faça o check-in no app do Wellhub antes de digitar. O leitor de QR também funciona.</p>
  </div>

  <div class="resposta" id="resposta"><h2 id="r-titulo"></h2><p id="r-texto"></p></div>

<script>
const TOKEN_DISPOSITIVO = ''; // preencha com DEVICE_TOKEN se você configurou um
let codigo = '';
const visor = document.getElementById('visor');

function pintar(){ visor.textContent = '•'.repeat(codigo.length); }

function responder(abrir, titulo, texto){
  const tela = document.getElementById('resposta');
  tela.className = 'resposta mostrar ' + (abrir ? 'sim' : 'nao');
  document.getElementById('r-titulo').textContent = titulo;
  document.getElementById('r-texto').textContent = texto || '';
  setTimeout(()=>{ tela.className = 'resposta'; codigo=''; pintar(); }, abrir ? 3000 : 5000);
}

async function entrar(){
  if (!codigo) return;
  const atual = codigo;
  codigo = ''; pintar();
  try{
    const cab = {'Content-Type':'application/json'};
    if (TOKEN_DISPOSITIVO) cab['X-Device-Token'] = TOKEN_DISPOSITIVO;
    const r = await fetch('/acesso', {method:'POST', headers:cab, body:JSON.stringify({codigo:atual})}).then(x=>x.json());
    responder(r.abrir, r.abrir ? 'Pode entrar' : 'Acesso negado', r.abrir ? (r.nome||'') : r.mensagem);
  }catch(e){
    responder(false, 'Fora do ar', 'Procure a recepção para liberar sua entrada.');
  }
}

document.getElementById('teclas').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  const acao = b.dataset.acao;
  if (acao === 'apagar') codigo = codigo.slice(0,-1);
  else if (acao === 'entrar') return entrar();
  else if (codigo.length < 20) codigo += b.textContent;
  pintar();
});

// Leitor de QR/código de barras funciona como teclado: digita e manda Enter.
document.addEventListener('keydown', e=>{
  if (e.key === 'Enter') entrar();
  else if (e.key === 'Backspace') { codigo = codigo.slice(0,-1); pintar(); }
  else if (/^[0-9A-Za-z]$/.test(e.key) && codigo.length < 20) { codigo += e.key; pintar(); }
});
</script>
</body>
</html>
