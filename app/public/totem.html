<!DOCTYPE html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrada · Team Rausch</title>
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="theme-color" content="#F2F3F5">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Team Rausch · totem ────────────────────────────────────────────────
     Base preta como o logo, vermelho só para a ação, amarelo para o que a
     pessoa está digitando. Verde e vermelho na resposta são sinal de porta,
     não marca: quem está entrando lê de longe, sem ler texto.            */
  :root{
    color-scheme:dark;
    --preto:#08090B;--superficie:#1C2026;--linha:#474E57;--linha-2:#5C636D;
    --texto:#F5F5F3;--apagado:#A6ABB2;--fraco:#949AA2;
    --vermelho:#E01F26;--amarelo:#F5C518;--liberado:#1B6B4A;
    --tecla-apagar:#141619;--linha-3:var(--linha-2);
  }
  /* Tema claro: o totem fica com fundo de papel e teclas brancas. Vermelho e
     amarelo escurecem para continuarem legíveis a alguns passos de distância. */
  :root[data-tema=claro]{
    color-scheme:light;
    --preto:#F2F3F5;--superficie:#FFFFFF;--linha:#C3C9D1;--linha-2:#A7AEB8;
    --texto:#15181C;--apagado:#414750;--fraco:#5C636C;
    --vermelho:#C8161C;--amarelo:#9A6E00;--liberado:#15694A;
    --tecla-apagar:#E9EBEF;
  }
  *{box-sizing:border-box;margin:0;padding:0;user-select:none}
  body{background:var(--preto);color:var(--texto);font-family:'Work Sans',system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 24px;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .painel{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center}
  .logo{width:132px;height:auto;display:block;margin-bottom:32px}
  .rotulo{font:600 11px 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;
    color:var(--amarelo);margin-bottom:14px}
  .chamada{font:400 30px/1.1 Anton,sans-serif;letter-spacing:.02em;text-transform:uppercase;
    text-align:center;margin-bottom:28px}
  .visor{width:100%;min-height:104px;background:var(--superficie);border:1px solid var(--linha-2);
    border-bottom:3px solid var(--amarelo);display:flex;align-items:center;justify-content:center;
    font:400 40px Anton,sans-serif;letter-spacing:.34em;color:var(--amarelo);
    margin-bottom:18px;padding:0 12px;word-break:break-all}
  .visor:empty::before{content:'••••••';color:var(--linha)}
  .teclas{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .teclas button{height:82px;background:var(--superficie);border:1px solid var(--linha);
    font:400 34px Anton,sans-serif;color:var(--texto);cursor:pointer}
  .teclas button:active{background:var(--texto);color:var(--preto);border-color:var(--texto)}
  .teclas button[data-acao=apagar]{background:var(--tecla-apagar);font-size:28px;color:var(--apagado)}
  .teclas button.ok{background:var(--vermelho);border-color:var(--vermelho);color:#fff;
    font-size:20px;letter-spacing:.08em;text-transform:uppercase}

  .resposta{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;color:#fff;padding:36px;text-align:center}
  .resposta.mostrar{display:flex}
  .resposta.sim{background:var(--liberado)} .resposta.nao{background:var(--vermelho)}
  .resposta h2{font:400 clamp(46px,13vw,72px)/0.95 Anton,sans-serif;letter-spacing:.02em;text-transform:uppercase}
  .resposta h2::after{content:'';display:block;width:48px;height:4px;margin:22px auto 0;background:var(--amarelo)}
  .resposta.nao h2::after{background:var(--preto)}
  .resposta p{font:500 19px/1.45 'Work Sans',sans-serif;margin-top:18px;max-width:420px;opacity:.94}

  /* ── telas do tablet ───────────────────────────────────────────────────
     Uma tela por vez, todas dentro do mesmo painel. Botões grandes porque a
     pessoa toca de pé, com a bolsa numa das mãos.                        */
  .tela{display:none;width:100%;flex-direction:column;align-items:center}
  .tela.ativa{display:flex}
  .opcoes{width:100%;display:flex;flex-direction:column;gap:14px}
  .opcoes button{width:100%;min-height:104px;background:var(--superficie);
    border:1px solid var(--linha);color:var(--texto);cursor:pointer;padding:18px;
    font:400 26px/1.05 Anton,sans-serif;letter-spacing:.02em;text-transform:uppercase;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .opcoes button:active{background:var(--texto);color:var(--preto);border-color:var(--texto)}
  .opcoes button.principal{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
  .opcoes button small{font:500 13px/1.35 'Work Sans',sans-serif;letter-spacing:0;
    text-transform:none;opacity:.85;max-width:300px}
  .voltar-totem{margin-top:22px;background:none;border:none;color:var(--fraco);
    font:600 13px 'Work Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;
    cursor:pointer;border-bottom:1px solid var(--linha);padding-bottom:3px}
  .voltar-totem:active{color:var(--amarelo);border-color:var(--amarelo)}

  /* Lista de homônimos: mesmo final de telefone, nomes diferentes. */
  .nomes{width:100%;display:flex;flex-direction:column;gap:10px}
  .nomes button{width:100%;min-height:76px;background:var(--superficie);border:1px solid var(--linha);
    color:var(--texto);font:500 20px 'Work Sans',sans-serif;cursor:pointer;padding:14px 18px}
  .nomes button:active{background:var(--texto);color:var(--preto)}

  /* Cadastro: teclado do próprio tablet, campos altos. */
  .form{width:100%;display:flex;flex-direction:column;gap:16px;text-align:left}
  .form label{display:block;font:600 11px 'Work Sans',sans-serif;letter-spacing:.16em;
    text-transform:uppercase;color:var(--amarelo);margin-bottom:8px}
  .form input{width:100%;min-height:62px;background:var(--superficie);color:var(--texto);
    border:1px solid var(--linha);border-bottom:2px solid var(--amarelo);padding:14px 16px;
    font:400 20px 'Work Sans',sans-serif;user-select:text}
  .form input:focus{outline:none;border-color:var(--amarelo)}
  .form .enviar{width:100%;min-height:78px;background:var(--vermelho);border:1px solid var(--vermelho);
    color:#fff;font:400 24px Anton,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .form .enviar[disabled]{opacity:.55}

  .aviso-totem{width:100%;margin-top:16px;padding:14px 16px;background:var(--superficie);
    border-left:3px solid var(--vermelho);font:500 15px/1.45 'Work Sans',sans-serif;
    color:var(--texto)}
  .aviso-totem:empty{display:none}

  @media (max-height:700px){
    .logo{width:104px;margin-bottom:20px}
    .chamada{font-size:24px;margin-bottom:18px}
    .visor{min-height:84px;font-size:32px}
    .teclas button{height:68px;font-size:28px}
  }

  /* Alternador de tema: o ícone mostra para onde se vai, não onde se está. */
  .tema{background:transparent;border:1px solid var(--linha-3);color:var(--apagado);
    border-radius:var(--raio,2px);cursor:pointer;padding:0;width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:border-color .15s,color .15s,background .15s}
  .tema:hover{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
  .tema svg{display:block}
  .tema .i-lua{display:none}
  :root[data-tema=claro] .tema .i-sol{display:none}
  :root[data-tema=claro] .tema .i-lua{display:block}
  .tema{position:fixed;top:18px;right:18px;z-index:5;width:44px;height:44px;
    border-color:var(--linha);opacity:.55}
  .tema:hover{opacity:1}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
/* Tema claro/escuro — claro é o padrão; a escolha do usuário, quando há,
   vale mais e fica guardada só neste aparelho.
   Roda antes do corpo desenhar para não haver piscada de tema errado. */
(function(){
  var CHAVE='tr_tema', CLARO='#F2F3F5', ESCURO='#0E0F11';
  function pintar(t){
    var claro = t==='claro';
    document.documentElement.setAttribute('data-tema', claro?'claro':'escuro');
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', claro?CLARO:ESCURO);
  }
  var salvo=null; try{ salvo=localStorage.getItem(CHAVE); }catch(e){}
  pintar(salvo||'claro');
  window.alternarTema=function(){
    var novo=document.documentElement.getAttribute('data-tema')==='claro'?'escuro':'claro';
    pintar(novo); try{ localStorage.setItem(CHAVE,novo); }catch(e){}
  };
  document.addEventListener('click',function(ev){
    var alvo=ev.target&&ev.target.closest?ev.target.closest('.tema'):null;
    if(alvo){ ev.preventDefault(); window.alternarTema(); }
  });
})();
</script>
</head>
<body>
  <button class="tema" type="button" aria-label="Alternar tema claro ou escuro" title="Alternar tema claro/escuro"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="i-sol"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.1M12 19.3v2.1M4.5 4.5l1.5 1.5M18 18l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.5 19.5l1.5-1.5M18 6l1.5-1.5"/></g><path class="i-lua" d="M20.2 14.6A8.5 8.5 0 0 1 9.4 3.8 8.7 8.7 0 1 0 20.2 14.6Z"/></svg></button>
  <div class="painel">
    <img src="/logo.png" alt="Team Rausch Studio" class="logo">

    <!-- ---------------------------- menu ---------------------------- -->
    <section class="tela ativa" id="tela-menu">
      <div class="rotulo">Entrada</div>
      <div class="chamada">Bem-vindo</div>
      <div class="opcoes">
        <button class="principal" data-ir="presenca">Confirmar presença
          <small>Já tem cadastro e aula marcada para hoje</small></button>
        <button id="btn-cadastro">Criar cadastro
          <small>Primeiro acesso</small></button>
      </div>
    </section>

    <!-- ------------------- confirmar presença ----------------------- -->
    <section class="tela" id="tela-presenca">
      <div class="rotulo">Confirmar presença</div>
      <div class="chamada">4 últimos dígitos<br>do seu telefone</div>
      <div class="visor" id="visor-final" aria-live="polite"></div>
      <div class="teclas" id="teclas-final">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button data-acao="apagar">←</button><button>0</button>
        <button class="ok" data-acao="ok">Ok</button>
      </div>
      <button class="voltar-totem" data-ir="menu">Voltar</button>
    </section>

    <!-- ---------------- escolher entre homônimos --------------------- -->
    <section class="tela" id="tela-nomes">
      <div class="rotulo">Confirmar presença</div>
      <div class="chamada">Quem é você?</div>
      <div class="nomes" id="lista-nomes"></div>
      <button class="voltar-totem" data-ir="presenca">Voltar</button>
    </section>

  </div>

  <div class="resposta" id="resposta"><h2 id="r-titulo"></h2><p id="r-texto"></p></div>

<script>
/* ── tablet da entrada ──────────────────────────────────────────────────
   Duas coisas: confirmar presença pelos 4 últimos dígitos do telefone e abrir
   cadastro. O cadastro não mora aqui — o botão abre a tela de entrada do app
   em modo totem, que é o mesmo fluxo do site.

   O check-in do Wellhub saiu desta tela: quem tem Wellhub confirma no app do
   próprio Wellhub, e o check-in chega ao sistema pelo webhook do portal. A
   rota /acesso continua de pé para a catraca, que não passa por aqui.

   As rotas usadas aqui são abertas, sem token de dispositivo: o tablet é só um
   atalho no navegador, sem nada para configurar.                          */

let tela = 'menu';
let final = '';    // 4 dígitos da presença
let ocioso = null;

const visorFinal = document.getElementById('visor-final');

async function chamar(caminho, corpo){
  const r = await fetch('/totem-api'+caminho,
    {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(corpo)});
  const dados = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(dados.erro || 'Não consegui completar.');
  return dados;
}

/* -------------------------- navegação ---------------------------------- */

function ir(destino){
  tela = destino;
  document.querySelectorAll('.tela').forEach(s=>s.classList.remove('ativa'));
  document.getElementById('tela-'+destino).classList.add('ativa');

  if (destino !== 'presenca' && destino !== 'nomes'){ final = ''; pintarFinal(); }
  reiniciarOcio();
}

/* O tablet fica sozinho no balcão: nome de aluno ou dado de cadastro não pode
   ficar na tela esperando a próxima pessoa chegar. */
function reiniciarOcio(){
  clearTimeout(ocioso);
  if (tela === 'menu') return;
  ocioso = setTimeout(()=>ir('menu'), 60000);
}
document.addEventListener('touchstart', reiniciarOcio, {passive:true});
document.addEventListener('click', reiniciarOcio);

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-ir]'); if (!b) return;
  ir(b.dataset.ir);
});

/* --------------------------- resposta ---------------------------------- */

function responder(bom, titulo, texto, segundos){
  const t = document.getElementById('resposta');
  t.className = 'resposta mostrar ' + (bom ? 'sim' : 'nao');
  document.getElementById('r-titulo').textContent = titulo;
  document.getElementById('r-texto').textContent = texto || '';
  clearTimeout(ocioso);
  setTimeout(()=>{ t.className = 'resposta'; ir('menu'); }, (segundos || (bom ? 3 : 6)) * 1000);
}

/* ---------------------- presença: 4 dígitos ---------------------------- */

function pintarFinal(){ visorFinal.textContent = '•'.repeat(final.length); }

async function buscarFinal(){
  if (final.length !== 4) return;
  const digitados = final;
  try{
    const r = await chamar('/buscar', {final: digitados});
    if (!r.alunos.length){
      return responder(false, 'Não encontrei',
        'Nenhum cadastro termina em ' + digitados + '. Confira o número ou crie seu cadastro.');
    }
    if (r.alunos.length === 1) return confirmar(r.alunos[0].bilhete);
    mostrarNomes(r.alunos);
  }catch(e){ responder(false, 'Ops', e.message); }
}

function mostrarNomes(alunos){
  document.getElementById('lista-nomes').innerHTML =
    alunos.map(a=>`<button data-bilhete="${a.bilhete}">${a.nome
      .replace(/[<>&"]/g, ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[ch]))}</button>`).join('');
  ir('nomes');
}

document.getElementById('lista-nomes').addEventListener('click', e=>{
  const b = e.target.closest('button[data-bilhete]'); if (!b) return;
  confirmar(b.dataset.bilhete);
});

async function confirmar(bilhete){
  try{
    const r = await chamar('/confirmar', {bilhete});
    if (r.ok){
      const quem = r.nome ? r.nome.split(' ')[0] : '';
      return responder(true, 'Check-in confirmado',
        `${quem ? quem + ' · ' : ''}aula das ${r.hora}`
        + (r.repetida ? ' — você já tinha confirmado.' : ''));
    }
    const extra = (r.horariosDeHoje || []).length
      ? ' Hoje você tem aula às ' + r.horariosDeHoje.join(' e ') + '.'
      : '';
    responder(false, 'Fora do horário', r.motivo + extra + ' Fale com o estúdio.');
  }catch(e){ responder(false, 'Ops', e.message); }
}

document.getElementById('teclas-final').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  const acao = b.dataset.acao;
  if (acao === 'apagar') final = final.slice(0,-1);
  else if (acao === 'ok'){ pintarFinal(); return buscarFinal(); }
  else if (final.length < 4) final += b.textContent;
  pintarFinal();
  // Quatro dígitos já bastam: buscar sozinho poupa um toque de quem está de pé.
  if (final.length === 4) buscarFinal();
});

/* ---------------------------- cadastro --------------------------------- */

/* Cadastro é o mesmo fluxo do site — telefone, código, nome, aniversário e os
   horários da semana. Em vez de reescrever isso aqui e ter duas versões para
   manter, o tablet abre a própria tela de entrada do app em modo totem: lá o
   token não fica guardado e, terminado o cadastro, a pessoa volta para cá. */
document.getElementById('btn-cadastro').addEventListener('click', ()=>{
  location.href = '/?totem=1';
});

if (new URLSearchParams(location.search).has('cadastro')){
  history.replaceState(null, '', '/totem.html');
  responder(true, 'Cadastro criado', 'Pronto! Agora é só entrar pelo seu celular.', 6);
}

/* Teclado físico ou leitor de código de barras: os dígitos caem no visor da
   presença e Enter busca. */
document.addEventListener('keydown', e=>{
  if (tela !== 'presenca' && tela !== 'nomes') return;
  if (e.key === 'Enter') buscarFinal();
  else if (e.key === 'Backspace'){ final = final.slice(0,-1); pintarFinal(); }
  else if (/^[0-9]$/.test(e.key) && final.length < 4){
    final += e.key; pintarFinal();
    if (final.length === 4) buscarFinal();
  }
});
</script>
</body>
</html>
