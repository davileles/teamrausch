<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrada · Wellhub</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{--concreto:#E8E9E4;--tinta:#101317;--linha:#D2D4CD;--liberado:#1B6B4A;--recusado:#A8321F}
  *{box-sizing:border-box;margin:0;padding:0;user-select:none}
  body{background:var(--concreto);color:var(--tinta);font-family:"Space Grotesk",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .painel{width:100%;max-width:380px;text-align:center}
  .chamada{font:500 20px/1.35 "Space Grotesk",sans-serif;margin-bottom:22px}
  .chamada small{display:block;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.14em;
    text-transform:uppercase;color:#6E7580;margin-bottom:10px}
  .visor{font:600 34px "IBM Plex Mono",monospace;letter-spacing:.12em;background:#fff;
    border:1px solid var(--linha);border-radius:4px;padding:20px;margin-bottom:16px;min-height:78px;
    display:flex;align-items:center;justify-content:center}
  .visor:empty::before{content:'••••';color:var(--linha)}
  .teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .teclas button{font:600 24px "IBM Plex Mono",monospace;padding:20px 0;border:1px solid var(--linha);
    background:#fff;border-radius:4px;cursor:pointer;color:var(--tinta)}
  .teclas button:active{background:var(--tinta);color:#fff}
  .teclas button.ok{background:var(--tinta);color:#fff;border-color:var(--tinta);font-size:15px;
    font-family:"Space Grotesk",sans-serif}
  .resposta{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;color:#fff;padding:32px;text-align:center}
  .resposta.mostrar{display:flex}
  .resposta.sim{background:var(--liberado)} .resposta.nao{background:var(--recusado)}
  .resposta h2{font:700 46px/1.1 "Space Grotesk",sans-serif;letter-spacing:-.02em}
  .resposta p{font:500 19px/1.4 "Space Grotesk",sans-serif;margin-top:14px;max-width:420px;opacity:.95}
</style>
</head>
<body>
  <div class="painel">
    <div class="chamada"><small>Entrada</small>Faça o check-in no app e digite seu código</div>
    <div class="visor" id="visor" aria-live="polite"></div>
    <div class="teclas" id="teclas">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button data-acao="apagar">←</button><button>0</button>
      <button class="ok" data-acao="entrar">Entrar</button>
    </div>
  </div>

  <div class="resposta" id="resposta"><h2 id="r-titulo"></h2><p id="r-texto"></p></div>

<script>
const TOKEN_DISPOSITIVO = ''; // preencha com DEVICE_TOKEN se você configurou um
let codigo = '';
const visor = document.getElementById('visor');

function pintar(){ visor.textContent = '•'.repeat(codigo.length); }

function responder(abrir, titulo, texto){
  const tela = document.getElementById('resposta');
  tela.className = 'resposta mostrar ' + (abrir ? 'sim' : 'nao');
  document.getElementById('r-titulo').textContent = titulo;
  document.getElementById('r-texto').textContent = texto || '';
  setTimeout(()=>{ tela.className = 'resposta'; codigo=''; pintar(); }, abrir ? 3000 : 5000);
}

async function entrar(){
  if (!codigo) return;
  const atual = codigo;
  codigo = ''; pintar();
  try{
    const cab = {'Content-Type':'application/json'};
    if (TOKEN_DISPOSITIVO) cab['X-Device-Token'] = TOKEN_DISPOSITIVO;
    const r = await fetch('/acesso', {method:'POST', headers:cab, body:JSON.stringify({codigo:atual})}).then(x=>x.json());
    responder(r.abrir, r.abrir ? 'Pode entrar' : 'Acesso negado', r.abrir ? (r.nome||'') : r.mensagem);
  }catch(e){
    responder(false, 'Fora do ar', 'Procure a recepção para liberar sua entrada.');
  }
}

document.getElementById('teclas').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  const acao = b.dataset.acao;
  if (acao === 'apagar') codigo = codigo.slice(0,-1);
  else if (acao === 'entrar') return entrar();
  else if (codigo.length < 20) codigo += b.textContent;
  pintar();
});

// Leitor de QR/código de barras funciona como teclado: digita e manda Enter.
document.addEventListener('keydown', e=>{
  if (e.key === 'Enter') entrar();
  else if (e.key === 'Backspace') { codigo = codigo.slice(0,-1); pintar(); }
  else if (/^[0-9A-Za-z]$/.test(e.key) && codigo.length < 20) { codigo += e.key; pintar(); }
});
</script>
</body>
</html>
