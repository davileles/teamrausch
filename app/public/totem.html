  /* Fontes servidas pelo próprio app, não pelo Google Fonts: o totem precisa
     abrir igual sem internet, e o service worker guarda estes arquivos junto
     com a página. Anton e Work Sans são licença OFL (livres para hospedar).
     Work Sans é variável: o mesmo arquivo cobre 400, 500 e 600. */
  @font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;
    src:url(/fonts/anton-latin-ext.woff2) format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;
    src:url(/fonts/anton-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:'Work Sans';font-style:normal;font-weight:400 600;font-display:swap;
    src:url(/fonts/work-sans-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

<style>
  /* ── Team Rausch · totem ────────────────────────────────────────────────
     Base preta como o logo, vermelho só para a ação, amarelo para o que a
     pessoa está digitando. Verde e vermelho na resposta são sinal de porta,
     não marca: quem está entrando lê de longe, sem ler texto.            */
  :root{
    color-scheme:dark;
    --preto:#08090B;--superficie:#1C2026;--linha:#474E57;--linha-2:#5C636D;
    --texto:#F5F5F3;--apagado:#A6ABB2;--fraco:#949AA2;
    --vermelho:#E01F26;--amarelo:#F5C518;--liberado:#1B6B4A;
    --tecla-apagar:#141619;--linha-3:var(--linha-2);
  }
  /* Tema claro: o totem fica com fundo de papel e teclas brancas. Vermelho e
     amarelo escurecem para continuarem legíveis a alguns passos de distância. */
  :root[data-tema=claro]{
    color-scheme:light;
    --preto:#F2F3F5;--superficie:#FFFFFF;--linha:#C3C9D1;--linha-2:#A7AEB8;
    --texto:#15181C;--apagado:#414750;--fraco:#5C636C;
    --vermelho:#C8161C;--amarelo:#9A6E00;--liberado:#15694A;
    --tecla-apagar:#E9EBEF;
  }
  *{box-sizing:border-box;margin:0;padding:0;user-select:none}
  body{background:var(--preto);color:var(--texto);font-family:'Work Sans',system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 24px;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .painel{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center}
  .logo{width:132px;height:auto;display:block;margin-bottom:32px}
  .rotulo{font:600 11px 'Work Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;
    color:var(--amarelo);margin-bottom:14px}
  .chamada{font:400 30px/1.1 Anton,sans-serif;letter-spacing:.02em;text-transform:uppercase;
    text-align:center;margin-bottom:28px}
  .visor{width:100%;min-height:104px;background:var(--superficie);border:1px solid var(--linha-2);
    border-bottom:3px solid var(--amarelo);display:flex;align-items:center;justify-content:center;
    font:400 40px Anton,sans-serif;letter-spacing:.34em;color:var(--amarelo);
    margin-bottom:18px;padding:0 12px;word-break:break-all}
  .visor:empty::before{content:'••••';color:var(--linha)}
  .teclas{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .teclas button{height:82px;background:var(--superficie);border:1px solid var(--linha);
    font:400 34px Anton,sans-serif;color:var(--texto);cursor:pointer}
  .teclas button:active{background:var(--texto);color:var(--preto);border-color:var(--texto)}
  .teclas button[data-acao=apagar]{background:var(--tecla-apagar);font-size:28px;color:var(--apagado)}
  .teclas button.ok{background:var(--vermelho);border-color:var(--vermelho);color:#fff;
    font-size:20px;letter-spacing:.08em;text-transform:uppercase}

  .resposta{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;color:#fff;padding:36px;text-align:center}
  .resposta.mostrar{display:flex}
  .resposta.sim{background:var(--liberado)} .resposta.nao{background:var(--vermelho)}
  .resposta h2{font:400 clamp(46px,13vw,72px)/0.95 Anton,sans-serif;letter-spacing:.02em;text-transform:uppercase}
  .resposta h2::after{content:'';display:block;width:48px;height:4px;margin:22px auto 0;background:var(--amarelo)}
  .resposta.nao h2::after{background:var(--preto)}
  .resposta p{font:500 19px/1.45 'Work Sans',sans-serif;margin-top:18px;max-width:420px;opacity:.94}
  /* Ação que a pessoa precisa tomar, quando há uma. O título diz o que
     aconteceu; este bloco diz o que fazer — por isso vem invertido (branco
     sobre a cor da tela), para ser a segunda coisa lida de longe e não se
     perder no fim do parágrafo. */
  .resposta .acao{display:none;margin-top:28px;padding:14px 28px 12px;background:#fff;
    color:var(--vermelho);font:400 clamp(36px,10vw,56px)/1 Anton,sans-serif;
    letter-spacing:.03em;text-transform:uppercase}
  .resposta.sim .acao{color:var(--liberado)}
  .resposta.com-acao .acao{display:block}
  .resposta.com-acao h2::after{display:none}

  /* ── telas do tablet ───────────────────────────────────────────────────
     Uma tela por vez, todas dentro do mesmo painel. Botões grandes porque a
     pessoa toca de pé, com a bolsa numa das mãos.                        */
  .tela{display:none;width:100%;flex-direction:column;align-items:center}
  .tela.ativa{display:flex}
  .opcoes{width:100%;display:flex;flex-direction:column;gap:14px}
  .opcoes button{width:100%;min-height:104px;background:var(--superficie);
    border:1px solid var(--linha);color:var(--texto);cursor:pointer;padding:18px;
    font:400 26px/1.05 Anton,sans-serif;letter-spacing:.02em;text-transform:uppercase;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .opcoes button:active{background:var(--texto);color:var(--preto);border-color:var(--texto)}
  .opcoes button.principal{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
  .opcoes button small{font:500 13px/1.35 'Work Sans',sans-serif;letter-spacing:0;
    text-transform:none;opacity:.85;max-width:300px}
  .voltar-totem{margin-top:22px;background:none;border:none;color:var(--fraco);
    font:600 13px 'Work Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;
    cursor:pointer;border-bottom:1px solid var(--linha);padding-bottom:3px}
  .voltar-totem:active{color:var(--amarelo);border-color:var(--amarelo)}

  /* Lista de homônimos: mesmo final de telefone, nomes diferentes. */
  .nomes{width:100%;display:flex;flex-direction:column;gap:10px}
  .nomes button{width:100%;min-height:76px;background:var(--superficie);border:1px solid var(--linha);
    color:var(--texto);font:500 20px 'Work Sans',sans-serif;cursor:pointer;padding:14px 18px}
  .nomes button:active{background:var(--texto);color:var(--preto)}

  /* Cadastro: teclado do próprio tablet, campos altos. */
  .form{width:100%;display:flex;flex-direction:column;gap:16px;text-align:left}
  .form label{display:block;font:600 11px 'Work Sans',sans-serif;letter-spacing:.16em;
    text-transform:uppercase;color:var(--amarelo);margin-bottom:8px}
  .form input{width:100%;min-height:62px;background:var(--superficie);color:var(--texto);
    border:1px solid var(--linha);border-bottom:2px solid var(--amarelo);padding:14px 16px;
    font:400 20px 'Work Sans',sans-serif;user-select:text}
  .form input:focus{outline:none;border-color:var(--amarelo)}
  .form .enviar{width:100%;min-height:78px;background:var(--vermelho);border:1px solid var(--vermelho);
    color:#fff;font:400 24px Anton,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .form .enviar[disabled]{opacity:.55}

  .aviso-totem{width:100%;margin-top:16px;padding:14px 16px;background:var(--superficie);
    border-left:3px solid var(--vermelho);font:500 15px/1.45 'Work Sans',sans-serif;
    color:var(--texto)}
  .aviso-totem:empty{display:none}

  /* Tela da liberação: as duas informações que importam são o estado (fora do
     horário) e a ação (chamar o professor). O selo vermelho marca o estado; a
     chamada grande, em uma linha, é a ação. */
  .selo-fora{display:inline-block;background:var(--vermelho);color:#fff;
    font:400 22px/1 Anton,sans-serif;letter-spacing:.06em;text-transform:uppercase;
    padding:10px 18px 8px;margin-bottom:16px}
  .chamada.chamada-prof{font-size:clamp(34px,10vw,46px);line-height:1;margin-bottom:22px}

  @media (max-height:700px){
    .logo{width:104px;margin-bottom:20px}
    .chamada{font-size:24px;margin-bottom:18px}
    .visor{min-height:84px;font-size:32px}
    .teclas button{height:68px;font-size:28px}
    .selo-fora{font-size:18px;margin-bottom:12px}
    .chamada.chamada-prof{font-size:32px;margin-bottom:16px}
  }

  /* Ligar a TV (Chromecast). Canto oposto ao do tema, mesmo peso visual: é
     coisa da recepção, não de quem está entrando. Some quando não há receptor
     configurado. Verde quando o mural já está rodando. */
  .btn-tv{position:fixed;top:18px;left:18px;z-index:5;width:44px;height:44px;
    background:transparent;border:1px solid var(--linha);color:var(--apagado);border-radius:2px;
    cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;opacity:.55}
  .btn-tv[hidden]{display:none}
  /* Aviso discreto de rede: só aparece sem internet ou com presença na fila. */
  .offline-aviso{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    font:600 11px 'Work Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;
    padding:8px 14px;border:1px solid var(--linha-2);background:var(--superficie);
    color:var(--apagado);white-space:nowrap}
  .offline-aviso[hidden]{display:none}
  .offline-aviso.sem-rede{border-color:var(--amarelo);color:var(--amarelo)}
  .btn-tv:hover{opacity:1}
  .btn-tv.ligada{opacity:1;background:var(--liberado);border-color:var(--liberado);color:#fff}

  /* Alternador de tema: o ícone mostra para onde se vai, não onde se está. */
  .tema{background:transparent;border:1px solid var(--linha-3);color:var(--apagado);
    border-radius:var(--raio,2px);cursor:pointer;padding:0;width:40px;height:40px;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:border-color .15s,color .15s,background .15s}
  .tema:hover{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
  .tema svg{display:block}
  .tema .i-lua{display:none}
  :root[data-tema=claro] .tema .i-sol{display:none}
  :root[data-tema=claro] .tema .i-lua{display:block}
  .tema{position:fixed;top:18px;right:18px;z-index:5;width:44px;height:44px;
    border-color:var(--linha);opacity:.55}
  .tema:hover{opacity:1}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
/* Tema claro/escuro — claro é o padrão; a escolha do usuário, quando há,
   vale mais e fica guardada só neste aparelho.
   Roda antes do corpo desenhar para não haver piscada de tema errado. */
(function(){
  var CHAVE='tr_tema', CLARO='#F2F3F5', ESCURO='#0E0F11';
  function pintar(t){
    var claro = t==='claro';
    document.documentElement.setAttribute('data-tema', claro?'claro':'escuro');
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', claro?CLARO:ESCURO);
  }
  var salvo=null; try{ salvo=localStorage.getItem(CHAVE); }catch(e){}
  pintar(salvo||'claro');
  window.alternarTema=function(){
    var novo=document.documentElement.getAttribute('data-tema')==='claro'?'escuro':'claro';
    pintar(novo); try{ localStorage.setItem(CHAVE,novo); }catch(e){}
  };
  document.addEventListener('click',function(ev){
    var alvo=ev.target&&ev.target.closest?ev.target.closest('.tema'):null;
    if(alvo){ ev.preventDefault(); window.alternarTema(); }
  });
})();
</script>

<script>
/* ── tablet da entrada ──────────────────────────────────────────────────
   Duas coisas: confirmar presença pelos 4 últimos dígitos do telefone e abrir
   cadastro. O cadastro não mora aqui — o botão pergunta se é aula experimental
   ou aluno cadastrando horários e abre a tela de entrada do app em modo totem
   (`/?totem=1`, com `&experimental=1` no primeiro caso).

   O check-in do Wellhub saiu desta tela: quem tem Wellhub confirma no app do
   próprio Wellhub, e o check-in chega ao sistema pelo webhook do portal. A
   rota /acesso continua de pé para a catraca, que não passa por aqui.

   As rotas usadas aqui são abertas, sem token de dispositivo: o tablet é só um
   atalho no navegador, sem nada para configurar.

   SEM INTERNET
   A página fica guardada no tablet (`/sw-totem.js`) e, de tempos em tempos,
   baixa um pacote com quem pode passar por aqui e a agenda dos próximos dias
   (`/totem-api/pacote`). Se a rede falha, a busca e a conferência do horário
   são feitas com esse pacote e a presença entra numa fila no próprio tablet,
   com o instante do toque. Quando a conexão volta, a fila vai para
   `/totem-api/sincronizar`, que confere tudo com as regras de sempre. A
   liberação do professor fora do horário também entra na fila: os dígitos
   dele só são conferidos no servidor.                                      */

let tela = 'menu';
let final = '';    // 4 dígitos da presença
let prof = '';     // 4 dígitos do professor, na liberação fora do horário
let bilheteLib = null;
let ocioso = null;

const visorFinal = document.getElementById('visor-final');
const visorProf = document.getElementById('visor-prof');

/* --------------------------- sem internet ------------------------------ */

const LS_PACOTE = 'totem-pacote-v1';
const LS_FILA = 'totem-fila-v1';
const PRAZO_REDE_MS = 7000;
let semRede = false;        // a última tentativa não chegou ao servidor
let sincronizando = false;
let liberacao = null;       // {chave, nome, data, hora}: liberação que pode ir para a fila
let opcoesNomes = [];       // homônimos na tela "Quem é você?"

function lerLocal(k, padrao){
  try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; }catch(e){ return padrao; }
}
function gravarLocal(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; }
}
function primeiroNome(n){ return n ? String(n).split(' ')[0] : ''; }

function erroDeRede(){ const e = new Error('Sem internet.'); e.semRede = true; return e; }

/* Wi-Fi conectado e sem saída para a internet não recusa: fica pendurado. O
   prazo é o que separa "o servidor disse não" de "não cheguei ao servidor". */
async function buscarRede(url, opcoes, prazo){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), prazo || PRAZO_REDE_MS);
  try{
    const r = await fetch(url, Object.assign({}, opcoes || {}, {signal: ctrl.signal, cache:'no-store'}));
    // 52x é o Cloudflare dizendo que o servidor está fora: para quem está na
    // frente do tablet, é o mesmo que estar sem internet.
    if (r.status === 502 || r.status === 503 || r.status === 504 || (r.status >= 520 && r.status <= 527)) throw erroDeRede();
    return r;
  }catch(e){
    if (e && e.semRede) throw e;
    throw erroDeRede();
  }finally{ clearTimeout(t); }
}

async function chamar(caminho, corpo){
  const r = await buscarRede('/totem-api'+caminho,
    {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(corpo)});
  const dados = await r.json().catch(()=>null);
  // Resposta que não é JSON é página de roteador ou de erro de proxy: não chegou aqui.
  if (dados === null) throw erroDeRede();
  if (!r.ok) throw new Error(dados.erro || 'Não consegui completar.');
  marcarRede(true);
  return dados;
}

function marcarRede(ok){
  if (semRede === !ok) return;
  semRede = !ok;
  pintarAviso();
  if (ok) sincronizar();
}

function pintarAviso(){
  const el = document.getElementById('offline-aviso'); if (!el) return;
  const n = lerLocal(LS_FILA, []).length;
  if (!semRede && !n){ el.hidden = true; return; }
  el.hidden = false;
  const qtd = n ? ' · ' + n + (n === 1 ? ' presença guardada' : ' presenças guardadas') : '';
  el.textContent = semRede ? 'Sem internet' + qtd : (sincronizando ? 'Enviando' + qtd : 'Na fila' + qtd);
  el.classList.toggle('sem-rede', semRede);
}

async function baixarPacote(){
  try{
    const r = await buscarRede('/totem-api/pacote', {}, 15000);
    if (!r.ok) return;
    const p = await r.json().catch(()=>null);
    if (p && Array.isArray(p.alunos)){ p.baixadoEm = Date.now(); gravarLocal(LS_PACOTE, p); }
    marcarRede(true);
  }catch(e){ if (e.semRede) marcarRede(false); }
}

async function sondar(){
  try{
    const r = await buscarRede('/totem-api/ping', {}, 5000);
    if (r.ok) marcarRede(true);
  }catch(e){ if (e.semRede) marcarRede(false); }
}

/* Data e minuto do dia no fuso do estúdio, não no do tablet. */
function agoraLocal(fuso){
  const partes = new Intl.DateTimeFormat('en-CA', {timeZone: fuso || 'America/Sao_Paulo',
    year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false})
    .formatToParts(new Date());
  const v = t => (partes.find(x=>x.type===t) || {}).value;
  return {data: v('year')+'-'+v('month')+'-'+v('day'), min: (Number(v('hour')) % 24) * 60 + Number(v('minute'))};
}
function emMin(h){ return Number(String(h).slice(0,2)) * 60 + Number(String(h).slice(3,5)); }

/* Mesma regra de `horaDaChegada` no servidor: a aula que já começou ganha da
   que vai começar; sem aula no dia, a hora cheia do relógio. */
function horaChegadaLocal(horas, min){
  const slots = (horas || []).map(h=>({hora:h, faltam: emMin(h) - min}));
  const comecadas = slots.filter(s=>s.faltam <= 0).sort((a,b)=>b.faltam - a.faltam);
  if (comecadas.length) return comecadas[0].hora;
  const proximas = slots.filter(s=>s.faltam > 0).sort((a,b)=>a.faltam - b.faltam);
  if (proximas.length) return proximas[0].hora;
  return String(Math.floor(min / 60)).padStart(2,'0') + ':00';
}

/* Mesma janela do servidor, com a agenda guardada no pacote. */
function decidirOffline(pacote, chave){
  const agora = agoraLocal(pacote.fuso);
  const dia = (pacote.dias || {})[agora.data];
  const j = pacote.janela || {antes:20, depois:20};
  // Pacote velho demais para ter o dia de hoje: guarda sem conferir e o
  // servidor decide na sincronização.
  if (!dia) return {data: agora.data, hora: null, conferido: false};
  const meus = (dia.por || {})[chave] || [];
  const dentro = meus.map(h=>({hora:h, faltam: emMin(h) - agora.min}))
    .filter(h=>h.faltam <= j.antes && h.faltam >= -j.depois)
    .sort((a,b)=>Math.abs(a.faltam) - Math.abs(b.faltam));
  if (dentro.length) return {data: agora.data, hora: dentro[0].hora, conferido: true};
  return {data: agora.data, hora: null, conferido: true, meus, chegada: horaChegadaLocal(dia.horas, agora.min)};
}

function enfileirar(item){
  const fila = lerLocal(LS_FILA, []);
  item.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  item.em = new Date().toISOString();
  fila.push(item);
  const ok = gravarLocal(LS_FILA, fila);
  pintarAviso();
  return ok;
}
function jaNaFila(chave, data, hora){
  return lerLocal(LS_FILA, []).some(i=>i.chave === chave && i.data === data && i.hora === hora);
}

async function sincronizar(){
  if (sincronizando) return;
  const fila = lerLocal(LS_FILA, []);
  if (!fila.length) return;
  sincronizando = true; pintarAviso();
  try{
    const lote = fila.slice(0, 100);
    const r = await buscarRede('/totem-api/sincronizar', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({itens: lote})}, 20000);
    const dados = await r.json().catch(()=>null);
    if (!r.ok || !dados || !Array.isArray(dados.resultados)) return;
    // "depois" fica para a próxima rodada; o resto (gravado, repetido ou
    // recusado) sai da fila. Relê a fila: pode ter entrado gente durante o envio.
    const resolvidos = new Set(dados.resultados.filter(x=>x && x.status !== 'depois').map(x=>x.id));
    const resto = lerLocal(LS_FILA, []).filter(i=>!resolvidos.has(i.id));
    gravarLocal(LS_FILA, resto);
    sincronizando = false;
    marcarRede(true);
    if (resto.length && resolvidos.size) setTimeout(sincronizar, 1000);
  }catch(e){ if (e.semRede) marcarRede(false); }
  finally{ sincronizando = false; pintarAviso(); }
}

function buscarOffline(digitados){
  const p = lerLocal(LS_PACOTE, null);
  if (!p) return responder(false, 'Sem internet',
    'Este tablet ainda não tem a lista de alunos guardada. Avise a recepção para anotar sua presença.', 7);
  const achados = p.alunos.filter(a=>a.f === digitados).map(a=>({chave:a.c, nome:a.n}));
  if (!achados.length) return responder(false, 'Não encontrei',
    'Nenhum cadastro termina em ' + digitados + '. Se você se cadastrou hoje, avise a recepção: estamos sem internet.');
  if (achados.length === 1) return confirmarOffline(achados[0]);
  mostrarNomes(achados);
}

function confirmarOffline(aluno){
  const p = lerLocal(LS_PACOTE, null);
  if (!p || !aluno || !aluno.chave) return responder(false, 'Sem internet',
    'Não consegui guardar sua presença neste tablet. Avise a recepção.', 7);
  const d = decidirOffline(p, aluno.chave);
  const quem = primeiroNome(aluno.nome);

  if (d.hora || !d.conferido){
    if (d.hora && jaNaFila(aluno.chave, d.data, d.hora)){
      return responder(true, 'Check-in confirmado',
        (quem ? quem + ' · ' : '') + 'aula das ' + d.hora + ' — você já tinha confirmado.');
    }
    if (!enfileirar({tipo:'confirmar', chave: aluno.chave, data: d.data, hora: d.hora})){
      return responder(false, 'Ops', 'Não consegui guardar sua presença neste tablet. Avise a recepção.', 7);
    }
    return responder(true, 'Presença guardada',
      (quem ? quem + ' · ' : '') + (d.hora ? 'aula das ' + d.hora + ' · ' : '')
      + 'estamos sem internet: ela entra no sistema quando a conexão voltar.', 4);
  }

  // Fora do horário: a liberação do professor também vai para a fila.
  liberacao = {chave: aluno.chave, nome: aluno.nome, data: d.data, hora: d.chegada};
  bilheteLib = null;
  prof = ''; pintarProf();
  document.getElementById('lib-motivo').textContent = 'Ele libera seu acesso à aula das ' + d.chegada + '.';
  const extra = d.meus.length ? ' Hoje você tem aula às ' + d.meus.join(' e ') + '.' : '';
  responder(false, 'Fora do horário',
    (quem ? quem + ', você' : 'Você') + ' está fora do horário.' + extra, 4, 'liberar', 'Chame o professor');
}

function liberarOffline(){
  const l = liberacao;
  const digitos = prof;
  prof = ''; pintarProf();
  if (!l) return;
  if (!enfileirar({tipo:'liberar', chave: l.chave, data: l.data, hora: l.hora, final: digitos})){
    return responder(false, 'Ops', 'Não consegui guardar a liberação neste tablet. Anote à mão.', 7);
  }
  liberacao = null; bilheteLib = null;
  const quem = primeiroNome(l.nome);
  responder(true, 'Liberação guardada',
    (quem ? quem + ' · ' : '') + 'aula das ' + l.hora
    + ' · estamos sem internet: o sistema confere o professor quando a conexão voltar.', 5);
}

/* -------------------------- navegação ---------------------------------- */

function ir(destino){
  tela = destino;
  document.querySelectorAll('.tela').forEach(s=>s.classList.remove('ativa'));
  document.getElementById('tela-'+destino).classList.add('ativa');

  if (destino !== 'presenca' && destino !== 'nomes'){ final = ''; pintarFinal(); }
  // Os dígitos do professor não sobrevivem à saída da tela: é o telefone de
  // quem manda no sistema, meio digitado, num tablet em cima do balcão.
  if (destino !== 'liberar'){ prof = ''; bilheteLib = null; liberacao = null; pintarProf(); }
  reiniciarOcio();
}

/* O tablet fica sozinho no balcão: nome de aluno ou dado de cadastro não pode
   ficar na tela esperando a próxima pessoa chegar. */
function reiniciarOcio(){
  clearTimeout(ocioso);
  if (tela === 'menu') return;
  // A tela do professor precisa de mais fôlego: alguém tem que sair do tablet,
  // entrar na sala e voltar acompanhado. Um minuto limparia a tela no meio do
  // caminho. Ainda assim é menos que a validade do bilhete no servidor, para a
  // tela não ficar oferecendo uma liberação que já morreu.
  ocioso = setTimeout(()=>ir('menu'), tela === 'liberar' ? 150000 : 60000);
}
document.addEventListener('touchstart', reiniciarOcio, {passive:true});
document.addEventListener('click', reiniciarOcio);

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-ir]'); if (!b) return;
  ir(b.dataset.ir);
});

/* --------------------------- resposta ---------------------------------- */

function responder(bom, titulo, texto, segundos, destino, acao){
  const t = document.getElementById('resposta');
  t.className = 'resposta mostrar ' + (bom ? 'sim' : 'nao') + (acao ? ' com-acao' : '');
  document.getElementById('r-titulo').textContent = titulo;
  document.getElementById('r-acao').textContent = acao || '';
  document.getElementById('r-texto').textContent = texto || '';
  clearTimeout(ocioso);
  // A tela cheia vermelha é o aviso: ela existe para ser vista de longe, do
  // outro lado da sala, por quem não está olhando para o tablet. Fora do
  // horário ela continua aparecendo — o que mudou é o que vem depois: em vez
  // de voltar ao menu e encerrar o assunto, a tela entrega a liberação.
  setTimeout(()=>{ t.className = 'resposta'; ir(destino || 'menu'); },
    (segundos || (bom ? 3 : 6)) * 1000);
}

/* ---------------------- presença: 4 dígitos ---------------------------- */

function pintarFinal(){ visorFinal.textContent = '•'.repeat(final.length); }

async function buscarFinal(){
  if (final.length !== 4) return;
  const digitados = final;
  // Já se sabe que a rede caiu: responde na hora com o pacote, sem esperar prazo.
  if (semRede) return buscarOffline(digitados);
  try{
    const r = await chamar('/buscar', {final: digitados});
    if (!r.alunos.length){
      return responder(false, 'Não encontrei',
        'Nenhum cadastro termina em ' + digitados + '. Confira o número ou crie seu cadastro.');
    }
    if (r.alunos.length === 1) return confirmar(r.alunos[0]);
    mostrarNomes(r.alunos);
  }catch(e){
    if (e.semRede){ marcarRede(false); return buscarOffline(digitados); }
    responder(false, 'Ops', e.message);
  }
}

function mostrarNomes(alunos){
  opcoesNomes = alunos;
  document.getElementById('lista-nomes').innerHTML =
    alunos.map((a, i)=>`<button data-i="${i}">${String(a.nome || 'Sem nome')
      .replace(/[<>&"]/g, ch=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[ch]))}</button>`).join('');
  ir('nomes');
}

document.getElementById('lista-nomes').addEventListener('click', e=>{
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const aluno = opcoesNomes[Number(b.dataset.i)];
  if (aluno) confirmar(aluno);
});

/* `aluno` = {bilhete, chave, nome} vindo da busca online, ou {chave, nome}
   vindo do pacote guardado (sem bilhete: aí só existe o caminho offline). */
async function confirmar(aluno){
  if (!aluno.bilhete || semRede) return confirmarOffline(aluno);
  try{
    const r = await chamar('/confirmar', {bilhete: aluno.bilhete});
    if (r.ok){
      const quem = r.nome ? r.nome.split(' ')[0] : '';
      return responder(true, 'Check-in confirmado',
        `${quem ? quem + ' · ' : ''}aula das ${r.hora}`
        + (r.repetida ? ' — você já tinha confirmado.' : ''));
    }
    const extra = (r.horariosDeHoje || []).length
      ? ' Hoje você tem aula às ' + r.horariosDeHoje.join(' e ') + '.'
      : '';
    if (r.podeLiberar){
      bilheteLib = r.bilhete;
      // Se a rede cair até o professor digitar, a liberação vai para a fila.
      liberacao = {chave: aluno.chave, nome: r.nome || aluno.nome,
        data: agoraLocal((lerLocal(LS_PACOTE, null) || {}).fuso).data, hora: r.horaSugerida};
      prof = ''; pintarProf();
      // O aluno não precisa saber como o professor libera — só que é com ele
      // que se resolve. Explicar os quatro dígitos aqui seria ensinar, a quem
      // está do lado de fora da autorização, exatamente o que ela pede.
      document.getElementById('lib-motivo').textContent =
        'Ele libera seu acesso à aula das ' + r.horaSugerida + '.';
      const quem = r.nome ? r.nome.split(' ')[0] + ', você' : 'Você';
      return responder(false, 'Fora do horário',
        quem + ' está fora do horário.' + extra, 4, 'liberar', 'Chame o professor');
    }
    responder(false, 'Fora do horário', r.motivo + extra + ' Fale com o estúdio.');
  }catch(e){
    if (e.semRede){ marcarRede(false); return confirmarOffline(aluno); }
    responder(false, 'Ops', e.message);
  }
}

/* ------------- fora do horário: liberação do professor ------------------ */

function pintarProf(){ if (visorProf) visorProf.textContent = '•'.repeat(prof.length); }

async function liberar(){
  if (prof.length !== 4) return;
  if (!bilheteLib){ if (liberacao) liberarOffline(); return; }
  if (semRede && liberacao) return liberarOffline();
  try{
    const r = await chamar('/liberar', {bilhete: bilheteLib, final: prof});
    if (r.ok){
      const quem = r.nome ? r.nome.split(' ')[0] : '';
      return responder(true, 'Presença liberada',
        `${quem ? quem + ' · ' : ''}aula das ${r.hora}`
        + (r.professor ? ' — liberada por ' + r.professor : '')
        + (r.repetida ? ' (já estava registrada).' : ''));
    }
    // Dígito errado não devolve a pessoa ao menu: o professor está ali, de pé,
    // e mandá-lo recomeçar pelo telefone do aluno seria trocar um toque errado
    // por seis certos.
    prof = ''; pintarProf();
    document.getElementById('lib-motivo').textContent = r.motivo;
    reiniciarOcio();
  }catch(e){
    if (e.semRede && liberacao){ marcarRede(false); return liberarOffline(); }
    prof = ''; pintarProf();
    responder(false, 'Ops', e.message);
  }
}

document.getElementById('teclas-prof').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  const acao = b.dataset.acao;
  if (acao === 'apagar') prof = prof.slice(0,-1);
  else if (acao === 'ok'){ pintarProf(); return liberar(); }
  else if (prof.length < 4) prof += b.textContent;
  pintarProf();
  if (prof.length === 4) liberar();
});

document.getElementById('teclas-final').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  const acao = b.dataset.acao;
  if (acao === 'apagar') final = final.slice(0,-1);
  else if (acao === 'ok'){ pintarFinal(); return buscarFinal(); }
  else if (final.length < 4) final += b.textContent;
  pintarFinal();
  // Quatro dígitos já bastam: buscar sozinho poupa um toque de quem está de pé.
  if (final.length === 4) buscarFinal();
});

/* ---------------------------- cadastro --------------------------------- */

/* Cadastro é o mesmo fluxo do site — telefone, código, nome, aniversário e os
   horários da semana. Em vez de reescrever isso aqui e ter duas versões para
   manter, o tablet abre a própria tela de entrada do app em modo totem: lá o
   token não fica guardado e, terminado o cadastro, a pessoa volta para cá. */
/* Dois casos no mesmo fluxo:
   - Aula experimental: quem está visitando. Pede telefone, nome e aniversário,
     sem grade da semana; a ficha nasce marcada como experimental.
   - Cadastrar horários: quem já é aluno. Fluxo completo, com a grade. */
/* O cadastro mora no app e precisa de internet: sair do totem sem rede
   deixaria o tablet numa página de erro do navegador. Confere antes. */
async function abrirCadastro(destino){
  try{
    const r = await buscarRede('/totem-api/ping', {}, 4000);
    if (!r.ok) throw erroDeRede();
    location.href = destino;
  }catch(e){
    marcarRede(false);
    responder(false, 'Sem internet', 'O cadastro precisa de internet. Fale com a recepção.', 6);
  }
}
document.getElementById('btn-horarios').addEventListener('click', ()=>abrirCadastro('/?totem=1'));
document.getElementById('btn-experimental').addEventListener('click', ()=>abrirCadastro('/?totem=1&experimental=1'));

{
  const cad = new URLSearchParams(location.search).get('cadastro');
  if (cad){
    history.replaceState(null, '', '/totem.html');
    if (cad === 'experimental') responder(true, 'Boa aula!', 'Cadastro criado. Aproveite sua aula experimental.', 6);
    else responder(true, 'Cadastro criado', 'Pronto! Agora é só entrar pelo seu celular.', 6);
  }
}

/* Teclado físico ou leitor de código de barras: os dígitos caem no visor da
   presença e Enter busca. */
document.addEventListener('keydown', e=>{
  if (tela !== 'presenca' && tela !== 'nomes') return;
  if (e.key === 'Enter') buscarFinal();
  else if (e.key === 'Backspace'){ final = final.slice(0,-1); pintarFinal(); }
  else if (/^[0-9]$/.test(e.key) && final.length < 4){
    final += e.key; pintarFinal();
    if (final.length === 4) buscarFinal();
  }
});

/* ------------------------ sem internet: rotina ------------------------- */

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw-totem.js', {scope: '/totem.html'})
    .catch(e=>console.warn('service worker do totem', e));
}
// Pede ao navegador para não apagar a fila e o pacote quando faltar espaço.
try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

setInterval(()=>{
  if (lerLocal(LS_FILA, []).length) sincronizar();
  else if (semRede) sondar();
}, 30000);
setInterval(baixarPacote, 10 * 60000);
window.addEventListener('online', ()=>{ sondar(); sincronizar(); });
pintarAviso();
baixarPacote();
sincronizar();
</script>
<script>
/* ── ligar a TV ─────────────────────────────────────────────────────────
   O mural (`/tv.html`) roda DENTRO do Chromecast, como app receptor. Este
   botão só dá a partida: depois disso o tablet pode recarregar, voltar ao
   menu ou ser desligado que a TV continua girando sozinha. Só aparece com o
   ID do receptor salvo em Configurações → Mural da TV.                    */
(function(){
  var btn = document.getElementById('btn-tv');
  var appId = null;

  function pintar(){
    try{
      var ctx = cast.framework.CastContext.getInstance();
      btn.classList.toggle('ligada', ctx.getCastState() === cast.framework.CastState.CONNECTED);
    }catch(e){}
  }

  window.__onGCastApiAvailable = function(disponivel){
    if (!disponivel || !appId) return;
    var ctx = cast.framework.CastContext.getInstance();
    ctx.setOptions({
      receiverApplicationId: appId,
      autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
    });
    ctx.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED, pintar);
    btn.hidden = false;
    pintar();
  };

  fetch('/tv-api/cast', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(c){
      if (!c || !c.appId || c.ativo === false) return;
      appId = c.appId;
      var s = document.createElement('script');
      s.src = 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
      document.body.appendChild(s);
    })
    .catch(function(){ /* sem TV configurada, sem botão */ });

  btn.addEventListener('click', function(){
    try{
      cast.framework.CastContext.getInstance().requestSession()
        .then(pintar)
        .catch(function(e){ if (e !== 'cancel') console.error('cast', e); });
    }catch(e){ console.error('cast', e); }
  });
})();
</script>
